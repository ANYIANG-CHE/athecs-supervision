/* =====================================================================
   PAINTING THE SCREEN WITHOUT THROWING THE USER OFF IT

   Every repaint replaces the whole of #app. The app repaints on its own —
   the 25-second tick, a sync finishing, an account refresh arriving — and
   each of those used to send the page back to the top and empty whatever
   box the person was typing in. To somebody halfway down a questionnaire
   that reads as the app losing its place for no reason. It is the single
   most irritating thing in the app and it has nothing to do with the data.

   So: a repaint of the SAME screen keeps the scroll position, keeps the
   focused field and its cursor, and keeps the section strip where it was.
   Only a real navigation goes back to the top. Nothing here changes what
   is displayed — only whether the ground moves under the person.
   ===================================================================== */
let VIEW_KEY = '';
function viewKey(){
  /* the space is part of the view: moving between spaces is a real navigation and
     must start at the top, not inherit the other space's scroll position */
  const u=me();
  return (location.hash||'#/home') + '|' + (u ? spaceOf(u) : '');
}

/* what the person was doing, captured the instant before the repaint */
function keepPlace(){
  const el = document.activeElement;
  const inApp = el && el.id && $('#app') && $('#app').contains(el)
             && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  const strips = {};
  ['#secnav','#tabnav'].forEach(sel=>{ const n=$(sel); if(n) strips[sel]=n.scrollLeft; });
  return {
    same: VIEW_KEY === viewKey(),
    y: window.scrollY || window.pageYOffset || 0,
    id: inApp ? el.id : '',
    start: inApp && el.selectionStart!=null ? el.selectionStart : null,
    end:   inApp && el.selectionEnd!=null   ? el.selectionEnd   : null,
    strips
  };
}
function restorePlace(p){
  /* A repaint of the same screen must not move the page. A navigation goes to the
     top, unless somebody has deliberately asked to hold the position. */
  if(window._toSection){
    /* ---- MOVING BETWEEN SECTIONS MOVES THE SECTION, NOT THE PAGE -------------------
       This used to scroll to the section anchor every single time. The anchor sits
       below the supervision header, so tapping ‹ or › while already at the top pushed
       the page DOWN — and since the questionnaire above the fold looks much the same
       from one section to the next, the arrows read as buttons that scroll instead of
       buttons that navigate. That is exactly what was reported.

       Now the page is only brought back when the person has scrolled PAST the
       questionnaire; if the top of it is already on screen, nothing moves vertically.
       What does move is the strip: the pill for the section you are now in is scrolled
       into view, which is the feedback the arrows owed you all along. */
    window._toSection = false;
    const anchor = $('#secanchor');
    if(anchor){
      const top = anchor.getBoundingClientRect().top;
      if(top < -4){                                    // the questionnaire is above us
        const y = Math.max(0, top + window.scrollY - 8);
        try{ window.scrollTo({top:y, behavior:'smooth'}); }catch(e){ window.scrollTo(0,y); }
      }
    }
    /* the strip follows the section, and must not be put back where it was */
    const strip = $('#secnav');
    if(strip){
      const on = strip.querySelector('button.on');
      if(on){
        /* measured against the strip itself, not against offsetParent — the pills are
           static, so offsetLeft is relative to whatever is positioned further up the
           tree, and centring on it put the wrong pill under the thumb */
        const a = on.getBoundingClientRect(), c = strip.getBoundingClientRect();
        const want = strip.scrollLeft + (a.left - c.left) - (c.width - a.width) / 2;
        const max  = Math.max(0, strip.scrollWidth - strip.clientWidth);
        const to   = Math.max(0, Math.min(max, want));
        try{ strip.scrollTo({left: to, behavior:'smooth'}); }
        catch(e){ strip.scrollLeft = to; }
      }
    }
    if(p && p.strips) delete p.strips['#secnav'];
  } else {
    const y = p.same ? p.y : (window._keepScroll || 0);
    window.scrollTo(0, y);
  }
  window._keepScroll = 0;
  if(p.same){
    Object.keys(p.strips).forEach(sel=>{ const n=$(sel); if(n) n.scrollLeft = p.strips[sel]; });
    if(p.id){
      const el=document.getElementById(p.id);
      if(el && el!==document.activeElement){
        try{
          el.focus({preventScroll:true});
          if(p.start!=null && el.setSelectionRange) el.setSelectionRange(p.start, p.end);
        }catch(e){}
      }
    }
  }
  VIEW_KEY = viewKey();
}
function paint(html, key, r){
  const p = keepPlace();
  $('#app').innerHTML = shell(html, key);
  restorePlace(p);
  if(typeof afterRender==='function') afterRender(r, p.same);
}

function render(){
  const r = route(); const u = me();
  if(!u)          return paint(viewLogin(), undefined, r);
  if(!canWork(u)) return paint(viewGate(u), undefined, r);
  let html='', key=r[0];
  if(isSite()){
    // facility staff: their own site only
    if(r[0]==='report' && mySiteIds().includes((DB.d.visits.find(v=>v.id===r[1])||{}).siteId))
      return paint(viewReport(r[1]), 'home', r);
    if(r[0]==='chat') return paint(viewChat(r[1]), 'chat', r);
    return paint(viewSiteHome(), 'home', r);
  }
  switch(r[0]){
    case 'home':   html=viewHome(); break;
    case 'report': html=viewReport(r[1]); key='visits'; break;
    case 'new':    html=viewNewVisit(); break;   // refuses a console account itself
    case 'visit':  html=viewVisit(r[1], r[2]||'q', r[3]); key='visits'; break;
    case 'visits': html=viewVisits(); break;
    case 'dash':   html=viewDash(); break;
    case 'chat':   html=viewChat(r[1]); break;
    case 'admin':  html=isSuper()?viewAdmin(r[1]||'supervisions', r[2]):'<div class="banner b-err">Accès refusé.</div>'; break;
    case 'sitereq':html=viewSiteReq(r[1]); key='visits'; break;
    default: html=viewHome(); key='home';
  }
  paint(html, key, r);
}

/* Only appears once the device holds more than a handful of accounts — a shared tablet,
   or the console. A personal phone keeps its one-tap list. */
function filterLoginUsers(q){
  const sel=$('#lg-user'); if(!sel) return;
  const n=normName(q||'');
  let first=null;
  Array.from(sel.options).forEach(o=>{
    const hit = !n || String(o.getAttribute('data-f')||'').includes(n);
    o.hidden = !hit;
    if(hit && !first) first=o;
  });
  if(first) sel.value=first.value;
}

/* Choosing which privileged account to sign into. It is remembered before anything is
   redrawn, so the choice survives the redraw instead of being undone by it. */
function pickAdmSlot(id){
  DB.d.config.lastAdmPick = id; DB.save();
  const pin = $('#lg-pin'); const typed = pin ? pin.value : '';
  render();
  const again = $('#lg-pin'); if(again){ again.value = typed; again.focus(); }
}

/* Administration sign-in. A slot that has not been claimed accepts ONLY its one-time
   code; a claimed slot accepts only the PIN its holder chose on this phone. */
async function doLoginAdmin(){
  const L=LANG==='fr';
  const sel=$('#lg-user'); if(!sel||!sel.value) return toast(L?'Aucun compte disponible':'No account available');
  const id=sel.value, typed=(($('#lg-pin')||{}).value||'').trim();
  const u=DB.d.users.find(x=>x.id===id); if(!u) return;
  DB.d.config.lastAdmPick=id; DB.save();
  if(!typed) return toast(L?'Saisissez votre code':'Enter your code');

  if(!u.claimed){
    if(!ONLINE) return toast(L?'L\'activation a besoin du réseau, une seule fois.'
                              :'Activation needs a network, once.', 4000);
    toast(L?'Vérification…':'Checking…', 1200);
    const r = await claimSlot(id, typed);
    if(!r || !r.valid) return toast(L
      ?'Code refusé. Il est valable 24 heures et une seule fois — demandez-en un nouveau.'
      :'Code refused. It is valid for 24 hours and once only — ask for a new one.', 4500);
    u.claimed=true; u.pin=''; if(r.name) u.name=r.name; if(r.role) u.role=r.role;
    DB.d.session=u.id; DB.save();
    audit('SLOT_CLAIM','user', u.name+' — '+roleLabel(u.role));
    try{ localStorage.setItem('ath_path','adm'); }catch(e){}
    LG_PATH='adm'; go('#/home'); render();
    return forcePinChange(u.id, 'claim');
  }

  if((u.pin||'') !== typed) return toast(L?'Code PIN incorrect':'Wrong PIN');
  DB.d.session=u.id; DB.save(); audit('LOGIN','user',u.name);
  try{ localStorage.setItem('ath_path','adm'); }catch(e){}
  LG_PATH='adm'; go('#/home'); render();
  /* A privileged account may not sit on an obvious code. The old sign-in enforced this
     and the rewrite lost it — put back before anything else happens. */
  if(DEFAULT_PINS.includes(u.pin)){ forcePinChange(u.id); return; }
  maybeTour();          // the rewrite dropped this: a new super user never saw the guide
  pushUser(u); refreshRoster(false); refreshAdmins(false); refreshSlots(false);
}

async function doLogin(){
  const L=LANG==='fr';
  const sel=$('#lg-user'); if(!sel||!sel.value) return toast(L?'Aucun compte disponible':'No account available');
  const id=sel.value, pin=(($('#lg-pin')||{}).value||'').trim();
  const u=DB.d.users.find(x=>x.id===id);
  if(!u) return toast('Utilisateur introuvable');
  if(!pin) return toast(L?'Saisissez votre code PIN':'Enter your PIN');

  /* A temporary code exists only when somebody forgot their PIN. It is typed in this
     same box — no separate recovery screen — but it is never stored on the device and
     never matched here: the server compares it and burns it. So it can only be used
     once, only within 24 hours, and only when a reset is actually outstanding. */
  let temp=false;
  if((u.pin||'')!==pin){
    if(ONLINE && DB.d.config.api && pin.length>=4){
      toast(L?'Vérification…':'Checking…', 1200);
      temp = await checkTempPin(u.id, pin);
    }
    if(!temp) return toast(!ONLINE && !(u.pin||'')
      ? (L?'Code temporaire : connectez-vous au réseau pour l\'utiliser':'Temporary code: connect to a network to use it')
      : (L?'Code PIN incorrect':'Wrong PIN'));
  }

  const path = isSlot(u) ? 'adm'
             : (isDual(u) && (LG_PATH==='site'||LG_PATH==='sup')) ? LG_PATH
             : (u.role==='SITE' ? 'site' : 'sup');
  try{ localStorage.setItem('ath_path', path); }catch(e){}
  LG_PATH = path;
  /* the door chosen IS the space opened — a dual account signing in at the facility
     door lands in the facility space, whatever it used last time */
  if(isDual(u) && path!=='adm'){ SPACE = path;
    try{ localStorage.setItem('ath_space', path); }catch(e){} }
  DB.d.session=u.id; DB.save(); audit('LOGIN','user',u.name); go('#/home'); render();
  if(temp){
    u.pinResetCode=''; u.pinResetAt=null; u.pinHelp=null; DB.save();
    audit('PIN_RESET_USED','user',u.name); forcePinChange(u.id,'reset'); return;
  }
  if(isSlot(u) && DEFAULT_PINS.includes(u.pin)){ forcePinChange(u.id); return; }
  maybeTour();
  if(isSlot(u)){ pushUser(u); refreshRoster(false); } else refreshMyState(false);
  refreshAdmins(false);
}

function saveForcedPin(uid){
  const u=DB.d.users.find(x=>x.id===uid);
  const a=($('#fp-new').value||'').trim(), b=($('#fp-new2').value||'').trim();
  const nEl=$('#fp-name'), tEl=$('#fp-tel');
  const L=LANG==='fr';
  if(a.length<4) return toast(L?'4 chiffres minimum':'At least 4 digits');
  if(DEFAULT_PINS.includes(a)) return toast(L?'Choisissez un code moins évident':'Choose a less obvious code');
  if(a!==b) return toast(L?'Les deux codes ne correspondent pas':'The two codes do not match');
  if(nEl && !(nEl.value||'').trim()) return toast(L?'Indiquez votre nom':'Enter your name');
  if(a===u.pinResetCode) return toast(L?'Choisissez un code différent du code temporaire'
                                       :'Choose a code different from the temporary one');
  u.pin=a;
  if(nEl) u.name=(nEl.value||'').trim();
  if(tEl) u.phone=(tEl.value||'').trim();
  u.pinResetCode=''; u.pinResetAt=null; u.pinHelp=null;
  DB.save();
  audit('PIN_CHANGED','user',u.name);
  /* a phone only ever clears its own recovery flags — it never rewrites its status,
     districts or role by pushing a whole record it may have received long ago */
  if(isSlot(u)){ /* a slot's row is the server's — see pushUser() */ }
  else queue('userFlag',{id:u.id, pinResetCode:'', pinResetAt:'', pinHelp:''});
  closeModal(); toast(L?'✓ Code PIN enregistré':'✓ PIN saved');
  render(); maybeTour();
  if(isSlot(u)) refreshRoster(false); else refreshMyState(false);
}

async function doEnrol(){

                  : Array.from($('#en-dis').selectedOptions).map(o=>o.value);

  else if(!dis.length) miss.push('District');
  if(pin.length<4)miss.push('PIN');
  if(!$('#en-dec').checked)miss.push('Déclaration');
  if(miss.length) return blockedModal(miss);
  const b64 = await fileToB64(file);
  const u={id:DB.id('U'), name, role:ENROL_ROLE, fn, matricule:g('en-mat'),
    sites: sites.length?sites:undefined, siteId: sites[0]||undefined,
    idType:idt, idNumber:idn, idFile:b64, phone:tel, email:g('en-mail'),
    districts:dis, pin, status:U_PENDING, active:true, enrolled:Date.now(),
    device:(navigator.userAgent||'').slice(0,80)};

  /* Somebody who already has an account on this device almost never means to make a second
     one — their supervisions would be split between the two. Ask before creating it. */
  const dup = duplicatesOf(u);
  if(dup.length){ PENDING_ENROL = u; return dupEnrolModal(dup); }
  saveEnrol(u);

/* ---------- the dead end, turned into the front door --------------------------
   Somebody enrolled as facility staff who is genuinely also a supervisor used to
   land here, press « Oui, c'est mon compte », and be sent straight back to the
   facility space by a single line that read their one and only role. They could
   never get out of it.

   Now, when the account found is the SAME PERSON — proved by the telephone number
   or the identity document, never by the name alone, because family names repeat
   across a district — the app offers what they actually came for: to ask for the
   other role on the account they already have. */
function roleAskFromEnrol(dup){
  const L=LANG==='fr';
  const want = ENROL_ROLE==='SITE' ? 'SITE' : 'SUPERVISOR';
  /* only a strong, personal match may lead to a role request */
  const hit = dup.find(x => x._match && (x._match.sure || normPhone(x.phone)
              && normPhone(x.phone)===normPhone((PENDING_ENROL||{}).phone)));
  if(!hit) return `<div class="banner b-info xs" style="margin-top:8px">${L
    ?'Si cette personne n\'est pas vous, appuyez sur « Non, c\'est quelqu\'un d\'autre » et dites pourquoi. Si c\'est vous mais que le numéro de téléphone diffère, appelez un super utilisateur plutôt que de créer un deuxième compte.'
    :'If that person is not you, press "No, this is somebody else" and say why. If it is you but the telephone number is different, call a super user rather than creating a second account.'}</div>`;
  if(isDual(hit) || (hit.role==='SITE') === (want==='SITE')) return '';
  ROLE_ASK_ID = hit.id;
  return `<div class="banner b-ok" style="margin-top:8px">
    <b>${L?'Vous avez déjà un compte — et vous n\'en avez pas besoin d\'un deuxième.':'You already have an account — and you do not need a second one.'}</b><br>
    ${L?'<b>'+esc(hit.name)+'</b> est enregistré comme <b>'+esc(roleLabelFor(hit.role))+
       '</b>. Vous pouvez demander à être <b>aussi '+esc(roleLabelFor(want)).toLowerCase()+
       '</b> sur ce même compte : un seul compte, un seul code PIN, deux espaces entre lesquels vous basculez en haut de l\'écran.'
      :'<b>'+esc(hit.name)+'</b> is registered as <b>'+esc(roleLabelFor(hit.role))+
       '</b>. You can ask to be <b>also a '+esc(roleLabelFor(want)).toLowerCase()+
       '</b> on that same account: one account, one PIN, two spaces you switch between at the top of the screen.'}
    <div style="margin-top:8px">
      <button class="btn ok sm" onclick="askRoleFromEnrol()">＋ ${
        L?'Demander ce rôle sur mon compte':'Ask for that role on my account'}</button></div>
  </div>`;
}
let ROLE_ASK_ID='';
function askRoleFromEnrol(){
  const L=LANG==='fr';
  const u=DB.d.users.find(x=>x.id===ROLE_ASK_ID);
  PENDING_ENROL=null; closeModal();
  if(!u) return render();
  if(userStatus(u)!==U_ACTIVE){
    return infoModal(L?'Votre compte n\'est pas encore validé':'Your account is not approved yet',
      L?'Votre compte existe mais il attend encore la validation du niveau central. Une fois validé, ouvrez l\'accueil et appuyez sur « Ajouter un rôle à mon compte ».'
       :'Your account exists but is still awaiting approval. Once it is approved, open the home screen and press "Add a role to my account".');
  }
  /* sign them in first — the request belongs to them, not to this screen */
  setPath(u.role==='SITE'?'site':'sup');
  setTimeout(()=>{
    const pin=$('#lg-pin'); if(pin) pin.focus();
    toast(L?'Saisissez votre code PIN — vous pourrez ensuite demander le rôle depuis l\'accueil.'
           :'Enter your PIN — you can then ask for the role from the home screen.', 6000);

}
function cancelEnrol(){ PENDING_ENROL=null; closeModal(); render(); }
/* This button used to close the dialog and redraw the same screen — it promised to take
   the person to their account and did nothing at all. Now it selects that account and
   puts the cursor in the PIN box, with the forgotten-PIN way out right underneath. */
function useExisting(uid){
  PENDING_ENROL=null; closeModal();
  const u=DB.d.users.find(x=>x.id===uid);
  /* land on the door that lists this account: for a dual account either door works,
     so stay on the one the person chose rather than overriding their choice */
  if(u) setPath(isDual(u) ? (LG_PATH==='site'||LG_PATH==='sup' ? LG_PATH : (u.role==='SITE'?'site':'sup'))
                          : (u.role==='SITE'?'site':'sup'));
  else render();
  setTimeout(()=>{
    const sel=$('#lg-user'); if(sel){ sel.value=uid; }
    const pin=$('#lg-pin'); if(pin){ pin.focus(); }
    const L=LANG==='fr';
    toast(L?'Votre compte est sélectionné — saisissez votre code PIN. Oublié ? « Code PIN oublié ? » juste en dessous.'
           :'Your account is selected — enter your PIN. Forgotten it? "Forgotten PIN?" is just below.', 5000);
  }, 260);
}
/* « Non, c'est quelqu'un d'autre » is the escape hatch for two real people who happen
   to share a name. It must not become the fast lane around approval: once a second role
   has to be granted, the impatient answer is to make a second account instead of waiting.
   A matching identity document is decisive, so that is refused outright; a matching
   telephone or email needs a written reason that the console will read. */
function forceEnrol(){
  const u=PENDING_ENROL; if(!u) return;
  const L=LANG==='fr';
  const dup=duplicatesOf(u);
  const sure=dup.find(x=>x._match && x._match.sure);
  if(sure){
    return infoModal(L?'Impossible de créer un deuxième compte':'A second account cannot be created',
      (L?'« '+sure.name+' » est enregistré avec LA MÊME PIÈCE D\'IDENTITÉ que celle que vous venez de saisir. Ce sont donc deux comptes pour une seule personne, et l\'application ne peut pas les créer.\n\nCE QU\'IL FAUT FAIRE :\n· Si c\'est votre compte, revenez en arrière et appuyez sur « Oui, c\'est mon compte ».\n· Si vous avez saisi le numéro de pièce par erreur, corrigez-le.\n· Si ce sont réellement deux personnes différentes, appelez un super utilisateur : lui seul peut trancher.'
        :'"'+sure.name+'" is registered with THE SAME IDENTITY DOCUMENT as the one you have just typed. That means two accounts for one person, and the app cannot create them.\n\nWHAT TO DO:\n· If it is your account, go back and press "Yes, this is my account".\n· If you typed the document number by mistake, correct it.\n· If these really are two different people, call a super user: only they can decide.'));
  }
  const likely=dup.find(x=>x._match && x._match.likely);
  if(likely){
    return askReason({
      title:L?'Deux comptes pour la même personne ?':'Two accounts for the same person?',
      banner:(L?'« '+esc(likely.name)+' » a '+esc((likely._match.why||[]).join(' et '))+' que vous.'
               :'"'+esc(likely.name)+'" has '+esc((likely._match.why||[]).join(' and '))+' as you.'),
      label:L?'Pourquoi s\'agit-il d\'une autre personne ? (obligatoire)'
             :'Why is this a different person? (mandatory)',
      help:L?'Votre réponse est enregistrée et lue au niveau central. Si c\'est votre propre compte, revenez en arrière : vous n\'avez pas besoin d\'un deuxième.'
            :'Your answer is recorded and read at central level. If it is your own account, go back: you do not need a second one.',
      confirmLabel:L?'Créer quand même':'Create anyway', danger:true,
      onOk: why=>{
        PENDING_ENROL=null;
        u.dupNote=why;
        audit('ENROL_DUP','user',u.name+' — créé malgré un doublon signalé : '+why);
        saveEnrol(u);
      }});
  }
  PENDING_ENROL=null;
  audit('ENROL_DUP','user',u.name+' — créé malgré un doublon signalé');
  saveEnrol(u);
}
function saveEnrol(u){
  DB.d.users.push(u); DB.save(); audit('ENROL','user',u.name+' / '+(u.fn||''));
  queue('user', u);
  closeModal();
  modal(LANG==='fr'?'Demande transmise':'Request sent', `
    <div class="banner b-info">${LANG==='fr'
      ?'Votre enrôlement a été enregistré et sera transmis au niveau central dès que vous aurez du réseau.'

    <p class="small">${LANG==='fr'

      :'A super user must approve your account before you can start a supervision. Sign in now to follow the state of your request.'}</p>
    <p class="xs muted">${LANG==='fr'
      ?'N\'enrôlez pas une deuxième fois : si votre compte est refusé ou bloqué, appelez l\'administrateur.'
      :'Do not enrol a second time: if your account is refused or blocked, call the administrator.'}</p>`,
    `<button class="btn" onclick="closeModal()">OK</button>`);
  render();
}

/* Accepts a YouTube video, a Google Slides deck, or any Google Drive file
   (PDF, PowerPoint, video) and turns it into an embeddable address. */
function toEmbed(url){
  if(!url) return '';
  let m;
  if((m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/)))
    return 'https://www.youtube.com/embed/'+m[1];
  if((m=url.match(/docs\.google\.com\/presentation\/d\/([\w-]+)/)))
    return 'https://docs.google.com/presentation/d/'+m[1]+'/embed?start=false&loop=false&delayms=60000';
  if((m=url.match(/docs\.google\.com\/document\/d\/([\w-]+)/)))
    return 'https://docs.google.com/document/d/'+m[1]+'/preview';
  if((m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/)))
    return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  return url;
}

/* =====================================================================
   SUPERVISOR LIFECYCLE
   PENDING → ACTIVE → SUSPENDED, PIN reset, transfer between districts.

   Offline rule: enrolment, and every day of work after approval, happen
   with no network. Only the approval itself needs one moment of signal,
   because the decision is taken by a person at central level.
   ===================================================================== */

const U_PENDING='PENDING', U_ACTIVE='ACTIVE', U_SUSPENDED='SUSPENDED', U_REJECTED='REJECTED';

const U_STATES=[U_PENDING,U_ACTIVE,U_SUSPENDED,U_REJECTED];
/* A status is only meaningful if it is one of the four we defined. Anything else — a
   boolean, a date, a stray string from a mis-written column — is treated as "no status
   recorded" and never as a refusal. Locking a supervisor out of a day's work because a
   cell held the wrong kind of value is the worst failure this app can have. */
function normStatus(v){
  const s=String(v==null?'':v).trim().toUpperCase();
  return U_STATES.includes(s) ? s : '';
}
function userStatus(u){
  if(!u) return null;
  if(isSlot(u)) return U_ACTIVE;          // super users are never gated
  return normStatus(u.status) || (u.active===false ? U_SUSPENDED : U_ACTIVE);
}
function canWork(u){ return userStatus(u)===U_ACTIVE; }
/* ---------- one person, one account ----------------------------------------
   Two records for the same person are not a cosmetic problem: their supervisions,
   their recommendations and their scores end up split between the two. Matching is
   deliberately loose — the same phone, the same email, or the same name once case,
   accents, spaces and hyphens are removed ("Josiane NGOTTE NTONDO" and
   "Josiane Ngotte-Ntondo" are the same person). */
function normPhone(p){ return String(p==null?'':p).replace(/[^0-9]/g,'').slice(-9); }
function normName(n){ return String(n||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function normMail(m){ return String(m||'').trim().toLowerCase(); }
/* Signals are weighted, because "same name" alone is weak where family names repeat
   across a district, and acting on it would offer to merge two different people.
     identity document  → decisive on its own
     phone / email      → strong
     name               → weak alone
     shared district or facility → supporting
   One decisive signal, or two strong ones, is a match worth proposing. Anything less is
   flagged for a person to look at and never acted on. A person always confirms. */
function normId(v){ return String(v==null?'':v).replace(/[^a-z0-9]/gi,'').toUpperCase(); }
function matchScore(a, b){
  const why=[]; let score=0;
  const ida=normId(a.idNumber), idb=normId(b.idNumber);
  if(ida.length>=5 && ida===idb){ score+=100; why.push(LANG==='fr'?'même pièce d\'identité':'same identity document'); }
  const pa=normPhone(a.phone);
  if(pa.length>=8 && pa===normPhone(b.phone)){ score+=50; why.push(LANG==='fr'?'même téléphone':'same phone'); }
  const ea=normMail(a.email);
  if(ea && ea===normMail(b.email)){ score+=50; why.push(LANG==='fr'?'même email':'same email'); }
  const na=normName(a.name);
  if(na.length>=6 && na===normName(b.name)){ score+=20; why.push(LANG==='fr'?'même nom':'same name'); }
  const da=(a.districts||[]), db=(b.districts||[]);
  if(da.some(d=>db.includes(d))){ score+=10; why.push(LANG==='fr'?'même district':'same district'); }
  const sa=(a.sites||[]), sb=(b.sites||[]);
  if(sa.some(x=>sb.includes(x))){ score+=10; why.push(LANG==='fr'?'même formation sanitaire':'same facility'); }
  return {score, why, sure: score>=100, likely: score>=70};
}
/* Candidates worth showing a human. `sure` or `likely` may be merged; the rest are only flagged. */
function duplicatesOf(u, list){
  return (list||DB.d.users)
    .filter(x=> x && x.id!==u.id && !isSlot(x))
    /* A COPY carrying its score. Writing _match onto the shared user object meant the
       next comparison silently overwrote the previous one's result. */
    .map(x=> Object.assign({}, x, {_match: matchScore(u,x)}))
    .filter(x=> x._match.score >= 20)
    .sort((a,b)=> b._match.score - a._match.score);
}
function mergeableWith(u, list){ return duplicatesOf(u, list).filter(x=>x._match.likely); }

/* ---------- merge two records into one ----------------------------------------
   The OLDER account survives: it is the one the supervisions already point at.
   Deleting the other outright would orphan them — a supervision with no supervisor,
   a blank signature block on the report. So everything is re-pointed first, on the
   server, and the dropped record is archived whole. */
function mergeUsers(keepId, dropId, reason){
  const keep=DB.d.users.find(x=>x.id===keepId), drop=DB.d.users.find(x=>x.id===dropId);
  if(!keep || !drop || keepId===dropId) return;
  const L=LANG==='fr';
  ['fn','matricule','idType','idNumber','idFile','idLast','phone','email'].forEach(k=>{
    if(!keep[k] && drop[k]) keep[k]=drop[k];
  });
  keep.districts = [...new Set([].concat(keep.districts||[], drop.districts||[]))];
  const sites = [...new Set([].concat(keep.sites||[], drop.sites||[]))].filter(id=>siteById(id));
  if(sites.length){ keep.sites=sites; keep.siteId=sites[0]; }
  /* The people who double-enrolled are exactly this case: one account as facility staff,
     another as a supervisor. Merging them without noticing would keep one role and lose
     the other silently. Two different roles going in means a dual account coming out. */
  const bothHats = (keep.role==='SITE') !== (drop.role==='SITE');
  if(bothHats || isDual(keep) || isDual(drop)){
    keep.dual = true;
    if(!(keep.sites&&keep.sites.length))  keep.dual = false;   // nothing to wear the hat with
    if(!(keep.districts&&keep.districts.length)) keep.dual = false;
  }
  keep.updated = Date.now();

  /* re-point locally too, so this console is right before the next sync */
  DB.d.visits.forEach(v=>{ if(v.uid===dropId) v.uid=keepId; });
  DB.d.messages.forEach(m=>{ if(m.uid===dropId) m.uid=keepId; });
  DB.d.siteReq.forEach(r=>{ if(r.reqUid===dropId) r.reqUid=keepId; });
  DB.d.users = DB.d.users.filter(x=>x.id!==dropId);
  DB.d.merged = Object.assign({}, DB.d.merged||{}, {[dropId]:keepId});
  DB.save();
  audit('USER_MERGE','user', drop.name+' ('+dropId+') → '+keep.name+' ('+keepId+')');
  pushUser(keep);
  queue('merge', {keepId, dropId, by:(me()||{}).name||'', reason:reason||''});
  toast(L?'✓ Comptes fusionnés — '+esc(keep.name)+' conservé'
        :'✓ Accounts merged — '+esc(keep.name)+' kept', 4000);
  render();
}
/* A phone still holding the dropped account swaps to the survivor by itself. */
function applyMerges(list){
  if(!Array.isArray(list) || !list.length) return 0;
  let n=0;
  list.forEach(m=>{
    if(!m || !m.drop || !m.keep) return;
    const had = DB.d.users.some(u=>u.id===m.drop);
    DB.d.visits.forEach(v=>{ if(v.uid===m.drop) v.uid=m.keep; });
    DB.d.messages.forEach(x=>{ if(x.uid===m.drop) x.uid=m.keep; });
    DB.d.siteReq.forEach(r=>{ if(r.reqUid===m.drop) r.reqUid=m.keep; });
    if(DB.d.session===m.drop) DB.d.session=m.keep;         // the person stays signed in
    if(had){
      const dropped=DB.d.users.find(u=>u.id===m.drop);
      const keep=DB.d.users.find(u=>u.id===m.keep);
      if(keep && dropped && !keep.pin && dropped.pin) keep.pin=dropped.pin;
      if(!keep && dropped){ dropped.id=m.keep; }           // keep the PIN on this device
      else DB.d.users = DB.d.users.filter(u=>u.id!==m.drop);
      n++;
    }
    DB.d.merged = Object.assign({}, DB.d.merged||{}, {[m.drop]:m.keep});
  });
  if(n) DB.save();
  return n;
}

/* Only ids that match a facility we actually know are accepted from the server. */
function realSites(list){
  return (Array.isArray(list)?list:[]).map(x=>String(x).trim()).filter(x=>!!siteById(x));
}

/* ---------- remise à zéro -----------------------------------------------------
   Central runs startFresh() in the Apps Script editor at the end of the test period.
   That stamps the reset; every read the app already makes carries the stamp, so each
   phone empties its own copy of the test data the next time it has signal. Nobody has
   to collect the phones.

   What goes: supervisions (including drafts), answers, SWOT, action plans, site-change
   requests, messages and the local log — plus any facility invented during the tests.
   What stays: the 84 facilities, the 64 questions, the cycles, and the person's own
   account and PIN, unless central chose the version that clears accounts too. */
/* Everything this phone generated during the test, and nothing else.
   KEPT, always: the enrolments on this device and their PINs, the 84 facilities, the
   questionnaire, the cycles, the server address and the link password. A person whose
   phone is cleared must still be able to sign in straight afterwards. */
function wipeLocalData(withUsers){
  const d=DB.d;
  d.visits=[]; d.answers={}; d.actions=[]; d.siteReq=[];
  d.messages=[]; d.threads=[]; d.audit=[]; d.outbox=[];
  d.sites=(d.sites||[]).filter(s=>String(s.status||'').toUpperCase()!=='PROVISIONAL');
  /* a facility invented during the test may be somebody's assigned facility: let go of
     the reference too, so nothing points at a site that no longer exists */
  (d.users||[]).forEach(u=>{
    if(Array.isArray(u.sites)){
      u.sites=u.sites.filter(id=>d.sites.some(s=>s.id===id));
      u.siteId=u.sites[0];
    }
  });
  if(withUsers){
    d.users=(d.users||[]).filter(u=>isSlot(u));
    d.session=null;
  }
  DB.save(); DB.migrate(); DB.save();     // puts the general announcements thread back
}
function applyReset(j){
  if(!j) return false;
  const c=DB.d.config, L=LANG==='fr';
  let data=false, users=false;
  if(j.resetAt && Number(j.resetAt) > (c.resetSeen||0)){ data=true; c.resetSeen=Number(j.resetAt); }
  if(j.resetUsersAt && Number(j.resetUsersAt) > (c.resetUsersSeen||0)){ users=true; c.resetUsersSeen=Number(j.resetUsersAt); }
  if(!data && !users) return false;
  /* A phone that arrives after the reset has nothing to clear — record the stamp quietly
     rather than announcing a wipe that did not happen. */
  const had = (DB.d.visits||[]).length + (DB.d.actions||[]).length + (DB.d.messages||[]).length;
  if(!had){ wipeLocalData(users); DB.save(); return false; }
  wipeLocalData(users);
  DB.save();
  modal(L?'Données de test effacées':'Test data cleared', `
    <div class="banner b-ok">${L
      ?'Le niveau central a remis l\'application à zéro pour le démarrage des supervisions réelles.'
      :'Central level has reset the app for the start of the real supervisions.'}</div>
    <p class="small">${L
      ?'Les supervisions d\'essai, les plans d\'action et les messages de test ont été effacés de cet appareil. Les 84 formations sanitaires et les 64 questions sont intactes.'
      :'The test supervisions, action plans and test messages have been cleared from this device. The 84 facilities and the 64 questions are untouched.'}</p>
    ${users?`<p class="small">${L
      ?'Les comptes ont également été réinitialisés : enrôlez-vous à nouveau pour commencer.'
      :'Accounts were reset as well: enrol again to start.'}</p>`:''}`,
    `<button class="btn" onclick="closeModal()">OK</button>`);
  render();
  return true;
}

/* ---------- device pulls its own state ---------- */
async function refreshMyState(loud){
  const u=me(), api=DB.d.config.api;
  if(!u || isSlot(u)) return;
  if(!api || !ONLINE){ if(loud) toast(T('offline')); return; }
  try{
    const r=await fetch(api+'?action=userstate&token='+encodeURIComponent(apiToken())+'&uid='+encodeURIComponent(u.id));
    const j=await r.json();
    if(applyReset(j)) return;
    if(!j || !j.ok || !j.user){ if(loud) toast(LANG==='fr'?'Pas encore enregistré au niveau central':'Not yet recorded at central level'); return; }
    const s=j.user, before=userStatus(u);
    const st=normStatus(s.status);
    if(st) u.status = st;                 // an unreadable status leaves the local one alone
    u.active = s.active !== false;
    /* ---- the second hat, and its removal --------------------------------------------
       Scope used to be accepted only when it was NOT empty, so taking a role away never
       reached the phone: central cleared the districts and the supervisor carried on
       supervising from a list nobody could see any more. `dual` travels as a real
       boolean, so when it goes to false the matching scope is cleared here too. */
    const wasDual = isDual(u);
    u.dual = s.dual === true;
    u.req  = s.req || null;
    if(Array.isArray(s.districts) && s.districts.length) u.districts = s.districts;
    else if(!u.dual && u.role==='SITE') { /* derived from the facility: leave it */ }
    else if(wasDual && !u.dual && u.role==='SITE') u.districts = [];
    const sv=realSites(s.sites);
    if(sv.length){ u.sites = sv; u.siteId = sv[0]; }
    else if(wasDual && !u.dual && u.role!=='SITE'){ u.sites = []; u.siteId = undefined; }
    if(wasDual && !u.dual) roleRevokedNotice(u);
    u.decisionNote = s.decisionNote || '';
    u.pinHelp = s.pinHelp || null;          // cleared once central has issued a code
    DB.save();
    const after=userStatus(u);
    if(before!==after){
      audit('USER_STATE','user', u.name+' : '+before+' → '+after);
      toast(after===U_ACTIVE
        ? (LANG==='fr'?'✓ Compte validé — vous pouvez commencer':'✓ Account approved — you can start')
        : (LANG==='fr'?'Statut mis à jour : '+after:'Status updated: '+after), 3400);
      render();
    } else if(loud){
      toast(LANG==='fr'?'Statut inchangé : '+after:'Status unchanged: '+after);
    }
  }catch(e){ if(loud) toast(LANG==='fr'?'Serveur injoignable':'Server unreachable'); }
}

/* ---------- a signed-OUT phone still checks the accounts it holds ------------
   refreshMyState() begins with me(), so it only ever ran for somebody already signed in.
   That was a deadlock: a deactivated person could not sign in, and the only thing that
   could undo the deactivation on their device required them to sign in. Central could
   press Reactivate for ever and it would never arrive.
   This asks the server about each account stored on this phone, using the same endpoint,
   sending no PIN and receiving no secret — only the status. */
let ACCT_TICK = 0;
async function refreshLocalAccounts(loud){
  const api=DB.d.config.api;
  if(!api || !ONLINE){ if(loud) toast(T('offline')); return 0; }
  const mine = DB.d.users.filter(u=>!isSlot(u) && !u.remote);
  if(!mine.length) return 0;
  let changed = 0;
  for(const u of mine){
    try{
      const r = await fetch(api+'?action=userstate&token='+encodeURIComponent(apiToken())
        +'&uid='+encodeURIComponent(u.id));
      const j = await r.json();
      if(applyReset(j)) return changed;
      if(!j || !j.ok || !j.user) continue;
      const before = userStatus(u), s = j.user;
      if(s.dual === true || s.dual === false) u.dual = s.dual === true;
      u.req = s.req || null;
      const st = normStatus(s.status);
      if(st) u.status = st;
      u.active = s.active !== false;
      if(Array.isArray(s.districts) && s.districts.length) u.districts = s.districts;
      const sv = realSites(s.sites); if(sv.length){ u.sites=sv; u.siteId=sv[0]; }
      u.decisionNote = s.decisionNote || '';
      if(userStatus(u) !== before){
        changed++;
        audit('USER_STATE','user', u.name+' : '+before+' → '+userStatus(u));
      }
    }catch(e){ /* offline mid-loop: whatever was learned is kept */ }
  }
  if(changed){ DB.save(); render(); }
  if(loud) toast(changed
    ? (LANG==='fr'?'✓ '+changed+' compte(s) mis à jour':'✓ '+changed+' account(s) updated')
    : (LANG==='fr'?'Aucun changement':'No change'), 2600);
  return changed;
}

/* ---------- the privileged slots, as the server describes them ----------------
   The app ships with none. A slot appears on the Administration screen only once an
   administrator has assigned it to a named person, and it accepts nothing but its
   one-time code until that person has claimed it and chosen their own PIN. */
async function refreshSlots(loud){
  const api=DB.d.config.api;
  if(!api || !ONLINE){ if(loud) toast(T('offline')); return 0; }
  let j=null;
  try{
    const r=await fetch(api+'?action=slots&token='+encodeURIComponent(apiToken()));
    j=await r.json();
  }catch(e){ if(loud) toast(LANG==='fr'?'Serveur injoignable':'Server unreachable'); return 0; }
  if(applyReset(j)) return 0;
  if(!j || !j.ok || !Array.isArray(j.slots)){ if(loud) toast(LANG==='fr'?'Serveur non à jour':'Server out of date'); return 0; }
  /* ---- THE WHOLE ROSTER, FREE POSTS INCLUDED --------------------------------------
     Below, a slot that nobody holds is REMOVED from DB.d.users — rightly: an empty post
     must not appear on the sign-in screen, and nobody must be able to try to sign into
     it. But the console's assignment panel was reading that same list, so it could only
     ever show posts that were ALREADY taken. Four new super-user posts existed on the
     server and were invisible to the one person whose job is to fill them.
     The roster is kept separately: the sign-in screen reads the users, the console
     reads this. */
  DB.d.config.slotRoster = j.slots.map(sl => ({
    id:sl.id, label:sl.label, role:sl.role, name:sl.name||'', phone:sl.phone||'',
    assigned:!!sl.assigned, claimed:!!sl.claimed, active:sl.active!==false}));
  let n=0;
  j.slots.forEach(sl=>{
    const local = DB.d.users.find(u=>u.id===sl.id);
    if(!sl.assigned || sl.active===false){
      /* released, or never assigned: it must vanish from this phone, and if somebody
         is signed into it right now they are signed out. */
      if(local){
        if(DB.d.session===sl.id){ DB.d.session=null; }
        DB.d.users = DB.d.users.filter(u=>u.id!==sl.id); n++;
      }
      return;
    }
    if(!local){
      DB.d.users.push({id:sl.id, name:sl.name, role:sl.role, phone:sl.phone,
        districts:'ALL', status:U_ACTIVE, active:true, pin:'',
        claimed:sl.claimed, slot:true}); n++; return;
    }
    if(local.name!==sl.name){ local.name=sl.name; n++; }
    if(local.role!==sl.role){ local.role=sl.role; n++; }
    if(sl.phone && local.phone!==sl.phone) local.phone=sl.phone;
    /* Reassigned to somebody else: the slot is unclaimed again, so this phone must
       let go of the PIN it was holding. */
    if(local.claimed && !sl.claimed){
      local.pin=''; local.claimed=false;
      if(DB.d.session===sl.id) DB.d.session=null;
      n++;
    }
    if(sl.claimed) local.claimed=true;
  });
  DB.save(); if(n) render();
  if(loud) toast(LANG==='fr'?'Comptes privilégiés à jour':'Privileged accounts updated', 2200);
  return n;
}

/* Claim a slot: the code is compared on the server and burned there. */
async function claimSlot(slotId, code){
  const api=DB.d.config.api;
  if(!api || !ONLINE) return {ok:false, offline:true};
  try{
    const r=await fetch(api+'?action=claim&token='+encodeURIComponent(apiToken())
      +'&slotId='+encodeURIComponent(slotId)+'&code='+encodeURIComponent(code));
    const j=await r.json();
    return j||{ok:false};
  }catch(e){ return {ok:false, error:String(e)}; }
}

/* ---------- "where does my account stand?" ----------------------------------
   The old button was labelled "Vérifier" and answered with a toast that said
   "Aucun changement" — which does not even tell you whether it reached the server.
   Its actual job is narrow but real: the app already asks the server every 25
   seconds, so this is for when somebody is standing in front of you and you do not
   want to wait. It now names, in a full sentence, which of six things happened. */
async function checkMyAccount(uid){
  const L=LANG==='fr', api=DB.d.config.api;
  const say = t => infoModal(L?'Où en est votre compte':'Where your account stands', t);
  const admins = DB.d.users.filter(x=>isSlot(x))
    .map(a=>'    '+a.name+(a.phone?'  —  '+a.phone:'')).join('\n') || '    —';

  if(!ONLINE) return say(L
    ?'Cet appareil est hors réseau.\n\nCette vérification interroge le niveau central : elle a besoin de signal, ne serait-ce qu\'un instant. Réessayez dès que vous en avez.'
    :'This device is offline.\n\nThis check asks central level, so it needs signal, even for a moment. Try again as soon as you have some.');
  if(!api) return say(L?'Aucune adresse de serveur n\'est configurée sur cet appareil. Appelez un super utilisateur.'
                       :'No server address is configured on this device. Call a super user.');

  const sel = $('#lg-user');
  const id  = uid || (sel && sel.value) || DB.d.session;
  const u   = DB.d.users.find(x=>x.id===id);
  if(!u) return say(L?'Choisissez d\'abord votre nom dans la liste.':'Choose your name from the list first.');

  let j=null;
  try{
    const r = await fetch(api+'?action=userstate&token='+encodeURIComponent(apiToken())
      +'&uid='+encodeURIComponent(u.id));
    j = await r.json();
  }catch(e){
    return say(L?'Le serveur n\'a pas répondu.\n\nVous avez du réseau, mais l\'adresse configurée ne répond pas. Ce n\'est pas votre compte qui est en cause. Appelez un super utilisateur :\n\n'+admins
                :'The server did not answer.\n\nYou have a network, but the configured address is not responding. This is not about your account. Call a super user:\n\n'+admins);
  }
  if(!j || !j.ok) return say(L?'Le serveur a répondu par une erreur. Appelez un super utilisateur :\n\n'+admins
                              :'The server answered with an error. Call a super user:\n\n'+admins);
  if(applyReset(j)) return;

  if(!j.user) return say(L
    ?'Votre demande n\'est pas encore arrivée au niveau central.\n\nElle est enregistrée sur ce téléphone et partira toute seule à la prochaine connexion réseau. N\'enrôlez pas une deuxième fois.\n\nAdministrateurs :\n'+admins
    :'Your request has not reached central level yet.\n\nIt is stored on this phone and will leave by itself at the next network connection. Do not enrol a second time.\n\nAdministrators:\n'+admins);

  /* adopt what the server says, then report it in words */
  const before = userStatus(u);
  const st = normStatus(j.user.status);
  if(st) u.status = st;
  u.active = j.user.active !== false;
  if(Array.isArray(j.user.districts) && j.user.districts.length) u.districts = j.user.districts;
  const sv = realSites(j.user.sites); if(sv.length){ u.sites=sv; u.siteId=sv[0]; }
  u.decisionNote = j.user.decisionNote || '';
  DB.save();
  const now = userStatus(u);
  if(before !== now){ audit('USER_STATE','user', u.name+' : '+before+' → '+now); render(); }

  const enrolled = u.enrolled ? fmtDT(u.enrolled) : '—';
  if(now === U_ACTIVE) return say(L
    ?'✓ Votre compte est validé.\n\nVous pouvez vous connecter avec votre code PIN — celui que vous aviez choisi à l\'enrôlement.\n\nSi vous l\'avez oublié : « Code PIN oublié ? » sur cet écran.'
    :'✓ Your account is approved.\n\nSign in with your PIN — the one you chose when you enrolled.\n\nIf you have forgotten it: "Forgotten PIN?" on this screen.');
  if(now === U_PENDING) return say(L
    ?'Votre compte est toujours en attente de validation.\n\nDemande envoyée le '+enrolled+'.\nElle est bien arrivée au niveau central : personne ne l\'a encore approuvée.\n\nAppelez :\n'+admins+'\n\nN\'enrôlez pas une deuxième fois.'
    :'Your account is still awaiting approval.\n\nRequest sent on '+enrolled+'.\nIt did reach central level: nobody has approved it yet.\n\nCall:\n'+admins+'\n\nDo not enrol a second time.');
  if(now === U_SUSPENDED) return say(L
    ?'Votre compte a été désactivé par le niveau central.\n\nMotif : '+(u.decisionNote||'non précisé')+'\n\nVos supervisions déjà enregistrées ne sont pas perdues. Le compte peut être réactivé — appelez :\n'+admins
    :'Your account has been deactivated by central level.\n\nReason: '+(u.decisionNote||'not specified')+'\n\nYour recorded supervisions are not lost. The account can be reactivated — call:\n'+admins);
  return say(L
    ?'Votre enrôlement a été refusé.\n\nMotif : '+(u.decisionNote||'non précisé')+'\n\nNe créez pas un deuxième compte : celui-ci peut être réactivé. Appelez :\n'+admins
    :'Your enrolment was refused.\n\nReason: '+(u.decisionNote||'not specified')+'\n\nDo not create a second account: this one can be reactivated. Call:\n'+admins);
}

/* Install the account on this phone. No new record is created anywhere: the id is the
   one the person already has, so their supervisions stay attached to them. */
function adoptAccount(uid){
  const L=LANG==='fr';
  const s=FOUND_ACCOUNTS.find(x=>String(x.id)===String(uid)); if(!s) return;
  if(DB.d.users.some(u=>u.id===s.id)){ closeModal();
    return toast(L?'Ce compte est déjà sur ce téléphone.':'That account is already on this phone.'); }
  DB.d.users.push({id:s.id, name:s.name, role:s.role||'SUPERVISOR', fn:s.fn,
    matricule:s.matricule, idType:s.idType, idLast:s.idLast,

    districts:Array.isArray(s.districts)?s.districts:[],
    sites:realSites(s.sites), siteId:realSites(s.sites)[0],
    status:normStatus(s.status)||U_PENDING, active:s.active!==false,

    decisionNote:s.decisionNote||'', enrolled:s.enrolled||Date.now(), pin:''});

  }, 260);

/* ---------- central pulls the roster ---------- */
async function refreshRoster(loud){
  const api=DB.d.config.api;
  if(!isSuper() || !api || !ONLINE){ if(loud) toast(T('offline')); return; }
  try{
    const r=await fetch(api+'?action=users&token='+encodeURIComponent(apiToken()));
    const j=await r.json();
    if(applyReset(j)) return;
    if(!j || !j.ok || !Array.isArray(j.users)) { if(loud) toast('—'); return; }
    let added=0, updated=0;
    j.users.forEach(s=>{
      if(!s.id) return;
      /* A privileged slot is NOT an ordinary account and this is not the place that owns
         it — refreshSlots() is. Letting the roster add one here re-created it without the
         slot marker, which the upgrade clean-up then deleted on the next load, which the
         roster then re-added… a loop with a phantom account flickering in the list. */
      if(s.role==='SUPER' || s.role==='ADMIN') return;
      const local=DB.d.users.find(x=>x.id===s.id);
      if(local){
        // never overwrite the local PIN, and never downgrade a super user
        if(isSlot(local)){
          // a renamed super user must reach the other console too — name and phone only
          if(s.name && s.name!==local.name){ local.name=s.name; updated++; }
          if(s.phone && s.phone!==local.phone){ local.phone=s.phone; }
        } else {
          const st2=normStatus(s.status); if(st2) local.status=st2;
          local.active=s.active!==false;
          local.dual = s.dual===true;
          local.req  = s.req || null;
          if(Array.isArray(s.districts)&&s.districts.length) local.districts=s.districts;
          local.fn=s.fn||local.fn; local.email=s.email||local.email;
          if(s.phone) local.phone=String(s.phone);   // Sheets can hand back a number
          local.matricule=local.matricule||s.matricule; local.idType=local.idType||s.idType;
          if(!local.idNumber && s.idLast) local.idLast=s.idLast;
          const sv2=realSites(s.sites); if(sv2.length){ local.sites=sv2; local.siteId=sv2[0]; }
          // PIN recovery: who has asked, and whether a code is still outstanding.
          // The code itself is never transmitted.
          local.pinHelp=s.pinHelp||null;
          local.pinResetAt=s.pinResetAt||null;
          if(!s.pinPending) local.pinResetCode='';
          updated++;
        }
      } else {
        DB.d.users.push({id:s.id, name:s.name, role:s.role||'SUPERVISOR', fn:s.fn,
          matricule:s.matricule, idType:s.idType, idLast:s.idLast,
          phone:s.phone, email:s.email, districts:s.districts||[], sites:s.sites||[],
          dual:s.dual===true, req:s.req||null,
          status:normStatus(s.status)||U_PENDING,
          active:s.active!==false, enrolled:s.enrolled||Date.now(), remote:true});
        added++;
      }
    });
    DB.save();
    if(loud) toast(LANG==='fr'?`Liste à jour — ${added} nouveau(x), ${updated} mis à jour`
                              :`Roster updated — ${added} new, ${updated} updated`, 3000);
    render();
  }catch(e){ if(loud) toast(LANG==='fr'?'Serveur injoignable':'Server unreachable'); }
}

/* ---------- central decisions ---------- */
/* A privileged account's row on the server belongs to assign / claim / release — never
   to a phone. Pushing it was how a phone came to blank its own activation and lock its
   holder out. Belt and braces alongside the server-side fix: the phone does not send it
   at all. Nothing is lost — a slot's name and telephone are set when it is assigned. */
function pushUser(u){
  if(!u) return;
  if(isSlot(u)) return;
  queue('user', u);
}

function approveUser(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  /* Every hat this account carries must have a real scope. An empty scope is not a
     harmless blank: an empty facility list shows the person nothing, and an empty
     district list used to show them the whole region. */
  if(hasSiteHat(u) && !(u.sites&&u.sites.length))
    return toast(L?'Attribuez une formation sanitaire avant de valider':'Assign a facility before approving');
  if(hasSupHat(u) && !(Array.isArray(u.districts) && u.districts.length))
    return toast(L?'Attribuez au moins un district avant de valider':'Assign at least one district before approving');
  const dis=Array.isArray(u.districts)?u.districts:[];
  u.status=U_ACTIVE; u.active=true; u.approvedBy=(me()||{}).name; u.approvedAt=Date.now(); u.decisionNote='';
  DB.save(); audit('USER_APPROVE','user',u.name+' · '+dis.join(', ')); pushUser(u);
  toast(LANG==='fr'?'✓ '+u.name+' validé':'✓ '+u.name+' approved'); render();
}
function rejectUser(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  askReason({
    title: (L?'Rejeter l\'enrôlement de ':'Refuse the enrolment of ')+u.name,
    label: L?'Motif du refus (obligatoire)':'Reason for refusal (mandatory)',
    placeholder: L?'ex. pièce d\'identité illisible':'e.g. identity document unreadable',
    help: L?'Le motif s\'affiche sur le téléphone de la personne. Soyez précis : c\'est ce qu\'elle devra corriger.'
           :'The reason is shown on the person\'s phone. Be specific: it is what they will have to correct.',
    confirmLabel: L?'Rejeter':'Refuse', danger:true,
    onOk: why=>{
      u.status=U_REJECTED; u.active=false; u.decisionNote=why;
      u.approvedBy=(me()||{}).name; u.approvedAt=Date.now();
      DB.save(); audit('USER_REJECT','user',u.name+' — '+why); pushUser(u);
      toast(L?'Enrôlement rejeté':'Enrolment refused'); render();
    }});
}
function suspendUser(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  if(isSlot(u)) return toast(LANG==='fr'?'Un super utilisateur ne peut pas être désactivé ici'
                                               :'A super user cannot be deactivated here');
  const L=LANG==='fr';
  askReason({
    title:(L?'Désactiver ':'Deactivate ')+u.name,
    label:L?'Motif de la désactivation (obligatoire)':'Reason for deactivation (mandatory)',
    placeholder:L?'ex. muté hors de la région':'e.g. transferred out of the region',
    help:L?'La personne verra ce motif à sa prochaine connexion. Ses supervisions déjà enregistrées ne sont pas perdues.'
          :'The person sees this reason at their next sign-in. Their recorded supervisions are not lost.',
    confirmLabel:L?'Désactiver':'Deactivate', danger:true,
    onOk: why=>{ suspendUserDo(uid, why); }});
}
function suspendUserDo(uid, why){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  u.status=U_SUSPENDED; u.active=false; u.decisionNote=why;
  DB.save(); audit('USER_SUSPEND','user',u.name+' — '+why); pushUser(u); render();
}
function reactivateUser(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  u.status=U_ACTIVE; u.active=true; u.decisionNote=''; u.updated=Date.now();
  DB.save(); audit('USER_REACTIVATE','user',u.name); pushUser(u);
  toast(LANG==='fr'?'✓ '+u.name+' réactivé — son téléphone le verra à sa prochaine connexion réseau'
                   :'✓ '+u.name+' reactivated — their phone sees it at its next network connection', 4000);
  render();
}

/* ---------- PIN recovery, one click ----------------------------------------
   A temporary code exists for exactly one reason: somebody forgot their PIN.
   It is six digits, single use, and dies 24 hours after it is issued. It is
   never stored as a PIN, never returned by any endpoint, and it is checked on
   the server, which burns it the moment it is accepted. */
const TEMP_TTL = 24*3600*1000;
function tempAlive(u){ return !!(u && u.pinResetAt && (Date.now()-u.pinResetAt) < TEMP_TTL); }
function tempEnds(u){ return u && u.pinResetAt ? fmtDT(u.pinResetAt + TEMP_TTL) : ''; }

function resetPin(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  const code=String(Math.floor(100000+Math.random()*900000));
  u.pinResetCode=code; u.pinResetAt=Date.now(); u.pinHelp=null;
  DB.save(); audit('PIN_RESET','user',u.name);
  queue('userFlag',{id:u.id, pinResetCode:code, pinResetAt:u.pinResetAt, pinHelp:''});
  showTempPin(uid);
}
function showTempPin(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u||!u.pinResetCode) return;
  const L=LANG==='fr';
  modal(L?'Code temporaire':'Temporary code', `
    <p class="small">${L
      ?`Lisez ce code à <b>${esc(u.name)}</b> au téléphone${u.phone?' ('+esc(u.phone)+')':''}.`
      :`Read this code to <b>${esc(u.name)}</b> over the phone${u.phone?' ('+esc(u.phone)+')':''}.`}</p>

/* ---------- every device keeps the administrators' names up to date ----------
   A super user who renames themselves must appear under the new name on the
   supervisors' phones too: on the login list, on the blocked screen, and in the
   "contact the administrator" panels. Names and phone numbers only — never a
   PIN, never a role change. */
async function refreshAdmins(loud){
  const api=DB.d.config.api;
  if(!api || !ONLINE){ if(loud) toast(T('offline')); return; }
  try{
    const r=await fetch(api+'?action=admins&token='+encodeURIComponent(apiToken()));
    const j=await r.json();
    if(applyReset(j)) return;
    if(!j || !j.ok || !Array.isArray(j.admins)) return;
    let n=0;
    j.admins.forEach(s=>{
      if(!s.id || !s.name) return;
      const local=DB.d.users.find(x=>x.id===s.id);
      if(local){
        const ph=s.phone?String(s.phone):'';
        if(local.name!==s.name || (local.phone||'')!==ph){
          local.name=s.name; if(ph) local.phone=ph; n++;
        }
      } else {
        DB.d.users.push({id:s.id, name:s.name, role:'SUPER', phone:s.phone?String(s.phone):'',
          pin:'', status:U_ACTIVE, active:true, remote:true});
        n++;
      }
    });
    if(n){ DB.save(); render(); }
    if(loud) toast(LANG==='fr'?`Administrateurs : ${n} mise(s) à jour`:`Administrators: ${n} update(s)`);
  }catch(e){ if(loud) toast(LANG==='fr'?'Serveur injoignable':'Server unreachable'); }
}

/* =====================================================================
   ONE PERSON, TWO HATS — ASKING FOR THE SECOND ONE

   The person asks; the coordination team grants. A phone can put a line in
   front of a super user and nothing more: the server's roleRequest() writes
   into the request cells only, and cannot touch a role or a scope.

   Two ways in, one request, one account:
     · « Ajouter un rôle à mon compte » on the home screen — the front door;
     · trying to enrol through the other door, which used to be a dead end.
   ===================================================================== */
function roleLabelFor(r){ const L=LANG==='fr';
  return r==='SITE' ? (L?'Personnel du site':'Facility staff')
                    : (L?'Superviseur':'Supervisor'); }

/* What this person is missing, or '' when they already have both. */
function missingHat(u){
  if(!u || isSlot(u) || isDual(u)) return '';
  return u.role==='SITE' ? 'SUPERVISOR' : 'SITE';
}
function reqPending(u){ return !!(u && u.req && String(u.req.status||'').toUpperCase()==='PENDING'); }
function reqRefused(u){ return !!(u && u.req && String(u.req.status||'').toUpperCase()==='REFUSED'); }

/* The line that sits under the identity card on the home screen. It is the whole
   entry point: one button when there is nothing pending, the state of the request
   when there is, and a way out of a refusal instead of a dead end. */
function roleRequestCard(){
  const u=me(); if(!u || isSlot(u)) return '';
  if(userStatus(u)!==U_ACTIVE) return '';           // finish being one thing first
  const L=LANG==='fr';

  if(reqPending(u)){
    const r=u.req;
    return `<div class="banner b-info" style="margin-bottom:12px">
      <b>${L?'Demande de rôle en attente':'Role request pending'}</b><br>
      ${L?'Vous avez demandé le rôle de ':'You asked for the role of '}<b>${esc(roleLabelFor(r.role))}</b>
      ${r.at?(L?', envoyée le ':' , sent on ')+fmtDT(r.at):''}.
      ${L?'Un super utilisateur doit la valider — vous verrez le changement ici même.'
         :'A super user has to approve it — you will see the change right here.'}
      <div style="margin-top:8px">
        <button class="btn sec sm" onclick="cancelRoleRequest()">${
          L?'Annuler ma demande':'Cancel my request'}</button></div>
    </div>`;
  }
  if(reqRefused(u)){
    const r=u.req;
    return `<div class="banner b-err" style="margin-bottom:12px">
      <b>${L?'Demande de rôle refusée':'Role request refused'}</b><br>
      ${r.note?esc(r.note):(L?'Aucun motif précisé.':'No reason given.')}
      ${r.by?' — '+esc(r.by):''}
      <div style="margin-top:8px">
        <button class="btn sec sm" onclick="roleRequestModal()">${
          L?'Faire une nouvelle demande':'Ask again'}</button>
        <button class="btn sec sm" onclick="clearRoleRequest()">${L?'Fermer':'Dismiss'}</button></div>
    </div>`;
  }
  const want=missingHat(u); if(!want) return '';
  return `<div style="margin:-4px 0 12px">
    <button class="btn sec blk sm" onclick="roleRequestModal()">＋ ${
      L?'Ajouter un rôle à mon compte':'Add a role to my account'}</button>
    <p class="xs muted" style="margin:6px 2px 0">${L
      ?'Vous êtes aussi '+(want==='SITE'?'point focal d\'une formation sanitaire':'superviseur')+
       ' ? Demandez-le ici — un seul compte, deux espaces.'
      :'Are you also '+(want==='SITE'?'a facility focal person':'a supervisor')+
       '? Ask for it here — one account, two spaces.'}</p>
  </div>`;
}

/* =====================================================================
   WHO SEES A SUPERVISION, AND WHO HOLDS THE PEN

   Two or more supervisors are assigned to the same district, and only one
   of them conducts a given facility in a given cycle. The other ones used
   to see NOTHING — the record arrived on their phone with every sync and
   was then filtered out of every list, so a colleague's work was invisible
   even though it was sitting in the same database.

   Now: everybody assigned to the district SEES it, read only, with the
   holder's name on it. Exactly one person can type into it. And the pen can
   move — because a supervisor travels, falls ill, or loses a handset, and
   that must not force a whole team to start the facility again.
   ===================================================================== */
function visitVisible(v, u){
  if(!v || !u) return false;
  if(isSuper()) return true;                 // the console sees the region
  if(v.uid === u.id) return true;            // my own work, always
  if(!hasSupHat(u)) return false;            // facility staff read their site elsewhere
  const ds = Array.isArray(u.districts) ? u.districts : [];
  const s  = siteById(v.siteId) || {};
  return ds.includes(s.district);            // assigned to the district it belongs to
}
/* The pen: exactly one holder, and it is the only person who may type. */
function holdsPen(v){ const u=me(); return !!(u && v && v.uid===u.id && !isSlot(u)); }
function penHolderName(v){
  if(!v) return '';
  const u=DB.d.users.find(x=>x.id===v.uid);
  return (u && u.name) || v.supervisor || '';
}
/* Locked for THIS person: submitted, or approved, or not theirs, or a console account. */
function visitLocked(v){
  if(!v) return true;
  return v.status==='SUBMITTED' || v.status==='APPROVED' || !canSupervise() || !holdsPen(v);
}
function myVisits(){
  const u=me(); if(!u) return [];
  return DB.d.visits.filter(v=> visitVisible(v,u))
                    .sort((a,b)=>(b.updated||0)-(a.updated||0));
}

/* ---------- nobody grades their own facility ---------------------------------
   The rule only bites on a dual account: a pure supervisor has no facility of their
   own, a pure focal person cannot supervise at all. It is enforced in three places —
   the list, the function, and the search — because hiding a button is not a rule. */
function ownFacilityIds(){
  const u=me();
  if(!u || isSlot(u) || !isDual(u)) return [];
  return Array.isArray(u.sites) ? u.sites.slice() : (u.siteId?[u.siteId]:[]);
}
function ownFacilityNames(){
  return ownFacilityIds().map(id=>(siteById(id)||{}).facility||id).join(', ');
}
function ownFacilityRefusal(siteId){
  const L=LANG==='fr', s=siteById(siteId)||{facility:'—'};
  audit('OWN_FACILITY_BLOCKED','visit', (me()||{}).name+' → '+(s.facility||siteId));
  infoModal(L?'Vous ne pouvez pas superviser votre propre formation sanitaire'
             :'You cannot supervise your own facility',
    (L?'Vous êtes point focal de « '+(s.facility||'—')+' ».\n\nUne supervision ne peut pas être conduite par la personne qui répond de la formation sanitaire évaluée : le résultat ne pourrait pas être défendu lors d\'une vérification.\n\nCE QU\'IL FAUT FAIRE :\nDemandez à la coordination régionale d\'affecter un autre superviseur à cette formation sanitaire. Vous pouvez superviser toutes les autres de vos districts normalement.'
       :'You are the focal person for "'+(s.facility||'—')+'".\n\nA supervision cannot be run by the person who answers for the facility being assessed: the result could not be defended during a verification.\n\nWHAT TO DO:\nAsk the regional coordination team to assign another supervisor to this facility. You can supervise every other facility in your districts as usual.'));
}

function nvSearch(q){
  const box=$('#nv-results'); if(!q||q.length<2){ box.innerHTML=''; return; }
  const s=q.toLowerCase();
  const own=ownFacilityIds();
  const hits=DB.d.sites.filter(x=>x.status!=='CLOSED' && !own.includes(x.id) &&
    (x.facility.toLowerCase().includes(s)||x.area.toLowerCase().includes(s)||x.district.toLowerCase().includes(s))).slice(0,12);
  box.innerHTML = hits.map(h=>`<div class="item" onclick="pickSite('${h.id}')">
    <div><b>${esc(h.facility)}</b><div class="s">${esc(h.district)} › ${esc(h.area)}</div></div>
    <span class="chip n">→</span></div>`).join('') || '<p class="small muted">—</p>';
}
function pickSite(id){ const s=siteById(id); NV.district=s.district; NV.area=s.area; NV.siteId=id; render(); }

async function startVisit(){
  const L=LANG==='fr';
  if(!canSupervise()) return toast(L
    ?'Un administrateur ou un super utilisateur ne conduit pas de supervision.'
    :'An administrator or a super user does not conduct supervisions.', 5000);
  const c=activeCycle();
  if(!c) return toast(L?'Aucun cycle ouvert':'No open cycle');
  if(ownFacilityIds().includes(NV.siteId)) return ownFacilityRefusal(NV.siteId);

  const dup=DB.d.visits.find(v=>v.siteId===NV.siteId && v.cycleId===c.id && v.status!=='DRAFT');
  if(dup) return infoModal(L?'Supervision déjà soumise':'Visit already submitted',
    L?'Une supervision a déjà été soumise pour cette formation sanitaire sur ce cycle. Demandez sa réouverture à un super utilisateur.'
     :'A visit has already been submitted for this facility in this cycle. Ask a super user to reopen it.');

  const ex=DB.d.visits.find(v=>v.siteId===NV.siteId && v.cycleId===c.id && v.status==='DRAFT' && v.uid===DB.d.session);
  if(ex) return go('#/visit/'+ex.id);

  /* ---- ONE SUPERVISION PER FACILITY, AND ONLY ONE -----------------------------------
     A second one used to be offered as a choice — "Ouvrir quand même" — and the two were
     reconciled afterwards. That was the wrong end to solve it from: it produced two
     people doing the same facility twice, and a facility that counted in no score until
     somebody untangled it. A facility already open is now simply not opened again. The
     supervisor is shown who holds it and sent to the one door that leads anywhere: ask
     for the editing rights. */
  const mine=DB.d.visits.find(v=>v.siteId===NV.siteId && v.cycleId===c.id && v.status==='DRAFT');
  if(mine) return siteTakenModal(mine.id, penHolderName(mine), mine.date, L);

  const taken = await siteAlreadyTaken(c.id, NV.siteId);
  if(taken && taken.taken){
    const first=(taken.by||[])[0]||{};
    return siteTakenModal(first.id||'', first.supervisor||'', first.date||'', L);
  }
  return startVisitAnyway();
}
/* Who holds it, and the only useful thing to do about it. */
function siteTakenModal(visitId, who, date, L){
  const s=siteById(NV.siteId)||{};
  const known=visitId && DB.d.visits.some(v=>v.id===visitId);
  modal(L?'Formation sanitaire déjà ouverte':'Facility already open', `
    <div class="banner b-warn">${L
      ?'Une supervision de <b>'+esc(s.facility||'')+'</b> est déjà ouverte pour ce cycle.'
      :'A supervision of <b>'+esc(s.facility||'')+'</b> is already open for this cycle.'}
      <div style="margin-top:6px">${L?'Droits d\'édition :':'Editing rights:'} <b>${esc(who||(L?'un autre superviseur':'another supervisor'))}</b>${
        date?' · '+esc(date):''}</div></div>
    <p class="small">${L
      ?'Une seule personne remplit une formation sanitaire à la fois. Deux saisies parallèles s\'effacent l\'une l\'autre et la formation sanitaire ne compte alors dans aucun score.'
      :'One person fills a facility at a time. Two parallel entries wipe each other out, and the facility then counts in no score.'}</p>
    <p class="xs muted">${L
      ?'<b>CE QU\'IL FAUT FAIRE :</b> si cette personne est empêchée, demandez les droits d\'édition. Elle peut vous les accorder, et la coordination régionale peut les accorder à sa place.'
      :'<b>WHAT TO DO:</b> if that person is unavailable, ask for the editing rights. They can grant them, and the regional coordination can grant them in their place.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${L?'Fermer':'Close'}</button>
     ${known?`<button class="btn sec" onclick="closeModal();go('#/visit/${visitId}')">${
       L?'Consulter':'View'}</button>
     <button class="btn" ${ONLINE?'':'disabled'} onclick="closeModal();penAskModal('${visitId}')">✋ ${
       L?'Demander les droits':'Ask for the rights'}</button>`
    :`<p class="xs muted" style="align-self:center">${L
       ?'Synchronisez pour la recevoir sur ce téléphone, puis demandez les droits.'
       :'Sync to receive it on this phone, then ask for the rights.'}</p>`}`);
}
/* Ask the server whether this facility is already taken for this cycle. Silent and
   forgiving: no network, no API, no answer — we carry on and let the server flag it. */
async function siteAlreadyTaken(cycleId, siteId){
  const api=DB.d.config.api;
  if(!api || !ONLINE) return null;
  try{
    const r=await fetch(api+'?action=taken&token='+encodeURIComponent(apiToken())
      +'&cycleId='+encodeURIComponent(cycleId)+'&siteId='+encodeURIComponent(siteId));
    const j=await r.json();
    return (j && j.ok && j.taken) ? j : null;
  }catch(e){ return null; }
}
function startVisitAnyway(){
  if(!canSupervise()) return;
  if(ownFacilityIds().includes(NV.siteId)) return ownFacilityRefusal(NV.siteId);
  const c=activeCycle(); if(!c) return;
  const v={id:DB.id('V'), siteId:NV.siteId, cycleId:c.id, uid:DB.d.session,
    supervisor:(me()||{}).name, comentors:'', type:'Mentorat intégré', date:today(),
    status:'DRAFT', created:Date.now(), updated:Date.now(),
    outOfScope: (NV.showAll && NV.whyAll) ? NV.whyAll : '',
    swot:{f:'',w:'',o:'',t:''}, monthsComplete:c.monthsComplete.slice()};
  DB.d.visits.push(v); DB.d.answers[v.id]={}; DB.save();
  audit('VISIT_START','visit', siteById(v.siteId).facility);
  go('#/visit/'+v.id);
}

function visitQuestions(v, sc, locked){
  const all=visitQs(v);
  const secs=[]; all.forEach(q=>{ if(!secs.includes(q.sec)) secs.push(q.sec); });
  VSEC=Math.max(0,Math.min(VSEC,secs.length-1));
  const cur=secs[VSEC];
  const qs=all.filter(q=>q.sec===cur);
  const c=cycleOf(v);
  const A=DB.d.answers[v.id]||{};
  const p=pooled(qs,A);
  const done=all.filter(q=>scoreAnswer(q,A[q.id],A).answered).length;
  const tot=all.length;
  return `
  <div id="secanchor"></div>
  <div class="secwrap">

    <span class="small"><b>${esc(cur)}</b> — ${qs.length} question${qs.length>1?'s':''}</span>

  </div>`;

function gotoSec(i){
  const secs=sectionList(cycleOf(DB.d.visits.find(x=>x.id===(route()[1]||''))));
