/* ---------- tokens: light ---------- */
:root{
  color-scheme: light;

  --brand:#0B3C71;  --brand-2:#1B6EC2;  --brand-3:#4C9AE8;
  --brand-tint:#EDF4FC; --brand-tint-2:#DCEAF9;

  --ok:#127A46;   --ok-tint:#E3F5EB;  --ok-line:#A6DDC0;
  --warn:#9A6200; --warn-tint:#FFF3DE; --warn-line:#F0CE93;
  --bad:#B3261E;  --bad-tint:#FCEAE8; --bad-line:#F2B7B2;

  --bg:#F5F8FC;
  --surface:#FFFFFF;
  --surface-2:#FAFCFE;
  --surface-3:#F1F5FA;
  --line:#E3EAF3;
  --line-2:#CFDAE8;

  --ink:#0F1723;
  --ink-2:#54617A;
  --ink-3:#8592A8;
  --on-brand:#FFFFFF;

  --r-xs:8px; --r-sm:11px; --r-md:15px; --r-lg:20px; --r-xl:26px; --r-full:999px;

  --sh-1:0 1px 2px rgba(16,32,56,.05);
  --sh-2:0 1px 3px rgba(16,32,56,.06), 0 4px 10px -2px rgba(16,32,56,.05);
  --sh-3:0 2px 6px rgba(16,32,56,.07), 0 10px 24px -6px rgba(16,32,56,.09);
  --sh-4:0 8px 20px rgba(16,32,56,.10), 0 24px 56px -12px rgba(16,32,56,.16);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.7);

  --ease:cubic-bezier(.2,.7,.3,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
  --fast:140ms; --med:240ms; --slow:380ms;

  --font:"Inter var","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text",
         "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;

  --topbar-h:0px;
}
:root{ --brand-900:#062B52; }

/* ---------- tokens: dark ---------- */
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand:#5AA2E8;  --brand-2:#79B6F0;  --brand-3:#9CCBF7;
  --brand-tint:#15242F; --brand-tint-2:#1B3040;

  --ok:#5BD39A;   --ok-tint:#10281D;  --ok-line:#1F6444;
  --warn:#F2B857; --warn-tint:#2B2113; --warn-line:#6B4E1C;
  --bad:#FF8A80;  --bad-tint:#2C1614; --bad-line:#7A2F28;

  --bg:#080C12;
  --surface:#111823;
  --surface-2:#151E2B;
  --surface-3:#1B2634;
  --line:#232F40;
  --line-2:#2E3D52;

  --ink:#E9EFF8;
  --ink-2:#A7B4C7;
  --ink-3:#78889E;
  --on-brand:#06121F;

  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 6px rgba(0,0,0,.5);
  --sh-3:0 4px 14px rgba(0,0,0,.55);
  --sh-4:0 12px 40px rgba(0,0,0,.65);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --brand:#5AA2E8;  --brand-2:#79B6F0;  --brand-3:#9CCBF7;
    --brand-tint:#15242F; --brand-tint-2:#1B3040;
    --ok:#5BD39A;   --ok-tint:#10281D;  --ok-line:#1F6444;
    --warn:#F2B857; --warn-tint:#2B2113; --warn-line:#6B4E1C;
    --bad:#FF8A80;  --bad-tint:#2C1614; --bad-line:#7A2F28;
    --bg:#080C12; --surface:#111823; --surface-2:#151E2B; --surface-3:#1B2634;
    --line:#232F40; --line-2:#2E3D52;
    --ink:#E9EFF8; --ink-2:#A7B4C7; --ink-3:#78889E; --on-brand:#06121F;
    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 2px 6px rgba(0,0,0,.5);
    --sh-3:0 4px 14px rgba(0,0,0,.55);
    --sh-4:0 12px 40px rgba(0,0,0,.65);
    --sh-in:inset 0 1px 0 rgba(255,255,255,.04);
  }
}

/* ---------- reset ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  font-size:15px; line-height:1.55; letter-spacing:-.006em;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  font-variant-numeric:tabular-nums;
  transition:background var(--med) var(--ease), color var(--med) var(--ease);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand-2);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .45em;line-height:1.22;letter-spacing:-.021em;font-weight:660}
h1{font-size:1.5rem} h2{font-size:1.17rem} h3{font-size:.98rem} h4{font-size:.86rem}
::selection{background:var(--brand-tint-2);color:var(--ink)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- app shell ---------- */
#app{max-width:1200px;margin:0 auto;padding:0 0 104px}
#app.hasbar{padding-bottom:132px}

.topbar{
  position:sticky; top:0; z-index:60;
  background:linear-gradient(180deg, color-mix(in srgb, var(--brand) 96%, #000) 0%, var(--brand) 100%);
  color:#fff; padding:env(safe-area-inset-top) 0 0;
  box-shadow:0 1px 0 rgba(255,255,255,.06), var(--sh-3);
}
:root[data-theme="dark"] .topbar,
:root:not([data-theme="light"]) .topbar{ background:linear-gradient(180deg,#0C1725,#0F1E30); }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .topbar{
  background:linear-gradient(180deg,#0A3565,#0B3C71); } }

.topbar-in{display:flex;align-items:center;gap:9px;padding:11px 16px;max-width:1200px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.16;min-width:0;flex:1}
.brand b{font-size:.83rem;font-weight:680;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.brand span{font-size:.62rem;opacity:.72;letter-spacing:.13em;font-weight:600}

.tb-btn{
  background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.10);
  color:#fff; border-radius:var(--r-xs); padding:6px 10px;
  font-size:.72rem; font-weight:650; cursor:pointer; white-space:nowrap;
  transition:background var(--fast) var(--ease), transform var(--fast) var(--spring);
  backdrop-filter:blur(6px);
}
.tb-btn:hover{background:rgba(255,255,255,.22)}
.tb-btn:active{transform:scale(.94)}
.tb-btn.on{background:#fff;color:var(--brand);border-color:transparent;box-shadow:var(--sh-1)}

.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:var(--r-xs);padding:2px;gap:2px}
.seg .tb-btn{background:transparent;border:0;padding:5px 9px}
.seg .tb-btn.on{background:#fff;color:var(--brand)}

.netdot{
  width:9px;height:9px;border-radius:var(--r-full);background:#3DD68C;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(61,214,140,.22);
}
.netdot.off{background:#F5B93C;box-shadow:0 0 0 3px rgba(245,185,60,.22);
  animation:pulseDot 2.2s var(--ease) infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 3px rgba(245,185,60,.22)}
  50%{box-shadow:0 0 0 6px rgba(245,185,60,.06)}}

/* ---------- primary nav ---------- */
.nav{display:flex;gap:1px;overflow-x:auto;background:rgba(0,0,0,.16);padding:0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{
  color:rgba(255,255,255,.68); padding:10px 13px; font-size:.77rem; font-weight:640;
  white-space:nowrap; border-bottom:2.5px solid transparent; position:relative;
  transition:color var(--fast) var(--ease);
}
.nav a:hover{color:rgba(255,255,255,.92);text-decoration:none}
.nav a.on{color:#fff;border-bottom-color:var(--brand-3)}

/* ---------- layout ---------- */
.wrap{padding:16px}
@media(min-width:760px){ .wrap{padding:22px} }

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); padding:16px; margin-bottom:13px;
  box-shadow:var(--sh-2), var(--sh-in);
  transition:box-shadow var(--med) var(--ease), border-color var(--med) var(--ease),
             background var(--med) var(--ease);
}
.card.tight{padding:12px 14px}
.card h2,.card h3{margin-top:0}
.card > h3:first-child{color:var(--ink);font-weight:660}

.grid{display:grid;gap:13px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.g3.always{grid-template-columns:repeat(3,1fr);gap:9px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:11px}
.muted{color:var(--ink-2)}
.small{font-size:.815rem}
.xs{font-size:.725rem;line-height:1.45}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- controls ---------- */
label.f{display:block;margin-bottom:12px}
label.f>span{
  display:block;font-size:.72rem;font-weight:680;color:var(--ink-2);
  margin-bottom:5px;letter-spacing:.028em;text-transform:none;
}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],
input[type=tel],select,textarea{
  width:100%;padding:10px 12px;
  border:1px solid var(--line-2); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink);
  box-shadow:var(--sh-1);
  transition:border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease),
             background var(--fast) var(--ease);
  min-height:42px;
}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:hover,select:hover,textarea:hover{border-color:var(--brand-3)}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--brand-2);
  box-shadow:0 0 0 3.5px color-mix(in srgb, var(--brand-2) 18%, transparent);
}
input:disabled,select:disabled,textarea:disabled{
  background:var(--surface-3);color:var(--ink-3);cursor:not-allowed;box-shadow:none}
textarea{min-height:82px;resize:vertical;line-height:1.5}
select[multiple]{min-height:auto;padding:6px}
select[multiple] option{padding:6px 8px;border-radius:6px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg, var(--brand-2), color-mix(in srgb, var(--brand-2) 86%, #000));
  color:#fff;border:0;border-radius:var(--r-sm);
  padding:11px 17px;min-height:44px;
  font-weight:660;font-size:.855rem;letter-spacing:-.004em;cursor:pointer;
  box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform var(--fast) var(--spring), filter var(--fast) var(--ease),
             box-shadow var(--fast) var(--ease);
}
.btn:hover{filter:brightness(1.07);box-shadow:var(--sh-3), inset 0 1px 0 rgba(255,255,255,.16)}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none;box-shadow:var(--sh-1)}
.btn.sec{
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2); box-shadow:var(--sh-1);
}
.btn.sec:hover{background:var(--surface-2);border-color:var(--brand-3)}
.btn.ok{background:linear-gradient(180deg, var(--ok), color-mix(in srgb, var(--ok) 84%, #000));color:#fff}
.btn.dan{background:linear-gradient(180deg, var(--bad), color-mix(in srgb, var(--bad) 84%, #000));color:#fff}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.dan{color:#06121F}
.btn.sm{padding:7px 12px;min-height:34px;font-size:.775rem;border-radius:var(--r-xs)}
.btn.blk{width:100%}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--brand-tint);color:var(--brand);
  border:1px solid color-mix(in srgb, var(--brand) 16%, transparent);
  border-radius:var(--r-full);padding:3px 11px;
  font-size:.715rem;font-weight:680;letter-spacing:.005em;white-space:nowrap;
}
.chip.g{background:var(--ok-tint);color:var(--ok);border-color:var(--ok-line)}
.chip.a{background:var(--warn-tint);color:var(--warn);border-color:var(--warn-line)}
.chip.r{background:var(--bad-tint);color:var(--bad);border-color:var(--bad-line)}
.chip.n{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}

/* ---------- score surfaces ---------- */
.sc{font-variant-numeric:tabular-nums;font-weight:730;letter-spacing:-.02em}
.fill-g{background:var(--ok-tint)!important;border-color:var(--ok-line)!important}
.fill-a{background:var(--warn-tint)!important;border-color:var(--warn-line)!important}
.fill-r{background:var(--bad-tint)!important;border-color:var(--bad-line)!important}

.bar{height:7px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.bar>i{display:block;height:100%;border-radius:var(--r-full);background:var(--brand-2);
  transition:width var(--slow) var(--ease)}

.stat{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--sh-1);
  transition:transform var(--med) var(--spring), box-shadow var(--med) var(--ease),
             background var(--med) var(--ease), border-color var(--med) var(--ease);
}
.stat:hover{transform:translateY(-1px);box-shadow:var(--sh-3)}
.stat b{display:block;font-size:1.62rem;line-height:1.08;font-weight:700;letter-spacing:-.03em}
.stat span{font-size:.685rem;color:var(--ink-2);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.g3.always .stat{padding:10px 9px}
.g3.always .stat b{font-size:1.18rem}
.g3.always .stat span{font-size:.575rem;letter-spacing:.045em}

/* ring gauge */
.g3.rings{grid-template-columns:repeat(3,1fr);gap:9px}
.g3.rings .stat{padding:12px 8px}
@media(max-width:700px){
  .g3.rings .ringwrap{flex-direction:column;gap:7px;text-align:center;align-items:center}
  .g3.rings .rv{align-items:center}
  .g3.rings .rv b{font-size:.95rem}
  .g3.rings .rv span{font-size:.58rem;letter-spacing:.04em}
}
.ring{display:block}
.ring circle{transition:stroke-dashoffset var(--slow) var(--ease)}
.ringwrap{display:flex;align-items:center;gap:11px}
.ringwrap .rv{display:flex;flex-direction:column;min-width:0}
.ringwrap .rv b{font-size:1.05rem;font-weight:720;letter-spacing:-.02em}
.ringwrap .rv span{font-size:.68rem;color:var(--ink-2);font-weight:660;letter-spacing:.05em;text-transform:uppercase}

/* ---------- question card ---------- */
.qbox{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
  padding:14px;margin-bottom:11px;box-shadow:var(--sh-1);
  transition:background var(--med) var(--ease), border-color var(--med) var(--ease),
             box-shadow var(--med) var(--ease);
}
.qbox:focus-within{box-shadow:var(--sh-3);border-color:var(--line-2)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{
  flex:0 0 auto;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));
  color:#fff;border-radius:var(--r-xs);
  min-width:30px;height:25px;display:flex;align-items:center;justify-content:center;
  font-size:.71rem;font-weight:730;padding:0 6px;box-shadow:var(--sh-1);
}
:root[data-theme="dark"] .qnum{color:#06121F}
.qtxt{flex:1;font-size:.9rem;line-height:1.5;font-weight:520}

.iBtn{
  flex:0 0 auto;width:27px;height:27px;border-radius:var(--r-full);
  border:1.5px solid color-mix(in srgb, var(--brand-2) 45%, transparent);
  background:var(--surface);color:var(--brand-2);
  font-weight:750;font-size:.74rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:background var(--fast) var(--ease), transform var(--fast) var(--spring),
             border-color var(--fast) var(--ease);
}
.iBtn:hover{background:var(--brand-tint);border-color:var(--brand-2)}
.iBtn:active{transform:scale(.88)}

.yn{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.yn button{
  flex:1;min-width:82px;padding:11px 10px;min-height:46px;
  border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);font-weight:660;font-size:.83rem;cursor:pointer;
  box-shadow:var(--sh-1);
  transition:all var(--fast) var(--ease), transform var(--fast) var(--spring);
}
.yn button:hover{border-color:var(--brand-3);background:var(--surface-2)}
.yn button:active{transform:scale(.97)}
.yn button.sel-y{background:linear-gradient(180deg,var(--ok),color-mix(in srgb,var(--ok) 84%,#000));
  border-color:transparent;color:#fff;box-shadow:var(--sh-2)}
.yn button.sel-n{background:linear-gradient(180deg,var(--bad),color-mix(in srgb,var(--bad) 84%,#000));
  border-color:transparent;color:#fff;box-shadow:var(--sh-2)}
.yn button.sel-x{background:var(--ink-2);border-color:transparent;color:var(--surface);box-shadow:var(--sh-2)}
:root[data-theme="dark"] .yn button.sel-y,:root[data-theme="dark"] .yn button.sel-n{color:#06121F}

.nd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
.nd label>span{font-size:.685rem;line-height:1.35;min-height:2.7em;display:block}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.845rem;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--brand-2);cursor:pointer}

.qres{
  margin-top:11px;padding:9px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-3);
  display:flex;justify-content:space-between;align-items:center;gap:9px;font-size:.8rem;
  transition:background var(--med) var(--ease), border-color var(--med) var(--ease);
}
.qres.rg{background:var(--ok-tint);border-color:var(--ok-line);color:var(--ok)}
.qres.ra{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn)}
.qres.rr{background:var(--bad-tint);border-color:var(--bad-line);color:var(--bad)}
.qres.rn{background:var(--surface-3);color:var(--ink-2)}
.qres .dotv{width:10px;height:10px;border-radius:var(--r-full);flex:0 0 auto;
  display:inline-block;margin-right:8px}
.qres .lbl{display:flex;align-items:center;font-weight:680}

/* ---------- section navigation ---------- */
.secwrap{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.secwrap .arw{
  flex:0 0 auto;width:36px;height:36px;border-radius:var(--r-full);
  border:1px solid var(--line-2);background:var(--surface);color:var(--brand-2);
  font-size:1.05rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:var(--sh-2);
  transition:all var(--fast) var(--ease), transform var(--fast) var(--spring);
}
.secwrap .arw:hover:not(:disabled){background:var(--brand-tint);border-color:var(--brand-2)}
.secwrap .arw:active:not(:disabled){transform:scale(.9)}
.secwrap .arw:disabled{opacity:.28;box-shadow:none}
.secwrap .secnav{flex:1;min-width:0;margin:0;padding:3px 0}

.secnav{display:flex;gap:7px;overflow-x:auto;padding:3px 0 9px;scrollbar-width:none;
  scroll-behavior:smooth}
.secnav::-webkit-scrollbar{display:none}
.secnav button{
  white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);
  border-radius:var(--r-full);padding:8px 15px;min-height:38px;
  font-size:.775rem;font-weight:650;cursor:pointer;color:var(--ink-2);
  box-shadow:var(--sh-1);
  transition:all var(--fast) var(--ease), transform var(--fast) var(--spring);
}
.secnav button:hover{border-color:var(--brand-3);color:var(--ink)}
.secnav button:active{transform:scale(.96)}
.secnav button.on{
  background:linear-gradient(180deg,var(--brand-2),var(--brand));
  border-color:transparent;color:#fff;box-shadow:var(--sh-2);
}
:root[data-theme="dark"] .secnav button.on{color:#06121F}
.secnav button .d{display:inline-block;width:7px;height:7px;border-radius:var(--r-full);margin-left:7px}
.secpos{font-size:.7rem;color:var(--ink-2);font-weight:650;text-align:center;margin:-2px 0 9px;
  letter-spacing:.02em}

/* ---------- sticky bottom bar ---------- */
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center;
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 -1px 0 var(--line), 0 -8px 30px rgba(16,32,56,.06);
}
.bottombar .btn{flex:1}
.bottombar .grow{flex:2}

/* ---------- save indicator ---------- */
.savebar{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.735rem;font-weight:670;color:var(--ok);
  background:var(--ok-tint);border:1px solid var(--ok-line);
  border-radius:var(--r-full);padding:5px 13px;
}
.savebar.pulse{animation:sv .8s var(--spring)}
@keyframes sv{0%{transform:scale(.92);opacity:.5}55%{transform:scale(1.045)}100%{transform:scale(1);opacity:1}}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-sm);
  border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.82rem;background:var(--surface)}
th,td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{
  background:linear-gradient(180deg,var(--brand),var(--brand-900));
  color:#fff;font-size:.7rem;font-weight:690;letter-spacing:.045em;text-transform:uppercase;
  position:sticky;top:0;z-index:2;border-bottom:0;white-space:nowrap;
}
:root[data-theme="dark"] th{background:linear-gradient(180deg,#16273A,#101C2B);color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--fast) var(--ease)}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr:hover{background:var(--brand-tint)}

/* ---------- modal ---------- */
.mask{
  position:fixed;inset:0;z-index:200;display:flex;
  align-items:flex-end;justify-content:center;padding:0;
  background:rgba(8,18,32,.5);
  backdrop-filter:blur(8px) saturate(120%);
  -webkit-backdrop-filter:blur(8px) saturate(120%);
  animation:fadeIn var(--med) var(--ease);
}
@media(min-width:640px){.mask{align-items:center;padding:24px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:660px;
  max-height:88vh;overflow:auto;padding:20px;
  box-shadow:var(--sh-4);
  animation:sheetUp var(--slow) var(--spring);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:640px){.modal{border-radius:var(--r-xl);animation:popIn var(--med) var(--spring)}}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{color:var(--ink);padding-right:40px;font-size:1.08rem}
.mclose{position:absolute;right:16px;top:16px;min-height:32px;padding:5px 11px}

/* ---------- banners ---------- */
.banner{
  padding:11px 14px;border-radius:var(--r-sm);font-size:.805rem;font-weight:580;
  margin-bottom:12px;border:1px solid;line-height:1.5;
}
.b-warn{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn)}
.b-err{background:var(--bad-tint);border-color:var(--bad-line);color:var(--bad)}
.b-ok{background:var(--ok-tint);border-color:var(--ok-line);color:var(--ok)}
.b-info{background:var(--brand-tint);border-color:color-mix(in srgb,var(--brand) 22%,transparent);color:var(--brand)}
.banner b{font-weight:700}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:calc(86px + env(safe-area-inset-bottom));z-index:300;
  background:color-mix(in srgb, var(--ink) 94%, transparent);
  color:var(--surface);padding:12px 20px;border-radius:var(--r-full);
  font-size:.83rem;font-weight:640;
  box-shadow:var(--sh-4);max-width:90vw;text-align:center;display:none;
  backdrop-filter:blur(10px);
  animation:toastIn var(--med) var(--spring);
}
@keyframes toastIn{from{transform:translateX(-50%) translateY(22px);opacity:0}
  to{transform:translateX(-50%) translateY(8px);opacity:1}}

/* ---------- chat ---------- */
.thread{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg{max-width:82%;padding:10px 13px;border-radius:var(--r-md);font-size:.855rem;line-height:1.48;
  box-shadow:var(--sh-1);animation:msgIn var(--med) var(--spring)}
@keyframes msgIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.msg.me{align-self:flex-end;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;
  border-bottom-right-radius:5px}
:root[data-theme="dark"] .msg.me{color:#06121F}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);
  border-bottom-left-radius:5px}
.msg .who{font-size:.655rem;font-weight:730;opacity:.75;display:block;margin-bottom:3px;letter-spacing:.04em}
.msg .tm{font-size:.62rem;opacity:.6;display:block;margin-top:4px;text-align:right}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.item{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;
  box-shadow:var(--sh-1);
  transition:all var(--fast) var(--ease), transform var(--fast) var(--spring);
}
.item:hover{border-color:var(--brand-3);background:var(--surface-2);box-shadow:var(--sh-2);transform:translateX(2px)}
.item:active{transform:scale(.995)}
.item b{font-size:.885rem;font-weight:640}
.item .s{font-size:.735rem;color:var(--ink-2);margin-top:1px}

.badge{background:var(--bad);color:#fff;border-radius:var(--r-full);padding:2px 8px;
  font-size:.66rem;font-weight:730;box-shadow:var(--sh-1)}
:root[data-theme="dark"] .badge{color:#06121F}

/* ---------- report ---------- */
.rep-head h2{font-size:1.12rem;letter-spacing:.02em}
.rep td.k{font-weight:670;color:var(--ink-2);white-space:nowrap;width:1%;font-size:.75rem}
.rep-foot{text-align:center;font-size:.66rem;color:var(--ink-3);padding:6px 14px 2px;line-height:1.6}
.sigbox{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px;min-height:96px;
  display:flex;flex-direction:column}
.sigbox span{font-size:.7rem;color:var(--ink-2);font-weight:670}
.sigbox b{font-size:.85rem;margin-top:3px}
.sigbox i{flex:1;border-bottom:1px solid var(--line-2);margin-top:auto}

@media print{
  @page{size:A4;margin:12mm 10mm}
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#F4F6F9;
        --ink:#000;--ink-2:#333;--line:#B9C4D2;--line-2:#9AA8BA}
  html[data-theme="dark"]{--bg:#fff;--surface:#fff;--ink:#000}
  body{background:#fff;color:#000;font-size:10.5pt}
  .topbar,.nav,.bottombar,#toast,.noprint,.foot,.secnav,.secwrap{display:none!important}
  #app{padding:0;max-width:none}
  .wrap{padding:0}
  .card{box-shadow:none;border:1px solid #C3CDDA;margin-bottom:8px;padding:10px;border-radius:6px}
  .rep-head,.sigbox,.stat,.grid.rings{break-inside:avoid}
  h3{break-after:avoid}
  thead{display:table-header-group}
  tr{break-inside:avoid}
  .tw{overflow:visible;border:0}
  table{font-size:8.6pt}
  th{background:#0B3C71!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fill-g,.fill-a,.fill-r,.chip,.banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rep-foot{display:block}
  h3{font-size:11pt}
  .stat{border:1px solid #C3CDDA;box-shadow:none}
}

/* ---------- login path chooser ---------- */
.pathcard{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);
  padding:15px 16px;margin-bottom:11px;cursor:pointer;color:var(--ink);
  box-shadow:var(--sh-2);
  transition:all var(--fast) var(--ease), transform var(--fast) var(--spring);
}
.pathcard:hover{border-color:var(--brand-2);background:var(--surface-2);box-shadow:var(--sh-3);transform:translateY(-1px)}
.pathcard:active{transform:scale(.985)}
.pathcard .ptxt{flex:1;min-width:0;display:flex;flex-direction:column}
.pathcard .ptxt b{font-size:.98rem;font-weight:670;margin-bottom:2px}
.pathcard .ptxt span{font-size:.775rem;color:var(--ink-2);line-height:1.42}
.pathcard .parr{font-size:1.3rem;color:var(--ink-3);font-weight:700;flex:0 0 auto}
.pico{
  flex:0 0 auto;width:46px;height:46px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;
  border:1px solid transparent;
}
.pico.sm{width:24px;height:24px;font-size:.82rem;border-radius:7px}
.pico.sup{background:var(--brand-tint);border-color:color-mix(in srgb,var(--brand) 20%,transparent)}
.pico.adm{background:var(--warn-tint);border-color:var(--warn-line)}
.pico.site{background:var(--ok-tint);border-color:var(--ok-line)}
.spsw{display:inline-flex;gap:2px;background:var(--surface-2,rgba(255,255,255,.10));
  border-radius:var(--r-full);padding:2px;margin-left:6px;flex:0 0 auto}
.spsw button{border:0;background:transparent;color:inherit;opacity:.62;cursor:pointer;
  font-size:.68rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;
  padding:5px 9px;border-radius:var(--r-full);min-height:30px;
  transition:all var(--fast) var(--ease)}
.spsw button.on{background:var(--surface);color:var(--brand);opacity:1;box-shadow:var(--sh-1)}
.spsw button:active{transform:scale(.95)}
@media(max-width:430px){ .spsw button{padding:5px 7px;font-size:.63rem} }
.item.admpick{width:100%;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);
  border-radius:var(--r-md,12px);padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  transition:all var(--fast) var(--ease)}
.item.admpick:hover{border-color:var(--brand-3)}
.item.admpick.on{border-color:var(--brand);background:var(--brand-tint);box-shadow:var(--sh-1)}
.pico.dash{background:var(--info-tint,var(--brand-tint));border-color:var(--info-line,color-mix(in srgb,var(--brand) 20%,transparent))}
.pathbadge{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:12px;font-size:.755rem;font-weight:690;letter-spacing:.04em;
  color:var(--brand);background:var(--brand-tint);
  border:1px solid color-mix(in srgb,var(--brand) 18%,transparent);
  border-radius:var(--r-full);padding:6px 14px;
}
.pathbadge.adm{color:var(--warn);background:var(--warn-tint);border-color:var(--warn-line)}

/* ---------- gate & code box ---------- */
.gate-ico{
  width:66px;height:66px;border-radius:var(--r-lg);margin:0 auto;
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;
  box-shadow:var(--sh-2);
}
.gate-ico.warn{background:var(--warn-tint);border:1px solid var(--warn-line)}
.gate-ico.err{background:var(--bad-tint);border:1px solid var(--bad-line)}
.codebox{
  font-family:var(--num);font-size:2.1rem;font-weight:700;letter-spacing:.24em;
  text-align:center;padding:18px;margin:14px 0;
  background:var(--brand-tint);border:1px dashed color-mix(in srgb,var(--brand) 35%,transparent);
  border-radius:var(--r-md);color:var(--brand);
}
.steps{margin:4px 0 12px 0;padding-left:20px;font-size:.88rem;line-height:1.55;color:var(--ink-2)}
.steps li{margin-bottom:6px}
.steps li::marker{color:var(--brand);font-weight:700}

/* ---------- onboarding tour ---------- */
.tour{
  position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(6,16,30,.72);
  backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);
  animation:fadeIn var(--med) var(--ease);
}
.tourcard{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);max-width:540px;width:100%;max-height:90vh;
  overflow:auto;padding:24px;box-shadow:var(--sh-4);
  animation:popIn var(--slow) var(--spring);
}
.tourcard h2{color:var(--ink)}
.tourstep{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.tourstep .ico{
  flex:0 0 auto;width:42px;height:42px;border-radius:var(--r-sm);
  background:var(--brand-tint);color:var(--brand);
  border:1px solid color-mix(in srgb,var(--brand) 18%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:730;
}
.tourstep b{display:block;font-size:.915rem;margin-bottom:3px;font-weight:660}
.tourstep span{font-size:.825rem;color:var(--ink-2);line-height:1.5}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}
.dots i{width:7px;height:7px;border-radius:var(--r-full);background:var(--line-2);display:block;
  transition:all var(--med) var(--spring)}
.dots i.on{background:var(--brand-2);width:22px}

/* ---------- footer ---------- */
.foot{text-align:center;font-size:.7rem;color:var(--ink-3);padding:24px 16px 10px;line-height:1.7}
.logos{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:11px;flex-wrap:wrap}
.logos img{height:34px;filter:none;transition:opacity var(--med) var(--ease)}
:root[data-theme="dark"] .logos img{filter:brightness(1.06)}

/* ---------- utility ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
.split{display:grid;gap:13px}
@media(min-width:880px){.split{grid-template-columns:320px 1fr}}
.fade-in{animation:fadeUp var(--med) var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media(max-width:470px){
  body{font-size:14.5px}
  .brand b{font-size:.76rem}
  .topbar-in{gap:7px;padding:10px 12px}
  .tb-btn{padding:6px 8px;font-size:.68rem}
  .nav a{padding:9px 11px;font-size:.735rem}
  .wrap{padding:13px}
  .card{padding:14px;border-radius:var(--r-sm)}
}
</style>

/* -----------------------------------------------------------------
   Installability. A data: manifest cannot resolve a relative
   start_url, and Android needs 192px + 512px icons, so the manifest
   is built here from the real page URL and attached as a blob.
   ----------------------------------------------------------------- */
(function(){
  try{
    if(location.protocol === 'file:') return;      // no install from a local file
    const base = location.href.split('#')[0].split('?')[0];
    const dir  = base.replace(/[^/]*$/, '');
    const mf = {
      name: 'Supervision Intégrée — Région de l\'Ouest',
      short_name: 'ATHECS',
      description: 'Outil de mentorat UPEC — Projet ATHECS · NACC / ICAP Global Health',
      start_url: base,
      scope: dir,
      id: dir,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#F2F5F9',
      theme_color: '#0B3C71',
      lang: 'fr',
      icons: [
        { src: ICON_192,  sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: ICON_512,  sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: ICON_512M, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(e){}
})();

/* Service worker — makes the page itself load with no network.
   Without it, tapping the home-screen icon offline shows a browser error. */
(function(){
  try{
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol === 'file:') return;
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* sw.js not uploaded — app still works online */ });
    });
  }catch(e){}
})();

/* A blank white screen is never acceptable in the field: show the error instead. */
window.addEventListener('error', function(ev){
  try{
    const app=document.getElementById('app');
    if(app && app.innerHTML.length < 50){
      app.innerHTML = '<div style="padding:20px;font:14px system-ui">'
       + '<h2 style="color:#B3261E">Erreur au démarrage / Startup error</h2>'
       + '<p style="font-size:13px">Signalez ce message à l\'administrateur :</p>'
       + '<pre style="white-space:pre-wrap;background:#FCE9E7;padding:10px;border-radius:8px;font-size:12px">'
       + String(ev.message || ev.error || 'unknown') + '</pre></div>';
    }
  }catch(e){}
});

/* What kind of phone, and are we already installed? On iOS the home-screen app and
   Safari keep SEPARATE storage: an account enrolled in Safari does not exist inside the
   installed app. So the install has to happen first — the app says so. */
function isIOS(){
  const ua=navigator.userAgent||'';
  return /iPad|iPhone|iPod/.test(ua) ||
         (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function isStandalone(){
  try{ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
  catch(e){ return false; }
}

/* The four roles, named once so every screen agrees and both languages are covered. */
const ROLES=[{k:'SUPERVISOR'},{k:'SUPER'},{k:'ADMIN'},{k:'SITE'},{k:'VIEWER'}];
function roleLabel(k){
  const L=LANG==='fr';
  return ({SUPERVISOR: L?'Superviseur':'Supervisor',
           SUPER:      L?'Super utilisateur':'Super user',
           ADMIN:      L?'Administrateur':'Administrator',
           SITE:       L?'Personnel du site':'Facility staff',
           VIEWER:     L?'Lecteur':'Viewer'})[k] || k;
}

/* A reason we can log, asked inside the app rather than through the browser's own
   prompt() — a native dialog is blocked or silently dropped in some installed-PWA
   contexts, which would make an approval or a refusal fail without saying so. */
let ASK_CB=null;
function askReason(o){
  ASK_CB = o.onOk || null;
  modal(o.title, `${o.help?`<p class="small muted">${esc(o.help)}</p>`:''}
    ${o.banner?`<div class="banner ${o.bannerTone||'b-warn'}">${o.banner}</div>`:''}
    <label class="f"><span>${esc(o.label||(LANG==='fr'?'Motif':'Reason'))}</span>
      <textarea id="ask-t" rows="3" placeholder="${esc(o.placeholder||'')}"></textarea></label>`,
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     <button class="btn ${o.danger?'dan':''}" onclick="askOk(${o.optional?'false':'true'})">${
       esc(o.confirmLabel||T('save'))}</button>`);
  setTimeout(()=>{ const t=$('#ask-t'); if(t) t.focus(); }, 60);
}
/* A yes/no that needs no typing. Same discipline as askReason(): never the
   browser's confirm(), which an installed PWA can swallow without a sound. */
let CONF_CB=null;
function confirmModal(o){
  CONF_CB = o.onOk || null;
  modal(o.title, `<div class="banner ${o.tone||'b-warn'}">${o.body||''}</div>
    ${o.extra||''}`,
    `<button class="btn sec" onclick="closeModal()">${esc(o.cancelLabel||T('cancel'))}</button>
     <button class="btn ${o.danger?'dan':''}" onclick="confOk()">${esc(o.okLabel||'OK')}</button>`);
}
function confOk(){ const cb=CONF_CB; CONF_CB=null; closeModal(); if(cb) cb(); }

function askOk(required){
  const v=(($('#ask-t')||{}).value||'').trim();
  if(required && !v) return toast(LANG==='fr'?'Le motif est obligatoire':'The reason is mandatory');
  const cb=ASK_CB; ASK_CB=null; closeModal(); if(cb) cb(v);

const DB = {
  k:'athecs_v1',
  d:null,
  load(){
    try{ this.d = JSON.parse(localStorage.getItem(this.k)) || null; }catch(e){ this.d=null; }
    if(!this.d) this.d = this.fresh();
    this.migrate();
    return this.d;
  },
  fresh(){
    return {
      users:[], sites:[], questions:[], cycles:[], visits:[], answers:{},
      actions:[], threads:[], messages:[], siteReq:[], audit:[], outbox:[],
      config:{ api:'', dashUrl:'', bands:{green:100,yellow:90}, dqa:{tolPct:5, exactBelow:100, yellowPct:10},
               admins:[], lastSync:null },
      session:null, seq:1
    };
  },
  migrate(){
    const d=this.d;
    if(!d.sites || !d.sites.length){
      d.sites = SEED_SITES.map((s,i)=>({
        id:'S'+String(i+1).padStart(3,'0'), district:s[0], area:s[1], facility:s[2],
        status:'ACTIVE', version:1
      }));
    }
    if(!d.questions || !d.questions.length){
      d.questions = SEED_QUESTIONS.map((q,i)=>Object.assign({},q,{
        id:q.code, order:i+1, weight:1, active:true, version:1
      }));
    }
    if(!d.cycles || !d.cycles.length){
      d.cycles = [ mkCycle('FY26 Q4', 2026, 4, true) ];
    }
    /* NOTHING privileged is seeded any more. The app used to ship with two super
       accounts on PIN 1234, in a file served from a public address — so anyone who
       installed it could open the regional console by typing four digits.
       A privileged slot now arrives from the server, already assigned to a named
       person, and is claimed with a one-time code. The app carries no PIN at all. */
    d.users = d.users || [];

    /* ---- and the ones already sitting on the phones -------------------------------
       Deleting the seed only stopped NEW installs. Every phone that ever ran an older
       version still has "Super Utilisateur 1" and "Super Utilisateur 2" — with PIN 1234
       — written into its own database, and an update does not touch that. So the old
       accounts kept appearing in the Administration list, where a real 6-digit code is
       naturally refused, and the person could go no further.

       A genuine v4 slot always arrives from the server carrying slot:true. Anything
       privileged on this phone WITHOUT it was seeded by an old version: it is removed
       here, and whoever was signed into it is signed out. Nothing is lost — a slot is
       re-assigned from the console in one click, and no supervision is attached to it. */
    const legacy = d.users.filter(u => u && (u.role==='SUPER'||u.role==='ADMIN') && !u.slot);
    if(legacy.length){
      const ids = legacy.map(u=>u.id);
      d.users = d.users.filter(u => !ids.includes(u.id));
      if(ids.includes(d.session)) d.session = null;
      d.legacySlotsRemoved = (d.legacySlotsRemoved||0) + legacy.length;
    }

    if(!d.config.dqa) d.config.dqa = {tolPct:5, exactBelow:100, yellowPct:10};
    if(!d.config.api && typeof DEFAULT_API==='string' && DEFAULT_API) d.config.api = DEFAULT_API;
    if(!d.threads.length){
      d.threads = [{id:'T-GEN', scope:'GENERAL', title:'Annonces régionales — Région de l\'Ouest', created:Date.now()}];
    }
  },
  save(){ try{ localStorage.setItem(this.k, JSON.stringify(this.d)); }catch(e){ toast('Stockage plein'); } },
  id(p){ const n = this.d.seq++; this.save(); return p+'-'+Date.now().toString(36)+'-'+n; }
};

/* Fiscal-year quarter helper — FY26 = 1 Oct 2025 → 30 Sep 2026 */
function fyQuarterMonths(fy, q){
  // q1 = Oct,Nov,Dec of (fy-1); q2 = Jan,Feb,Mar of fy; q3 = Apr,May,Jun; q4 = Jul,Aug,Sep
  const map = {1:[[9,fy-1],[10,fy-1],[11,fy-1]], 2:[[0,fy],[1,fy],[2,fy]],
               3:[[3,fy],[4,fy],[5,fy]], 4:[[6,fy],[7,fy],[8,fy]]};
  return map[q].map(([m,y])=>({m,y}));
}
const MONTHS_FR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthName(m,y){ return (LANG==='fr'?MONTHS_FR:MONTHS_EN)[m]+' '+y; }

function mkCycle(name, fy, q, active){
  const mo = fyQuarterMonths(fy,q);
  return {
    id:'C-FY'+fy+'Q'+q, name:name, fy:fy, q:q,
    months: mo, monthsComplete:[true,true,true],
    open: new Date(mo[0].y, mo[0].m, 1).toISOString().slice(0,10),
    close: new Date(mo[2].y, mo[2].m+1, 0).toISOString().slice(0,10),
    deadline:'', status: active?'OPEN':'PLANNED', qversion:1, sites:'ALL'
  };
}
function cycleMonths(c){
  // returns only the months flagged complete
  return c.months.filter((m,i)=>c.monthsComplete[i]!==false);
}
function cyclePeriodLabel(c){
  const ms = cycleMonths(c);
  if(!ms.length) return c.name;
  return monthName(ms[0].m,ms[0].y) + ' – ' + monthName(ms[ms.length-1].m, ms[ms.length-1].y);
}
/* Every month name a question can carry, in both languages — used only to catch a month
   somebody typed by hand into a question added from the console. */
const MONTH_RE = 'Janvier|Février|Fevrier|Mars|Avril|Mai|Juin|Juillet|Aout|Août|Septembre|Octobre|Novembre|Décembre|Decembre|'
               + 'January|February|March|April|June|July|August|September|October|November|December';

/* Put the cycle's real months into a question's text.
   Applies to the wording AND to the numerator, denominator, follow-up and checklist
   labels — a title saying "Juillet" above a field saying "Avril" is how a supervisor
   ends up entering the wrong month's figure.
   mIdx, when given, is the index inside cycleMonths(): a question asked once per month. */
function resolvePeriod(text, cyc, mIdx){
  let t = (text==null) ? text : String(text);
  if(!cyc || t==null || t==='') return t;
  const ms  = cycleMonths(cyc);
  const lbl = cyclePeriodLabel(cyc);
  const m1  = ms.length? monthName(ms[0].m, ms[0].y) : lbl;
  const m2  = ms.length>1? monthName(ms[ms.length-1].m, ms[ms.length-1].y) : m1;
  const mk  = (mIdx!==undefined && ms[mIdx]) ? monthName(ms[mIdx].m, ms[mIdx].y) : m1;

  /* FIRST the legacy clean-up, for a month typed by hand into a new question.
     It has to run BEFORE the tokens are expanded: run afterwards it would rewrite the
     month we have just inserted for month 2 or 3 back to the first month of the cycle. */
  t = t.replace(/entre\s+\S+\s+et\s+\S+\s+20\d\d/gi, 'sur la période '+lbl);
  t = t.replace(new RegExp('('+MONTH_RE+')\\s+et\\s+('+MONTH_RE+')\\s+20\\d\\d','gi'), m1+' et '+m2);
  t = t.replace(new RegExp('en\\s+('+MONTH_RE+')\\s*20\\d\\d','gi'), 'en '+m1);
  t = t.replace(/\bFY2[3-9]-?2?\d?\b/g, 'FY'+(cyc.fy%100));

  /* THEN the explicit tokens the questionnaire actually uses. */
  return t.replace(/\{\{PERIODE\}\}/g, lbl)
          .replace(/\{\{MOIS_1\}\}/g, m1)
          .replace(/\{\{MOIS_2\}\}/g, m2)
          .replace(/\{\{MOIS\}\}/g,   mk);
}

/* ===================== scoring ===================== */
/* Bands (approved): 100% = GREEN, 90–99.9% = YELLOW, <90% = RED */
function band(pct){
  if(pct===null||pct===undefined||isNaN(pct)) return 'n';
  const B = DB.d.config.bands;
  if(pct >= (B.green||100)) return 'g';
  if(pct >= (B.yellow||90)) return 'a';
  return 'r';
}
function bandColor(p){ const b=band(p); return b==='g'?'var(--green)':b==='a'?'var(--amber)':b==='r'?'var(--red)':'#D8E1EC'; }
function bandLabel(b){ return b==='g'?T('perf'):b==='a'?T('accept'):b==='r'?T('crit'):'—'; }

/* DQA concordance rule (approved):
   Comparing a figure reported in two tools (DAMA vs Registre).
   - If the reference figure > 100  : |écart| ≤ 5%  → GREEN ; ≤ 10% → YELLOW ; else RED
   - If the reference figure ≤ 100  : écart = 0     → GREEN ; ≤ 10% → YELLOW ; else RED   */
function dqaScore(num, den){
  const cfg = DB.d.config.dqa;
  if(den===null||den===undefined||den===''||isNaN(den)) return null;
  const D = Number(den), N = Number(num);
  if(D===0) return null;
  const diff = Math.abs(N - D);
  const pct = (diff / D) * 100;
  let b;
  if(D > (cfg.exactBelow||100)) b = pct <= (cfg.tolPct||5) ? 'g' : (pct <= (cfg.yellowPct||10) ? 'a' : 'r');
  else b = diff === 0 ? 'g' : (pct <= (cfg.yellowPct||10) ? 'a' : 'r');
  return { band:b, diff:(N-D), pct:pct, points: b==='g'?1:(b==='a'?0.5:0),
           explain: dqaExplain(N,D,diff,pct,b,cfg) };
}
function dqaExplain(N,D,diff,pct,b,cfg){
  const L = LANG==='fr';
  const rule = D > (cfg.exactBelow||100)
    ? (L? `La valeur de référence (${D}) est supérieure à 100 : un écart de ±${cfg.tolPct}% est toléré (vert).`
        : `Reference value (${D}) is above 100: a ±${cfg.tolPct}% gap is tolerated (green).`)
    : (L? `La valeur de référence (${D}) est inférieure ou égale à 100 : la concordance doit être exacte pour être verte.`
        : `Reference value (${D}) is 100 or below: concordance must be exact to score green.`);
  return (L
    ? `DAMA = ${N} · Registre = ${D}\nÉcart = ${N-D} (${pct.toFixed(1)} %)\n${rule}\nAu-delà de ±${cfg.yellowPct}% le score est rouge.\nRésultat : ${b==='g'?'VERT (1 point)':b==='a'?'JAUNE (0,5 point)':'ROUGE (0 point)'}`
    : `DAMA = ${N} · Register = ${D}\nGap = ${N-D} (${pct.toFixed(1)} %)\n${rule}\nBeyond ±${cfg.yellowPct}% the score is red.\nResult: ${b==='g'?'GREEN (1 point)':b==='a'?'YELLOW (0.5 point)':'RED (0 point)'}`);
}

/* Score one answer → {n, d, pct, band, na, explain} */
function scoreAnswer(q, a){
  if(!a) return {n:null,d:null,pct:null,band:'n',na:false,answered:false};
  if(a.na) return {n:0,d:0,pct:null,band:'n',na:true,answered:true,
                   explain:(LANG==='fr'?'Marqué N/A — exclu du numérateur et du dénominateur.':'Marked N/A — excluded from both numerator and denominator.')};
  const L = LANG==='fr';
  if(q.dqa){
    const r = dqaScore(a.num, a.den);
    if(!r) return {n:null,d:null,pct:null,band:'n',na:false,answered:false};
    return {n:r.points,d:1,pct:r.points*100,band:r.band,na:false,answered:true,explain:r.explain,dqa:r};
  }
  if(q.type==='BINARY'){
    if(a.v===undefined||a.v===null) return {n:null,d:null,pct:null,band:'n',na:false,answered:false};
    let pts = a.v?1:0;
    // conditional follow-up: both must be yes
    if(q.fu && a.v){ if(a.fu===undefined||a.fu===null) return {n:null,d:null,pct:null,band:'n',na:false,answered:false}; pts = a.fu?1:0; }
    return {n:pts,d:1,pct:pts*100,band:pts?'g':'r',na:false,answered:true,
      explain:(L?`Réponse : ${a.v?'Oui':'Non'}${q.fu&&a.v?` · À jour : ${a.fu?'Oui':'Non'}`:''}\nScore = ${pts} ÷ 1 = ${pts*100} %`
                :`Answer: ${a.v?'Yes':'No'}${q.fu&&a.v?` · Up to date: ${a.fu?'Yes':'No'}`:''}\nScore = ${pts} ÷ 1 = ${pts*100} %`)};
  }
  if(q.type==='THRESHOLD'){
    if(a.days===undefined||a.days===null||a.days==='') return {n:null,d:null,pct:null,band:'n',na:false,answered:false};
    const pts = Number(a.days) < 30 ? 1 : 0;
    return {n:pts,d:1,pct:pts*100,band:pts?'g':'r',na:false,answered:true,
      explain:(L?`Délai déclaré : ${a.days} jours.\nMoins de 30 jours = 1 point, 30 jours et plus = 0.\nScore = ${pts} ÷ 1 = ${pts*100} %`
                :`Reported delay: ${a.days} days.\nUnder 30 days = 1 point, 30 or more = 0.\nScore = ${pts} ÷ 1 = ${pts*100} %`)};
  }
  if(q.type==='COMPOSITE'){
    const items = q.items||[];
    const ticks = a.items||[];
    if(ticks.length!==items.length || ticks.some(x=>x===undefined||x===null))
      return {n:null,d:null,pct:null,band:'n',na:false,answered:false};
    const all = ticks.every(Boolean);
    const pts = all?1:0;
    const nb = ticks.filter(Boolean).length;
    return {n:pts,d:1,pct:pts*100,band:pts?'g':'r',na:false,answered:true,
      explain:(L?`${nb} élément(s) sur ${items.length} disponibles.\nLe point n'est accordé que si TOUS les éléments sont présents.\nScore = ${pts} ÷ 1 = ${pts*100} %`
                :`${nb} of ${items.length} elements present.\nThe point is awarded only when ALL elements are present.\nScore = ${pts} ÷ 1 = ${pts*100} %`)};
  }
  // RATIO / SAMPLED
  if(a.num===undefined||a.num===null||a.num===''||a.den===undefined||a.den===null||a.den==='')
    return {n:null,d:null,pct:null,band:'n',na:false,answered:false};
  const N = Number(a.num), D = Number(a.den);
  if(D===0) return {n:0,d:0,pct:null,band:'n',na:true,answered:true,
    explain:(L?'Dénominateur nul sur la période — la question est automatiquement exclue (N/A).':'Denominator is zero for the period — automatically excluded (N/A).')};
  const pct = (N/D)*100;
  return {n:N,d:D,pct:pct,band:band(pct),na:false,answered:true,
    explain:(L?`${T('numerator')} = ${N}\n${T('denominator')} = ${D}\nScore = ${N} ÷ ${D} = ${pct.toFixed(1)} %\nSeuils : 100 % vert · 90–99,9 % jaune · < 90 % rouge`
              :`${T('numerator')} = ${N}\n${T('denominator')} = ${D}\nScore = ${N} ÷ ${D} = ${pct.toFixed(1)} %\nBands: 100 % green · 90–99.9 % yellow · < 90 % red`)};
}

/* Pooled ratio across a set of questions */
function pooled(qs, answers){
  let sn=0, sd=0, nAns=0, nNA=0, nTot=0, zeros=[];
  qs.forEach(q=>{
    nTot++;
    const r = scoreAnswer(q, answers[q.id]);
    if(!r.answered) return;
    nAns++;
    if(r.na){ nNA++; return; }
    sn += r.n * (q.weight||1);
    sd += r.d * (q.weight||1);
    if(r.band==='r') zeros.push(q);
  });
  const pct = sd>0 ? (sn/sd)*100 : null;
  /* answered = questions the supervisor has dealt with, N/A included.
     scored   = the ones that actually carry a number into the ratio. */
  return {n:sn, d:sd, pct:pct, band:band(pct), answered:nAns, scored:nAns-nNA,
          na:nNA, total:nTot, failed:zeros};
}
function visitScores(visit){
  const answers = DB.d.answers[visit.id] || {};
  const qs = visitQs(visit);
  const bySec = {};
  qs.forEach(q=>{ (bySec[q.sec] = bySec[q.sec] || []).push(q); });
  const secs = Object.keys(bySec).map(s=>Object.assign({sec:s, qs:bySec[s]}, pooled(bySec[s], answers)));
  return {
    sections: secs,
    clinical: pooled(qs.filter(q=>q.dom==='CLIN'), answers),
    mne:      pooled(qs.filter(q=>q.dom==='MNE'),  answers),
    overall:  pooled(qs, answers)
  };
}
/* A question flagged perMonth is not one question: it is one question PER MONTH the cycle
   still covers. Three months ticked → three DQA lines for that indicator; untick September
   and its line disappears with it. The answer id carries the month, so unticking a month
   and ticking it back finds the figures still there. */
function monthKey(mo){ return 'M'+mo.y+String(mo.m+1).padStart(2,'0'); }

function activeQuestions(cyc){
  const c = (cyc === undefined) ? activeCycle() : cyc;
  const base = DB.d.questions.filter(q=>q.active!==false)
                             .sort((a,b)=>(a.order||0)-(b.order||0));
  const ms = c ? cycleMonths(c) : [];
  const out = [];
  const put = (q, mIdx, mo)=>{
    const r = t => resolvePeriod(t, c, mIdx);
    out.push(Object.assign({}, q, {
      id:         mo ? q.id + monthKey(mo) : q.id,
      baseId:     q.id,
      month:      mo || null,
      monthLabel: mo ? monthName(mo.m, mo.y) : '',
      q:   r(q.q),   num: r(q.num), den: r(q.den), fu: r(q.fu),
      items: q.items ? q.items.map(r) : q.items
    }));
  };
  base.forEach(q=>{
    if(q.perMonth && ms.length) ms.forEach((mo,i)=>put(q,i,mo));
    else put(q);
  });

}

function cycleOf(v){

  if(!c) return null;
  if(v && Array.isArray(v.monthsComplete) && v.monthsComplete.length === (c.months||[]).length)
    return Object.assign({}, c, {monthsComplete: v.monthsComplete});

}

  let s=v.toFixed(1); if(Number(s)>=100 && v<100) s='99.9';
  if(Number(s)<=0 && v>0) s='0.1';

function me(){ return DB.d.session ? DB.d.users.find(u=>u.id===DB.d.session) : null; }
/* An administrator IS a super user, plus the right to assign super users. Every
   existing isSuper() gate therefore keeps working unchanged for both roles. */
function isSuper(){ const u=me(); return !!u && (u.role==='SUPER' || u.role==='ADMIN'); }
function isAdmin(){ const u=me(); return !!u && u.role==='ADMIN'; }
function isSlot(u){ return !!u && (u.role==='SUPER' || u.role==='ADMIN'); }

/* =====================================================================
   ONE PERSON, TWO HATS

   A person can genuinely be both: a supervisor covering districts, and the
   focal person of their own facility. `role` stays exactly what it always
   was — the account's PRIMARY role, and nothing already deployed changes
   meaning. A second hat is one explicit flag plus the scope field that
   already exists for it:

     supervisor hat  →  districts[]      dual===true means BOTH are real
     facility hat    →  sites[]

   The flag is explicit and never inferred, because facility staff also
   carry a district (derived from their facility) and guessing from that
   would hand people a supervisor role they were never given.

   A second hat is ASSIGNED, never self-declared: which districts somebody
   supervises is a decision of the coordination team. The phone can ask;
   only an approval can grant.
   ===================================================================== */
function isDual(u){ return !!(u && u.dual === true); }
/* Does this account carry the hat at all — regardless of which space is open. */
function hasSupHat(u){
  if(!u || isSlot(u)) return false;
  return u.role !== 'SITE' || isDual(u);
}
function hasSiteHat(u){
  if(!u || isSlot(u)) return false;
  return u.role === 'SITE' || isDual(u);
}

/* ---------- which space is open on THIS device -------------------------------
   The space decides what is DISPLAYED. It never decides what the person is
   allowed to have started: switching space in the middle of a supervision
   must cost a tap, not a morning's work. */
let SPACE = '';
function spaceOf(u){
  if(!u) return 'sup';
  if(!isDual(u)) return u.role==='SITE' ? 'site' : 'sup';
  if(SPACE==='site' || SPACE==='sup') return SPACE;
  let saved=''; try{ saved=localStorage.getItem('ath_space')||''; }catch(e){}
  if(saved==='site' || saved==='sup'){ SPACE=saved; return SPACE; }
  SPACE = u.role==='SITE' ? 'site' : 'sup';
  return SPACE;
}
function setSpace(sp){
  const u=me(); if(!u || !isDual(u)) return;
  if(sp!=='site' && sp!=='sup') return;
  SPACE = sp;
  try{ localStorage.setItem('ath_space', sp); }catch(e){}
  /* land on the home screen OF THAT SPACE, never on a screen the other space owns */
  if(location.hash !== '#/home') go('#/home'); else render();
}

/* ---------- who may CONDUCT a supervision -------------------------------------
   An administrator and a super user run the region: they open cycles, approve, return,
   reopen, manage accounts and read every score. They do NOT conduct supervisions.
   The separation is deliberate — the person who validates the work cannot be the person
   who did it, or the validation means nothing. If a super user must go to the field,
   they enrol a supervisor account like anybody else and use that.

   This is enforced at three levels, not one: the screens do not offer it, the routes
   refuse it, and the functions that write refuse it. Hiding a button is not a rule. */
function canSupervise(){ return hasSupHat(me()); }

/* ---------- one supervision per site per cycle --------------------------------
   The rule in the field is one supervisor phone per site. When the server finds a
   second submission for the same site and the same cycle it flags BOTH, and every
   score holds them out until a supervisor has chosen which one counts. A wrong
   average is worse than a missing one: it is believed. */
function inConflict(v){ return !!(v && Array.isArray(v.conflict) && v.conflict.length); }
function countable(v){ return (v.status==='SUBMITTED'||v.status==='APPROVED') && !inConflict(v); }
/* Every supervision caught in the same conflict as this one, this one included. */
function conflictGroup(v){
  if(!inConflict(v)) return [];
  const ids=[v.id].concat(v.conflict);
  return DB.d.visits.filter(x=>ids.includes(x.id));
}
/* The conflicts THIS person has to settle: they own one of the supervisions in it. */
function myConflicts(){
  const u=me(); if(!u) return [];
  const seen={}, out=[];
  DB.d.visits.forEach(v=>{
    if(!inConflict(v)) return;
    const g=conflictGroup(v);
    if(!g.some(x=>x.uid===u.id)) return;
    const key=g.map(x=>x.id).sort().join('|');
    if(seen[key]) return; seen[key]=1; out.push(g);
  });
  return out;
}
function activeCycle(){ return DB.d.cycles.find(c=>c.status==='OPEN') || DB.d.cycles[0]; }
function siteById(id){ return DB.d.sites.find(s=>s.id===id); }
function audit(action, entity, detail){
  DB.d.audit.push({id:DB.id('A'), ts:Date.now(), user:(me()||{}).name||'—', uid:DB.d.session,
                   action, entity, detail: detail||'' });
  DB.save();
  try{ queue('audit', DB.d.audit[DB.d.audit.length-1]); }catch(e){}
}

/* SVG ring gauge. size in px, pct 0-100 (null = empty ring). */
function ring(pct, size, label, sub, onInfo){
  const sz=size||62, sw=Math.max(5, Math.round(sz*0.105)), r=(sz-sw)/2, C=2*Math.PI*r;
  const v = (pct===null||pct===undefined||isNaN(pct)) ? 0 : Math.max(0,Math.min(100,pct));
  const b = band(pct);
  const col = b==='g'?'var(--ok)':b==='a'?'var(--warn)':b==='r'?'var(--bad)':'var(--line-2)';
  return `<div class="ringwrap">
    <svg class="ring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true">
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/>
      <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
        stroke-dashoffset="${(C*(1-v/100)).toFixed(1)}"
        transform="rotate(-90 ${sz/2} ${sz/2})"/>
    </svg>
    <div class="rv">
      <b class="sc" style="color:${col}">${pc(pct)}</b>
      <span>${esc(label||'')}</span>
      ${sub?`<span class="xs muted" style="text-transform:none;letter-spacing:0">${esc(sub)}</span>`:''}
      ${onInfo?`<button class="iBtn" style="margin-top:5px" onclick="${onInfo}">i</button>`:''}
    </div>
  </div>`;
}

/* =====================================================================
   PAINTING THE SCREEN WITHOUT THROWING THE USER OFF IT

   Every repaint replaces the whole of #app. The app repaints on its own —
   the 25-second tick, a sync finishing, an account refresh arriving — and
   each of those used to send the page back to the top and empty whatever
   box the person was typing in. To somebody halfway down a questionnaire
   that reads as the app losing its place for no reason. It is the single
   most irritating thing in the app and it has nothing to do with the data.

   So: a repaint of the SAME screen keeps the scroll position, keeps the
   focused field and its cursor, and keeps the section strip where it was.
   Only a real navigation goes back to the top. Nothing here changes what
   is displayed — only whether the ground moves under the person.
   ===================================================================== */
let VIEW_KEY = '';
function viewKey(){
  /* the space is part of the view: moving between spaces is a real navigation and
     must start at the top, not inherit the other space's scroll position */
  const u=me();
  return (location.hash||'#/home') + '|' + (u ? spaceOf(u) : '');
}

/* what the person was doing, captured the instant before the repaint */
function keepPlace(){
  const el = document.activeElement;
  const inApp = el && el.id && $('#app') && $('#app').contains(el)
             && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  const strips = {};
  ['#secnav','#tabnav'].forEach(sel=>{ const n=$(sel); if(n) strips[sel]=n.scrollLeft; });
  return {
    same: VIEW_KEY === viewKey(),
    y: window.scrollY || window.pageYOffset || 0,
    id: inApp ? el.id : '',
    start: inApp && el.selectionStart!=null ? el.selectionStart : null,
    end:   inApp && el.selectionEnd!=null   ? el.selectionEnd   : null,
    strips
  };
}
function restorePlace(p){
  /* A repaint of the same screen must not move the page. A navigation goes to the
     top, unless somebody has deliberately asked to hold the position. */
  if(window._toSection){
    /* A deliberate move between sections: the questionnaire starts again at the top,
       but glided to rather than snapped to, so the eye can follow it. */
    window._toSection = false;
    const anchor = $('#secanchor');
    const top = anchor ? (anchor.getBoundingClientRect().top + window.scrollY - 8) : 0;
    try{ window.scrollTo({top: Math.max(0, top), behavior:'smooth'}); }
    catch(e){ window.scrollTo(0, Math.max(0, top)); }
  } else {
    const y = p.same ? p.y : (window._keepScroll || 0);
    window.scrollTo(0, y);
  }
  window._keepScroll = 0;
  if(p.same){
    Object.keys(p.strips).forEach(sel=>{ const n=$(sel); if(n) n.scrollLeft = p.strips[sel]; });
    if(p.id){
      const el=document.getElementById(p.id);
      if(el && el!==document.activeElement){
        try{
          el.focus({preventScroll:true});
          if(p.start!=null && el.setSelectionRange) el.setSelectionRange(p.start, p.end);
        }catch(e){}
      }
    }
  }
  VIEW_KEY = viewKey();
}
function paint(html, key, r){
  const p = keepPlace();
  $('#app').innerHTML = shell(html, key);
  restorePlace(p);
  if(typeof afterRender==='function') afterRender(r, p.same);
}

function render(){
  const r = route(); const u = me();
  if(!u)          return paint(viewLogin(), undefined, r);
  if(!canWork(u)) return paint(viewGate(u), undefined, r);
  let html='', key=r[0];
  if(isSite()){
    // facility staff: their own site only
    if(r[0]==='report' && mySiteIds().includes((DB.d.visits.find(v=>v.id===r[1])||{}).siteId))
      return paint(viewReport(r[1]), 'home', r);
    if(r[0]==='chat') return paint(viewChat(r[1]), 'chat', r);
    return paint(viewSiteHome(), 'home', r);
  }
  switch(r[0]){
    case 'home':   html=viewHome(); break;
    case 'report': html=viewReport(r[1]); key='visits'; break;
    case 'new':    html=viewNewVisit(); break;   // refuses a console account itself
    case 'visit':  html=viewVisit(r[1], r[2]||'q', r[3]); key='visits'; break;
    case 'visits': html=viewVisits(); break;
    case 'dash':   html=viewDash(); break;

    case 'admin':  html=isSuper()?viewAdmin(r[1]||'supervisions', r[2]):'<div class="banner b-err">Accès refusé.</div>'; break;
    case 'sitereq':html=viewSiteReq(r[1]); key='visits'; break;
    default: html=viewHome(); key='home';
  }
  paint(html, key, r);
}

/* Only appears once the device holds more than a handful of accounts — a shared tablet,
   or the console. A personal phone keeps its one-tap list. */
function filterLoginUsers(q){
  const sel=$('#lg-user'); if(!sel) return;
  const n=normName(q||'');
  let first=null;
  Array.from(sel.options).forEach(o=>{
    const hit = !n || String(o.getAttribute('data-f')||'').includes(n);
    o.hidden = !hit;
    if(hit && !first) first=o;
  });
  if(first) sel.value=first.value;
}

/* Choosing which privileged account to sign into. It is remembered before anything is
   redrawn, so the choice survives the redraw instead of being undone by it. */
function pickAdmSlot(id){
  DB.d.config.lastAdmPick = id; DB.save();
  const pin = $('#lg-pin'); const typed = pin ? pin.value : '';
  render();
  const again = $('#lg-pin'); if(again){ again.value = typed; again.focus(); }
}

/* Administration sign-in. A slot that has not been claimed accepts ONLY its one-time
   code; a claimed slot accepts only the PIN its holder chose on this phone. */
async function doLoginAdmin(){
  const L=LANG==='fr';
  const sel=$('#lg-user'); if(!sel||!sel.value) return toast(L?'Aucun compte disponible':'No account available');
  const id=sel.value, typed=(($('#lg-pin')||{}).value||'').trim();
  const u=DB.d.users.find(x=>x.id===id); if(!u) return;
  DB.d.config.lastAdmPick=id; DB.save();
  if(!typed) return toast(L?'Saisissez votre code':'Enter your code');

  if(!u.claimed){
    if(!ONLINE) return toast(L?'L\'activation a besoin du réseau, une seule fois.'
                              :'Activation needs a network, once.', 4000);
    toast(L?'Vérification…':'Checking…', 1200);
    const r = await claimSlot(id, typed);
    if(!r || !r.valid) return toast(L
      ?'Code refusé. Il est valable 24 heures et une seule fois — demandez-en un nouveau.'
      :'Code refused. It is valid for 24 hours and once only — ask for a new one.', 4500);
    u.claimed=true; u.pin=''; if(r.name) u.name=r.name; if(r.role) u.role=r.role;
    DB.d.session=u.id; DB.save();
    audit('SLOT_CLAIM','user', u.name+' — '+roleLabel(u.role));
    try{ localStorage.setItem('ath_path','adm'); }catch(e){}
    LG_PATH='adm'; go('#/home'); render();
    return forcePinChange(u.id, 'claim');
  }

  if((u.pin||'') !== typed) return toast(L?'Code PIN incorrect':'Wrong PIN');
  DB.d.session=u.id; DB.save(); audit('LOGIN','user',u.name);
  try{ localStorage.setItem('ath_path','adm'); }catch(e){}
  LG_PATH='adm'; go('#/home'); render();
  /* A privileged account may not sit on an obvious code. The old sign-in enforced this
     and the rewrite lost it — put back before anything else happens. */
  if(DEFAULT_PINS.includes(u.pin)){ forcePinChange(u.id); return; }
  maybeTour();          // the rewrite dropped this: a new super user never saw the guide
  pushUser(u); refreshRoster(false); refreshAdmins(false); refreshSlots(false);
}

async function doLogin(){
  const L=LANG==='fr';
  const sel=$('#lg-user'); if(!sel||!sel.value) return toast(L?'Aucun compte disponible':'No account available');
  const id=sel.value, pin=(($('#lg-pin')||{}).value||'').trim();
  const u=DB.d.users.find(x=>x.id===id);
  if(!u) return toast('Utilisateur introuvable');
  if(!pin) return toast(L?'Saisissez votre code PIN':'Enter your PIN');

  /* A temporary code exists only when somebody forgot their PIN. It is typed in this
     same box — no separate recovery screen — but it is never stored on the device and
     never matched here: the server compares it and burns it. So it can only be used
     once, only within 24 hours, and only when a reset is actually outstanding. */
  let temp=false;
  if((u.pin||'')!==pin){
    if(ONLINE && DB.d.config.api && pin.length>=4){
      toast(L?'Vérification…':'Checking…', 1200);
      temp = await checkTempPin(u.id, pin);
    }
    if(!temp) return toast(!ONLINE && !(u.pin||'')
      ? (L?'Code temporaire : connectez-vous au réseau pour l\'utiliser':'Temporary code: connect to a network to use it')
      : (L?'Code PIN incorrect':'Wrong PIN'));
  }

  const path = isSlot(u) ? 'adm'
             : (isDual(u) && (LG_PATH==='site'||LG_PATH==='sup')) ? LG_PATH
             : (u.role==='SITE' ? 'site' : 'sup');
  try{ localStorage.setItem('ath_path', path); }catch(e){}
  LG_PATH = path;
  /* the door chosen IS the space opened — a dual account signing in at the facility
     door lands in the facility space, whatever it used last time */
  if(isDual(u) && path!=='adm'){ SPACE = path;
    try{ localStorage.setItem('ath_space', path); }catch(e){} }
  DB.d.session=u.id; DB.save(); audit('LOGIN','user',u.name); go('#/home'); render();
  if(temp){
    u.pinResetCode=''; u.pinResetAt=null; u.pinHelp=null; DB.save();
    audit('PIN_RESET_USED','user',u.name); forcePinChange(u.id,'reset'); return;
  }
  if(isSlot(u) && DEFAULT_PINS.includes(u.pin)){ forcePinChange(u.id); return; }
  maybeTour();
  if(isSlot(u)){ pushUser(u); refreshRoster(false); } else refreshMyState(false);
  refreshAdmins(false);
}

function saveForcedPin(uid){
  const u=DB.d.users.find(x=>x.id===uid);
  const a=($('#fp-new').value||'').trim(), b=($('#fp-new2').value||'').trim();
  const nEl=$('#fp-name'), tEl=$('#fp-tel');
  const L=LANG==='fr';
  if(a.length<4) return toast(L?'4 chiffres minimum':'At least 4 digits');
  if(DEFAULT_PINS.includes(a)) return toast(L?'Choisissez un code moins évident':'Choose a less obvious code');
  if(a!==b) return toast(L?'Les deux codes ne correspondent pas':'The two codes do not match');
  if(nEl && !(nEl.value||'').trim()) return toast(L?'Indiquez votre nom':'Enter your name');
  if(a===u.pinResetCode) return toast(L?'Choisissez un code différent du code temporaire'
                                       :'Choose a code different from the temporary one');
  u.pin=a;
  if(nEl) u.name=(nEl.value||'').trim();
  if(tEl) u.phone=(tEl.value||'').trim();
  u.pinResetCode=''; u.pinResetAt=null; u.pinHelp=null;
  DB.save();
  audit('PIN_CHANGED','user',u.name);
  /* a phone only ever clears its own recovery flags — it never rewrites its status,
     districts or role by pushing a whole record it may have received long ago */
  if(isSlot(u)){ /* a slot's row is the server's — see pushUser() */ }
  else queue('userFlag',{id:u.id, pinResetCode:'', pinResetAt:'', pinHelp:''});
  closeModal(); toast(L?'✓ Code PIN enregistré':'✓ PIN saved');
  render(); maybeTour();
  if(isSlot(u)) refreshRoster(false); else refreshMyState(false);
}

async function doEnrol(){
  const g=id=>$('#'+id)?$('#'+id).value.trim():'';
  const name=g('en-name'), fn=g('en-fn'), idt=g('en-idt'), idn=g('en-idn'),
        tel=g('en-tel'), pin=g('en-pin');
  const isS = ENROL_ROLE==='SITE';
  const sites = isS ? ENROL_SITES.slice() : [];
  const dis = isS ? districtsOfSites(sites)
                  : Array.from($('#en-dis').selectedOptions).map(o=>o.value);
  const file=$('#en-idf').files[0];
  const miss=[];
  if(!name)miss.push(T('name')); if(!idn)miss.push('N° pièce'); if(!file)miss.push('Photo pièce');
  if(!tel)miss.push('Téléphone');
  if(isS){ if(!sites.length) miss.push(LANG==='fr'?'Au moins une formation sanitaire':'At least one facility'); }
  else if(!dis.length) miss.push('District');
  if(pin.length<4)miss.push('PIN');
  if(!$('#en-dec').checked)miss.push('Déclaration');
  if(miss.length) return blockedModal(miss);
  const b64 = await fileToB64(file);
  const u={id:DB.id('U'), name, role:ENROL_ROLE, fn, matricule:g('en-mat'),
    sites: sites.length?sites:undefined, siteId: sites[0]||undefined,
    idType:idt, idNumber:idn, idFile:b64, phone:tel, email:g('en-mail'),
    districts:dis, pin, status:U_PENDING, active:true, enrolled:Date.now(),
    device:(navigator.userAgent||'').slice(0,80)};

  /* Somebody who already has an account on this device almost never means to make a second
     one — their supervisions would be split between the two. Ask before creating it. */
  const dup = duplicatesOf(u);
  if(dup.length){ PENDING_ENROL = u; return dupEnrolModal(dup); }
  saveEnrol(u);
}

/* ---------- the dead end, turned into the front door --------------------------
   Somebody enrolled as facility staff who is genuinely also a supervisor used to
   land here, press « Oui, c'est mon compte », and be sent straight back to the
   facility space by a single line that read their one and only role. They could
   never get out of it.

   Now, when the account found is the SAME PERSON — proved by the telephone number
   or the identity document, never by the name alone, because family names repeat
   across a district — the app offers what they actually came for: to ask for the
   other role on the account they already have. */
function roleAskFromEnrol(dup){
  const L=LANG==='fr';
  const want = ENROL_ROLE==='SITE' ? 'SITE' : 'SUPERVISOR';
  /* only a strong, personal match may lead to a role request */
  const hit = dup.find(x => x._match && (x._match.sure || normPhone(x.phone)
              && normPhone(x.phone)===normPhone((PENDING_ENROL||{}).phone)));
  if(!hit) return `<div class="banner b-info xs" style="margin-top:8px">${L
    ?'Si cette personne n\'est pas vous, appuyez sur « Non, c\'est quelqu\'un d\'autre » et dites pourquoi. Si c\'est vous mais que le numéro de téléphone diffère, appelez un super utilisateur plutôt que de créer un deuxième compte.'
    :'If that person is not you, press "No, this is somebody else" and say why. If it is you but the telephone number is different, call a super user rather than creating a second account.'}</div>`;
  if(isDual(hit) || (hit.role==='SITE') === (want==='SITE')) return '';
  ROLE_ASK_ID = hit.id;
  return `<div class="banner b-ok" style="margin-top:8px">
    <b>${L?'Vous avez déjà un compte — et vous n\'en avez pas besoin d\'un deuxième.':'You already have an account — and you do not need a second one.'}</b><br>
    ${L?'<b>'+esc(hit.name)+'</b> est enregistré comme <b>'+esc(roleLabelFor(hit.role))+
       '</b>. Vous pouvez demander à être <b>aussi '+esc(roleLabelFor(want)).toLowerCase()+
       '</b> sur ce même compte : un seul compte, un seul code PIN, deux espaces entre lesquels vous basculez en haut de l\'écran.'
      :'<b>'+esc(hit.name)+'</b> is registered as <b>'+esc(roleLabelFor(hit.role))+
       '</b>. You can ask to be <b>also a '+esc(roleLabelFor(want)).toLowerCase()+
       '</b> on that same account: one account, one PIN, two spaces you switch between at the top of the screen.'}
    <div style="margin-top:8px">
      <button class="btn ok sm" onclick="askRoleFromEnrol()">＋ ${
        L?'Demander ce rôle sur mon compte':'Ask for that role on my account'}</button></div>
  </div>`;
}
let ROLE_ASK_ID='';

/* This button used to close the dialog and redraw the same screen — it promised to take
   the person to their account and did nothing at all. Now it selects that account and
   puts the cursor in the PIN box, with the forgotten-PIN way out right underneath. */
function useExisting(uid){
  PENDING_ENROL=null; closeModal();
  const u=DB.d.users.find(x=>x.id===uid);
  /* land on the door that lists this account: for a dual account either door works,
     so stay on the one the person chose rather than overriding their choice */
  if(u) setPath(isDual(u) ? (LG_PATH==='site'||LG_PATH==='sup' ? LG_PATH : (u.role==='SITE'?'site':'sup'))
                          : (u.role==='SITE'?'site':'sup'));
  else render();
  setTimeout(()=>{
    const sel=$('#lg-user'); if(sel){ sel.value=uid; }
    const pin=$('#lg-pin'); if(pin){ pin.focus(); }
    const L=LANG==='fr';
    toast(L?'Votre compte est sélectionné — saisissez votre code PIN. Oublié ? « Code PIN oublié ? » juste en dessous.'
           :'Your account is selected — enter your PIN. Forgotten it? "Forgotten PIN?" is just below.', 5000);
  }, 260);
}
/* « Non, c'est quelqu'un d'autre » is the escape hatch for two real people who happen
   to share a name. It must not become the fast lane around approval: once a second role
   has to be granted, the impatient answer is to make a second account instead of waiting.
   A matching identity document is decisive, so that is refused outright; a matching
   telephone or email needs a written reason that the console will read. */
function forceEnrol(){
  const u=PENDING_ENROL; if(!u) return;
  const L=LANG==='fr';
  const dup=duplicatesOf(u);
  const sure=dup.find(x=>x._match && x._match.sure);
  if(sure){
    return infoModal(L?'Impossible de créer un deuxième compte':'A second account cannot be created',
      (L?'« '+sure.name+' » est enregistré avec LA MÊME PIÈCE D\'IDENTITÉ que celle que vous venez de saisir. Ce sont donc deux comptes pour une seule personne, et l\'application ne peut pas les créer.\n\nCE QU\'IL FAUT FAIRE :\n· Si c\'est votre compte, revenez en arrière et appuyez sur « Oui, c\'est mon compte ».\n· Si vous avez saisi le numéro de pièce par erreur, corrigez-le.\n· Si ce sont réellement deux personnes différentes, appelez un super utilisateur : lui seul peut trancher.'
        :'"'+sure.name+'" is registered with THE SAME IDENTITY DOCUMENT as the one you have just typed. That means two accounts for one person, and the app cannot create them.\n\nWHAT TO DO:\n· If it is your account, go back and press "Yes, this is my account".\n· If you typed the document number by mistake, correct it.\n· If these really are two different people, call a super user: only they can decide.'));
  }
  const likely=dup.find(x=>x._match && x._match.likely);
  if(likely){
    return askReason({
      title:L?'Deux comptes pour la même personne ?':'Two accounts for the same person?',
      banner:(L?'« '+esc(likely.name)+' » a '+esc((likely._match.why||[]).join(' et '))+' que vous.'
               :'"'+esc(likely.name)+'" has '+esc((likely._match.why||[]).join(' and '))+' as you.'),
      label:L?'Pourquoi s\'agit-il d\'une autre personne ? (obligatoire)'
             :'Why is this a different person? (mandatory)',
      help:L?'Votre réponse est enregistrée et lue au niveau central. Si c\'est votre propre compte, revenez en arrière : vous n\'avez pas besoin d\'un deuxième.'
            :'Your answer is recorded and read at central level. If it is your own account, go back: you do not need a second one.',
      confirmLabel:L?'Créer quand même':'Create anyway', danger:true,
      onOk: why=>{
        PENDING_ENROL=null;
        u.dupNote=why;
        audit('ENROL_DUP','user',u.name+' — créé malgré un doublon signalé : '+why);
        saveEnrol(u);
      }});
  }
  PENDING_ENROL=null;
  audit('ENROL_DUP','user',u.name+' — créé malgré un doublon signalé');
  saveEnrol(u);
}
function saveEnrol(u){

/* Accepts a YouTube video, a Google Slides deck, or any Google Drive file
   (PDF, PowerPoint, video) and turns it into an embeddable address. */
function toEmbed(url){
  if(!url) return '';
  let m;
  if((m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/)))
    return 'https://www.youtube.com/embed/'+m[1];
  if((m=url.match(/docs\.google\.com\/presentation\/d\/([\w-]+)/)))
    return 'https://docs.google.com/presentation/d/'+m[1]+'/embed?start=false&loop=false&delayms=60000';
  if((m=url.match(/docs\.google\.com\/document\/d\/([\w-]+)/)))
    return 'https://docs.google.com/document/d/'+m[1]+'/preview';
  if((m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/)))
    return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  return url;
}
