  closeModal();
  toast(LANG==='fr'?'Mot de passe de liaison remis par défaut — nouvel essai…'
                   :'Link password reset to the default — trying again…', 3000);
  setTimeout(()=>syncNow(false), 400);
}
async function tokenRefused(){
  const L = LANG==='fr';
  const api = DB.d.config.api;
  const mine = apiToken();
  const shown = mine ? mine : (L?'(vide)':'(empty)');
  const box = h => infoModal(L?'Le serveur refuse cet appareil':'The server is refusing this device', h);

  if(!api) return box(L?'Aucune adresse de serveur n\'est configurée (Console ▸ Paramètres ▸ URL de l\'API).'
                       :'No server address is configured (Console ▸ Settings ▸ API URL).');
  if(!ONLINE) return box(L?'Cet appareil est hors réseau. Reconnectez-vous, puis réessayez.'
                          :'This device is offline. Reconnect and try again.');

  const a = await probeToken(mine);
  const b = (mine === API_TOKEN) ? a : await probeToken(API_TOKEN);

  /* 1 · the address does not answer at all */
  if(a.get === 'unreachable' && a.post === 'unreachable')
    return box((L?'L\'adresse configurée ne répond pas :\n\n':'The configured address does not answer:\n\n')
      + api + (L?'\n\nCe n\'est pas un problème de mot de passe. Vérifiez la connexion, puis l\'adresse dans Console ▸ Paramètres.'
                :'\n\nThis is not a password problem. Check the connection, then the address in Console ▸ Settings.'));

  /* 2 · the password saved on this phone is stale, and the built-in one works */
  if(a.post === 'refused' && b.post === 'ok'){
    return modal(L?'Mot de passe de liaison incorrect sur ce téléphone'
                  :'Wrong link password on this phone', `
      <div class="banner b-ok">${L
        ?'Bonne nouvelle : le serveur va bien, et le mot de passe d\'origine fonctionne. C\'est la valeur enregistrée sur CE téléphone qui est mauvaise.'
        :'Good news: the server is fine, and the built-in password works. It is the value saved on THIS phone that is wrong.'}</div>
      <p class="small">${L?'Enregistré ici :':'Saved here:'} <b class="sc">${esc(shown)}</b><br>
        ${L?'Attendu par le serveur :':'Expected by the server:'} <b class="sc">${esc(API_TOKEN)}</b></p>
      <button class="btn blk" onclick="useDefaultToken()">${
        L?'Corriger maintenant et réessayer':'Fix it now and try again'}</button>
      <p class="xs muted" style="margin-top:8px">${L
        ?'Rien n\'est perdu : ce qui attendait d\'être envoyé partira aussitôt.'
        :'Nothing is lost: whatever was waiting to be sent will go straight away.'}</p>`,
      `<button class="btn sec" onclick="closeModal()">${L?'Plus tard':'Later'}</button>`);
  }

  /* 3 · neither password is accepted: the workbook's TOKEN is something else */
  if(a.post === 'refused' && b.post === 'refused')
    return box((L?'LE MOT DE PASSE DU CLASSEUR EST DIFFÉRENT\n\n':'THE WORKBOOK PASSWORD IS DIFFERENT\n\n')
      + (L?'Ni la valeur enregistrée ici (' : 'Neither the value saved here (') + shown
      + (L?'), ni celle d\'origine (' : '), nor the built-in one (') + API_TOKEN
      + (L?') n\'est acceptée.\n\nÀ FAIRE :\n1. Classeur ▸ Extensions ▸ Apps Script\n2. Cherchez tout en haut :   var TOKEN = \'…\';\n3. Recopiez EXACTEMENT cette valeur dans Console ▸ Paramètres ▸ « Mot de passe de liaison », puis Enregistrer.\n\nMajuscules comprises, sans espace avant ni après.'
          :') is accepted.\n\nTO DO:\n1. Workbook ▸ Extensions ▸ Apps Script\n2. Near the top, find:   var TOKEN = \'…\';\n3. Copy that value EXACTLY into Console ▸ Settings ▸ "Link password", then Save.\n\nCapitals included, no space before or after.'));

  /* 4 · the password is fine now — whatever was refused has cleared */
  if(a.post === 'ok'){
    closeModal();
    toast(L?'✓ La liaison est rétablie — envoi en cours' : '✓ The link is working again — sending', 3500);
    return setTimeout(()=>syncNow(true), 500);
  }

  /* ---- 5 · THE READ WORKS, SO THE PASSWORD IS RIGHT --------------------------------
     This branch used to be headed "Le serveur refuse cet appareil" and printed two
     words of diagnostics, which sent people hunting for a password fault that the probe
     directly above had already ruled out: a read that returns ok, with the script's
     version number, is a read that was authenticated.

     What it actually means is that the WRITE could not get through — almost always
     because the workbook is busy with a long write and this one queued behind it.
     Nothing is lost while that is true: everything waits in the outbox. */
  if(a.get === 'ok'){
    const busyish = (a.post === 'busy' || a.post === 'html' || a.post === 'unreachable');
    return infoModal(
      L?'Le serveur est occupé — rien n\'est perdu':'The server is busy — nothing is lost',
      (busyish
        ? (L?'Votre mot de passe de liaison est BON : la lecture fonctionne et le serveur a répondu.\n\nC\'est l\'ÉCRITURE qui n\'est pas passée. Le classeur est occupé par une écriture plus longue — souvent au moment d\'une mise à jour, quand plusieurs téléphones écrivent en même temps.\n\nÀ FAIRE : rien. Tout ce qui attend reste dans la file et repartira tout seul. Réessayez dans quelques minutes.\n\nSi cela dure plus d\'une heure, montrez cet écran à la coordination régionale.'
            :'Your link password is CORRECT: reading works and the server answered.\n\nIt is the WRITE that did not get through. The workbook is busy with a longer write — often during an update, when several phones write at once.\n\nWHAT TO DO: nothing. Everything waiting stays in the queue and will go by itself. Try again in a few minutes.\n\nIf it lasts more than an hour, show this screen to the regional coordination.')
        : (L?'Le serveur répond à la lecture mais donne une réponse inattendue à l\'écriture.'
            :'The server answers reads but gives an unexpected answer to writes.'))
      + '\n\n' + api + '\n'
      + (L?'  lecture : ':'  read: ') + a.get + (L?'   ·   écriture : ':'   ·   write: ') + a.post + '\n'
      + (a.version ? (L?'  version du script : ':'  script version: ') + a.version + '\n' : '')
      + (L?'  en attente d\'envoi : ':'  waiting to be sent: ') + DB.d.outbox.length);
  }

  /* 6 · anything else: say exactly what was observed rather than guessing */
  return box((L?'RÉPONSE INATTENDUE DU SERVEUR\n\n':'UNEXPECTED ANSWER FROM THE SERVER\n\n')
    + api + '\n\n'
    + (L?'Avec le mot de passe enregistré ici (':'With the password saved here (') + shown + ') :\n'
    + '  lecture : ' + a.get + '   ·   écriture : ' + a.post + '\n'
    + (a.version ? (L?'  version du script : ':'  script version: ') + a.version + '\n' : '')
    + (L?'\nMontrez cet écran à la personne qui gère le classeur.'
        :'\nShow this screen to whoever manages the workbook.'));
}

/* ---------------------------------------------------------------------------
   THE DIAGNOSTIC
   "I submitted a supervision and I cannot see it" has exactly three answers:
   the workbook never received it, this device never fetched it, or the address
   the app is talking to is not the deployment that was updated. This says which,
   in words, without anybody having to read a spreadsheet or ask me. */
async function runDiag(){
  const L=LANG==='fr', api=DB.d.config.api;
  const box = h => infoModal(L?'Diagnostic':'Diagnostic', h);
  if(!api) return box(L?'Aucune adresse de serveur n\'est configurée (Paramètres ▸ URL de l\'API).'
                       :'No server address is configured (Settings ▸ API URL).');
  if(!ONLINE) return box(L?'Cet appareil est hors réseau. Le diagnostic a besoin d\'une connexion.'
                          :'This device is offline. The diagnostic needs a connection.');
  let j=null, err='';
  try{
    const r = await fetch(api+'?action=diag&token='+encodeURIComponent(apiToken()));
    j = await r.json();
  }catch(e){ err=String(e); }

  /* A single blip on a district connection is not a diagnosis. Ask twice. */
  if(err){
    await new Promise(r=>setTimeout(r, 1200));
    try{
      const r2 = await fetch(api+'?action=diag&token='+encodeURIComponent(apiToken()));
      j = await r2.json(); err='';
    }catch(e){ err=String(e); }
  }
  if(err) return box(await whyUnreachable(api, err));

  if(j && j.ok===false && /bad token/i.test(String(j.error||''))) return box(
    (L?'LE SERVEUR REFUSE CET APPAREIL\n\n':'THE SERVER IS REFUSING THIS DEVICE\n\n')
    + (L?'Le serveur répond, mais rejette chaque message : le mot de passe de liaison ne correspond pas. Rien ne circule dans un sens ni dans l\'autre.\n\nOuvrez Apps Script, lisez la ligne 19 (var TOKEN = \'…\') et recopiez exactement cette valeur dans Paramètres ▸ Mot de passe de liaison.\n\nAdresse interrogée :\n'
       :'The server answers but rejects every message: the link password does not match. Nothing moves in either direction.\n\nOpen Apps Script, read line 19 (var TOKEN = \'…\') and copy that value exactly into Settings ▸ Link password.\n\nAddress queried:\n')
    + api);
  if(!j || !j.ok || j.visits === undefined) return box(
    (L?'LE SERVEUR N\'A PAS ÉTÉ MIS À JOUR\n\n':'THE SERVER HAS NOT BEEN UPDATED\n\n')
    + (L?'L\'adresse répond, mais avec une ancienne version du script — elle ne connaît pas encore le diagnostic ni le renvoi des supervisions.\n\nRedéployez Code.gs :\nApps Script ▸ coller ▸ setup ▸ Déployer ▸ GÉRER LES DÉPLOIEMENTS ▸ ✏️ ▸ nouvelle version.\nJamais « Nouveau déploiement ».\n\nAdresse interrogée :\n'
       :'The address answers, but with an older version of the script — it does not know the diagnostic or how to send supervisions back.\n\nRedeploy Code.gs:\nApps Script ▸ paste ▸ setup ▸ Deploy ▸ MANAGE DEPLOYMENTS ▸ ✏️ ▸ new version.\nNever "New deployment".\n\nAddress queried:\n')
    + api);

  const here = {
    visits: DB.d.visits.length,
    subm:   DB.d.visits.filter(v=>v.status==='SUBMITTED').length,
    answers:Object.keys(DB.d.answers||{}).length,
    users:  DB.d.users.length,
    queue:  DB.d.outbox.length
  };
  const byStatus = Object.keys(j.visitsByStatus||{})
    .map(k=>'      '+k+' : '+j.visitsByStatus[k]).join('\n') || '      —';
  const recent = (j.recent||[]).slice().reverse().map(v=>
    '      '+(v.facility||'?')+'  ·  '+(v.district||'')+'  ·  '+(v.status||'')
    +(v.supervisor?'  ·  '+v.supervisor:'')).join('\n') || '      —';

  let verdict;
  if(j.visits === 0)
    verdict = L?'AUCUNE SUPERVISION N\'EST ARRIVÉE AU CLASSEUR.\nCe n\'est pas un problème de cet appareil : rien n\'a encore été envoyé. Le téléphone du superviseur garde sa supervision dans sa file d\'attente. Demandez-lui d\'ouvrir ATHECS une fois avec du réseau — elle part toute seule.'
             :'NO SUPERVISION HAS REACHED THE WORKBOOK.\nThis is not a problem with this device: nothing has been sent yet. The supervisor\'s phone is still holding it in its outbox. Ask them to open ATHECS once with a network — it leaves by itself.';
  else if(here.visits < j.visits)
    verdict = L?'LE CLASSEUR EN A PLUS QUE CET APPAREIL.\nAppuyez sur « ⇩ Actualiser » (Console ▸ Supervisions). Si le nombre ne bouge pas, dites-le moi avec cet écran.'
             :'THE WORKBOOK HOLDS MORE THAN THIS DEVICE.\nPress "⇩ Actualiser" (Console ▸ Supervisions). If the number does not move, send me this screen.';
  else
    verdict = L?'CET APPAREIL EST À JOUR AVEC LE CLASSEUR.'
             :'THIS DEVICE IS UP TO DATE WITH THE WORKBOOK.';

  box(
    (L?'SERVEUR\n':'SERVER\n')
    + '      '+(L?'version du script':'script version')+' : '+(j.version||'?')+'\n'
    + '      '+(L?'classeur':'workbook')+' : '+String(j.sheetId||'').slice(0,12)+'…\n\n'
    + (L?'DANS LE CLASSEUR\n':'IN THE WORKBOOK\n')
    + '      '+(L?'supervisions':'supervisions')+' : '+j.visits+'\n'
    + byStatus+'\n'
    + '      '+(L?'réponses':'answers')+' : '+j.answers
    + '   ·   '+(L?'recommandations':'recommendations')+' : '+j.actions+'\n'
    + '      '+(L?'comptes':'accounts')+' : '+j.users
    + '   ·   '+(L?'formations sanitaires':'facilities')+' : '+j.sites+'\n'
    + '      '+(L?'questions':'questions')+' : '+j.questions
    + '   ·   '+(L?'cycle ouvert':'open cycle')+' : '
    + (j.openCycle ? j.openCycle.name+' ('+j.openCycle.ticked+'/'+j.openCycle.months+' '+(L?'mois':'months')+')' : '—')+'\n\n'
    + (L?'SUR CET APPAREIL\n':'ON THIS DEVICE\n')
    + '      '+(L?'supervisions':'supervisions')+' : '+here.visits
    + '   ·   '+(L?'à approuver':'to approve')+' : '+here.subm+'\n'
    + '      '+(L?'comptes':'accounts')+' : '+here.users
    + '   ·   '+(L?'en attente d\'envoi':'waiting to be sent')+' : '+here.queue+'\n'
    + '      '+(L?'dernière réception':'last received')+' : '
    + (DB.d.config.lastData?fmtDT(DB.d.config.lastData):'—')+'\n\n'
    + (L?'DERNIÈRES SUPERVISIONS DU CLASSEUR\n':'MOST RECENT IN THE WORKBOOK\n')
    + recent+'\n\n'
    + '— — —\n\n' + verdict
  );
}

/* =====================================================================
   A SUPERVISION IN PROGRESS NOW LEAVES THE PHONE

   Until now a draft was uploaded only when it was SUBMITTED. Everything
   typed before that lived on exactly one phone and nowhere else, which is
   why a supervisor who travelled, fell ill or lost a handset took the whole
   facility's work with them and the team started again from nothing.

   A draft that has changed since its last upload now goes up on the ordinary
   sync. Nothing else changes: it is still the holder's supervision, still
   read-only to everybody else, and it still counts in no score until it is
   submitted. But it EXISTS somewhere other than one pocket, so a colleague
   can see where the work got to, and the pen can be handed over.

   Only what changed is sent — a draft nobody has touched since its last
   upload is not re-sent on every tick.
   ===================================================================== */
function autoPushDrafts(){
  const u=me(); if(!u || isSlot(u)) return 0;
  let n=0;
  DB.d.visits.forEach(v=>{
    if(v.status!=='DRAFT' || v.uid!==u.id) return;
    if((v.updated||0) <= (v.pushed||0)) return;
    v.pushed = v.updated || Date.now();
    queue('visit', {visit:visitForSync(v), answers:answersForSync(v.id), actions:visitActions(v.id)});
    n++;
  });
  if(n) DB.save();
  return n;
}

let ADMIN_TICK=0;
setInterval(()=>{
  if(!ONLINE || !DB.d.config.api) return;
  pullRemote();
  autoPushDrafts();
  publishQuestionnaire();
  if(DB.d.outbox.length) syncNow(true);
  const u=me();
  if(u){ if(isSlot(u)) refreshRoster(false); else refreshMyState(false); }
  /* Nobody signed in: still ask the server about the accounts this phone holds, so a
     reactivation reaches a person who cannot currently get past the sign-in screen. */
  else if(typeof refreshLocalAccounts==='function'){ refreshLocalAccounts(false); }
  /* the privileged slots, whether or not anybody is signed in: this is what makes an
     assignment appear, and a withdrawal disappear, without anyone doing anything */
  if(ADMIN_TICK % 4 === 0 && typeof refreshSlots==='function') refreshSlots(false);
  /* the delta every 25 s; the questionnaire, cycles and registry every 8th pass */
  if(u) pullData(ADMIN_TICK % 8 === 0).then(r=>{ if(r && r.changed) render(); });
  if(ADMIN_TICK++ % 8 === 0) refreshAdmins(false);   // ~ every 3 minutes, all roles
}, 25000);

/* ===================== boot ===================== */
let STRIP_ON = {};
function afterRender(r, sameView){
  const th=$('#thread'); if(th) th.scrollTop=th.scrollHeight;
  /* Keep the active pill in view — but only MOVE the strip when the active pill has
     actually changed. It used to re-run on every repaint, and because the repaint had
     already reset the strip to the far left, the person watched it slide back across
     the screen every twenty-five seconds. That is the sideways "jump". */
  ['#secnav','#tabnav'].forEach(sel=>{
    const nav=$(sel); if(!nav) return;
    const on=nav.querySelector('button.on'); if(!on) return;
    const label=(on.getAttribute('data-i')||on.textContent||'').trim();
    if(sameView && STRIP_ON[sel]===label) return;      // nothing moved: leave it alone
    STRIP_ON[sel]=label;
    const left = on.offsetLeft - nav.clientWidth/2 + on.offsetWidth/2;
    if(Math.abs(nav.scrollLeft - left) < 4) return;
    try{ nav.scrollTo({left, behavior: sameView?'smooth':'auto'}); }
    catch(e){ nav.scrollLeft = left; }
  });
  // reserve room for the sticky bottom bar
  const app=$('#app'); if(app) app.classList.toggle('hasbar', !!$('.bottombar'));
}
DB.load();
render();
maybeTour();
window.addEventListener('load', ()=>{ if(ONLINE){ pullRemote(); syncNow(true); refreshAdmins(false);
  const u=me();
  if(!u && typeof refreshLocalAccounts==='function') refreshLocalAccounts(false);
  if(typeof refreshSlots==='function') refreshSlots(false);
  if(u){
    if(isSlot(u)) refreshRoster(false); else refreshMyState(false);
    /* first launch of the session: bring down everything, including anything
       submitted from another phone while this one was closed */
    pullData(true).then(r=>{ if(r && r.changed) render(); });
  }
} });

/* =====================================================================
   PUBLISHING THIS BUILD'S QUESTIONNAIRE TO THE WORKBOOK

   The corrected questionnaire was being built correctly on every phone and
   overwritten by the workbook on the next pull, because nothing had ever
   carried it to the workbook. One phone publishes it; the server refuses
   anything older than what it already holds, so an old build can never
   push an old questionnaire back over a new one.

   It is attempted on every sync until the workbook confirms it, because
   the first attempt is very often made with no signal at all.
   ===================================================================== */
function publishQuestionnaire(force, stamp){
  if(!ONLINE || !DB.d.config.api) return false;
  /* ---- THE QUESTIONNAIRE IS PUBLISHED FROM THE CONSOLE -----------------------------
     It used to be published by whichever phone synced first. On the morning of an
     upgrade that is twenty phones each sending sixty questions within the same minute,
     all of them queueing behind the same script lock — which is what took the writes
     down across the region while the reads carried on working.

     One account publishes: a super user's or an administrator's. A supervisor's phone
     keeps using its own built-in questionnaire meanwhile, which is correct and needs no
     network at all; it simply stops shouting it at the workbook. */
  const who = me();
  if(!stamp && !(who && isSlot(who))) return false;
  const mark = stamp || QCORR_VERSION;
  if(!force && String(DB.d.config.qserver||'') >= String(mark)) return false;
  if(!stamp && publishQuestionnaire._busy) return false;
  if(!stamp) { publishQuestionnaire._busy = true;
               setTimeout(()=>{ publishQuestionnaire._busy = false; }, 30000); }
  const u = me() || {};
  /* Deactivated questions go up too: a question switched off at the centre has to be
     switched off in the workbook, and a set that simply omits it would leave the old row
     active for ever. publishQuestions() deactivates whatever the set does not mention. */
  queue('qPublish', {stamp: mark, byId: u.id||'', who: u.name||'',
    questions: DB.d.questions.filter(q=>q.active!==false)});
  DB.d.config.qserver = mark; DB.save();
  return true;
}
/* A change made in the console is newer than the build it was made on, by definition.
   The full timestamp sorts after the build's date-only stamp, so the workbook becomes
   authoritative the moment a super user edits the questionnaire — which is what makes an
   added question reach the field, and what stops it being undone on the next pull. */
function publishQuestionnaireEdit(){
  const now = new Date();
  const p2 = n => String(n).padStart(2,'0');
  const stamp = now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate())
              + 'T'+p2(now.getHours())+p2(now.getMinutes())+p2(now.getSeconds());
  return publishQuestionnaire(true, stamp);
}

/* =====================================================================
   KEEPING EVERY PHONE ON THE SAME VERSION            (new in v4.3.4)

   THE FIELD REPORT
   "Some supervisors keep refreshing but their versions does not change —
    I have a supervisor still on v4.0.0, has been refreshing, no action."

   WHY REFRESHING COULD NOT WORK
   Two separate reasons, and both had to be fixed or the phone stayed put:
     · the ↻ button in the app refreshes DATA. It has never fetched the
       application itself. A supervisor pressing it was doing the one thing
       that could not possibly help, and the app never said so.
     · the service worker re-fetched index.html through the phone's ordinary
       HTTP cache, which kept handing back the same old file (see sw.js).

   WHAT HAPPENS NOW
     · the service worker asks the host, conditionally, at every start-up
       and on every return of signal, and tells the page what it finds;
     · the SERVER also says which version the region should be on
       (APP_EXPECTED in Code.gs), returned on every single pull. This is
       the half that reaches a phone whose own worker is too old to ask:
       the pull is data, and data always got through — that is why the
       v4.0.0 phone could still sync while never updating;
     · either signal raises a banner that is on every screen, and a prompt
       the first time it is seen;
     · the update button clears the caches and reloads past them.

   WHAT IT NEVER TOUCHES
   localStorage. Enrolment, PIN, and every unsent supervision live there.
   Clearing a cache is not a data loss, and the test proves it.
   ===================================================================== */

/* '4.10.0' is newer than '4.9.0'. A string comparison gets that wrong. */
function verLt(a, b){
  const A = String(a||'').split('.').map(n=>parseInt(n,10)||0);
  const B = String(b||'').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(A.length,B.length);i++){
    const x=A[i]||0, y=B[i]||0;
    if(x!==y) return x<y;
  }
  return false;
}

/* The version this phone should be running, or '' when it already is.
   Two independent sources, because either one alone leaves a gap. */
function updateDue(){
  try{
    if(typeof NEW_VERSION==='string' && NEW_VERSION && verLt(APP_VERSION, NEW_VERSION))
      return NEW_VERSION;
  }catch(e){}
  const want = String((DB.d.config||{}).appExpected||'');
  if(want && verLt(APP_VERSION, want)) return want;
  return '';
}

/* =====================================================================
   INSTALLING AN UPDATE WITHOUT ASKING ANYBODY          (v4.3.5)

   Asked for in the field: "is there a way to force update their version,
   without them having to do anything?"

   There are two quite different situations, and only one of them ever
   needs a human:

   ① THE NEW VERSION IS ALREADY ON THE PHONE. Since v4.3.4 the worker
      caches it in the background while the app is being used. From that
      moment the update needs no network, no permission and no button —
      the phone is simply holding the new file and still showing the old
      one. Reloading is all that remains, and this code does it by itself
      at the first SAFE moment. Nothing is asked. Nothing is announced
      beyond a line saying it is about to happen.

      Even if the app is closed before that moment arrives, the NEXT time
      it is opened the cached copy IS the new version. So every phone that
      opens the app twice updates itself, whatever anybody does or does
      not tap.

   ② THE SERVER SAYS THE PHONE IS BEHIND, BUT NOTHING IS CACHED. This is
      a phone whose worker is too old to have fetched it — the v4.0.0
      case. Here there genuinely is nothing on the device to apply, so
      this is the one case that still asks.

   WHAT "SAFE" MEANS, and it is not negotiable: never during a
   supervision, never with a dialogue open, never while the supervisor is
   typing, never mid-sync. A reload that interrupts a visit would be a
   worse failure than an old version. */

let UPDATE_READY = '';        /* a newer version is already in this phone's cache */

function updateReady(v){
  if(!v || !verLt(APP_VERSION, v)) return;
  UPDATE_READY = v;
  if(!updateReady._t) updateReady._t = setInterval(autoApply, 15000);
  setTimeout(autoApply, 4000);
  try{ render(); }catch(e){}
}

/* The whole list of reasons not to reload right now. */
function autoApplySafe(){
  if(!UPDATE_READY) return false;
  const r = (typeof route==='function') ? route()[0] : '';
  if(r === 'visit' || r === 'new' || r === 'sitereq') return false;  /* mid-supervision */
  if(document.querySelector('.modal')) return false;                 /* mid-dialogue */
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName||'')) return false;  /* mid-typing */
  if(syncNow._busy) return false;                                    /* mid-send */
  return true;
}

/* A reload that does not take must not become a reload loop: if we already
   reloaded for this exact version a few minutes ago and are still not on it,
   the host is serving something inconsistent — stop, and let the banner and
   the manual button take over. */
function autoApply(){
  if(!autoApplySafe()) return false;
  const v = UPDATE_READY;
  let last = {};
  try{ last = JSON.parse(localStorage.getItem('ath_autoupd')||'{}'); }catch(e){}
  if(last.v === v && (Date.now() - (last.at||0)) < 10*60*1000) return false;
  try{ localStorage.setItem('ath_autoupd', JSON.stringify({v, at:Date.now()})); }catch(e){}
  try{ DB.save(); }catch(e){}
  try{ clearInterval(updateReady._t); }catch(e){}
  autoApply._go();
  return true;
}
/* A named seam, so the test can watch the decision without navigating away. */
autoApply._go = () => { try{ location.reload(); }catch(e){} };

/* Sits under the top bar, on every screen, for as long as the phone is behind.
   Two versions of it, because the two situations above deserve two different
   sentences: one is an announcement, the other is a request. */
function updateBanner(){
  const v = updateDue(); if(!v) return '';
  const L = LANG==='fr';
  if(UPDATE_READY) return `<div class="wrap" style="padding-bottom:0">
    <div class="banner b-ok" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="flex:1;min-width:180px">${L
        ?`<b>Version v${esc(v)} prête sur cet appareil</b><br><span class="xs">Elle s'installera toute seule dès que vous ne serez pas en pleine supervision. Vous n'avez rien à faire.</span>`
        :`<b>Version v${esc(v)} is ready on this device</b><br><span class="xs">It will install by itself as soon as you are not in the middle of a supervision. You have nothing to do.</span>`}</span>
      <button class="btn sec sm" onclick="updateModal()">${L?'Installer maintenant':'Install now'}</button>
    </div></div>`;
  return `<div class="wrap" style="padding-bottom:0">
    <div class="banner b-warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="flex:1;min-width:180px">${L
        ?`<b>Nouvelle version disponible : v${esc(v)}</b><br><span class="xs">Cet appareil est encore en v${APP_VERSION}. Mettez à jour maintenant — rien de ce qui est enregistré ici ne sera perdu.</span>`
        :`<b>New version available: v${esc(v)}</b><br><span class="xs">This device is still on v${APP_VERSION}. Update now — nothing saved on this device is lost.</span>`}</span>
      <button class="btn sm" onclick="updateModal()">${L?'Mettre à jour':'Update'}</button>
    </div></div>`;
}

/* Asked for once per version per session — and ONLY in situation ②, where
   the phone has nothing cached and a human really is the only way through.
   When the update is already on the device it installs itself, and
   interrupting a supervisor to tell them that would be noise. */
let UPD_ASKED = '';
function updateAsk(){
  const v = updateDue(); if(!v || UPD_ASKED === v) return;
  if(UPDATE_READY) return;                       /* it is coming by itself */
  if(document.querySelector('.modal')) return;   /* never interrupt another dialogue */
  UPD_ASKED = v; updateModal();
}

function updateModal(){
  const L = LANG==='fr';
  const v = updateDue() || APP_VERSION;
  modal(L?'Mettre à jour l\'application':'Update the application',
   `${UPDATE_READY?`<div class="banner b-ok">${L
      ?'Cette version est DÉJÀ téléchargée sur cet appareil. L\'installer ne demande aucun réseau et ne dure qu\'un instant. Elle s\'installera d\'elle-même si vous ne faites rien.'
      :'This version is ALREADY downloaded on this device. Installing it needs no network and takes a moment. It will install by itself if you do nothing.'}</div>`:''}
    <div class="banner b-ok">${L
     ?`Cet appareil : <b>v${APP_VERSION}</b> &nbsp;·&nbsp; disponible : <b>v${esc(v)}</b>`
     :`This device: <b>v${APP_VERSION}</b> &nbsp;·&nbsp; available: <b>v${esc(v)}</b>`}</div>
    <p class="small">${L
     ?'La mise à jour retélécharge l\'application et la recharge. Elle dure quelques secondes avec du réseau.'
     :'The update re-downloads the application and reloads it. It takes a few seconds with a network.'}</p>
    <p class="small"><b>${L?'Ce qui est conservé :':'What is kept:'}</b> ${L
     ?'votre enrôlement, votre code PIN, vos supervisions — y compris celles qui ne sont pas encore parties.'
     :'your enrolment, your PIN, your supervisions — including the ones not yet sent.'}</p>
    ${DB.d.outbox.length?`<div class="banner b-warn">${L
      ?`Il reste <b>${DB.d.outbox.length}</b> élément(s) à envoyer. Ils restent sur l'appareil et repartiront après la mise à jour.`
      :`<b>${DB.d.outbox.length}</b> item(s) still to send. They stay on this device and will go after the update.`}</div>`:''}
    ${!ONLINE?`<div class="banner b-err">${L
      ?'Pas de réseau. La mise à jour a besoin du réseau une fois — reconnectez-vous puis revenez ici.'
      :'No network. The update needs a network once — reconnect and come back here.'}</div>`:''}`,
   `<button class="btn sec" onclick="closeModal()">${L?'Plus tard':'Later'}</button>
    ${ONLINE?`<button class="btn" onclick="forceUpdate()">${L?'Mettre à jour maintenant':'Update now'}</button>`:''}`);
}

/* The button that actually works, unlike ↻.
   Order matters: register/update the worker FIRST so a new sw.js is picked
   up, then empty every cache, then reload with a query string the HTTP cache
   has never seen. Any one of the three alone can be defeated. */
async function forceUpdate(){
  const L = LANG==='fr';
  if(!ONLINE){ return toast(L?'Pas de réseau — la mise à jour a besoin du réseau une fois.'
                             :'No network — the update needs a network once.'); }
  closeModal();
  toast(L?'Mise à jour…':'Updating…', 8000);
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ try{ await r.update(); }catch(e){}
        try{ if(r.waiting) r.waiting.postMessage({type:'ATHECS_SKIP_WAITING'}); }catch(e){} }
    }
  }catch(e){}
  try{
    if(window.caches){
      const keys = await caches.keys();
      for(const k of keys){ try{ await caches.delete(k); }catch(e){} }
    }
  }catch(e){}
  /* DB lives in localStorage and is deliberately left alone. Saving first
     so that nothing typed in the last second is lost to the reload. */
  try{ DB.save(); }catch(e){}
  const u = location.origin + location.pathname + '?v=' + Date.now() + (location.hash||'');
  setTimeout(()=>forceUpdate._go(u), 250);
}
/* A named seam, so the test can watch where the update WOULD send the phone
   without actually navigating away mid-assertion. Nothing else overrides it. */
forceUpdate._go = u => { try{ location.replace(u); }catch(e){ location.href = u; } };


/* =====================================================================
   "SERVER UNREACHABLE — TypeError: Failed to fetch"      (v4.3.5)

   That message was true and useless. A browser reports exactly the same
   TypeError whether the phone has no route to Google at all, or reaches
   Google perfectly well and is refused by this one deployment. The two
   have completely different fixes — one is the operator's network and
   nothing to touch, the other is a setting in Manage deployments — and
   the coordination team was being asked to guess which.

   They can be told apart, cheaply. Ask Google for something that is not
   this deployment: script.google.com's own favicon, no-cors, so it needs
   no permission to answer. If THAT fails too, the phone cannot reach
   Google. If it succeeds while the deployment does not, the phone is fine
   and the deployment is refusing it.
   ===================================================================== */
async function googleReachable(){
  try{
    await fetch('https://script.google.com/favicon.ico',
      {mode:'no-cors', cache:'no-store'});
    return true;
  }catch(e){ return false; }
}

async function whyUnreachable(api, err){
  const L = LANG==='fr';
  const up = await googleReachable();
  const tail = '\n\n' + api + '\n' + err
    + '\n' + (L?'  en attente sur cet appareil : ':'  waiting on this device: ') + DB.d.outbox.length;

  if(!up) return (L
    ?'CE TÉLÉPHONE N\'ATTEINT PAS GOOGLE DU TOUT\n\n'
     +'script.google.com ne répond pas non plus. Le problème est la connexion de ce téléphone, pas le classeur.\n\n'
     +'À FAIRE :\n'
     +'1. Basculez entre données mobiles et Wi-Fi, puis réessayez.\n'
     +'2. Si plusieurs superviseurs le signalent en même temps, c\'est l\'opérateur qui bloque ou ralentit Google. Attendez et réessayez plus tard.\n'
     +'3. Rien n\'est perdu : tout ce qui attend reste sur le téléphone et repartira seul.\n\n'
     +'RIEN À CHANGER SUR LE CLASSEUR.'
    :'THIS PHONE CANNOT REACH GOOGLE AT ALL\n\n'
     +'script.google.com does not answer either. The problem is this phone\'s connection, not the workbook.\n\n'
     +'WHAT TO DO:\n'
     +'1. Switch between mobile data and Wi-Fi, then try again.\n'
     +'2. If several supervisors report this at the same time, the operator is blocking or throttling Google. Wait and try later.\n'
     +'3. Nothing is lost: everything waiting stays on the phone and leaves by itself.\n\n'
     +'NOTHING TO CHANGE ON THE WORKBOOK.') + tail;

  return (L
    ?'GOOGLE RÉPOND, CE DÉPLOIEMENT NON\n\n'
     +'Ce téléphone atteint script.google.com, mais cette adresse-ci refuse la connexion. En pratique cela veut dire l\'une de deux choses, et les deux se règlent au même endroit :\n\n'
     +'· l\'accès du déploiement n\'est plus « Tout le monde » — le navigateur est renvoyé vers une page de connexion Google qu\'il ne peut pas suivre ;\n'
     +'· cette adresse n\'est plus un déploiement actif (archivé, ou remplacé par un « Nouveau déploiement » qui a une autre adresse).\n\n'
     +'VÉRIFICATION LA PLUS RAPIDE : copiez l\'adresse ci-dessous dans Chrome, sur ce téléphone.\n'
     +'   du JSON s\'affiche  →  le déploiement va bien, c\'était passager.\n'
     +'   une page de connexion Google  →  point 4 ci-dessous.\n'
     +'   « Impossible d\'ouvrir le fichier »  →  l\'adresse est morte, point 5.\n\n'
     +'À FAIRE, sur l\'ordinateur qui possède le classeur :\n'
     +'1. Classeur ▸ Extensions ▸ Apps Script\n'
     +'2. Déployer ▸ GÉRER LES DÉPLOIEMENTS\n'
     +'3. ✏️ sur le déploiement existant\n'
     +'4. Qui a accès : TOUT LE MONDE   ← vérifiez ceci en premier\n'
     +'5. Version : nouvelle version ▸ Déployer\n'
     +'6. Recopiez l\'adresse /exec affichée et comparez-la, caractère par caractère, avec celle ci-dessous.\n\n'
     +'Jamais « Nouveau déploiement » : cela crée une deuxième adresse et les téléphones continuent de parler à l\'ancienne.'
    :'GOOGLE ANSWERS, THIS DEPLOYMENT DOES NOT\n\n'
     +'This phone reaches script.google.com, but this particular address refuses the connection. In practice that means one of two things, and both are fixed in the same place:\n\n'
     +'· the deployment\'s access is no longer "Anyone" — the browser is being sent to a Google sign-in page it cannot follow;\n'
     +'· this address is no longer a live deployment (archived, or replaced by a "New deployment" that has a different address).\n\n'
     +'QUICKEST CHECK: copy the address below into Chrome, on this phone.\n'
     +'   JSON appears  →  the deployment is fine, this was transient.\n'
     +'   a Google sign-in page  →  step 4 below.\n'
     +'   "Sorry, unable to open the file"  →  the address is dead, step 5.\n\n'
     +'WHAT TO DO, on the computer that owns the workbook:\n'
     +'1. Workbook ▸ Extensions ▸ Apps Script\n'
     +'2. Deploy ▸ MANAGE DEPLOYMENTS\n'
     +'3. ✏️ on the existing deployment\n'
     +'4. Who has access: ANYONE   ← check this first\n'
     +'5. Version: New version ▸ Deploy\n'
     +'6. Copy the /exec address it shows and compare it, character for character, with the one below.\n\n'
     +'Never "New deployment": that creates a second address and the phones keep talking to the old one.') + tail;
}
