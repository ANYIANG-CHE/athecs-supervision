/* A download is invisible on a phone: nothing opens, nothing moves, and the person
   taps again. Say what left, or say there was nothing to send. */
function exportAll(){
  const rows=[['VisiteID','Date','Statut','District','Aire','Formation sanitaire','Cycle','Periode',
               'Superviseur','Score global %','Clinique %','S&E DQA %','Recos','Recos non resolues']];
  DB.d.visits.forEach(v=>{
    const s=siteById(v.siteId)||{}; const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{};
    const sc=v.scores||visitScores(v);
    const acts=visitActions(v.id);
    rows.push([v.id,v.date,v.status,s.district,s.area,s.facility,c.name,c.name?cyclePeriodLabel(c):'',
      v.supervisor, sc.overall.pct===null?'':sc.overall.pct.toFixed(1),
      sc.clinical.pct===null?'':sc.clinical.pct.toFixed(1),
      sc.mne.pct===null?'':sc.mne.pct.toFixed(1),
      acts.length, acts.filter(a=>a.status!=='RESOLVED').length]);
  });
  const L=LANG==='fr';
  if(rows.length<2) return toast(L
    ?'Rien à exporter : aucune supervision sur cet appareil pour l\'instant.'
    :'Nothing to export: no supervision on this device yet.', 4000);
  downloadCSV(rows,'ATHECS_supervisions_'+today()+'.csv');
  toast((L?'✓ ':'✓ ')+(rows.length-1)+(L?' supervision(s) exportée(s) — cherchez le fichier dans vos téléchargements'
                                        :' supervision(s) exported — look in your downloads'), 4500);
}

/* ===================== DASHBOARD ===================== */
let DASH={cycle:'', district:'', site:''};
/* A supervisor and the coordination team need two different screens under the same word.
   The coordination team compares districts. A supervisor needs their own districts and,
   above all, the facility they have just supervised. So the dashboard splits in two, and a
   supervisor is never shown another district's figures. */
function viewDash(){ return isSuper() ? viewDashRegional() : viewDashMine(); }

/* An EMPTY scope means NOTHING, never everything.
   This used to return null for an empty list, and every caller reads null as
   "no filter" — so a supervisor whose districts had been emptied silently saw
   every district in the West. Only a super user sees the whole region, and that
   is said here explicitly instead of falling out of a missing value. */
function myDistricts(){
  const u=me();
  if(!u) return [];
  if(isSlot(u)) return null;                    // the console: the whole region, on purpose
  return Array.isArray(u.districts) ? u.districts : [];
}
/* every submitted supervision inside this person's districts, for the chosen cycle */
function scopedVisits(cid){
  const mine=myDistricts();
  return DB.d.visits.filter(v=>{
    if(!countable(v)) return false;      // a supervision in conflict counts nowhere
    if(cid && v.cycleId!==cid) return false;
    const s=siteById(v.siteId); if(!s) return false;
    return !mine || mine.includes(s.district);
  });
}
const poolOf=(arr,key)=>{ let n=0,d=0; arr.forEach(v=>{ const sc=v.scores||visitScores(v);
  n+=sc[key].n; d+=sc[key].d; }); return d>0?(n/d)*100:null; };

function viewDashMine(){
  const L=LANG==='fr', u=me(), cycles=DB.d.cycles;
  const cid=DASH.cycle||(activeCycle()||{}).id;
  const mine=myDistricts();
  const vs=scopedVisits(cid);

  /* the facilities this person can look at, in their districts, that have been supervised */
  const seen={}; vs.forEach(v=>{ const s=siteById(v.siteId); if(s) seen[s.id]=s; });
  const sites=Object.values(seen).sort((a,b)=>a.facility.localeCompare(b.facility));
  const one = DASH.site ? seen[DASH.site] : null;
  if(DASH.site && !one) DASH.site='';          // the chosen facility left the current cycle

  const filters = `
  <div class="card tight">
    <div class="row">
      <label class="f" style="flex:1;margin:0"><span>${T('cycle')}</span>
        <select onchange="DASH.cycle=this.value;render()">
          ${cycles.map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${esc(c.name)} — ${esc(cyclePeriodLabel(c))}</option>`).join('')}
        </select></label>
      <label class="f" style="flex:1;margin:0"><span>${T('facility')}</span>
        <select onchange="DASH.site=this.value;render()">
          <option value="">${L?'Toutes mes formations sanitaires':'All my facilities'}</option>
          ${sites.map(s=>`<option value="${s.id}" ${DASH.site===s.id?'selected':''}>${esc(s.facility)}</option>`).join('')}
        </select></label>
    </div>
    <p class="xs muted" style="margin:6px 0 0">${
      one ? (L?'Formation sanitaire : ':'Facility: ')+'<b>'+esc(one.facility)+'</b> · '+esc(one.district)+' › '+esc(one.area)
          : (L?'Vos districts : ':'Your districts: ')+'<b>'+esc((mine||[L?'tous':'all']).join(', '))+'</b>'}
      ${vs.length?'':' · '+(L?'aucune supervision soumise sur cette période':'no supervision submitted for this period')}</p>
  </div>`;

  /* ---------- one facility ---------- */
  if(one){
    const hist=DB.d.visits.filter(v=>v.siteId===one.id && reportReady(v))
                          .sort((a,b)=>(b.submitted||0)-(a.submitted||0));
    const last=hist[0];
    if(!last) return filters+`<div class="card"><p class="small muted">${
      L?'Aucune supervision soumise pour cette formation sanitaire sur ce cycle.'
       :'No supervision submitted for this facility in this cycle.'}</p></div>`;
    const sc=last.scores||visitScores(last);
    const acts=DB.d.actions.filter(a=>a.siteId===one.id);
    const open=acts.filter(a=>a.status!=='RESOLVED');
    const late=open.filter(a=>a.deadline&&a.deadline<today());
    const ranked=rankedSections(last);
    return filters+`
    <div class="grid g3 rings" style="margin-bottom:13px">
      <div class="stat">${ring(sc.clinical.pct,58,T('clinical'))}</div>
      <div class="stat">${ring(sc.mne.pct,58,T('mne'))}</div>
      <div class="stat">${ring(sc.overall.pct,58,T('synth'),esc(last.date||''),`explainOverall('${last.id}')`)}</div>
    </div>

    <div class="card">
      <div class="spread"><h3>${esc(one.facility)}</h3>
        <button class="btn sec sm" onclick="go('#/report/${last.id}')">📄 ${L?'Rapport':'Report'}</button></div>
      <p class="small muted">${L?'Supervision du':'Supervision of'} <b>${esc(last.date||'')}</b> ·
        ${esc(last.supervisor||'')} · ${statusChip(last.status)}</p>
      <div class="tw"><table>
        <thead><tr><th>${T('sections')}</th><th>${L?'Renseignées':'Filled in'}</th><th>N/A</th><th>Score</th></tr></thead>
        <tbody>${ranked.map(s=>`<tr class="${s.answered?'fill-'+s.band:''}">
          <td>${esc(s.sec)}</td><td class="xs">${s.answered}/${s.total}</td>
          <td class="xs">${s.na}</td><td class="sc">${pc(s.pct)}</td></tr>`).join('')}</tbody></table></div>
      <p class="xs muted" style="margin-top:6px">${L?'Sections de la plus faible à la plus forte.'
                                                   :'Sections from weakest to strongest.'}</p>
    </div>

    <div class="card">
      <div class="spread"><h3>${L?'Recommandations de ce site':'Recommendations for this site'}</h3>
        <span class="chip ${open.length?(late.length?'r':'a'):'g'}">${open.length} ${L?'ouverte(s)':'open'}</span></div>
      ${acts.length?`<div class="tw"><table>
        <thead><tr><th>${T('reco')}</th><th>${T('resp')}</th><th>${T('deadline')}</th><th>${T('status')}</th></tr></thead>
        <tbody>${acts.map(a=>{const l=a.deadline&&a.deadline<today()&&a.status!=='RESOLVED';
          return `<tr class="${l?'fill-r':(a.status==='RESOLVED'?'fill-g':'')}">
          <td class="small">${esc((a.reco||a.root||'').slice(0,120))}</td>
          <td class="xs">${esc(a.resp||'')}</td><td class="xs">${esc(a.deadline||'')}</td>
          <td class="xs">${a.status==='RESOLVED'?T('resolved'):a.status==='ONGOING'?T('ongoing'):T('unresolved')}</td></tr>`;}).join('')}
        </tbody></table></div>`:`<p class="small muted">—</p>`}
    </div>

    ${hist.length>1?`<div class="card">
      <h3>${L?'Historique de cette formation sanitaire':'History of this facility'}</h3>
      <div class="list">${hist.map(v=>{const s2=(v.scores||visitScores(v)).overall;
        const cy=DB.d.cycles.find(c=>c.id===v.cycleId)||{};
        return `<div class="item" onclick="go('#/report/${v.id}')">
          <div style="min-width:0"><b>${esc(v.date||'')}</b>
            <div class="s">${esc(cy.name||'')} · ${esc(v.supervisor||'')}</div></div>
          <span class="chip ${band(s2.pct)}">${pc(s2.pct)}</span></div>`;}).join('')}</div>
    </div>`:''}`;
  }

  /* ---------- all my facilities ---------- */
  const agg=vs.filter(v=>{ const s=siteById(v.siteId); return s && s.status==='ACTIVE'; });
  const actIds=new Set(vs.map(v=>v.id));
  const acts=DB.d.actions.filter(a=>actIds.has(a.visitId));
  const open=acts.filter(a=>a.status!=='RESOLVED');
  const late=open.filter(a=>a.deadline&&a.deadline<today());
  const resPct=acts.length?((acts.length-open.length)/acts.length*100):null;
  const secAgg={};
  vs.forEach(v=>{ const sc=v.scores||visitScores(v);
    sc.sections.forEach(s=>{ const o=secAgg[s.sec]=secAgg[s.sec]||{n:0,d:0}; o.n+=s.n; o.d+=s.d; }); });
  const secRows=Object.keys(secAgg).map(s=>({sec:s, pct:secAgg[s].d>0?(secAgg[s].n/secAgg[s].d)*100:null}))
    .sort((a,b)=>(a.pct===null?999:a.pct)-(b.pct===null?999:b.pct));

  return filters+`
  <div class="grid g3 rings" style="margin-bottom:13px">
    <div class="stat">${ring(poolOf(agg,'clinical'),58,T('clinical'))}</div>
    <div class="stat">${ring(poolOf(agg,'mne'),58,T('mne'))}</div>
    <div class="stat">${ring(poolOf(agg,'overall'),58,
      L?'Mes districts':'My districts', agg.length+(L?' site(s)':' site(s)'))}</div>
  </div>

  <div class="card">
    <h3>${L?'Mes formations sanitaires supervisées':'The facilities I have supervised'}</h3>
    ${vs.length?`<div class="list">${vs.map(v=>({v,s:siteById(v.siteId)||{},sc:v.scores||visitScores(v)}))
      .sort((a,b)=>(a.sc.overall.pct||0)-(b.sc.overall.pct||0))
      .map(x=>`<div class="item" onclick="DASH.site='${x.s.id}';render()">
        <div style="min-width:0"><b>${esc(x.s.facility||'')}</b>
          <div class="s">${esc(x.s.district||'')} · ${esc(x.v.date||'')} · ${
            L?'clinique':'clinical'} ${pc(x.sc.clinical.pct)} · ${L?'S&E':'M&E'} ${pc(x.sc.mne.pct)}</div></div>
        <span class="chip ${band(x.sc.overall.pct)}">${pc(x.sc.overall.pct)}</span></div>`).join('')}</div>
    <p class="xs muted" style="margin-top:6px">${L?'De la plus faible à la plus forte. Touchez une ligne pour voir le détail du site.'
                                                  :'Weakest first. Tap a row for that facility\'s detail.'}</p>`
    :`<p class="small muted">—</p>`}
  </div>

  <div class="card">
    <h3>${L?'Recommandations sur la période':'Recommendations for the period'}</h3>
    <div class="grid g3 always">
      <div class="stat"><b>${acts.length}</b><span>TOTAL</span></div>
      <div class="stat ${open.length?'fill-a':'fill-g'}"><b>${open.length}</b><span>${L?'NON RÉSOLUES':'UNRESOLVED'}</span></div>
      <div class="stat ${late.length?'fill-r':''}"><b>${late.length}</b><span>${L?'EN RETARD':'OVERDUE'}</span></div>
    </div>
    <div style="margin-top:10px">
      <div class="spread small"><span>${L?'Taux de résolution':'Resolution rate'}</span><b class="sc">${pc(resPct)}</b></div>
      <div class="bar"><i style="width:${resPct||0}%;background:${bandColor(resPct)}"></i></div>
    </div>
    ${open.length?`<div class="tw" style="margin-top:12px"><table>
      <thead><tr><th>${T('facility')}</th><th>${T('reco')}</th><th>${T('deadline')}</th></tr></thead>
      <tbody>${open.slice(0,30).map(a=>{const s=siteById(a.siteId)||{};
        const l=a.deadline&&a.deadline<today();
        return `<tr class="${l?'fill-r':''}"><td class="xs">${esc(s.facility||'')}</td>
          <td class="small">${esc((a.reco||a.root||'').slice(0,110))}</td>
          <td class="xs">${esc(a.deadline||'')}</td></tr>`;}).join('')}
      </tbody></table></div>`:''}
  </div>

  <div class="card">

function explainRegional(pooledPct, meanPct, n){
  const L=LANG==='fr';
  infoModal(T('howCalc'), L
   ?`SCORE RÉGIONAL — deux lectures\n\n1) Ratio agrégé (affiché en titre) : ${pc(pooledPct)}\n   Tous les numérateurs et dénominateurs des ${n} supervisions sont additionnés puis divisés. Un gros site pèse davantage — c'est la performance réelle de la région.\n\n2) Moyenne des scores de site : ${pc(meanPct)}\n   Chaque site compte pour un. Répond à la question « le site moyen se porte-t-il bien ? ».\n\nLes sites PROVISOIRES sont exclus des agrégats tant qu'ils ne sont pas validés.`
   :`REGIONAL SCORE — two readings\n\n1) Pooled ratio (headline): ${pc(pooledPct)}\n   All numerators and denominators from the ${n} visits are summed then divided. A large site weighs more — this is the region's real performance.\n\n2) Mean of site scores: ${pc(meanPct)}\n   Every site counts once. Answers "how is the average site doing?".\n\nPROVISIONAL sites are excluded from aggregates until approved.`);
}

/* ===================== CHAT ===================== */
function myThreads(){
  const u=me();
  return DB.d.threads.filter(t=>{
    if(t.scope==='GENERAL') return true;
    if(isSuper()) return true;
    /* ---- A FACILITY CONVERSATION BELONGS TO THE FACILITY ---------------------------
       Membership was taken from whoever already had a supervision there, so a thread
       opened about a facility was invisible to every other supervisor of the district
       AND to the facility's own focal point — the two audiences it exists for. */
    if(t.scope==='SITE'){
      const s=siteById(t.siteId); if(!s) return false;
      if((u.sites||[]).includes(t.siteId)) return true;      // the facility's own staff
      if(!hasSupHat(u)) return false;
      const ds=Array.isArray(u.districts)?u.districts:[];
      return ds.includes(s.district);
    }
    if(t.scope==='DIRECT') return (t.members||[]).includes(u.id);
    if(t.scope==='VISIT'){ const v=DB.d.visits.find(x=>x.id===t.visitId); return v && v.uid===u.id; }
    return false;
  });
}
function unread(){
  const u=me(); if(!u) return 0;
  return DB.d.messages.filter(m=> m.uid!==u.id && !(m.read||[]).includes(u.id) &&
    myThreads().some(t=>t.id===m.threadId)).length;
}
function viewChat(tid){
  const th=myThreads();
  const cur=tid?DB.d.threads.find(t=>t.id===tid):null;
  if(cur){ (DB.d.messages.filter(m=>m.threadId===cur.id)).forEach(m=>{
    m.read=m.read||[]; if(!m.read.includes(DB.d.session)) m.read.push(DB.d.session); }); DB.save(); }
  return `<div class="split">
    <div>
      <div class="card tight">
        <div class="spread"><b>${T('chat')}</b>
          ${isSuper()?`<button class="btn sm" onclick="newThreadModal()">＋</button>`:''}</div>
      </div>
      <div class="list">${th.map(t=>{
        const last=DB.d.messages.filter(m=>m.threadId===t.id).slice(-1)[0];
        const un=DB.d.messages.filter(m=>m.threadId===t.id&&m.uid!==DB.d.session&&!(m.read||[]).includes(DB.d.session)).length;
        const s=t.siteId?siteById(t.siteId):null;
        return `<div class="item ${cur&&cur.id===t.id?'fill-g':''}" onclick="go('#/chat/${t.id}')">
          <div style="min-width:0"><b>${esc(t.title||(s?s.facility:'—'))}</b>
            <div class="s">${scopeLabel(t.scope)}${last?' · '+esc((last.body||'').slice(0,40)):''}</div></div>
          ${un?`<span class="badge">${un}</span>`:'<span class="chip n">→</span>'}</div>`;}).join('')||'<p class="small muted">—</p>'}
      </div>
    </div>
    <div>
      ${cur?chatPane(cur):`<div class="card"><p class="small muted">${LANG==='fr'?'Sélectionnez une conversation.':'Select a conversation.'}</p></div>`}
    </div></div>`;
}

function chatPane(t){
  const ms=DB.d.messages.filter(m=>m.threadId===t.id).sort((a,b)=>a.ts-b.ts);
  const s=t.siteId?siteById(t.siteId):null;

function sendMsg(tid){
  const el=$('#msg-in'); const body=(el.value||'').trim(); if(!body) return;
  const m={id:DB.id('M'), threadId:tid, uid:DB.d.session, who:(me()||{}).name, body,
    ts:Date.now(), read:[DB.d.session], pending:!ONLINE};
  DB.d.messages.push(m); DB.save(); queue('message', m); el.value='';
  render(); const th=$('#thread'); if(th) th.scrollTop=th.scrollHeight;
}
function postSiteMessage(siteId, body){
  let t=DB.d.threads.find(x=>x.scope==='SITE'&&x.siteId===siteId);
  if(!t){ const s=siteById(siteId);
    t={id:DB.id('T'), scope:'SITE', siteId, title:s.facility, created:Date.now(),
       members:DB.d.visits.filter(v=>v.siteId===siteId).map(v=>v.uid)};
    DB.d.threads.push(t); queue('thread', t); }
  const m={id:DB.id('M'), threadId:t.id, uid:DB.d.session, who:(me()||{}).name, body, ts:Date.now(), read:[DB.d.session]};
  DB.d.messages.push(m); DB.save(); queue('message', m);
}

function createThread(){
  const scope=$('#nt-scope').value; const title=$('#nt-title').value.trim();

  let t=DB.d.threads.find(x=>x.scope==='DIRECT'&&(x.members||[]).includes(DB.d.session));

    t={id:DB.id('T'),scope:'DIRECT',members:[DB.d.session,su?su.id:''],title:'Administrateur',created:Date.now()};

async function submitSiteReq(editId){
  const u=me(); const g=i=>{const e=$('#'+i); return e?String(e.value||'').trim():'';};
  const miss=[];
  if(!g('sr-dis'))miss.push(T('district')); if(!g('sr-area'))miss.push(T('area'));
  if(!g('sr-fac'))miss.push(T('facility'));
  if(!g('sr-ref'))miss.push(LANG==='fr'?'N° du document (E1)':'Document reference (E1)');
  if(!g('sr-date'))miss.push(LANG==='fr'?'Date du document (E1)':'Document date (E1)');
  if(!$('#sr-doc').files[0])miss.push(LANG==='fr'?'Pièce justificative (E2)':'Supporting document (E2)');
  if(!u.idNumber)miss.push(LANG==='fr'?'Pièce d\'identité du demandeur (E3)':'Requester identity document (E3)');
  if(!g('sr-fn'))miss.push(LANG==='fr'?'Fonction dans le site (E4)':'Function at the site (E4)');
  if(!g('sr-tel'))miss.push(LANG==='fr'?'Téléphone (E5)':'Phone (E5)');
  if(!$('#sr-dec').checked)miss.push(LANG==='fr'?'Déclaration (E6)':'Declaration (E6)');
  if(miss.length) return blockedModal(miss);

  const doc=await fileToB64($('#sr-doc').files[0]);
  let gps=null;
  if($('#sr-gps').checked && navigator.geolocation){
    gps = await new Promise(r=>navigator.geolocation.getCurrentPosition(
      p=>r({lat:p.coords.latitude,lng:p.coords.longitude}), ()=>r(null), {timeout:6000}));
  }
  const ref='ATH-SR-'+new Date().getFullYear()+'-'+String(DB.d.siteReq.length+1).padStart(4,'0');
  const before = editId? Object.assign({},siteById(editId)) : null;
  const req={id:DB.id('SR'), ref, type:g('sr-type'), editId:editId||null,
    before, after:{district:g('sr-dis'), area:g('sr-area'), facility:g('sr-fac')},
    source:g('sr-src'), docRef:g('sr-ref'), docDate:g('sr-date'), docFile:doc,
    reqName:u.name, reqUid:u.id, reqFn:g('sr-fn'), reqMat:g('sr-mat'),
    idType:u.idType, idNumber:u.idNumber,
    phone:g('sr-tel'), email:g('sr-mail'), justification:g('sr-just'),
    gps, deviceTs:Date.now(), status:'SUBMITTED'};
  DB.d.siteReq.push(req);

  // Provisional site available immediately (approved decision D4)
  if(req.type==='ADD'){
    const s={id:DB.id('S'), district:req.after.district, area:req.after.area, facility:req.after.facility,
      status:'PROVISIONAL', version:1, reqId:req.id};
    DB.d.sites.push(s); req.siteId=s.id;
    NV.district=s.district; NV.area=s.area; NV.siteId=s.id;
  }
  DB.save(); audit('SITE_REQ', req.type, ref+' · '+req.after.facility);
  queue('siteReq', req);
  modal(LANG==='fr'?'Demande enregistrée':'Request recorded',
   `<div class="banner b-ok">${LANG==='fr'?'Référence':'Reference'} : <b>${ref}</b></div>
    <p class="small">${req.type==='ADD'
      ? (LANG==='fr'?'Le site est utilisable immédiatement en statut <b>PROVISOIRE</b> (signalé en orange). Ses données sont exclues des agrégats régionaux jusqu\'à validation par un super utilisateur.'
                    :'The site is usable immediately as <b>PROVISIONAL</b> (flagged orange). Its data is excluded from regional aggregates until a super user approves it.')
      : (LANG==='fr'?'La modification sera appliquée après validation par un super utilisateur. Le registre est versionné : l\'ancienne version est conservée.'
                    :'The change will be applied after a super user approves it. The registry is versioned: the old version is kept.')}</p>`,
   `<button class="btn" onclick="closeModal();go(canSupervise()?'#/new':'#/home')">OK</button>`);
}

/* ---------------------------------------------------------------------------
   SUPER USERS — assigned, never enrolled.
   The one thing an administrator can do that a super user cannot. Assigning
   generates a random 6-digit code; the person activates the slot on their own
   phone with it and chooses their own PIN. No PIN is ever stored anywhere but
   on that phone, and nothing in the app carries a default. */
function admSlots(){
  const L=LANG==='fr';
  /* The ROSTER the server keeps, not the accounts this phone happens to hold. An empty
     post is deliberately absent from DB.d.users — it must never appear on a sign-in
     screen — and reading that list here meant the assignment panel could only show
     posts that were already filled. */
  const roster = (DB.d.config.slotRoster||[]);
  const slots = (roster.length
      ? roster.map(sl => Object.assign({}, sl))
      : DB.d.users.filter(u=>isSlot(u)).map(u=>({id:u.id, role:u.role, name:u.name,
          phone:u.phone, claimed:u.claimed, assigned:!!String(u.name||'').trim()})))
    .sort((a,b)=> a.id<b.id ? -1 : 1);
  const row=u=>{
    const named=String(u.name||'').trim();
    const isA=u.role==='ADMIN';
    return `<div class="card tight">
      <div class="spread">
        <div style="min-width:0">
          <b>${named?esc(u.name):(L?'— non attribué —':'— unassigned —')}</b>
          <div class="xs muted">${esc(roleLabel(u.role))} · ${esc(u.id)}${u.phone?' · '+esc(u.phone):''}</div>
        </div>
        <span class="chip ${!named?'n':u.claimed?'g':'a'}">${
          !named?(L?'libre':'free'):u.claimed?(L?'actif':'active'):(L?'à activer':'to activate')}</span>
      </div>
      ${isA?`<p class="xs muted" style="margin-top:8px">${L
        ?'Un compte administrateur ne s\'attribue pas ici. Il se donne depuis l\'éditeur Apps Script : fonction <b>nouveauCodeAdmin</b>. C\'est ce qui fait que seul le propriétaire du classeur peut nommer un administrateur.'
        :'An administrator account is not assigned here. It is given from the Apps Script editor: function <b>nouveauCodeAdmin</b>. That is what makes the workbook owner the only person who can name an administrator.'}</p>`
      :`<div class="row" style="margin-top:9px">
          <button class="btn sm" ${ONLINE?'':'disabled'} onclick="assignSlotModal('${u.id}')">${
            named?(L?'⇄ Réattribuer':'⇄ Reassign'):(L?'＋ Attribuer':'＋ Assign')}</button>
          ${named?`<button class="btn sec sm" ${ONLINE?'':'disabled'} onclick="releaseSlotAsk('${u.id}')">⛔ ${
            L?'Retirer':'Withdraw'}</button>`:''}
        </div>`}
    </div>`;
  };
  return `<div class="card">
    <div class="spread"><h3>${L?'Comptes privilégiés':'Privileged accounts'}</h3>
      <button class="btn sm" ${ONLINE?'':'disabled'} onclick="refreshSlots(true)">↻ ${L?'Actualiser':'Refresh'}</button></div>
    <p class="small muted">${L
      ?'Deux administrateurs et six super utilisateurs, pas davantage. Un compte n\'est jamais créé par la personne elle-même : il lui est <b>attribué</b>, et elle l\'active sur son téléphone avec un code à 6 chiffres. Aucun code PIN n\'existe par défaut, nulle part.'
      :'Two administrators and six super users, no more. An account is never created by the person: it is <b>assigned</b> to them, and they activate it on their phone with a 6-digit code. No PIN exists by default, anywhere.'}</p>
    ${!roster.length?`<div class="banner b-warn">${L
      ?'Cette liste n\'a pas encore été lue sur le serveur. Appuyez sur <b>Actualiser</b> : les postes libres n\'apparaissent qu\'à ce moment-là.'
      :'This list has not been read from the server yet. Press <b>Refresh</b>: free posts only appear then.'}</div>`:''}
    ${slots.map(row).join('')||`<p class="small muted">—</p>`}
    <hr>
    <p class="xs muted">${L
      ?'Retirer un compte le rend libre immédiatement : le téléphone de la personne s\'en sépare tout seul à sa prochaine connexion, et son code PIN cesse de fonctionner. Ses décisions passées restent au journal.'
      :'Withdrawing an account frees it immediately: the person\'s phone lets go of it by itself at its next connection and their PIN stops working. Their past decisions stay in the Journal.'}</p>
  </div>`;
}

/* Everything the region has submitted, in one place, with the decision on the row.
   Before this the only way in was a card on the home screen, and only if the
   supervision had somehow reached the device — which, until the data endpoint
   existed, it had not. */
/* The console grants the pen in the holder's place. It is the same server message the
   holder sends, checked against the caller's role — nothing here is a special case. */
function penGrant(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v || !v.penReq) return;
  const L=LANG==='fr';
  const to=DB.d.users.find(u=>u.id===v.penReq.byId);
  if(!to) return toast(L?'Compte demandeur introuvable':'Requesting account not found');
  confirmModal({
    title:L?'Accorder les droits d\'édition':'Grant the editing rights',
    tone:'b-warn',
    body:L?`La supervision de « ${esc((siteById(v.siteId)||{}).facility||'')} » passera de <b>${esc(penHolderName(v)||'—')}</b> à <b>${esc(to.name)}</b>.<br><br>Ce qui a été synchronisé suit la supervision. Ce que le détenteur actuel a saisi hors réseau et pas encore envoyé reste sur son téléphone.`
           :`The supervision of "${esc((siteById(v.siteId)||{}).facility||'')}" will move from <b>${esc(penHolderName(v)||'—')}</b> to <b>${esc(to.name)}</b>.<br><br>Whatever was synced follows the supervision. Anything the current holder entered offline and has not sent stays on their phone.`,
    okLabel:L?'Accorder':'Grant',
    onOk:()=>{
      queue('penSet', {visitId:vid, toId:to.id, toName:to.name, byId:(me()||{}).id,
                       why:(L?'accordé par la console : ':'granted by the console: ')+(v.penReq.why||'')});
      v.uid=to.id; v.supervisor=to.name; v.penReq=null; v.updated=Date.now(); DB.save();
      audit('PEN_GRANT','visit', `${(siteById(v.siteId)||{}).facility||v.siteId} → ${to.name}`);
      toast(L?'✓ Droits accordés':'✓ Rights granted'); render();
    }});
}
function penRefuse(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v || !v.penReq) return;
  const L=LANG==='fr';
  askReason({
    title:L?'Refuser la demande':'Refuse the request',
    label:L?'Motif (lu sur le téléphone du demandeur)':'Reason (read on the requester\'s phone)',
    confirmLabel:L?'Refuser':'Refuse', danger:true,
    onOk:why=>{
      v.penReq=Object.assign({}, v.penReq, {status:'REFUSED', note:why, by:(me()||{}).name||''});
      v.updated=Date.now(); DB.save();
      queue('visit', {visit:visitForSync(v), answers:answersForSync(v.id), actions:visitActions(v.id)});
      audit('PEN_REFUSE','visit', `${(siteById(v.siteId)||{}).facility||v.siteId} — ${why}`);
      toast(L?'Demande refusée':'Request refused'); render();
    }});
}

      <div class="row">
        <button class="btn sec sm" onclick="setCycleStatus('${c.id}','${c.status==='OPEN'?'CLOSED':'OPEN'}')">

function newCycleModal(){

/* Nothing on this tab used to leave the console. Opening a quarter, unticking a month or
   moving the deadline changed the coordinator's own screen and no phone in the region ever
   heard about it — the field stayed on the previous period. Every change now pushes the
   WHOLE list, so the closure of the old cycle travels along with the opening of the new. */
function pushCycles(){ DB.d.cycles.forEach(c=>queue('cycle', c)); }

function createCycle(){
  const fy=Number($('#cy-fy').value), q=Number($('#cy-q').value);
  const name='FY'+String(fy).slice(2)+' Q'+q;
  if(DB.d.cycles.find(c=>c.id==='C-FY'+fy+'Q'+q)) return toast(LANG==='fr'?'Ce cycle existe déjà':'Cycle already exists');
  DB.d.cycles.forEach(c=>c.status='CLOSED');
  DB.d.cycles.push(mkCycle(name, fy, q, true));
  DB.save(); audit('CYCLE_OPEN','cycle',name); pushCycles(); closeModal();
  toast(LANG==='fr'?'✓ '+name+' ouvert — les téléphones basculent à leur prochaine connexion'
                   :'✓ '+name+' opened — phones switch at their next connection', 4000);
  render();
}
function setMonth(cid,i,val){ const c=DB.d.cycles.find(x=>x.id===cid); c.monthsComplete[i]=val; DB.save();
  audit('CYCLE_MONTH','cycle',c.name+' m'+(i+1)+'='+val); queue('cycle', c);
  toast(LANG==='fr'?(val?'Mois inclus':'Mois retiré')+' — transmis aux téléphones'
                   :(val?'Month included':'Month removed')+' — sent to the phones', 2600);
  render(); }
function setCycleStatus(cid,st){ const c=DB.d.cycles.find(x=>x.id===cid);
  if(st==='OPEN') DB.d.cycles.forEach(x=>x.status='CLOSED');
  c.status=st; DB.save(); audit('CYCLE_STATUS','cycle',c.name+'→'+st); pushCycles(); render(); }
function setCycleDeadline(cid,v){ const c=DB.d.cycles.find(x=>x.id===cid);
  c.deadline=v; DB.save(); queue('cycle', c); }

function admApprovals(){
  const L=LANG==='fr';
  const all=DB.d.users.filter(u=>!isSlot(u));
  const pending=all.filter(u=>userStatus(u)===U_PENDING);
  const active=all.filter(u=>userStatus(u)===U_ACTIVE);
  const off=all.filter(u=>[U_SUSPENDED,U_REJECTED].includes(userStatus(u)));
  const help=active.filter(u=>u.pinHelp);

  /* Two records for one person split their supervisions in half. Show it on both cards. */
  /* Deactivating the twin used to be the only option — and it was a trap: the deactivated
     account vanished from its own phone, and that phone could never learn it had been
     reactivated. Merging keeps ONE account, moves everything onto it and archives the other. */
  const dupBanner=u=>{
    const d=duplicatesOf(u, all);
    if(!d.length) return '';
    const older=(a,b)=>((a.enrolled||0)<=(b.enrolled||0)?a:b);
    return `<div class="banner b-warn xs" style="margin-top:8px">⚠ ${L?'Doublon probable':'Probable duplicate'}
      ${d.map(x=>`<div style="margin-top:6px">
        <b>${esc(x.name)}</b> (${esc(x.fn||'—')}${x.idType?', '+esc(x.idType):''}, ${userStatus(x)})
        <div class="xs">${L?'Concordance':'Match'} : ${esc((x._match&&x._match.why||[]).join(' · ')||'—')}
          ${x._match&&x._match.sure?`<b>${L?'— certaine':'— certain'}</b>`
            :x._match&&x._match.likely?`<b>${L?'— probable':'— likely'}</b>`
            :`<i>${L?'— faible, à vérifier avec la personne':'— weak, check with the person'}</i>`}</div>
        <div class="row" style="margin-top:5px">
          ${x._match&&x._match.likely?`<button class="btn sm" onclick="confirmMerge('${older(u,x).id}','${(older(u,x).id===u.id?x:u).id}')">⇄ ${
            L?'Fusionner':'Merge'}</button>`:''}
          <button class="btn sec sm" onclick="closeDuplicate('${x.id}','${esc(u.name).replace(/'/g,"")}')">⛔ ${
            L?'Désactiver seulement':'Deactivate only'}</button>
        </div></div>`).join('')}
      <div class="xs" style="margin-top:6px">${L
        ?'La fusion garde le compte le plus ancien — c\'est celui auquel les supervisions sont rattachées — et archive l\'autre. Le téléphone de la personne bascule tout seul : elle n\'a rien à refaire.'
        :'Merging keeps the older account — the one the supervisions point at — and archives the other. The person\'s phone switches by itself: nothing for them to redo.'}</div>
    </div>`;
  };

  /* what the applicant supplied — read only. Central just decides. */
  const row=(k,v)=>v?`<tr><td class="k">${esc(k)}</td><td>${v}</td></tr>`:'';
  /* A dual account has TWO scopes and both must be visible: showing only one is how
     somebody ends up approved into a space that holds nothing. */
  const siteChips=u=>{
    const st=(u.sites||[]).map(id=>{ const x=siteById(id);
      return `<span class="chip n">${x?esc(x.district)+' › '+esc(x.facility):esc(id)}</span>`; }).join(' ');
    return st || `<span class="chip r">${L?'aucune formation sanitaire':'no facility'}</span>`;
  };
  const disChips=u=>{
    const d=(u.districts||[]);
    return d.length? d.map(x=>`<span class="chip n">${esc(x)}</span>`).join(' ')
                   : `<span class="chip r">${L?'aucun district':'no district'}</span>`;
  };
  const scope=u=>{
    if(isDual(u)) return `<div><span class="xs muted">👥 ${L?'Supervise':'Supervises'} :</span> ${disChips(u)}</div>
      <div style="margin-top:4px"><span class="xs muted">🏥 ${L?'Point focal':'Focal point'} :</span> ${siteChips(u)}</div>`;
    return u.role==='SITE' ? siteChips(u) : disChips(u);
  };

  /* The full ID number never leaves the private workbook. On a device that took the
     enrolment it is here; on any other device only the last four characters arrive —
     enough to read back to the person on the phone, never enough to reconstruct. */
  const idLine=(u,L)=>{
    if(u.idNumber) return esc(u.idType||'')+' n° '+esc(u.idNumber)
      + (u.idFile?` <a href="${u.idFile}" target="_blank">↗</a>`:'');
    if(u.idLast) return esc(u.idType||'')+' •••'+esc(u.idLast)
      + ` <span class="xs muted">(${L?'n° complet dans le classeur':'full number in the workbook'})</span>`;
    return `<span class="chip a">${L?'à vérifier dans le classeur':'check in the workbook'}</span>`;
  };

  const pendingCard=u=>`<div class="card tight">
    <div class="spread" style="margin-bottom:8px">
      <div style="min-width:0"><b style="font-size:1rem">${esc(u.name)}</b>
        <div class="xs muted">${esc(u.fn||'')}</div></div>
      <span class="chip ${u.role==='SITE'?'g':'n'}">${u.role==='SITE'?(L?'Personnel du site':'Facility staff'):(L?'Superviseur':'Supervisor')}</span>
    </div>
    <div class="tw"><table><tbody>
      ${row(u.role==='SITE'?T('facility'):T('district'), scope(u))}
      ${isDual(u)?row(L?'Deux rôles':'Two roles', `<span class="chip g">${L?'Superviseur + Personnel du site':'Supervisor + Facility staff'}</span>`):''}
      ${row(L?'Téléphone':'Phone', esc(u.phone||''))}
      ${row('Email', esc(u.email||''))}
      ${row(L?'Pièce d\'identité':'ID document', idLine(u,L))}
      ${row(L?'Matricule':'Matricule', esc(u.matricule||''))}
      ${row(L?'Demande reçue':'Request received', u.enrolled?fmtDT(u.enrolled):'')}

    ${dupBanner(u)}
    <div class="row" style="margin-top:10px">
      <button class="btn ok" style="flex:2" onclick="approveUser('${u.id}')">✓ ${L?'Approuver':'Approve'}</button>
      <button class="btn dan" style="flex:1" onclick="rejectUser('${u.id}')">✕ ${L?'Rejeter':'Reject'}</button>
    </div>
    <button class="btn sec blk sm" style="margin-top:8px" onclick="editScope('${u.id}')">
      ✎ ${L?'Modifier l\'affectation avant d\'approuver':'Change the assignment before approving'}</button>
  </div>`;

  const activeCard=u=>`<div class="card tight ${u.pinHelp?'fill-a':''}">
    <div class="spread">
      <div style="min-width:0"><b>${esc(u.name)}</b>
        <div class="xs muted">${esc(u.fn||'')}${u.phone?' · '+esc(u.phone):''}</div>
        <div class="xs" style="margin-top:4px">${scope(u)}</div></div>
      <span class="chip g">${L?'Actif':'Active'}</span>
    </div>
    ${dupBanner(u)}
    ${u.pinHelp?`<div class="banner b-warn xs" style="margin-top:8px">🔑 ${L
      ?'A signalé un code PIN oublié le '+fmtDT(u.pinHelp)+'. Appelez-le/la et donnez le code temporaire.'
      :'Reported a forgotten PIN on '+fmtDT(u.pinHelp)+'. Call them and give the temporary code.'}</div>`
     : tempAlive(u)?`<div class="banner b-info xs" style="margin-top:8px">${L
      ?'Code temporaire en cours, valable jusqu\'au '+tempEnds(u)+'.'
      :'Temporary code outstanding, valid until '+tempEnds(u)+'.'}
      ${u.pinResetCode?`<a href="#" onclick="event.preventDefault();showTempPin('${u.id}')">${
        L?'revoir le code':'show the code again'}</a>`:''}</div>`:''}
    ${roleReqBanner(u)}
    <div class="row" style="margin-top:9px">
      ${hasSupHat(u)?`<button class="btn sec sm" onclick="editScope('${u.id}','SUPERVISOR')">⇄ ${
        L?'Districts':'Districts'}</button>`:''}
      ${hasSiteHat(u)?`<button class="btn sec sm" onclick="editScope('${u.id}','SITE')">🏥 ${
        L?'Formations sanitaires':'Facilities'}</button>`:''}
      <button class="btn ${u.pinHelp?'':'sec'} sm" onclick="resetPin('${u.id}')">🔑 ${
        u.pinHelp?(L?'Donner un code':'Give a code'):(L?'PIN oublié':'Forgotten PIN')}</button>
      <button class="btn dan sm" onclick="suspendUser('${u.id}')">⛔ ${L?'Désactiver':'Deactivate'}</button>
    </div>
    <div class="row" style="margin-top:7px">
      ${!isDual(u) && !reqPending(u) ? `<button class="btn sec sm" onclick="addRoleModal('${u.id}')">＋ ${
        L?'Ajouter le rôle '+(u.role==='SITE'?'superviseur':'personnel du site')
         :'Add the '+(u.role==='SITE'?'supervisor':'facility staff')+' role'}</button>`:''}
      ${isDual(u) ? `<button class="btn sec sm" onclick="revokeRoleAsk('${u.id}')">− ${
        L?'Retirer le second rôle':'Remove the second role'}</button>`:''}
    </div>
  </div>`;

  const offCard=u=>`<div class="card tight">
    <div class="spread">
      <div style="min-width:0"><b>${esc(u.name)}</b>
        <div class="xs muted">${esc(u.decisionNote||'')}</div></div>
      <span class="chip r">${userStatus(u)}</span>
    </div>
    <button class="btn ok sm" style="margin-top:8px" onclick="reactivateUser('${u.id}')">↺ ${L?'Réactiver':'Reactivate'}</button>
  </div>`;

  return `<div class="card">
    <div class="spread"><h3>${L?'Validation des comptes':'Account approvals'}</h3>
      <button class="btn sm" ${ONLINE?'':'disabled'} onclick="refreshRoster(true)">↻ ${L?'Actualiser':'Refresh'}</button></div>
    <p class="small muted">${L
      ?'Chaque personne renseigne elle-même toutes ses informations à l\'enrôlement. Ici, il suffit d\'approuver ou de rejeter.'
      :'Each person supplies all their own details at enrolment. Here you simply approve or reject.'}</p>

    ${help.length?`<h3 style="margin-top:14px">🔑 ${L?'Codes PIN oubliés':'Forgotten PINs'}
      <span class="badge">${help.length}</span></h3>
      <p class="small muted">${L
        ?'Ces personnes ont signalé avoir oublié leur code. Appelez-les et donnez-leur le code temporaire.'
        :'These people reported a forgotten PIN. Call them and read out the temporary code.'}</p>
      ${help.map(activeCard).join('')}`:''}

    <h3 style="margin-top:14px">${L?'En attente':'Pending'} ${pending.length?`<span class="badge">${pending.length}</span>`:''}</h3>
    ${pending.map(pendingCard).join('')||`<p class="small muted">${L?'Aucune demande en attente.':'No pending request.'}</p>`}

    <h3 style="margin-top:16px">${L?'Comptes actifs':'Active accounts'} (${active.length})</h3>
    ${active.map(activeCard).join('')||`<p class="small muted">—</p>`}

    ${off.length?`<h3 style="margin-top:16px">${L?'Désactivés / rejetés':'Deactivated / rejected'} (${off.length})</h3>
      ${off.map(offCard).join('')}`:''}

}

/* One person, one account — the confirmation before it happens. */
function confirmMerge(keepId, dropId){
  const keep=DB.d.users.find(x=>x.id===keepId), drop=DB.d.users.find(x=>x.id===dropId);
  if(!keep||!drop) return;
  const L=LANG==='fr';
  const m=matchScore(keep,drop);
  const nVis=DB.d.visits.filter(v=>v.uid===dropId).length;
  modal(L?'Fusionner deux comptes':'Merge two accounts', `
    <div class="banner ${m.sure?'b-ok':'b-warn'}">${L?'Concordance':'Match'} : ${esc(m.why.join(' · '))}
      ${m.sure?(L?' — certaine':' — certain'):(L?' — probable, confirmez avec la personne':' — likely, confirm with the person')}</div>
    <table><tbody>
      <tr><td class="k">${L?'Compte conservé':'Account kept'}</td><td><b>${esc(keep.name)}</b><br>
        <span class="xs muted">${esc(keep.fn||'')} · ${esc(keep.id)} · ${L?'enrôlé le':'enrolled'} ${keep.enrolled?fmtDT(keep.enrolled):'—'}</span></td></tr>
      <tr><td class="k">${L?'Compte archivé':'Account archived'}</td><td>${esc(drop.name)}<br>
        <span class="xs muted">${esc(drop.fn||'')} · ${esc(drop.id)}${nVis?' · '+nVis+(L?' supervision(s) à transférer':' supervision(s) to move'):''}</span></td></tr>

    <p class="small">${L
      ?'Les supervisions, réponses, recommandations, demandes de site et messages du compte archivé sont rattachés au compte conservé. Le compte archivé disparaît de toutes les listes ; son contenu est conservé dans l\'onglet ARCHIVE du classeur.'
      :'The archived account\'s supervisions, answers, recommendations, site requests and messages are re-pointed to the kept account. It disappears from every list; its full record is kept in the workbook\'s ARCHIVE tab.'}</p>
    <p class="xs muted">${L
      ?'Le téléphone de la personne bascule seul à sa prochaine connexion réseau. Elle garde son code PIN et n\'a pas à se réenrôler.'
      :'The person\'s phone switches by itself at its next network connection. They keep their PIN and do not re-enrol.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     <button class="btn" onclick="closeModal();mergeUsers('${keepId}','${dropId}')">⇄ ${L?'Fusionner':'Merge'}</button>`);
}

      ?`<b>${esc(u.name)}</b> sera désactivé et disparaîtra de l'écran de connexion. La personne continuera avec <b>${esc(keptName)}</b>.`

function confirmCloseDuplicate(uid, keptName){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  u.status=U_SUSPENDED; u.active=false;
  u.decisionNote=(L?'Compte en double — utilisez ':'Duplicate account — use ')+keptName;

  pushUser(u); closeModal();
  toast(L?'✓ Doublon désactivé':'✓ Duplicate deactivated'); render();
}

/* change districts (supervisor) or facility (site staff) — only when needed */
function editScope(uid, hat){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  /* WHICH scope is being edited is now explicit. It used to be deduced from the role,
     which on a dual account could only ever reach one of the two — and worse, saving the
     facilities rewrote the districts from them, wiping the supervisor's assignment. */
  const which = (hat==='SITE'||hat==='SUPERVISOR') ? hat : (u.role==='SITE'?'SITE':'SUPERVISOR');
  EDIT_HAT = which;
  if(which==='SITE'){
    /* One person may follow several facilities, in several districts. */
    const byDis={};
    DB.d.sites.filter(s=>s.status!=='CLOSED').forEach(s=>{ (byDis[s.district]=byDis[s.district]||[]).push(s); });
    const cur=u.sites||[];
    modal((L?'Formations sanitaires — ':'Facilities — ')+u.name, `
      <p class="small muted">${L
        ?'Cochez toutes les formations sanitaires suivies par cette personne. Elles peuvent appartenir à plusieurs districts : les districts sont déduits automatiquement.'
        :'Select every facility this person follows. They may span several districts: the districts are derived automatically.'}</p>
      <label class="f"><span>${L?'Filtrer':'Filter'}</span>
        <input type="text" id="sc-find" placeholder="${L?'nom de la formation ou du district…':'facility or district name…'}"
          oninput="filterScopeSites(this.value)"></label>
      <label class="f"><span>${T('facility')}</span>
        <select id="sc-site" multiple size="14">
          ${Object.keys(byDis).sort().map(d=>`<optgroup label="${esc(d)}">${
            byDis[d].sort((a,b)=>(a.area+a.facility).localeCompare(b.area+b.facility)).map(s=>
              `<option value="${s.id}" data-f="${esc((d+' '+s.area+' '+s.facility).toLowerCase())}" ${
                cur.includes(s.id)?'selected':''}>${esc(s.area)} › ${esc(s.facility)}</option>`).join('')
          }</optgroup>`).join('')}
        </select></label>
      <p class="xs muted">${L
        ?'Sur téléphone : appuyez longuement ou touchez plusieurs lignes pour en sélectionner plusieurs.'
        :'On a phone: press and hold, or tap several rows, to select more than one.'}</p>`,
      `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
       <button class="btn" onclick="saveScope('${uid}')">${T('save')}</button>`);
  } else {
    const dis=[...new Set(DB.d.sites.map(s=>s.district))].sort();
    modal((L?'Districts — ':'Districts — ')+u.name, `
      <p class="small muted">${L?'Sélectionnez les districts couverts. Le changement est journalisé.'
                                :'Select the districts covered. The change is logged.'}</p>
      <label class="f"><span>${T('district')}</span>
        <select id="sc-dis" multiple size="10">${dis.map(d=>
          `<option ${(u.districts||[]).includes(d)?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <label class="f"><span>${L?'Motif / référence (facultatif)':'Reason / reference (optional)'}</span>
        <input type="text" id="sc-why" placeholder="${L?'Note de service n°…':'Service note no…'}"></label>`,
      `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
       <button class="btn" onclick="saveScope('${uid}')">${T('save')}</button>`);
  }
}
function filterScopeSites(q){
  const sel=$('#sc-site'); if(!sel) return;
  const t=(q||'').trim().toLowerCase();
  Array.from(sel.querySelectorAll('option')).forEach(o=>{
    o.hidden = !!t && !(o.dataset.f||'').includes(t);
  });
  Array.from(sel.querySelectorAll('optgroup')).forEach(g=>{
    g.hidden = !Array.from(g.querySelectorAll('option')).some(o=>!o.hidden);
  });
}
let EDIT_HAT='';
function saveScope(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  if(EDIT_HAT==='SITE'){
    const ids=Array.from(($('#sc-site')||{selectedOptions:[]}).selectedOptions).map(o=>o.value);
    if(!ids.length) return toast(LANG==='fr'?'Choisissez au moins une formation sanitaire'
                                            :'Choose at least one facility');
    const before=(u.sites||[]).map(i=>(siteById(i)||{}).facility||i).join(', ');
    u.sites=ids; u.siteId=ids[0];
    /* For a facility-only account the districts are derived from the facilities, as they
       always were. For a DUAL account they are the supervisor's own assignment and must
       never be overwritten by an edit to the facilities. */
    if(!isDual(u)) u.districts=[...new Set(ids.map(i=>(siteById(i)||{}).district).filter(Boolean))];
    audit('USER_SITE','user',`${u.name} : ${before||'—'} → ${ids.map(i=>(siteById(i)||{}).facility||i).join(', ')}`);
  } else {
    const next=Array.from($('#sc-dis').selectedOptions).map(o=>o.value);
    if(!next.length) return toast(LANG==='fr'?'Au moins un district':'At least one district');
    const why=($('#sc-why')||{}).value||'';
    audit('USER_TRANSFER','user',`${u.name} : ${(u.districts||[]).join(', ')} → ${next.join(', ')}${why?' ('+why+')':''}`);
    u.districts=next; if(why) u.transferNote=why;
  }
  DB.save();
  /* ---- A SCOPE CHANGE IS A PRIVILEGED ACT, AND IT TRAVELS LIKE ONE -----------------
     It used to leave as an ordinary pushUser() for a single-hat account. The server
     locks role, districts and sites on any settled account — rightly, so that no phone
     can hand itself the region — so the push was silently ignored and the next pull put
     the old districts straight back. That is the "I change the districts and after
     syncing it returns to the previous value" you reported: the console was being
     refused by a guard meant for phones.

     Both hats now leave as their own privileged message, checked against the caller. */
  const byId=(me()||{}).id;
  if(isDual(u)) queue('roleGrant', {id:u.id, byId, want:EDIT_HAT,
                                    scope: EDIT_HAT==='SITE' ? (u.sites||[]) : (u.districts||[])});
  else if(EDIT_HAT==='SITE') queue('scopeSet', {id:u.id, byId, what:'SITES',
                                    scope:(u.sites||[]), districts:(u.districts||[])});
  else queue('scopeSet', {id:u.id, byId, what:'DISTRICTS', scope:(u.districts||[])});
  closeModal();
  toast(LANG==='fr'?'✓ Affectation enregistrée':'✓ Assignment saved'); render();
}

/* The section used to be a datalist. On Android a datalist shows nothing at all when you
   tap it, so the field looked frozen on whatever section it opened with — every new question
   silently landed in "Coordination et documentation générale". It is a real select now, with
   an explicit way to create a section. */
function eqSectionChanged(v){
  const w=$('#eq-secnew-wrap'); if(!w) return;
  w.classList.toggle('hidden', v!=='__NEW__');
  if(v==='__NEW__') setTimeout(()=>{ const i=$('#eq-secnew'); if(i) i.focus(); }, 60);
}
function eqSection(){
  const sel=($('#eq-sec')||{}).value||'';
  if(sel!=='__NEW__') return sel.trim();
  return (($('#eq-secnew')||{}).value||'').trim();
}
function saveQ(id){
  const g=i=>$('#'+i).value;
  const patch={sec:eqSection(), q:g('eq-q').trim(), type:g('eq-type'), dom:g('eq-dom'),
    num:g('eq-num').trim()||undefined, den:g('eq-den').trim()||undefined,
    defDen:g('eq-dd')?Number(g('eq-dd')):undefined, weight:Number(g('eq-w'))||1,
    fu:g('eq-fu').trim()||undefined, dqa:$('#eq-dqa').checked?1:undefined,
    perMonth:$('#eq-pm').checked?true:undefined};
  if(!patch.sec) return toast(LANG==='fr'?'Choisissez ou nommez une section':'Choose or name a section');
  if(!patch.q) return toast(LANG==='fr'?'Énoncé obligatoire':'Question text required');
  if(patch.perMonth && !/\{\{MOIS\}\}/.test([patch.q,patch.num,patch.den].join(' ')))
    return toast(LANG==='fr'
      ?'Question par mois : écrivez {{MOIS}} dans l\'énoncé ou dans un libellé, sinon les lignes seront identiques'
      :'Per-month question: write {{MOIS}} in the wording or a label, otherwise every line reads the same', 4200);
  if(id){ const q=DB.d.questions.find(x=>x.id===id);
    const scoreRelevant = q.q!==patch.q||q.type!==patch.type||q.den!==patch.den||q.dom!==patch.dom||q.weight!==patch.weight;
    Object.assign(q,patch); if(scoreRelevant) q.version=(q.version||1)+1;
    audit('QUESTION_EDIT','question','Q'+q.n+' v'+q.version);
  } else {
    const n=Math.max(...DB.d.questions.map(x=>x.n))+1;
    /* Put it at the end of ITS OWN section, not at the end of the questionnaire — otherwise
       a question added to IPC appears after the last section and the supervisor never finds
       it where they expect. */
    const same=DB.d.questions.filter(x=>x.sec===patch.sec);
    const after=same.length? Math.max(...same.map(x=>x.order||0)) : Math.max(...DB.d.questions.map(x=>x.order||0));
    DB.d.questions.forEach(x=>{ if((x.order||0)>after) x.order=(x.order||0)+1; });
    DB.d.questions.push(Object.assign({id:'Q'+String(n).padStart(2,'0'),code:'Q'+n,n,active:true,
      order:after+1,version:1},patch));
    audit('QUESTION_ADD','question','Q'+n+' — '+patch.sec);
    toast(LANG==='fr'?'✓ Question ajoutée à « '+patch.sec+' »':'✓ Question added to "'+patch.sec+'"', 3200);
  }
  DB.save(); publishQuestionnaireEdit(); closeModal(); render();
}
function toggleQ(id){
  const q=DB.d.questions.find(x=>x.id===id); if(!q) return;
  const L=LANG==='fr', turningOff = q.active!==false;
  if(!turningOff){ applyToggleQ(id); return; }        // re-activating needs no ceremony
  modal(L?'Désactiver la question '+q.n:'Deactivate question '+q.n, `
    <div class="banner b-warn">${L
      ?'Cette question disparaîtra du questionnaire de <b>tous les superviseurs</b> au prochain chargement.'

      :'Nothing is deleted: supervisions already done keep this question and its score. You can switch it back on at any time.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     <button class="btn dan" onclick="applyToggleQ('${id}')">${L?'Désactiver':'Deactivate'}</button>`);
}
function applyToggleQ(id){
  const q=DB.d.questions.find(x=>x.id===id); if(!q) return;

                     :'Question '+q.n+' deactivated — '+activeQuestions().length+' active questions'), 3400);
  render();
}

function decideSite(id, decision){
  const L=LANG==='fr';
  const r=DB.d.siteReq.find(x=>x.id===id); if(!r) return;
  if(decision==='MOREINFO'){
    return askReason({
      title:L?'Demander un complément — '+r.ref:'Ask for more information — '+r.ref,
      label:L?'Qu\'est-ce qui manque ? (obligatoire)':'What is missing? (mandatory)',
      placeholder:L?'ex. joindre la note de service signée':'e.g. attach the signed service note',
      help:L?'La demande reste ouverte. Le superviseur voit ce message et peut compléter son dossier.'
            :'The request stays open. The supervisor sees this message and can complete their file.',
      bannerTone:'b-info', confirmLabel:L?'Demander le complément':'Ask for it',
      onOk: note=>decideSiteDo(id, decision, note)});
  }
  if(decision!=='APPROVED'){
    return askReason({
      title:L?'Rejeter la demande '+r.ref:'Refuse request '+r.ref,
      label:L?'Motif du rejet (obligatoire)':'Reason for refusal (mandatory)',
      placeholder:L?'ex. formation sanitaire déjà enregistrée sous un autre nom'
                   :'e.g. facility already recorded under another name',
      help:L?'La demande est close. Le superviseur qui l\'a faite verra ce motif.'
            :'The request is closed. The supervisor who made it will see this reason.',
      confirmLabel:L?'Rejeter':'Refuse', danger:true,
      onOk: note=>decideSiteDo(id, decision, note)});
  }
  decideSiteDo(id, decision, '');
}
function decideSiteDo(id, decision, note){
  const r=DB.d.siteReq.find(x=>x.id===id); if(!r) return;
  r.status=decision; r.decidedBy=(me()||{}).name; r.decidedAt=Date.now(); r.decisionNote=note;
  if(decision==='APPROVED'){
    if(r.type==='ADD' && r.siteId){ const s=siteById(r.siteId); s.status='ACTIVE'; }
    else if(r.editId){ const s=siteById(r.editId);
      DB.d.audit.push({id:DB.id('A'),ts:Date.now(),user:(me()||{}).name,action:'SITE_VERSION',
        entity:'site',detail:JSON.stringify({before:r.before,after:r.after})});
      s.district=r.after.district; s.area=r.after.area; s.facility=r.after.facility;
      s.version=(s.version||1)+1;
      if(r.type==='MOVE'&&/ferm/i.test(r.justification||'')) s.status='CLOSED'; }
  } else if(r.type==='ADD' && r.siteId){
    const s=siteById(r.siteId); if(s) s.status='CLOSED';
  }
  DB.save(); audit('SITE_DECISION', decision, r.ref+' '+note); queue('siteReq', r); render();
}

   alone. A dual account has two scopes and they mean different things: the districts are
   what the person supervises, the facilities are what they answer for. Printing only one
   was how the second role stayed invisible. */
function scopeCell(u){
  const L=LANG==='fr';

  const ds=Array.isArray(u.districts)?u.districts:[];

      vals.length?esc(vals.join(', ')):`<span class="kov">${L?'aucune':'none'}</span>`}
      <button class="btn sec sm" style="padding:1px 6px;margin-left:4px"
        onclick="editScope('${u.id}','${hat}')">✎</button></div>`;
  let out='';

  if(hasSiteHat(u)) out += line('🏥', L?'FOSA :':'Facilities:', ss, 'SITE');
  return out || '—';
}

function setRole(uid,r){ const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  if(isSlot(u)) return toast(LANG==='fr'
    ?'Un compte privilégié n\'est pas un rôle que l\'on change ici : c\'est un poste, attribué par code.'
    :'A privileged account is not a role changed here: it is a slot, assigned by code.', 5000);
  const before=u.role; u.role=r; DB.save();
  audit('USER_ROLE','user',u.name+' : '+roleLabel(before)+' → '+roleLabel(r));
  queue('scopeSet', {id:u.id, byId:(me()||{}).id, what:'ROLE', role:r}); render(); }
function setPin(uid,p){ const u=DB.d.users.find(x=>x.id===uid); u.pin=p; DB.save(); }
function toggleUser(uid){ const u=DB.d.users.find(x=>x.id===uid); u.active=u.active===false;
  DB.save(); pushUser(u); render(); }
function renameSuper(){
  const su=DB.d.users.filter(u=>isSlot(u));
  const L=LANG==='fr';
  modal(L?'Super utilisateurs':'Super users',
    `<p class="small muted">${L
      ?'Le nom et le téléphone saisis ici s\'affichent sur tous les téléphones : liste de connexion Administration, écran d\'attente de validation, et « contactez l\'administrateur ». La mise à jour part au serveur dès l\'enregistrement et arrive sur les autres appareils à leur prochaine connexion réseau.'
      :'The name and phone entered here appear on every phone: the Administration sign-in list, the awaiting-approval screen and the "contact the administrator" panels. The update leaves for the server as soon as you save and reaches the other devices at their next network connection.'}</p><hr>`+
    su.map((u,i)=>`<label class="f"><span>${L?'Nom':'Name'} ${i+1}</span>
      <input type="text" id="su-${u.id}" value="${esc(u.name)}"></label>
      <label class="f"><span>${L?'Téléphone':'Phone'}</span><input type="tel" id="sp-${u.id}" value="${esc(u.phone||'')}"></label>`).join('<hr>'),
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     <button class="btn" onclick="saveSuper()">${T('save')}</button>`);
}
function saveSuper(){
  const changed=[];
  DB.d.users.filter(u=>isSlot(u)).forEach(u=>{
    const n=$('#su-'+u.id), p=$('#sp-'+u.id);
    const before=u.name+'|'+(u.phone||'');
    if(n && n.value.trim()) u.name=n.value.trim();
    if(p) u.phone=p.value.trim();
    if(before !== u.name+'|'+(u.phone||'')) changed.push(u);
  });
  DB.save();
  changed.forEach(u=>{ audit('SUPER_RENAME','user',u.name); pushUser(u); });
  closeModal();
  toast(changed.length
    ? (LANG==='fr'?'✓ Enregistré et transmis à tous les appareils':'✓ Saved and sent to every device')
    : T('save'));
  render();
}

/* =====================================================================
   ONE PERSON, TWO HATS — THE CONSOLE SIDE

   A request from a phone arrives in the same place as the enrolments and is
   handled with the same two buttons. A super user can also add a role to
   anybody outright, which is how somebody already stuck is fixed without
   them touching their phone.
   ===================================================================== */
function roleReqBanner(u){
  if(!reqPending(u)) return '';
  const L=LANG==='fr', r=u.req;
  const what = r.role==='SITE'
    ? (r.scope||[]).map(id=>{const s=siteById(id); return s?s.district+' › '+s.facility:id;}).join(', ')
    : (r.scope||[]).join(', ');
  return `<div class="banner b-info" style="margin-top:8px">
    <b>＋ ${L?'Demande de rôle':'Role request'}</b> — ${esc(roleLabelFor(r.role))}<br>
    <span class="xs">${L?'Portée demandée':'Scope asked for'} : <b>${esc(what||'—')}</b>
      ${r.fn?' · '+esc(r.fn):''}${r.at?' · '+fmtDT(r.at):''}</span>
    <div class="row" style="margin-top:8px">
      <button class="btn ok sm" onclick="grantRole('${u.id}')">✓ ${L?'Accorder':'Grant'}</button>
      <button class="btn sec sm" onclick="addRoleModal('${u.id}',true)">✎ ${L?'Modifier la portée':'Change the scope'}</button>
      <button class="btn dan sm" onclick="refuseRole('${u.id}')">✕ ${L?'Refuser':'Refuse'}</button>
    </div></div>`;
}
/* Grant exactly what was asked for. */
function grantRole(uid, scopeOverride, wantOverride){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  const want  = wantOverride || (u.req&&u.req.role) || missingHat(u);
  const scope = scopeOverride || ((u.req&&u.req.scope)||[]);
  if(!want) return toast(L?'Ce compte a déjà les deux rôles':'This account already has both roles');
  if(!scope.length) return toast(want==='SITE'
    ? (L?'Choisissez au moins une formation sanitaire':'Choose at least one facility')
    : (L?'Choisissez au moins un district':'Choose at least one district'));
  u.dual=true;
  if(want==='SITE'){ u.sites=scope.slice(); u.siteId=scope[0]; }
  else u.districts=scope.slice();
  u.req=null; u.updated=Date.now(); DB.save();
  audit('ROLE_GRANT','user', u.name+' → '+roleLabelFor(want)+' ('+scope.join(', ')+')');
  queue('roleGrant', {id:u.id, byId:(me()||{}).id, want, scope});
  closeModal();
  toast(L?'✓ '+u.name+' a maintenant les deux rôles':'✓ '+u.name+' now has both roles', 4000);
  render();
}
function refuseRole(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  askReason({
    title:(L?'Refuser la demande de ':'Refuse the request from ')+u.name,
    label:L?'Motif du refus (obligatoire)':'Reason for refusal (mandatory)',
    help:L?'Le motif s\'affiche sur le téléphone de la personne. Dites-lui quoi faire ensuite.'
          :'The reason is shown on the person\'s phone. Tell them what to do next.',
    confirmLabel:L?'Refuser':'Refuse', danger:true,
    onOk: why=>{
      u.req={role:(u.req&&u.req.role)||'', scope:[], fn:'', at:Date.now(),
             status:'REFUSED', note:why, by:(me()||{}).name||''};
      DB.save(); audit('ROLE_REFUSE','user', u.name+' — '+why);
      queue('roleGrant', {id:u.id, byId:(me()||{}).id, refuse:true, note:why});
      toast(L?'Demande refusée':'Request refused'); render();
    }});
}
/* Add a role to somebody outright, or correct the scope of a request before granting. */
let ADDR_SITES=[];
function addRoleModal(uid, fromReq){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  const want = fromReq && u.req && u.req.role ? u.req.role : missingHat(u);
  if(!want) return toast(L?'Ce compte a déjà les deux rôles':'This account already has both roles');
  ADDR_SITES = (fromReq && u.req && want==='SITE') ? (u.req.scope||[]).slice() : [];
  const head=`<div class="banner b-warn">${L
    ?'Un seul compte, deux espaces. <b>'+esc(u.name)+'</b> gardera son code PIN et toutes ses supervisions.'
    :'One account, two spaces. <b>'+esc(u.name)+'</b> keeps their PIN and all their supervisions.'}</div>`;

  if(want==='SUPERVISOR'){
    const dis=[...new Set(DB.d.sites.map(s=>s.district))].sort();
    const pre=(fromReq && u.req) ? (u.req.scope||[]) : [];
    modal((L?'Ajouter le rôle superviseur — ':'Add the supervisor role — ')+u.name, head+`
      <label class="f"><span>${L?'Districts couverts':'Districts covered'}</span>
        <select id="ar-dis" multiple size="10">${dis.map(d=>
          `<option ${pre.includes(d)?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <p class="xs muted">${L
        ?'La personne ne pourra pas superviser la formation sanitaire dont elle est point focal — l\'application le lui dira clairement.'
        :'They will not be able to supervise the facility they are focal person for — the app tells them so plainly.'}</p>`,
      `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
       <button class="btn ok" onclick="doAddRole('${u.id}','SUPERVISOR')">${L?'Accorder':'Grant'}</button>`);
    return;
  }
  const byDis={};
  DB.d.sites.filter(s=>s.status!=='CLOSED').forEach(s=>{ (byDis[s.district]=byDis[s.district]||[]).push(s); });
  modal((L?'Ajouter le rôle personnel du site — ':'Add the facility staff role — ')+u.name, head+`
    <label class="f"><span>${L?'Filtrer':'Filter'}</span>
      <input type="text" id="ar-find" placeholder="${L?'nom de la formation ou du district…':'facility or district name…'}"
        oninput="filterAddSites(this.value)"></label>

/* ===================== SYNC (Google Sheets via Apps Script) ===================== */
function queue(kind, payload){
  DB.d.outbox.push({id:DB.id('OB'), kind, payload, ts:Date.now(), tries:0});
  DB.save();
  if(ONLINE) setTimeout(()=>syncNow(true), 400);
}
async function syncNow(quiet){
  const api=DB.d.config.api;
  if(!api){ if(!quiet) toast(LANG==='fr'?'Aucune URL d\'API configurée (Console → Paramètres)':'No API URL configured (Console → Settings)'); return; }
  if(!ONLINE){ if(!quiet) toast(T('offline')); return; }
  if(syncNow._busy) return; syncNow._busy=true;
  const box=DB.d.outbox.slice();
  let ok=0, fail=0, badToken=false, busy=false;
  for(const item of box){
    try{
      const res=await fetch(api,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({token:apiToken(), kind:item.kind, id:item.id, payload:item.payload})});
      const j=await res.json();
      if(j && j.ok){ DB.d.outbox=DB.d.outbox.filter(x=>x.id!==item.id); ok++; }
      /* The workbook is busy with somebody else's write. Nothing is wrong, nothing is
         lost: this stays in the outbox and goes on the next pass. */
      else if(j && j.busy){ busy=true; item.tries++; break; }
      /* "bad token" is the server refusing this device outright. Counting it as an
         ordinary failure produced "Synchronisé : 0" — which looks like success with
         nothing to send, and hid a total communication breakdown. */
      else if(j && /bad token/i.test(String(j.error||''))){ badToken=true; fail++; break; }
      else { item.tries++; fail++; }
    }catch(e){ item.tries++; fail++; break; }
  }
  DB.d.config.lastSync=Date.now(); DB.save(); syncNow._busy=false;
  DB.d.messages.forEach(m=>{ if(m.pending && !DB.d.outbox.some(o=>o.kind==='message'&&o.payload.id===m.id)) m.pending=false; });
  DB.save();
  if(badToken){ render(); return tokenRefused(); }
  if(busy && !quiet) toast(LANG==='fr'
    ?'Le serveur est occupé — vos données restent en attente et repartiront seules.'
    :'The server is busy — your data stays queued and will go by itself.', 4500);
  if(!quiet||ok) toast((LANG==='fr'?'Synchronisé : ':'Synced: ')+ok+(fail?(LANG==='fr'?' · échecs '+fail:' · failed '+fail):''));
  render();
}
async function pullRemote(){
  const api=DB.d.config.api; if(!api||!ONLINE) return;
  try{
    const res=await fetch(api+'?action=pull&token='+encodeURIComponent(apiToken()));
    const j=await res.json();
    if(j && j.ok){
      /* The conversations FIRST. A message whose thread this phone does not have is
         filtered out of every list and read by nobody — which is exactly what happened
         to the first message a supervisor sent from the field. */
      if(Array.isArray(j.threads)){
        j.threads.forEach(rt=>{
          const i=DB.d.threads.findIndex(x=>x.id===rt.id);
          if(i<0) DB.d.threads.push(rt);
          else DB.d.threads[i]=Object.assign({}, DB.d.threads[i], rt);
        });
      }
      if(j.messages){
        const known=new Set(DB.d.messages.map(m=>m.id));
        j.messages.forEach(m=>{ if(!known.has(m.id)) DB.d.messages.push(m); });
      }
      DB.save();
    }
  }catch(e){}
}

/* =====================================================================
   THE RETURN JOURNEY
   Pushing was only half a sync. Until this existed, a supervision
   submitted on a supervisor's phone stayed on that phone: the console
   had nothing to approve and the facility never saw its report.
   full=true also brings the questionnaire, the cycles and the site
   registry, so a question added at the centre reaches every phone.
   ===================================================================== */
/* full : also bring the questionnaire, the cycles and the site registry.
   deep : ignore the watermark and re-read the whole history — the repair button. */
async function pullData(full, deep){
  const api=DB.d.config.api;
  if(!api || !ONLINE) return {changed:0};
  const since = deep ? 0 : (DB.d.config.lastData || 0);
  let j;
  try{
    const res = await fetch(api+'?action=data&token='+encodeURIComponent(apiToken())
      +'&since='+since+(full?'&full=1':''));
    j = await res.json();
  }catch(e){ return {changed:0, error:String(e)}; }
  if(j && j.ok===false && /bad token/i.test(String(j.error||''))) return {changed:0, badToken:true};
  if(!j || !j.ok) return {changed:0, error:(j&&j.error)||'?'};
  /* An old Code.gs does not know the word "data": it falls through to its generic reply,
     which still says ok:true. The app then found no supervisions and cheerfully reported
     "Déjà à jour" — a silent instruction that had not delivered. It says so now. */
  if(!Array.isArray(j.visits)) return {changed:0, stale:true, serverVersion:j.version||''};
  DB.d.config.serverVersion = j.version || '';
  /* The half that reaches a phone whose service worker is too old to ask.
     Data pulls always got through — that is how the v4.0.0 phone stayed
     in touch while never learning that it was three versions behind. */
  if(j.appExpected) DB.d.config.appExpected = String(j.appExpected);
  if(typeof applyReset==='function') applyReset(j);

  const meNow = me() || {};
  let changed = 0;

  /* Applied FIRST: a supervision arriving for an account this phone has just had merged
     away must land on the surviving id, not create an orphan. */
  if(typeof applyMerges==='function') changed += applyMerges(j.merges);

  /* Applied BEFORE the visits arrive: a supervision the supervisor set aside after a
     double submission is gone from the server, so nothing would ever tell this phone
     about it again. Without this it would sit here for ever, in this phone's scores and
     nowhere else — the two would never agree. */
  changed += applyVisitArchive(j.varchive);

  /* The Journal is the region's, not this console's. */
  if(Array.isArray(j.audit) && j.audit.length){
    const known=new Set(DB.d.audit.map(x=>x.id));
    j.audit.forEach(x=>{ if(x && x.id && !known.has(x.id)){ DB.d.audit.push(x); changed++; } });
    if(DB.d.audit.length>3000) DB.d.audit=DB.d.audit.sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-3000);
  }

  /* A supervision still open on THIS phone is the one being typed into right now.
     The server's copy of it is older by definition, so it never overwrites it. */
  const penLost=[];
  (j.visits||[]).forEach(rv=>{
    if(!rv || !rv.id) return;
    const i = DB.d.visits.findIndex(x=>x.id===rv.id);
    if(i < 0){ DB.d.visits.push(rv); changed++; return; }
    const mine = DB.d.visits[i];
    /* ---- A HANDOVER HAS TO REACH THE PHONE THAT IS GIVING THE PEN UP ---------------
       The rule below — never overwrite the draft being typed into on this phone — is
       right, and it is also exactly what would have stopped a transfer from landing:
       the phone still believes the supervision is its own, so it would refuse the very
       message telling it that it is not. A change of HOLDER is therefore always taken,
       whatever this phone thinks. The work itself is safe: the outbox is emptied before
       the pull runs, so anything typed here has already gone up. */
    const handedOver = String(rv.uid||'') && String(rv.uid) !== String(mine.uid||'');
    const editingHere = mine.status==='DRAFT' && mine.uid===meNow.id;
    if(editingHere && !handedOver) return;
    if(handedOver && mine.uid===meNow.id){
      penLost.push({v:rv, site:(siteById(rv.siteId)||{}).facility||rv.siteId});
    }
    if(handedOver || (rv.updated||0) >= (mine.updated||0)){
      DB.d.visits[i] = Object.assign({}, mine, rv); changed++; }
  });
  /* Losing half your buttons in silence is what people report as "the app is broken". */
  if(penLost.length && typeof infoModal==='function'){
    const L=LANG==='fr'; const x=penLost[0];
    setTimeout(()=>infoModal(
      L?'Droits d\'édition transférés':'Editing rights transferred',
      (L?`La supervision de « ${x.site} » ne vous appartient plus : les droits d'édition ont été transférés à ${penHolderName(x.v)||'un autre superviseur'}.\n\nVous la voyez toujours, en lecture seule. Tout ce que vous aviez saisi et synchronisé s'y trouve.`
        :`The supervision of "${x.site}" is no longer yours: the editing rights were transferred to ${penHolderName(x.v)||'another supervisor'}.\n\nYou can still see it, read only. Everything you had entered and synced is there.`)), 600);
  }

  Object.keys(j.answers||{}).forEach(vid=>{
    const v = DB.d.visits.find(x=>x.id===vid);
    if(v && v.status==='DRAFT' && v.uid===meNow.id) return;    // never clobber live typing
    DB.d.answers[vid] = repairLegacyAnswers(j.answers[vid], v);
  });

  (j.swot||[]).forEach(s=>{
    const v = DB.d.visits.find(x=>x.id===s.visitId); if(!v) return;
    if(v.status==='DRAFT' && v.uid===meNow.id) return;
    v.swot = {f:s.f, w:s.w, o:s.o, t:s.t};
  });

  /* A recommendation is written by the facility and read by everyone else.
     Last update wins — there is one field per side and they do not collide. */
  (j.actions||[]).forEach(ra=>{
    const i = DB.d.actions.findIndex(x=>x.id===ra.id);
    if(i < 0){ DB.d.actions.push(ra); changed++; }
    else if((ra.updated||0) > (DB.d.actions[i].updated||0)){ DB.d.actions[i] = ra; changed++; }
  });

  (j.siteReq||[]).forEach(r=>{
    const i = DB.d.siteReq.findIndex(x=>x.id===r.id);
    if(i < 0) DB.d.siteReq.push(r); else DB.d.siteReq[i] = Object.assign({}, DB.d.siteReq[i], r);
  });

  /* ---- THE CENTRE OWNS THE QUESTIONNAIRE — BUT ONLY ONCE IT HAS THIS VERSION ------
     This line replaced the whole questionnaire with whatever the workbook held. The
     workbook held the OLD one, because nothing had ever carried the corrected set to
     it. So every phone rebuilt its questionnaire at start-up and had it overwritten
     twenty-five seconds later, which is why the DQA block kept reading July on three
     different lines: the per-month flag was on the phone's copy and not on the
     workbook's.

     The rule now: the workbook wins only when it is serving a questionnaire at least
     as new as the one built into this app. Until it is, this phone publishes its own
     (see publishQuestionnaire) and ignores what comes back. */
  if(j.questions && j.questions.length){
    const theirs = String(j.qversion||'');
    const mine   = String(QCORR_VERSION||'');
    if(theirs && theirs >= mine){
      const order = {}; DB.d.questions.forEach((q,i)=>order[q.id]=q.order||i+1);
      DB.d.questions = j.questions.map((q,i)=>Object.assign({order: order[q.id] || (i+1)}, q));
      DB.d.config.qserver = theirs;
    } else {
      DB.d.config.qserver = theirs;   // remembered, so the console can say what is there
    }
  }
  if(j.cycles && j.cycles.length){
    j.cycles.forEach(rc=>{
      const i = DB.d.cycles.findIndex(x=>x.id===rc.id);
      if(i < 0) DB.d.cycles.push(rc); else DB.d.cycles[i] = Object.assign({}, DB.d.cycles[i], rc);
    });
    if(j.cycles.some(c=>c.status==='OPEN'))
      DB.d.cycles.forEach(c=>{ if(!j.cycles.some(x=>x.id===c.id && x.status==='OPEN')) c.status='CLOSED'; });
  }
  if(j.sites && j.sites.length){
    j.sites.forEach(rs=>{
      const i = DB.d.sites.findIndex(x=>x.id===rs.id);
      if(i < 0) DB.d.sites.push(rs); else DB.d.sites[i] = Object.assign({}, DB.d.sites[i], rs);
    });
  }

  DB.d.config.lastData = j.now || Date.now();
  DB.save();
  /* Every connection verifies the version. Asked for by name in the field. */
  try{ if(typeof updateAsk==='function') updateAsk(); }catch(e){}
  return {changed};
}
/* A supervision submitted BEFORE v2.9.0 was stored only in the readable columns, which
   flatten a yes/no to 1/0 in the numerator. Read back as-is it would show as unanswered.
   Where the question is a yes/no we can put it back exactly; a delay in days or a
   checklist was never written at all in that format and cannot be recovered — those
   stay unanswered rather than being guessed. */
function repairLegacyAnswers(answers, v){
  if(!answers || !v) return answers || {};
  const qs = {}; visitQs(v).forEach(q=>qs[q.id]=q);
  Object.keys(answers).forEach(qid=>{
    const a = answers[qid], q = qs[qid];
    if(!a || !q || a.na) return;
    if(q.type==='BINARY' && a.v===undefined && a.num!==undefined && a.num!==''){
      const n = Number(a.num);
      if(n===1 || n===0){ a.v = (n===1); if(q.fu && n===1) a.fu = true; a._recovered=true; }
    }
  });
  return answers;
}

/* Manual button — says plainly what came back. */
/* Let go of supervisions the server has archived. Everything attached to one goes with
   it — answers, recommendations, the SWOT — because a recommendation whose supervision
   no longer exists is an orphan the facility can never close. */
function applyVisitArchive(list){
  if(!Array.isArray(list) || !list.length) return 0;
  let n=0;
  list.forEach(x=>{
    const id = x && x.id; if(!id) return;
    if(!DB.d.visits.some(v=>v.id===id)) return;
    DB.d.visits  = DB.d.visits.filter(v=>v.id!==id);
    DB.d.actions = DB.d.actions.filter(a=>a.visitId!==id);
    delete DB.d.answers[id];
    n++;
  });
  if(n) DB.save();
  return n;
}

/* The single most misleading state the app could be in: the server rejects every
   message, and the app reports "Synchronisé : 0" as if there had been nothing to send. */
/* =====================================================================
   THE SERVER IS REFUSING THIS DEVICE — WHICH SIDE IS WRONG?

   The old version of this message told the person what to type and left
   them to work out where the mismatch was. That is not good enough when
   the app is otherwise working and sites are waiting: the person is told
   something is broken and given homework.

   So it now finds out first, with two probes that write nothing:

     · GET  ?action=ping        — does the address accept this password?
     · POST kind:'__probe__'    — the token is checked BEFORE the kind, so
                                  "unknown kind" means the password passed
                                  and "bad token" means it did not.

   It then tries the password built into the app. If that one works, the
   phone simply has a stale value saved in Settings, and a single button
   fixes it here and now.
   ===================================================================== */
async function probeToken(tok){
  const api = DB.d.config.api;
  const out = {get:'?', post:'?'};
  try{
    const r = await fetch(api+'?action=ping&token='+encodeURIComponent(tok));
    const j = await r.json();
    out.get = (j && j.ok) ? 'ok' : (/bad token/i.test(String((j&&j.error)||'')) ? 'refused' : 'other');
    out.version = (j && j.version) || '';
  }catch(e){ out.get = 'unreachable'; }
  try{
    const r = await fetch(api,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:tok, kind:'__probe__', id:'PROBE', payload:{}})});
    /* Read it as TEXT first. A write that is queued behind a long one, or a script that
       threw, comes back as an HTML page — and calling .json() on that throws, which the
       old code reported as "unreachable", i.e. as if the address had not answered at
       all. It had answered; it had said something we could not read. */
    const txt = await r.text();
    let j=null; try{ j = JSON.parse(txt); }catch(e){}
    if(!j) out.post = /^\s*</.test(txt) ? 'html' : 'other';
    else if(j.busy) out.post = 'busy';
    /* the token is checked before the kind: "unknown kind" is a PASS */
    else out.post = /bad token/i.test(String(j.error||'')) ? 'refused'
             : (/unknown kind/i.test(String(j.error||'')) || j.ok) ? 'ok' : 'other';
  }catch(e){ out.post = 'unreachable'; }
  return out;
}
function useDefaultToken(){
  DB.d.config.token = '';
