/* The numerator / denominator pair, shared by a plain ratio, a sample and the part of a
   gate question that opens after « Oui ». A denominator carried from another question is
   shown, not asked for: it is already answered, and a second box invites a second answer. */
function ndBlock(v,q,a,dis){
  const nl=q.num||T('numerator'), dl=q.den||T('denominator');
  const L=LANG==='fr';
  const carried = !!q.denFrom;
  const dv = a.den ?? (q.defDen??'');
  return `<div class="nd">
    <label><span>${esc(nl)}</span><input type="number" min="0" value="${a.num??''}" ${dis}
      oninput="liveA('${v.id}','${q.id}',{num:this.value})" onblur="guardND('${v.id}','${q.id}','num',this)"></label>
    <label><span>${esc(dl)}</span><input type="number" min="0" value="${dv}" ${carried?'disabled':dis}
      ${carried?'':`oninput="liveA('${v.id}','${q.id}',{den:this.value})" onblur="guardND('${v.id}','${q.id}','den',this)"`}></label></div>
    ${carried?`<p class="xs muted" style="margin:4px 0 0">${L
      ?`Repris automatiquement de la question ${(qById(q.denFrom,v)||{}).n||q.denFrom} — saisissez-le là-bas s'il est à corriger.`
      :`Carried from question ${(qById(q.denFrom,v)||{}).n||q.denFrom} — change it there if it is wrong.`}</p>`:''}
    ${(q.defDen && !q.sampleGroup)?`<p class="xs muted" style="margin:4px 0 0">${L
      ?`Échantillon prescrit : ${q.defDen} dossiers. Toute modification exige un motif.`
      :`Prescribed sample: ${q.defDen} records. Any change requires a reason.`}</p>`:''}`;
}

function qBox(v,q,a,locked,c){
  a=a||{};
  const A=DB.d.answers[v.id]||{};
  const r=scoreAnswer(q,a,A);
  const txt=q.q, L=LANG==='fr';
  const dis=locked?'disabled':'';
  const naBtn=`<button class="btn sec sm ${a.na?'sel-x':''}" ${dis} style="margin-top:6px" onclick="markNA('${v.id}','${q.id}')">${T('na')}</button>`;
  let body='';

  /* ---- a broken checklist stops here, loudly ------------------------------------- */
  if(r.broken){
    body=`<div class="banner b-err" style="margin-top:8px">${L
      ?'<b>Question incomplète.</b> Elle attend une liste de vérification et sa liste est vide : elle ne peut pas être notée et elle ne compte dans aucun score. Signalez-la à la coordination régionale.'
      :'<b>Incomplete question.</b> It expects a checklist and its list is empty: it cannot be scored and it counts towards nothing. Report it to the regional coordination.'}</div>`;
  }
  else if(q.type==='BINARY'){
    body=`<div class="yn">
      <button class="${a.v===true?'sel-y':''}" ${dis} onclick="setA('${v.id}','${q.id}',{v:true})">${T('yes')}</button>
      <button class="${a.v===false?'sel-n':''}" ${dis} onclick="setA('${v.id}','${q.id}',{v:false,fu:null})">${T('no')}</button>
      <button class="${a.na?'sel-x':''}" ${dis} onclick="markNA('${v.id}','${q.id}')">${T('na')}</button></div>`;
    /* A "yes, and then…" question opens its own panel. The answer is summarised here,
       so nothing that decides the score is hidden behind a button. */
    if(q.fu && a.v===true){
      const done = a.fu===true||a.fu===false;
      body+=`<div class="subq">
        <div class="small"><b>↳</b> ${esc(q.fu)}</div>
        <button class="btn ${done?'sec':''} sm" ${dis} onclick="fuModal('${v.id}','${q.id}')">${
          done ? (L?'Modifier la réponse':'Change the answer') : (L?'Répondre':'Answer')}</button>
        <span class="small ${a.fu===true?'okv':'kov'}" style="margin-left:8px">${
          done ? (a.fu ? '✔ '+T('yes') : '✘ '+T('no')) : (L?'— en attente':'— pending')}</span>
      </div>`;
    }
  }
  else if(q.type==='THRESHOLD'){
    body=`<label class="f" style="margin:8px 0 0"><span>${L?'Délai observé (jours)':'Observed delay (days)'}</span>
      <input type="number" min="0" value="${a.days??''}" ${dis}
        oninput="liveA('${v.id}','${q.id}',{days:this.value})"></label>`+naBtn;
  }
  else if(q.type==='COMPOSITE'){
    const items=q.items||[], ticks=a.items||[];
    const nb=ticks.filter(Boolean).length;
    const started=ticks.length===items.length && !ticks.some(x=>x===undefined||x===null);
    body=`<div class="chkline">
      <button class="btn ${started?'sec':''} sm" ${dis} onclick="itemsModal('${v.id}','${q.id}')">
        ☑ ${L?`Vérifier les ${items.length} éléments`:`Check the ${items.length} items`}</button>
      <span class="small" style="margin-left:8px">${started
        ? `<b>${nb}/${items.length}</b> ${L?'présent(s)':'present'}`
        : (L?'— aucun élément vérifié':'— nothing checked yet')}</span></div>
      ${started && nb<items.length ? `<p class="xs kov" style="margin:4px 0 0">${L
        ?'Manquant : ':'Missing: '}${esc(items.filter((_,i)=>!ticks[i]).join(' · '))}</p>`:''}`+naBtn;
  }
  else if(q.gate){
    /* Oui/Non first. « Non » closes the question — the figures are never asked for. */
    body=`<div class="yn">
      <button class="${a.v===true?'sel-y':''}" ${dis} onclick="setA('${v.id}','${q.id}',{v:true})">${T('yes')}</button>
      <button class="${a.v===false?'sel-n':''}" ${dis} onclick="setA('${v.id}','${q.id}',{v:false})">${T('no')}</button>
      <button class="${a.na?'sel-x':''}" ${dis} onclick="markNA('${v.id}','${q.id}')">${T('na')}</button></div>`;
    if(a.v===true) body+=`<div class="subq">${ndBlock(v,q,a,dis)}</div>`;
    else if(a.v===false) body+=`<p class="xs muted" style="margin:6px 0 0">${L
      ?'Réponse « Non » : il n\'y a rien à dénombrer. La question vaut 0.'
      :'Answered "No": there is nothing to count. The question scores 0.'}</p>`;
  }
  else {
    body=ndBlock(v,q,a,dis);
    if(q.sampleGroup) body += sampleLine(v,q,dis);
    body += naBtn;
  }

  const chip = q.dqa ? `<span class="chip n">${q.dom==='MNE'?'DQA':(L?'Concordance':'Concordance')}</span>` : '';
  return `<div class="qbox ${qFill(r)}" id="qb-${q.id}">
    <div class="qhead">
      <span class="qnum">${q.n}</span>
      <div class="qtxt">${esc(txt)} ${chip}${
        q.monthLabel?` <span class="chip a">${esc(q.monthLabel)}</span>`:''}
        ${q.sub?`<div class="xs muted" style="margin-top:3px;font-weight:400">${esc(q.sub)}</div>`:''}</div>
      <button class="iBtn" title="${L?'Aide : que vérifier, où le vérifier':'Help: what to check and where'}"
        onclick="qHelp('${q.id}','${v.id}')">?</button>
    </div>
    ${body}
    <div class="qres ${qResCls(r)}" id="qr-${q.id}">${qResHTML(q,r,v.id)}</div>
    <div id="qc-${q.id}">${qCommentHTML(q,a,r,v.id,dis)}</div>
  </div>`;
}
function qFill(r){ return (r.answered&&!r.na)?('fill-'+r.band):''; }
function qResHTML(q,r,vid){
  let label, cls, dot;
  if(!r.answered){ label=(LANG==='fr'?'Non répondu':'Not answered'); cls='rn'; dot='#C6CFDA'; }
  else if(r.na){ label=T('na')+' — '+(LANG==='fr'?'exclu du calcul':'excluded from the calculation'); cls='rn'; dot='#8C97A5'; }
  else {
    cls = r.band==='g'?'rg':r.band==='a'?'ra':'rr';
    dot = r.band==='g'?'#1E7A3C':r.band==='a'?'#E0A100':'#B3261E';
    label = r.dqa
      ? (LANG==='fr'?'Écart ':'Gap ')+(r.dqa.diff>0?'+':'')+r.dqa.diff+' ('+r.dqa.pct.toFixed(1)+' %) · '
        +bandLabel(r.band)+' · '+r.dqa.points+' pt'
      : pc(r.pct)+' · '+bandLabel(r.band);
  }
  return `<span class="lbl small"><i class="dotv" style="background:${dot}"></i>${label}</span>
    <button class="iBtn" title="${LANG==='fr'?'Voir le détail du calcul de ce score':'See how this score was calculated'}"
      onclick="qExplain('${q.id}','${vid}')">i</button>`;
}
function qResCls(r){
  if(!r.answered||r.na) return 'rn';
  return r.band==='g'?'rg':r.band==='a'?'ra':'rr';
}
function qCommentHTML(q,a,r,vid,dis){
  const isNA = r.na;                       // covers both manual N/A and automatic (denominator = 0)
  const need = r.answered && (isNA || r.band==='r');
  if(!need && !a.comment && !a.naReason) return '';
  const key = a.na ? 'naReason' : 'comment';
  const val = a.na ? (a.naReason||'') : (a.comment||'');
  const label = isNA ? T('reason')+' (N/A) *' : T('comment')+(need?' *':'');
  return `<label class="f" style="margin-top:8px"><span>${label}</span>
    <textarea ${dis} style="min-height:52px" oninput="quietA('${vid}','${q.id}','${key}',this.value)"
    >${esc(val)}</textarea></label>`;
}

/* --- targeted updates: never rebuild a box the user is typing in --- */
/* =====================================================================
   "THE QUESTIONNAIRE HAS BEEN CORRECTED"

   A supervisor who left a facility on Friday with everything answered must
   not open the app on Monday, find four questions blank, and have to work
   out for themselves what happened. The supervision says, on its own face,
   what was moved, what was kept and what has to be answered again — and
   sends them straight to it.
   ===================================================================== */
function correctedBanner(v){
  const c = v && v.corrected; if(!c) return '';
  const L=LANG==='fr';
  const nq = (c.cleared||[]).length;
  return `<div class="card tight">
    <div class="banner b-warn">
      <b>${L?'Questionnaire corrigé':'The questionnaire has been corrected'}</b><br>
      ${L?'Des corrections validées par la coordination régionale sont arrivées sur ce téléphone.'
         :'Corrections approved by the regional coordination have reached this phone.'}
      <ul style="margin:8px 0 0;padding-left:18px">
        ${c.moved?`<li>${L?`<b>${c.moved}</b> réponse(s) déplacée(s) vers le bon mois — <b>rien à refaire</b>.`
                          :`<b>${c.moved}</b> answer(s) moved to the right month — <b>nothing to redo</b>.`}</li>`:''}
        ${c.phantom?`<li>${L?`<b>${c.phantom}</b> question(s) du chapitre CPI se répondaient toutes seules : ce n'était pas une réponse, c'était une anomalie. Elles sont à remplir.`
                             :`<b>${c.phantom}</b> IPC question(s) were answering themselves: that was never an answer, it was a fault. They are to be filled in.`}</li>`:''}
        ${nq?`<li>${L?`<b>${nq}</b> question(s) ont changé de forme : leur ancienne réponse ne voudrait plus dire la même chose, elle a donc été effacée.`
                     :`<b>${nq}</b> question(s) changed shape: the old answer would no longer mean the same thing, so it was cleared.`}</li>`:''}
      </ul>
      ${nq?`<div class="xs" style="margin-top:8px">${L?'À revoir :':'To review:'} ${
        esc((c.cleared||[]).map(id=>{ const q=(DB.d.questions||[]).find(x=>x.id===id); return 'Q'+((q&&q.n)||id); }).join(' · '))}</div>`:''}
      <div class="row" style="margin-top:10px">
        ${nq?`<button class="btn sm" onclick="gotoCorrected('${v.id}')">${
          L?'Rouvrir et compléter':'Reopen and complete'}</button>`:''}
        <button class="btn sec sm" onclick="dismissCorrected('${v.id}')">${L?'J\'ai lu':'Understood'}</button>
      </div>
    </div></div>`;
}
function gotoCorrected(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const first=((v.corrected||{}).cleared||[])[0];
  const q=(DB.d.questions||[]).find(x=>x.id===first);
  if(q) jumpTo(vid, q.sec); else go('#/visit/'+vid+'/q');
}
function dismissCorrected(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  v.corrected=null; DB.save(); render();
}

/* =====================================================================
   THE PEN — HANDING A SUPERVISION OVER

   Two routes, and both need the network, because a transfer that only one
   phone knows about is not a transfer.

     · the holder hands it over — they are going on leave, or handing the
       facility to a colleague already on site;
     · a colleague asks for it — and a super user or an administrator grants
       it. This is the route that works when the holder is unreachable,
       which is the case that matters.

   What a transfer CANNOT do is invent work that never left the phone. It
   moves what was last synced. That limit is stated on the screen rather
   than discovered in a facility with a supervisor waiting.
   ===================================================================== */
function penBanner(v){
  const u=me(); if(!u || !v) return '';
  const L=LANG==='fr';
  /* ---- THE CONSOLE READS, IT DOES NOT WRITE ----------------------------------------
     A super user's job is to approve, return and reopen — never to fill a supervision
     in on the supervisor's behalf. That has always been enforced, but on a console
     account the screen simply arrived with every field disabled and no explanation,
     which reads as a broken page rather than a rule. It says so now. */
  if(isSlot(u)) return `<div class="card tight">
    <div class="banner b-info"><b>${L?'Lecture seule — console':'Read only — console'}</b><br>
      ${L?'Droits d\'édition : ':'Editing rights: '}<b>${esc(penHolderName(v)||'—')}</b>
      <div class="xs" style="margin-top:6px">${L
        ?'Vous validez les supervisions, vous ne les remplissez pas. Vous conservez l\'approbation, le retour, la réouverture et le transfert des droits d\'édition.'
        :'You approve supervisions, you do not fill them in. You keep approval, return, reopening and the transfer of editing rights.'}</div></div>
    ${v.status==='DRAFT' && v.penReq && v.penReq.status==='PENDING'
      ? `<div class="banner b-warn" style="margin-top:8px">${L
          ?`<b>${esc(v.penReq.byName||'Un superviseur')}</b> demande les droits d'édition${v.penReq.why?' : '+esc(v.penReq.why):''}.`
          :`<b>${esc(v.penReq.byName||'A supervisor')}</b> is asking for the editing rights${v.penReq.why?': '+esc(v.penReq.why):''}.`}
          <div class="row" style="margin-top:6px">
            <button class="btn sm" ${ONLINE?'':'disabled'} onclick="penGrant('${v.id}')">⇄ ${L?'Accorder':'Grant'}</button>
            <button class="btn sec sm" onclick="penRefuse('${v.id}')">${L?'Refuser':'Refuse'}</button>
          </div></div>`
      : (v.status==='DRAFT' ? `<button class="btn sec sm" style="margin-top:8px" ${ONLINE?'':'disabled'}
          onclick="penHandModal('${v.id}')">⇄ ${L?'Transférer les droits d\'édition':'Transfer the editing rights'}</button>`:'')}
  </div>`;
  if(holdsPen(v)){
    if(v.status!=='DRAFT') return '';
    const req=(v.penReq && v.penReq.status==='PENDING') ? v.penReq : null;
    return `<div class="card tight">
      <div class="spread"><div><b>${L?'Vous tenez la plume':'You hold the pen'}</b>
        <div class="xs muted">${L?'Vous êtes seul à pouvoir remplir cette supervision.'
                                 :'You are the only person who can fill this supervision in.'}</div></div>
        <button class="btn sec sm" onclick="penHandModal('${v.id}')">⇄ ${L?'Transférer':'Transfer'}</button></div>
      ${req?`<div class="banner b-warn" style="margin-top:8px">${L
        ?`<b>${esc(req.byName||'Un superviseur')}</b> demande les droits d'édition${req.why?' : '+esc(req.why):''}.`
        :`<b>${esc(req.byName||'A supervisor')}</b> is asking for the editing rights${req.why?': '+esc(req.why):''}.`}
        <div class="row" style="margin-top:6px">
          <button class="btn sm" onclick="penHand('${v.id}','${esc(req.byId)}','${L?'demande acceptée':'request accepted'}')">${
            L?'Accepter et transférer':'Accept and transfer'}</button>
        </div></div>`:''}
    </div>`;
  }
  const who=penHolderName(v)||(L?'un autre superviseur':'another supervisor');
  const req=(v.penReq && v.penReq.status==='PENDING' && v.penReq.byId===u.id) ? v.penReq : null;
  return `<div class="card tight">
    <div class="banner b-warn"><b>${L?'Lecture seule':'Read only'}</b><br>
      ${L?`Droits d'édition : <b>${esc(who)}</b>`:`Editing rights: <b>${esc(who)}</b>`}
      ${v.updated?` · ${L?'dernière synchronisation':'last synced'} ${fmtDT(v.updated)}`:''}
      <div class="xs" style="margin-top:6px">${L
        ?'Vous pouvez consulter cette supervision et son rapport. Vous ne pouvez pas la modifier : une seule personne écrit sur une formation sanitaire, sinon deux saisies se remplacent l\'une l\'autre.'
        :'You can read this supervision and its report. You cannot change it: one person writes on a facility, otherwise two sets of entries overwrite each other.'}</div></div>
    ${v.status==='DRAFT'?(req
      ? `<div class="banner b-info" style="margin-top:8px">${L
          ?`Demande envoyée le ${fmtDT(req.at)}. ${esc(who)} ou la coordination régionale peut l'accorder.`
          :`Request sent on ${fmtDT(req.at)}. ${esc(who)} or the regional coordination can grant it.`}</div>`
      : `<p class="xs muted" style="margin-top:8px">${L
          ?'<b>Ce qu\'il faut faire :</b> si cette personne est empêchée, demandez les droits d\'édition. Elle peut les accorder elle-même, et la coordination régionale peut les accorder à sa place.'
          :'<b>What to do:</b> if that person is unavailable, ask for the editing rights. They can grant them, and the regional coordination can grant them in their place.'}</p>
         <button class="btn sec blk sm" style="margin-top:6px" ${ONLINE?'':'disabled'}
           onclick="penAskModal('${v.id}')">✋ ${L?'Demander les droits d\'édition':'Ask for the editing rights'}</button>
         ${ONLINE?'':`<p class="xs muted" style="margin-top:4px">${L?'Hors ligne — la demande part dès que le réseau revient.':'Offline — the request leaves as soon as the network is back.'}</p>`}`)
      :''}
  </div>`;
}
function penCandidates(v){
  const s=siteById(v.siteId)||{};
  const own=new Set();   /* nobody supervises their own facility, transfer included */
  DB.d.users.forEach(u=>{ if(hasSiteHat(u)) (u.sites||[]).forEach(id=>{ if(id===v.siteId) own.add(u.id); }); });
  return DB.d.users.filter(u=>
    !isSlot(u) && u.active!==false && normStatus(u.status)===U_ACTIVE &&
    hasSupHat(u) && u.id!==v.uid && !own.has(u.id) &&
    (Array.isArray(u.districts) ? u.districts.includes(s.district) : true));
  /* A console account is never a candidate: it does not conduct supervisions. */
}
function penHandModal(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const L=LANG==='fr'; const cands=penCandidates(v);
  const s=siteById(v.siteId)||{};
  modal(L?'Transférer les droits d\'édition':'Transfer the editing rights',
    `<p class="small">${esc(s.facility||'')} — ${esc(s.district||'')}</p>
     <div class="banner b-warn">${L
       ?'Le transfert emporte ce qui a été <b>synchronisé</b>. Tout ce que vous avez saisi hors réseau et pas encore envoyé reste sur ce téléphone. Synchronisez avant de transférer.'
       :'A transfer carries what has been <b>synced</b>. Anything entered offline and not yet sent stays on this phone. Sync before you transfer.'}</div>
     ${cands.length? `<label class="f"><span>${L?'Transférer à':'Transfer to'}</span>
       <select id="pn-to">${cands.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}${u.fn?' — '+esc(u.fn):''}</option>`).join('')}</select></label>
       <label class="f"><span>${L?'Motif (obligatoire)':'Reason (mandatory)'}</span>
         <input id="pn-why" placeholder="${L?'ex. congé maladie, je quitte le district':'e.g. sick leave, leaving the district'}"></label>`
      : `<div class="banner b-err">${L
       ?'Aucun autre superviseur actif n\'est affecté à ce district. La coordination régionale doit d\'abord affecter quelqu\'un.'
       :'No other active supervisor is assigned to this district. The regional coordination has to assign somebody first.'}</div>`}`,
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     ${cands.length?`<button class="btn" ${ONLINE?'':'disabled'} onclick="penHandGo('${vid}')">⇄ ${L?'Transférer':'Transfer'}</button>`:''}`);
}
function penHandGo(vid){
  const to=($('#pn-to')||{}).value||'';
  const why=(($('#pn-why')||{}).value||'').trim();
  const L=LANG==='fr';
  if(!to) return;
  if(why.length<4) return toast(L?'Le motif est obligatoire':'The reason is mandatory');
  penHand(vid, to, why);
}
function penHand(vid, toId, why){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const L=LANG==='fr';
  if(!ONLINE) return toast(L?'Un transfert exige le réseau.':'A transfer needs the network.', 4000);
  if(v.status!=='DRAFT') return toast(L
    ?'Une supervision soumise n\'a plus de plume à passer — rouvrez-la d\'abord.'
    :'A submitted supervision has no pen to hand over — reopen it first.', 5000);
  const to=DB.d.users.find(u=>u.id===toId); if(!to) return;
  /* push whatever is still here BEFORE the pen moves, so nothing is stranded */
  if(typeof autoPushDrafts==='function'){ v.updated=Date.now(); v.pushed=0; autoPushDrafts(); }
  queue('penSet', {visitId:vid, toId, toName:to.name, byId:(me()||{}).id, why:why||''});
  v.uid=toId; v.supervisor=to.name; v.penReq=null; v.updated=Date.now();
  DB.save(); audit('PEN_TRANSFER','visit', `${(siteById(v.siteId)||{}).facility||v.siteId} → ${to.name} (${why||'—'})`);
  closeModal();
  infoModal(L?'Droits transférés':'Rights transferred',
    L?`Cette supervision appartient maintenant à ${to.name}. Elle reste visible sur votre téléphone, en lecture seule.`
     :`This supervision now belongs to ${to.name}. It stays visible on your phone, read only.`);
  render();
}
function penAskModal(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const L=LANG==='fr'; const who=penHolderName(v)||(L?'le superviseur':'the supervisor');
  modal(L?'Demander les droits d\'édition':'Ask for the editing rights',
    `<div class="banner b-info">${L
      ?`${esc(who)} peut accorder les droits directement. Si cette personne est injoignable, la coordination régionale les accorde à sa place — la demande leur parvient dans les deux cas.`
      :`${esc(who)} can grant the rights directly. If they cannot be reached, the regional coordination grants them instead — the request reaches both.`}</div>
     <label class="f"><span>${L?'Motif (obligatoire)':'Reason (mandatory)'}</span>
       <input id="pa-why" placeholder="${L?'ex. le superviseur est malade, je suis sur place demain':'e.g. the supervisor is ill, I am on site tomorrow'}"></label>`,
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     <button class="btn" onclick="penAskGo('${vid}')">${L?'Envoyer la demande':'Send the request'}</button>`);
}
function penAskGo(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const L=LANG==='fr'; const u=me();
  const why=(($('#pa-why')||{}).value||'').trim();
  if(why.length<4) return toast(L?'Le motif est obligatoire':'The reason is mandatory');
  v.penReq={byId:u.id, byName:u.name, why, at:Date.now(), status:'PENDING'};
  v.updated=Date.now(); DB.save();
  queue('penReq', {visitId:vid, byId:u.id, byName:u.name, why});
  audit('PEN_REQUEST','visit', `${(siteById(v.siteId)||{}).facility||v.siteId} — ${why}`);
  closeModal();
  toast(L?'✓ Demande envoyée. Elle part dès que le réseau le permet.'
        :'✓ Request sent. It leaves as soon as the network allows.', 5000);
  render();
}

/* ---- THE SYSTEMATIC SAMPLE ---------------------------------------------------------
   Ten records, drawn once, answering three questions. The supervisor gives the active
   file, the app gives back the interval and the exact positions to open in the ART
   register. Drawn once and stored on the supervision, so the three questions are read
   on the SAME ten patients — which is the only way the three answers can be compared. */
function sampleOf(v, group){ return ((v.samples||{})[group])||null; }
function sampleLine(v,q,dis){
  const s=sampleOf(v,q.sampleGroup); const L=LANG==='fr';
  if(!s) return `<div class="chkline" style="margin-top:6px">
    <button class="btn sm" ${dis} onclick="sampleModal('${v.id}','${q.sampleGroup}')">🎯 ${
      L?'Tirer l\'échantillon':'Draw the sample'}</button>
    <span class="small kov" style="margin-left:8px">${L?'— échantillon non tiré':'— not drawn yet'}</span></div>`;
  return `<div class="chkline" style="margin-top:6px">
    <button class="btn sec sm" ${dis} onclick="sampleModal('${v.id}','${q.sampleGroup}')">🎯 ${
      L?'Voir l\'échantillon':'See the sample'}</button>
    <span class="small" style="margin-left:8px">${L?'File active':'Active file'} <b>${s.fileActive}</b> · ${
      L?'1 dossier sur':'every'} <b>${s.step}</b>${L?'':'th record'}</span></div>`;
}
function sampleModal(vid,group){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const s=sampleOf(v,group); const L=LANG==='fr';
  const locked = visitLocked(v);
  modal(L?'Échantillon systématique de 10 dossiers':'Systematic sample of 10 records',
   `<div class="banner b-info">${L
     ?'Un seul tirage sert aux trois questions (poids, taille, tension artérielle) : les trois réponses portent donc sur les <b>mêmes</b> dix patients, ce qui est la seule façon de les comparer.'
     :'One draw serves all three questions (weight, height, blood pressure), so the three answers describe the <b>same</b> ten patients — the only way they can be compared.'}</div>
    <label class="f"><span>${L?'File active au registre TARV':'Active file in the ART register'}</span>
      <input type="number" min="1" id="sm-fa" value="${s?s.fileActive:''}" ${locked?'disabled':''}></label>
    ${locked?'':`<button class="btn blk" style="margin-top:8px" onclick="drawSample('${vid}','${group}')">${
      s?(L?'Retirer l\'échantillon':'Draw again'):(L?'Tirer':'Draw')}</button>`}
    <div id="sm-out">${sampleOut(v,group)}</div>`,
   `<button class="btn sec" onclick="closeModal()">${L?'Fermer':'Close'}</button>`);
}
function sampleOut(v,group){
  const s=sampleOf(v,group); const L=LANG==='fr';
  if(!s) return `<p class="small muted" style="margin-top:10px">${L
    ?'Saisissez la file active, puis appuyez sur « Tirer ». L\'application calcule le pas et vous donne les positions exactes à ouvrir dans le registre.'
    :'Enter the active file, then tap "Draw". The app works out the interval and gives you the exact positions to open in the register.'}</p>`;
  return `<div class="banner b-ok" style="margin-top:10px">
      ${L?`File active <b>${s.fileActive}</b> ÷ 10 = pas de <b>${s.step}</b> (arrondi au supérieur). Départ au <b>premier</b> dossier actif.`
         :`Active file <b>${s.fileActive}</b> ÷ 10 = interval of <b>${s.step}</b> (rounded up). Start at the <b>first</b> active record.`}</div>
    <p class="small" style="margin-top:8px"><b>${L?'Positions à ouvrir dans le registre TARV :':'Positions to open in the ART register:'}</b></p>
    <p class="small">${s.positions.join(' · ')}</p>
    <div class="banner b-warn" style="margin-top:8px">${L
      ?'<b>Un enfant dans l\'échantillon.</b> Le poids et la taille se mesurent chez l\'enfant : ce dossier reste évalué pour les questions 55 et 56. La tension artérielle ne s\'y mesure pas : pour la question 57 <b>uniquement</b>, remplacez-le par le dossier actif suivant et notez-le dans le commentaire de la question.'
      :'<b>A child in the sample.</b> Weight and height are measured in children, so that record still counts for questions 55 and 56. Blood pressure is not: for question 57 <b>only</b>, replace it with the next active record and note it in that question\'s comment.'}</div>`;
}
function drawSample(vid,group){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  if(!mayAnswer(vid)) return;
  const L=LANG==='fr';
  const fa=Number(($('#sm-fa')||{}).value||0);
  if(!fa || fa<1) return toast(L?'Saisissez la file active':'Enter the active file');
  if(fa<10) return toast(L
    ?'File active inférieure à 10 : examinez tous les dossiers, l\'échantillon n\'a pas de sens.'
    :'Active file under 10: review every record — a sample makes no sense.', 6000);
  const step=Math.ceil(fa/10);
  const positions=[]; for(let i=0;i<10;i++){ const p=1+i*step; if(p<=fa) positions.push(p); }
  v.samples=v.samples||{};
  v.samples[group]={fileActive:fa, step, positions, drawnAt:Date.now(), by:(me()||{}).name||''};
  DB.save(); audit('SAMPLE_DRAWN','visit', `${group} — file active ${fa}, pas ${step}`);
  const out=$('#sm-out'); if(out) out.innerHTML=sampleOut(v,group);
  render();
}

                 :`The numerator (${a.num}) cannot exceed the denominator (${a.den}).\n\nThis is the most common data-quality error on the paper version of this tool. Check the source and re-enter.`);

/* full=true rebuilds the whole box (safe after a click); false updates score line only */
function refreshQ(vid,qid,full){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;

/* score strip + section pills, without touching the form */
function refreshHeader(vid){

  });

  if(cur){ const s=cur.getAttribute('data-sec');

/* ---- WHO MAY TYPE, AND INTO WHAT --------------------------------------------------
   A submitted supervision is closed. But when the questionnaire is corrected AFTER a
   supervision was submitted, the questions that changed have to be answerable again —
   and only those. Sending the whole supervision back to draft would throw away its
   approval and let everything else be rewritten, which is not what anybody asked for.
   So the lock is lifted question by question, for the holder, on the corrected ones. */
function isCorrectedQ(v,q){
  const c=v&&v.corrected; if(!c||!q) return false;
  return (c.cleared||[]).includes(q.baseId||q.id);
}
function mayEditQ(v,q){
  if(!v) return false;
  if(!visitLocked(v)) return true;
  return holdsPen(v) && canSupervise() && v.status!=='APPROVED' && isCorrectedQ(v,q);
}
/* The console reads a supervision; it never types into one. */
function mayAnswer(vid, qid){
  const v=DB.d.visits.find(x=>x.id===vid);
  if(!canSupervise()){
    toast(LANG==='fr'
      ?'Lecture seule : vous validez cette supervision, vous ne la remplissez pas.'
      :'Read only: you approve this supervision, you do not fill it in.', 4000);
    return false;
  }
  if(v && !holdsPen(v)){
    toast(LANG==='fr'
      ?'Lecture seule : les droits d\'édition sont à '+(penHolderName(v)||'un autre superviseur')+'.'
      :'Read only: the editing rights belong to '+(penHolderName(v)||'another supervisor')+'.', 5000);
    return false;
  }
  if(v && visitLocked(v) && !(qid && mayEditQ(v, qById(qid,v)))){
    toast(LANG==='fr'?'Cette supervision est soumise.':'This supervision has been submitted.', 4000);
    return false;
  }
  return true;
}
function setA(vid,qid,patch){
  if(!mayAnswer(vid,qid)) return;
  const A=DB.d.answers[vid]=DB.d.answers[vid]||{};
  const a=A[qid]=A[qid]||{};
  Object.assign(a,patch);
  if(patch.v!==undefined||patch.days!==undefined) a.na=false;
  /* « Non » on a gate question closes it: the figures behind it are not merely hidden,
     they are cleared, so that a Oui typed by mistake leaves nothing behind. */
  const qq=qById(qid, DB.d.visits.find(x=>x.id===vid));
  if(qq && qq.gate && patch.v===false){ a.num=''; if(!qq.denFrom) a.den=''; }
  const carried = carryDen(vid, qid);
  touch(vid); refreshQ(vid,qid,true); carried.forEach(id=>refreshQ(vid,id,true)); refreshHeader(vid);
}
/* A figure entered once is a figure entered once. Q30 is scored against the samples
   TAKEN, which the supervisor typed a question earlier on Q29; asking for it a second
   time invites two different answers to the same question. Whenever a question that
   feeds another is answered, the figure is carried across and the dependent question
   redraws. Returns the ids that moved, so the caller can repaint them. */
function carryDen(vid, qid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return [];
  const A=DB.d.answers[vid]||{}; const src=A[qid]; const moved=[];
  visitQs(v).forEach(q=>{
    if(q.denFrom !== qid) return;
    const b = A[q.id] = A[q.id] || {};
    const val = (!src || src.na || src.num===undefined || src.num===null || src.num==='')
              ? '' : String(src.num);
    if(b.den !== val){ b.den = val; moved.push(q.id); }
  });
  return moved;
}
function setItem(vid,qid,i,val,len){
  if(!mayAnswer(vid,qid)) return;
  const A=DB.d.answers[vid]=DB.d.answers[vid]||{}; const a=A[qid]=A[qid]||{};
  a.items=a.items||new Array(len).fill(false); a.items[i]=val; a.na=false;
  touch(vid); refreshQ(vid,qid,false); refreshHeader(vid);
}
function markNA(vid,qid){
  if(!mayAnswer(vid,qid)) return;
  const A=DB.d.answers[vid]=DB.d.answers[vid]||{}; const a=A[qid]=A[qid]||{};
  a.na=!a.na; if(a.na){ a.v=undefined; a.fu=undefined; a.num=''; a.den=''; a.days=''; a.items=undefined; }
  touch(vid); refreshQ(vid,qid,true); refreshHeader(vid);
}
function touch(vid){ const v=DB.d.visits.find(x=>x.id===vid); if(v) v.updated=Date.now(); DB.save();
  if(typeof flashSaved==='function') flashSaved(); }

    COMPOSITE:L?'Tout ou rien : le point n\'est accordé que si TOUS les éléments listés sont cochés. S\'il en manque un seul, la question s\'affiche en jaune pour marquer qu\'il s\'en est fallu de peu — mais elle vaut 0. Dénominateur 1.'
               :'All or nothing: the point is awarded only if EVERY listed item is ticked. One missing shows amber to mark how close it came — but it still scores 0. Denominator 1.',

  if(q.gate) txt += '\n'+(L?'Cette question commence par Oui / Non. « Non » la ferme à 0 sur 1 : il n\'y a rien à dénombrer. « Oui » ouvre les deux chiffres, et c\'est eux qui font le score.'
                          :'This question starts with Yes / No. "No" closes it at 0 out of 1: there is nothing to count. "Yes" opens the two figures, and they are what score.');
  if(q.denFrom) txt += '\n'+(L?'Le dénominateur est repris de la question précédente : il n\'est pas saisi deux fois.'
                              :'The denominator is carried from the previous question: it is not entered twice.');

                                  :'Systematic sample of 10 records, drawn once and shared by questions 55, 56 and 57.');
  if(q.dqa) txt += '\n\n'+(L?'RÈGLE DE CONCORDANCE\nOn compare deux comptages indépendants de la même chose, qui devraient être égaux. Un écart dans un sens comme dans l\'autre est une erreur : un outil qui déclare PLUS que l\'autre est aussi faux qu\'un outil qui déclare moins, et un pourcentage ne saurait pas le dire.\nSi la valeur de référence est supérieure à 100 : un écart de ±5 % est vert. Sinon la concordance doit être exacte. Un écart jusqu\'à ±10 % est jaune (½ point) ; au-delà, rouge.'
                            :'CONCORDANCE RULE\nTwo independent counts of the same thing, which ought to be equal. A gap either way is an error: a tool reporting MORE than the other is as wrong as one reporting less, and a percentage could not say so.\nIf the reference value is above 100, a ±5 % gap is green. Otherwise concordance must be exact. Up to ±10 % is yellow (half a point); beyond that, red.');

function explainOverall(vid){
  const v=DB.d.visits.find(x=>x.id===vid); const sc=visitScores(v); const L=LANG==='fr';
  let t = (L?'SCORE DE SYNTHÈSE DU SITE\n\n':'OVERALL SITE SCORE\n\n');
  t += (L?'Principe : ratio agrégé. On additionne tous les numérateurs et tous les dénominateurs, puis on divise. On ne fait jamais la moyenne des pourcentages.\n\n'
        :'Principle: pooled ratio. All numerators are summed, all denominators are summed, then divided. Percentages are never averaged.\n\n');
  t += `Σ numérateurs = ${sc.overall.n}\nΣ dénominateurs = ${sc.overall.d}\n`;
  t += `Score = ${sc.overall.n} ÷ ${sc.overall.d} = ${pc(sc.overall.pct)} — ${bandLabel(sc.overall.band)}\n\n`;
  t += `${T('clinical')} : ${pc(sc.clinical.pct)}  (${sc.clinical.total} questions)\n`;

        :`Answered: ${sc.overall.answered} / ${sc.overall.total}\nMarked N/A (excluded): ${sc.overall.na}\n\nBands: 100 % green · 90–99.9 % yellow · below 90 % red.`);

/* ===================== SWOT ===================== */
function visitSwot(v, locked){
  const sc=visitScores(v);
  const strong=sc.sections.filter(s=>s.pct===100).map(s=>s.sec);
  const weak=sc.sections.filter(s=>s.pct!==null&&s.pct<90).map(s=>s.sec+' ('+pc(s.pct)+')');
  const f=(k,lbl,hint)=>`<label class="f"><span>${lbl}</span>
    <textarea ${locked?'disabled':''} oninput="setSwot('${v.id}','${k}',this.value)">${esc(v.swot[k]||'')}</textarea>
    ${hint?`<span class="xs muted">${hint}</span>`:''}</label>`;
  return `<div class="card">
    <h3>${T('swot')}</h3>
    ${strong.length||weak.length?`<div class="banner b-info xs">${LANG==='fr'?'Suggestions issues de la supervision':'Suggestions drawn from this visit'} —
      ${strong.length?`<b>${T('forces')} :</b> ${esc(strong.join(' · '))}. `:''}
      ${weak.length?`<b>${T('faiblesses')} :</b> ${esc(weak.join(' · '))}.`:''}</div>`:''}
    <div class="grid g2">
      ${f('f',T('forces'))}
      ${f('o',T('opportunites'))}
      ${f('w',T('faiblesses'))}
      ${f('t',T('menaces'))}
    </div>
    <button class="btn blk" onclick="go('#/visit/${v.id}/plan')">${T('actionPlan')} →</button>
  </div>`;
}
function setSwot(vid,k,val){ const v=DB.d.visits.find(x=>x.id===vid); v.swot[k]=val; touch(vid); }

/* ===================== ACTION PLAN =====================
   Approved structure: root cause (auto-filled from failed questions) ·
   action taken on site · recommendation · responsible · deadline · follow-up status */
function visitActions(vid){ return DB.d.actions.filter(a=>a.visitId===vid); }

function visitPlan(v, locked){
  const sc=visitScores(v);
  const A=DB.d.answers[v.id]||{};
  const existing=visitActions(v.id);
  const covered=new Set(existing.map(a=>a.qid).filter(Boolean));
  // auto root causes = every failed question, grouped by section
  const failed=[];
  sc.sections.forEach(s=> s.failed.forEach(q=> failed.push({sec:s.sec,q:q})) );
  const pending=failed.filter(f=>!covered.has(f.q.id));
  return `
  <div class="card">
    <div class="spread"><h3>${T('actionPlan')}</h3>
      <span class="chip ${pending.length?'a':'g'}">${existing.length} ${LANG==='fr'?'recommandation(s)':'recommendation(s)'}</span></div>
    <p class="small muted">${LANG==='fr'
      ?'Les causes racines sont pré-remplies à partir des sections et questions échouées. Vous pouvez ajouter tout autre problème observé mais non évalué directement.'
      :'Root causes are pre-filled from the sections and questions that failed. You can add any other issue observed but not directly assessed.'}</p>

    ${pending.length?`<div class="banner b-warn">
      <b>${pending.length}</b> ${LANG==='fr'?'question(s) échouée(s) sans recommandation.':'failed question(s) without a recommendation.'}
      <button class="btn sm" style="margin-left:8px" ${locked?'disabled':''} onclick="autoFillPlan('${v.id}')">${LANG==='fr'?'Générer les causes racines':'Generate root causes'}</button>
    </div>`:''}

    <div class="list">${existing.map(a=>planCard(a,locked)).join('')||'<p class="small muted">—</p>'}</div>

    <button class="btn sec blk sm" style="margin-top:10px" ${locked?'disabled':''} onclick="addAction('${v.id}')">
      ＋ ${LANG==='fr'?'Ajouter un autre problème observé (non évalué)':'Add another observed issue (not assessed)'}</button>
    <button class="btn blk" style="margin-top:10px" onclick="go('#/visit/${v.id}/rev')">${T('review')} →</button>
  </div>`;
}
function planCard(a, locked){
  const d=locked?'disabled':'';
  const late = a.deadline && a.deadline<today() && a.status!=='RESOLVED';
  const stCls = a.status==='RESOLVED'?'fill-g':late?'fill-r':'';
  return `<div class="card tight ${stCls}" style="margin:0">
    <div class="spread" style="margin-bottom:6px">
      ${a.qid?`<span class="chip n">Q${esc(a.qn)} · ${esc(a.sec)}</span>`
             :`<span class="chip a">${LANG==='fr'?'Problème observé (non évalué)':'Observed issue (not assessed)'}</span>`}
      <button class="btn sec sm" ${d} onclick="delAction('${a.id}')">✕</button>
    </div>
    <label class="f"><span>${T('rootCause')} *</span>
      <textarea ${d} style="min-height:64px" oninput="quietAct('${a.id}','root',this.value)">${esc(a.root||'')}</textarea></label>
    <label class="f"><span>${T('actionOnsite')}</span>
      <textarea ${d} style="min-height:52px" oninput="quietAct('${a.id}','onsite',this.value)">${esc(a.onsite||'')}</textarea></label>
    <label class="f"><span>${T('reco')} *</span>
      <textarea ${d} style="min-height:52px" oninput="quietAct('${a.id}','reco',this.value)">${esc(a.reco||'')}</textarea></label>
    <div class="grid g2">
      <label class="f"><span>${T('resp')}</span>
        <input type="text" ${d} value="${esc(a.resp||'')}" placeholder="${LANG==='fr'?'Nom / fonction':'Name / function'}"
          oninput="quietAct('${a.id}','resp',this.value)"></label>
      <label class="f"><span>${T('deadline')}</span>
        <input type="date" ${d} value="${esc(a.deadline||'')}" onchange="upA('${a.id}','deadline',this.value)"></label>
    </div>
    <label class="f" style="margin:0"><span>${T('status')}${late?' · '+(LANG==='fr'?'EN RETARD':'OVERDUE'):''}</span>
      <select ${d} onchange="upA('${a.id}','status',this.value)">
        <option value="OPEN" ${a.status==='OPEN'?'selected':''}>${T('unresolved')}</option>
        <option value="ONGOING" ${a.status==='ONGOING'?'selected':''}>${T('ongoing')}</option>
        <option value="RESOLVED" ${a.status==='RESOLVED'?'selected':''}>${T('resolved')}</option>
      </select></label>
  </div>`;
}
function quietAct(id,k,val){ const a=DB.d.actions.find(x=>x.id===id); if(!a)return;
  a[k]=val; a.updated=Date.now(); DB.save(); if(typeof flashSaved==='function') flashSaved(); }
function autoFillPlan(vid){
  const v=DB.d.visits.find(x=>x.id===vid); const sc=visitScores(v);
  const covered=new Set(visitActions(vid).map(a=>a.qid).filter(Boolean));
  const c=DB.d.cycles.find(x=>x.id===v.cycleId);
  let n=0;
  sc.sections.forEach(s=> s.failed.forEach(q=>{
    if(covered.has(q.id)) return;
    const AA=DB.d.answers[vid]||{};
    const ans=AA[q.id]||{};
    const r=scoreAnswer(q,ans,AA);
    DB.d.actions.push({id:DB.id('AC'), visitId:vid, siteId:v.siteId, cycleId:v.cycleId,
      qid:q.id, qn:q.n, sec:s.sec,
      root:`[${s.sec}] Q${q.n}${q.monthLabel?' ('+q.monthLabel+')':''} — ${q.q.slice(0,180)} → ${pc(r.pct)}`,
      onsite:'', reco:'', resp:'', deadline:'', status:'OPEN', created:Date.now()});
    n++;
  }));
  DB.save(); toast(n+(LANG==='fr'?' cause(s) racine générée(s)':' root cause(s) generated')); render();
}
function addAction(vid){
  const v=DB.d.visits.find(x=>x.id===vid);
  DB.d.actions.push({id:DB.id('AC'), visitId:vid, siteId:v.siteId, cycleId:v.cycleId,
    qid:null, qn:null, sec:LANG==='fr'?'Observation libre':'Free observation',
    root:'', onsite:'', reco:'', resp:'', deadline:'', status:'OPEN', created:Date.now()});
  DB.save(); render();
}
function upA(id,k,val){ const a=DB.d.actions.find(x=>x.id===id); if(!a)return;
  a[k]=val; a.updated=Date.now(); if(k==='status'&&val==='RESOLVED') a.resolvedAt=Date.now();
  DB.save(); window._keepScroll=window.scrollY; render(); }
function delAction(id){ DB.d.actions=DB.d.actions.filter(x=>x.id!==id); DB.save(); render(); }

/* ===================== FOLLOW-UP on previous recommendations ===================== */

  const prev=DB.d.actions.filter(a=>a.siteId===v.siteId && a.visitId!==v.id)

      <tbody>${prev.map(a=>{

            <option value="ONGOING" ${a.status==='ONGOING'?'selected':''}>${T('ongoing')}</option>
            <option value="RESOLVED" ${a.status==='RESOLVED'?'selected':''}>${T('resolved')}</option></select></td>
          <td><input type="text" value="${esc(a.siteNote||'')}" placeholder="${LANG==='fr'?'commentaire du site':'site comment'}"

/* ===================== REVIEW & SUBMIT ===================== */
function unanswered(v){
  const A=DB.d.answers[v.id]||{};
  return visitQs(v).filter(q=>!scoreAnswer(q,A[q.id],A).answered)
    .map(q=>({q, txt:q.q}));
}
function missingComments(v){
  const A=DB.d.answers[v.id]||{};
  return visitQs(v).filter(q=>{
    const a=A[q.id]; if(!a) return false;
    const r=scoreAnswer(q,a,A);
    if(r.na) return !String((a.na?a.naReason:a.comment)||'').trim();
    /* A checklist missing one item shows amber and scores zero — it owes a comment
       exactly as a red one does, or a site loses a point with nothing written down. */
    return r.answered && (r.band==='r' || (r.d>0 && r.n===0)) && !(a.comment||'').trim();
  });
}

        onchange="setVisitField('${v.id}','comentors',this.value)"></label>
    ${locked?`<p class="xs muted">${LANG==='fr'?'La supervision est soumise : ces champs sont verrouillés.'

        <td class="sc">${pc(s.pct)}</td></tr>`).join('')}
        <tr style="font-weight:800"><td>${T('synth')}</td><td class="xs">${sc.overall.answered}/${sc.overall.total}</td>
          <td class="xs">${sc.overall.na}</td><td class="sc">${pc(sc.overall.pct)}</td></tr>
      </tbody></table></div>
    <p class="xs muted" style="margin-top:6px">${LANG==='fr'
      ?'« Renseignées » compte aussi les questions marquées N/A. Seules les '+sc.overall.scored+' questions notées entrent dans le score ; les '+sc.overall.na+' N/A en sont exclues.'
      :'"Filled in" includes questions marked N/A. Only the '+sc.overall.scored+' scored questions enter the score; the '+sc.overall.na+' N/A ones are excluded.'}</p>
  </div>

  ${un.length?`<div class="card"><div class="banner b-err">${T('incomplete')} : ${un.length}</div>
    <div class="list">${un.slice(0,40).map(x=>`<div class="item" onclick="jumpTo('${v.id}','${x.q.sec}')">
      <div><b>Q${x.q.n}</b> <span class="s">${esc(x.txt.slice(0,90))}…</span></div><span class="chip r">→</span></div>`).join('')}</div>
    </div>`:''}

  ${mc.length?`<div class="card"><div class="banner b-warn">${LANG==='fr'
    ?'Commentaire obligatoire manquant sur les questions rouges / N/A :':'Mandatory comment missing on red / N/A questions:'} ${mc.length}</div>
    <div class="list">${mc.slice(0,40).map(q=>`<div class="item" onclick="jumpTo('${v.id}','${q.sec}')">
      <div><b>Q${q.n}</b> <span class="s">${esc(q.sec)}</span></div><span class="chip a">→</span></div>`).join('')}</div></div>`:''}

  ${noReco.length?`<div class="card"><div class="banner b-warn">${LANG==='fr'
    ?'Recommandation non renseignée pour :':'Recommendation missing for:'} ${noReco.length}

        :'This facility was submitted more than once for this cycle. Until the supervisor has chosen which one counts, none of these supervisions enters any score, and the console can neither approve nor return.'}
      ${conflictOwner(v)?`<div style="margin-top:8px"><button class="btn dan sm" onclick="resolveConflictModal('${v.id}')">
        ${LANG==='fr'?'Choisir celle qui compte':'Choose the one that counts'}</button></div>`:''}
    </div>`:''}
    ${isSuper()&&v.status==='SUBMITTED'&&!inConflict(v)?`<hr>
      <label class="f"><span>${LANG==='fr'?'Retour au superviseur':'Feedback to the supervisor'}</span>
        <textarea id="rv-note"></textarea></label>
      <div class="row"><button class="btn ok" onclick="approveVisit('${v.id}')">✓ ${
          LANG==='fr'?'Approuver la supervision':'Approve the supervision'}</button>
        <button class="btn dan" onclick="returnVisit('${v.id}')">↩ ${
          LANG==='fr'?'Retourner au superviseur':'Return to the supervisor'}</button></div>`:''}
    ${isSuper()&&v.status==='APPROVED'?`<hr><button class="btn sec sm" onclick="reopenVisit('${v.id}')">

    <hr>

function setVisitField(vid, field, val){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  if(v.status==='SUBMITTED'||v.status==='APPROVED') return;
  const before=v[field]||'';
  v[field]=(val||'').trim(); v.updated=Date.now(); DB.save();
  audit('VISIT_FIELD','visit', field+' : '+(before||'—')+' → '+(v[field]||'—'));
  flashSaved();
}
function jumpTo(vid,sec){
  VSEC=sectionList(cycleOf(DB.d.visits.find(x=>x.id===vid))).indexOf(sec);
  go('#/visit/'+vid+'/q');
}
/* Enrich answers with computed metadata so the spreadsheet is readable on its own */
function answersForSync(vid){
  const v=DB.d.visits.find(x=>x.id===vid)||{};
  const A=DB.d.answers[vid]||{}; const out={};
  visitQs(v).forEach(q=>{
    const a=A[q.id]; if(!a) return;
    const r=scoreAnswer(q,a,A);
    out[q.id]=Object.assign({}, a, {_n:q.n, _sec:q.sec, _month:q.monthLabel||'',
      _dom:q.dom==='MNE'?'S&E (DQA)':'Clinique',
      _pct: r.pct===null?'':Math.round(r.pct*10)/10, _band: bandLabel(r.band)});
  });
  return out;
}
function visitForSync(v){
  const s=siteById(v.siteId)||{};
  return Object.assign({}, v, {_district:s.district, _area:s.area, _facility:s.facility});
}
function submitVisit(vid){
  const v=DB.d.visits.find(x=>x.id===vid);
  if(!v) return;
  if(!canSupervise()) return toast(LANG==='fr'
    ?'Un administrateur ou un super utilisateur ne soumet pas de supervision.'
    :'An administrator or a super user does not submit supervisions.', 4500);
  v.status='SUBMITTED'; v.submitted=Date.now(); v.scores=visitScores(v); v.updated=Date.now();
  DB.save(); audit('VISIT_SUBMIT','visit',siteById(v.siteId).facility);
  const c=DB.d.cycles.find(x=>x.id===v.cycleId);
  if(c) queue('cycle', c);
  queue('visit', {visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)});
  modal(LANG==='fr'?'Supervision soumise':'Visit submitted', `
    <div class="banner b-ok">${LANG==='fr'
      ?'La supervision est verrouillée et transmise à la coordination.'
      :'The visit is locked and sent to the coordination team.'}</div>
    <p class="small">${LANG==='fr'
      ?'Le rapport de restitution est prêt. Ouvrez-le pour le débriefing avec l\'équipe de la formation sanitaire — il fonctionne sans réseau et peut être imprimé ou enregistré en PDF.'
      :'The debriefing report is ready. Open it for the debriefing with the facility team — it works with no network and can be printed or saved as PDF.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${LANG==='fr'?'Plus tard':'Later'}</button>
     <button class="btn" onclick="closeModal();go('#/report/${vid}')">📄 ${LANG==='fr'?'Ouvrir le rapport':'Open the report'}</button>`);
  render();
}
function approveVisit(vid){
  const v=DB.d.visits.find(x=>x.id===vid);
  v.status='APPROVED'; v.reviewNote=($('#rv-note')||{}).value||''; v.reviewedBy=(me()||{}).name;
  v.reviewedAt=Date.now(); DB.save(); audit('VISIT_APPROVE','visit',siteById(v.siteId).facility);
  queue('visit',{visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)}); postSiteMessage(v.siteId, (LANG==='fr'?'Supervision approuvée. ':'Visit approved. ')+(v.reviewNote||''));
  toast(T('approved')); render();
}
function returnVisit(vid){
  const note=($('#rv-note')||{}).value||'';
  if(!note.trim()) return toast(LANG==='fr'?'Un retour écrit est obligatoire':'Written feedback is mandatory');
  const v=DB.d.visits.find(x=>x.id===vid);
  v.status='RETURNED'; v.reviewNote=note; v.reviewedBy=(me()||{}).name; v.reviewedAt=Date.now();
  v.updated=Date.now();
  DB.save(); audit('VISIT_RETURN','visit',note);
  /* Without this the decision stayed on the console: the supervisor was never told, and
     their copy stayed locked as SUBMITTED for ever. approveVisit pushed; this did not. */
  queue('visit',{visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)});
  postSiteMessage(v.siteId, (LANG==='fr'?'Supervision retournée : ':'Visit returned: ')+note);
  toast(T('returned')); render();
}
function reopenVisit(vid){
  const L=LANG==='fr';
  askReason({
    title:L?'Rouvrir cette supervision':'Reopen this supervision',
    label:L?'Motif de réouverture (obligatoire)':'Reason for reopening (mandatory)',
    placeholder:L?'ex. score DQA saisi à l\'envers':'e.g. DQA figures entered the wrong way round',
    help:L?'La supervision repasse en brouillon et redevient modifiable par le superviseur. Le motif est journalisé.'
          :'The supervision goes back to draft and the supervisor can edit it again. The reason is logged.',
    confirmLabel:L?'Rouvrir':'Reopen', danger:true,
    onOk: r=>{
      const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
      v.status='DRAFT'; v.reopened=(v.reopened||[]).concat([{by:(me()||{}).name,at:Date.now(),reason:r}]);
      v.updated=Date.now();
      DB.save(); audit('VISIT_REOPEN','visit',r);
      queue('visit',{visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)});
      toast(L?'Supervision rouverte':'Supervision reopened'); render();
    }});
}
function exportVisit(vid){
  const v=DB.d.visits.find(x=>x.id===vid); const s=siteById(v.siteId); const c=DB.d.cycles.find(x=>x.id===v.cycleId);
  const A=DB.d.answers[vid]||{};
  const rows=[['District','Aire','Formation sanitaire','Cycle','Periode','N','Mois','Section','Question','Domaine','Num','Den','Score %','Bande','Commentaire']];
  visitQs(v).forEach(q=>{ const a=A[q.id]||{}; const r=scoreAnswer(q,a,A);
    rows.push([s.district,s.area,s.facility,c.name,cyclePeriodLabel(c),q.n,q.monthLabel||'',q.sec,q.q,
      q.dom==='MNE'?'S&E (DQA)':'Clinique', a.na?'NA':(a.num??(a.v===true?1:a.v===false?0:'')),
      a.na?'NA':(a.den??(a.v===undefined?'':1)), r.pct===null?'':r.pct.toFixed(1),
      bandLabel(r.band), a.comment||a.naReason||'']); });
  downloadCSV(rows, 'supervision_'+s.facility.replace(/\W+/g,'_')+'_'+c.name.replace(/\W+/g,'')+'.csv');
  toast((LANG==='fr'?'✓ Export CSV créé — cherchez le fichier dans vos téléchargements'
                    :'✓ CSV export created — look in your downloads'), 4500);
}
function downloadCSV(rows, name){
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
}

/* =====================================================================
   DOUBLE SUBMISSION — THE SUPERVISOR CHOOSES, NOT THE CONSOLE

   One supervisor phone per site is the rule. When it is broken — a team
   that split up, a phone reinstalled mid-cycle, a visit begun twice — the
   server flags every submission for that site and cycle. None of them
   counts anywhere until somebody who actually did the work says which one
   is the real supervision. The other is archived, not deleted: it stays in
   the workbook, out of every score, recoverable.

   The console can SEE the conflict. It cannot settle it. That is deliberate
   and it is the one place where the app refuses the coordination team: only
   the people who were in the facility know which visit is the true one.
   ===================================================================== */
function conflictOwner(v){
  const u=me(); if(!u) return false;
  return conflictGroup(v).some(x=>x.uid===u.id);
}
function conflictLine(v){
  const L=LANG==='fr';
  const sc=(v.scores||visitScores(v)).overall;
  const A=DB.d.answers[v.id]||{};
  const answered=Object.keys(A).length;
  return `${esc(v.supervisor||'—')} · ${fmtDate?fmtDate(v.date):v.date}
    · ${answered} ${L?'question(s) renseignée(s)':'question(s) answered'}
    · ${sc.pct===null?'—':sc.pct.toFixed(1)+' %'}
    ${v.submitted?' · '+(L?'soumise le ':'submitted ')+fmtDT(v.submitted):''}`;
}
function resolveConflictModal(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const g=conflictGroup(v); const L=LANG==='fr';
  if(g.length<2) return toast(L?'Ce conflit est déjà réglé':'This conflict is already settled');
  if(!conflictOwner(v)) return toast(L
    ?'Seul un superviseur qui a conduit l\'une de ces supervisions peut trancher.'
    :'Only a supervisor who ran one of these supervisions can settle it.', 5000);
  const s=siteById(v.siteId)||{facility:'?'};
  const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{name:'?'};
  modal(L?'Deux supervisions pour la même formation sanitaire':'Two supervisions for the same facility', `
    <div class="banner b-warn">${L
      ?'<b>'+esc(s.facility)+'</b> a été soumise '+g.length+' fois pour <b>'+esc(c.name)+'</b>. Une seule peut compter.'
      :'<b>'+esc(s.facility)+'</b> was submitted '+g.length+' times for <b>'+esc(c.name)+'</b>. Only one can count.'}</div>
    <p class="small">${L
      ?'Choisissez celle qui est la vraie supervision de cette visite. Les autres sont archivées : elles sortent de tous les scores et de tous les rapports, mais elles restent dans le classeur et peuvent être consultées par la coordination.'
      :'Choose the one that is the real supervision for this visit. The others are archived: they leave every score and every report, but stay in the workbook and can still be consulted by the coordination team.'}</p>
    <div class="list" style="margin-top:10px">${g.map(x=>`
      <div class="item">
        <div style="min-width:0"><b>${esc(x.supervisor||'—')}</b>
          <span class="small muted">${conflictLine(x)}</span></div>
        <button class="btn sm" onclick="doResolveConflict('${x.id}')">${
          L?'C\'est celle-ci':'This is the one'}</button>
      </div>`).join('')}</div>
    <p class="xs muted" style="margin-top:10px">${L
      ?'Ce choix a besoin du réseau : il est enregistré sur le serveur, pour que les deux téléphones et la console voient le même résultat.'
      :'This choice needs a network: it is recorded on the server, so that both phones and the console see the same result.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${L?'Plus tard':'Later'}</button>`);
}
async function doResolveConflict(keepId){
  const L=LANG==='fr';
  const v=DB.d.visits.find(x=>x.id===keepId); if(!v) return;
  if(!ONLINE) return toast(L?'Ce choix a besoin du réseau — réessayez avec du signal.'
                            :'This choice needs a network — try again with signal.', 4500);
  const api=DB.d.config.api;
  if(!api) return toast(L?'Aucune URL d\'API configurée':'No API URL configured');
  const drop=conflictGroup(v).filter(x=>x.id!==keepId);
  toast(L?'Enregistrement…':'Recording…', 1500);
  let j=null;
  try{
    const r=await fetch(api,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:apiToken(), kind:'resolve', id:'RC-'+Date.now(),
        payload:{keepId, byId:(me()||{}).id}})});
    j=await r.json();
  }catch(e){}
  if(!j || !j.ok) return toast((L?'Échec : ':'Failed: ')+((j&&j.error)||'—'), 5000);
  /* the server has archived the others: let go of them here too, and clear the flag */
  drop.forEach(x=>{
    DB.d.visits = DB.d.visits.filter(y=>y.id!==x.id);
    delete DB.d.answers[x.id];
    DB.d.actions = DB.d.actions.filter(a=>a.visitId!==x.id);
  });
  v.conflict=[]; DB.save();
  audit('CONFLICT_RESOLVED','visit', (siteById(v.siteId)||{}).facility+' — '+keepId+
        ' ' + (L?'conservée, ':'kept, ') + drop.length + (L?' archivée(s)':' archived'));
  closeModal();
  toast(L?'✓ Supervision retenue — les autres sont archivées'
        :'✓ Supervision kept — the others are archived', 4500);
  render();
}
/* The banner the supervisor cannot miss. It sits on the home screen, because a
   conflict left alone silently removes a facility from the region's figures. */
function conflictBanner(){
  const groups=myConflicts(); if(!groups.length) return '';
  const L=LANG==='fr';
  return groups.map(g=>{
    const v=g[0], s=siteById(v.siteId)||{facility:'?'};
    const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{name:'?'};
    return `<div class="banner b-err">
      <b>${L?'Double soumission à régler':'Double submission to settle'}</b><br>
      ${L?'<b>'+esc(s.facility)+'</b> a été soumise '+g.length+' fois pour '+esc(c.name)+
          '. Tant que vous n\'avez pas choisi celle qui compte, cette formation sanitaire ne figure dans aucun score.'
        :'<b>'+esc(s.facility)+'</b> was submitted '+g.length+' times for '+esc(c.name)+
          '. Until you choose which one counts, this facility appears in no score.'}
      <div style="margin-top:8px"><button class="btn dan sm" onclick="resolveConflictModal('${v.id}')">
        ${L?'Choisir celle qui compte':'Choose the one that counts'}</button></div>
    </div>`;
  }).join('');
}

/* =====================================================================
   SUPERVISION REPORT — produced the moment a visit is submitted.
   Built entirely from data already on the device: no network, no server.
   Works in a facility with no signal, and prints to PDF from the browser.
   ===================================================================== */

function reportReady(v){ return v && (v.status==='SUBMITTED' || v.status==='APPROVED'); }

/* every answered question, worst first */
function rankedQuestions(v){
  const A=DB.d.answers[v.id]||{};
  return visitQs(v).map(q=>{
    const a=A[q.id]||{}; const r=scoreAnswer(q,a,A);
    return {q, a, r, txt:q.q};
  }).filter(x=>x.r.answered);
}
function failingQuestions(v){
  return rankedQuestions(v).filter(x=>!x.r.na && x.r.band!=='g')
    .sort((x,y)=>{
      const bx=x.r.band==='r'?0:1, by=y.r.band==='r'?0:1;
      if(bx!==by) return bx-by;
      return (x.r.pct??0)-(y.r.pct??0);
    });
}
function rankedSections(v){
  const sc=visitScores(v);
  return sc.sections.filter(s=>s.answered>0)
    .sort((a,b)=>(a.pct===null?101:a.pct)-(b.pct===null?101:b.pct));
}

/* On a phone the print dialog is the operating system's, and it can take a second to

/* =====================================================================
   SITE FOCAL POINT
   Facility staff. Sees only their own facility: its scores, its reports,
   and the recommendations they are responsible for closing.
   Cannot start, edit or submit a supervision.
   Entirely offline once their device has synced at least once.
   ===================================================================== */

/* "Am I looking at the facility space right now?" — not "is my role SITE".
   A dual account is in the facility space only while that space is open. */
function isSite(){ const u=me(); return !!u && spaceOf(u)==='site'; }
function mySiteIds(){
  const u=me(); if(!u) return [];
  return Array.isArray(u.sites) ? u.sites : (u.siteId ? [u.siteId] : []);
}
function mySiteVisits(){
  const ids=mySiteIds();
  return DB.d.visits.filter(v=>ids.includes(v.siteId) && reportReady(v))
    .sort((a,b)=>(b.submitted||0)-(a.submitted||0));
}

function viewSiteHome(){
  const L=LANG==='fr', u=me();
  const ids=mySiteIds();
  const sites=ids.map(siteById).filter(Boolean);
  const visits=mySiteVisits();
  const last=visits[0];
  const acts=DB.d.actions.filter(a=>ids.includes(a.siteId));
  const open=acts.filter(a=>a.status!=='RESOLVED');
  const late=open.filter(a=>a.deadline && a.deadline<today());
  const done=acts.length-open.length;
  const pct=acts.length? (done/acts.length*100) : null;

  if(!sites.length) return `<div class="card">
    <div class="banner b-warn">${L
      ?'Aucune formation sanitaire ne vous est encore rattachée. Le niveau central doit vous en attribuer au moins une.'
      :'No facility is assigned to you yet. Central level must assign at least one.'}</div></div>`;

  const multi = sites.length>1;
  const disList = [...new Set(sites.map(s=>s.district))];

  return `
  <div class="card" style="background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0">
    <div class="spread">
      <div style="min-width:0">
        <h2 style="color:#fff;margin:0">${multi
          ? esc(sites.length+(L?' formations sanitaires':' facilities'))
          : esc(sites[0].facility)}</h2>
        <span class="small" style="opacity:.88">${multi
          ? esc(disList.join(' · '))
          : esc(sites[0].district)+' › '+esc(sites[0].area)}</span></div>
      <span class="chip" style="background:rgba(255,255,255,.2);color:#fff;border-color:transparent">
        ${L?'Point focal':'Focal point'}</span>
    </div>
    ${last?`<div class="small" style="opacity:.92;margin-top:7px">
      ${L?'Dernière supervision':'Last supervision'} : <b>${esc(last.date||'')}</b> · ${pc((last.scores||visitScores(last)).overall.pct)}</div>`:''}
  </div>

  ${typeof roleRequestCard==='function' ? roleRequestCard() : ''}

  ${multi?`<div class="card">
    <h3>${L?'Mes formations sanitaires':'My facilities'}</h3>
    <p class="small muted">${L
      ?'Les chiffres ci-dessous couvrent l\'ensemble de vos formations sanitaires. Le détail de chacune est dans son rapport.'
      :'The figures below cover all your facilities together. Each one\'s detail is in its own report.'}</p>
    <div class="list">${sites.map(st=>{
      const vs=DB.d.visits.filter(v=>v.siteId===st.id && reportReady(v))
                          .sort((a,b)=>(b.submitted||0)-(a.submitted||0));
      const lv=vs[0], sc=lv?(lv.scores||visitScores(lv)).overall:null;
      const op=DB.d.actions.filter(a=>a.siteId===st.id && a.status!=='RESOLVED').length;
      return `<div class="item" ${lv?`onclick="go('#/report/${lv.id}')"`:'style="cursor:default"'}>
        <div style="min-width:0"><b>${esc(st.facility)}</b>
          <div class="s">${esc(st.district)} › ${esc(st.area)} · ${
            op?(op+(L?' recommandation(s) ouverte(s)':' open recommendation(s)')):(L?'à jour':'up to date')}</div></div>
        ${sc?`<span class="chip ${band(sc.pct)}">${pc(sc.pct)}</span>`
            :`<span class="chip n">${L?'aucun rapport':'no report'}</span>`}</div>`;}).join('')}
    </div>
  </div>`:''}

  ${last&&multi?`<p class="xs muted" style="margin:0 0 6px">${L
    ?'Scores de la dernière supervision — '+esc((siteById(last.siteId)||{}).facility||'')
    :'Scores of the most recent supervision — '+esc((siteById(last.siteId)||{}).facility||'')}</p>`:''}
  ${last?`<div class="grid g3 rings" style="margin-bottom:13px">
    <div class="stat">${ring((last.scores||visitScores(last)).clinical.pct,56,T('clinical'))}</div>
    <div class="stat">${ring((last.scores||visitScores(last)).mne.pct,56,T('mne'))}</div>
    <div class="stat">${ring((last.scores||visitScores(last)).overall.pct,56,T('synth'))}</div>
  </div>`:''}

  <div class="card">
    <div class="spread"><h3>${L?'Mes recommandations':'My recommendations'}</h3>
      <span class="chip ${open.length?(late.length?'r':'a'):'g'}">${open.length} ${L?'ouverte(s)':'open'}</span></div>
    <div class="grid g3 always" style="margin-bottom:11px">
      <div class="stat"><b>${acts.length}</b><span>${L?'TOTAL':'TOTAL'}</span></div>
      <div class="stat ${open.length?'fill-a':'fill-g'}"><b>${open.length}</b><span>${L?'À FAIRE':'TO DO'}</span></div>
      <div class="stat ${late.length?'fill-r':''}"><b>${late.length}</b><span>${L?'EN RETARD':'OVERDUE'}</span></div>
    </div>
    <div class="spread small"><span>${L?'Taux de résolution':'Resolution rate'}</span><b class="sc">${pc(pct)}</b></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:${pct||0}%;background:${
      pct>=90?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)'}"></i></div>

    <p class="small muted">${L
      ?'Mettez à jour chaque recommandation dès qu\'elle est réalisée. Le superviseur et la coordination le voient à la synchronisation suivante.'
      :'Update each recommendation as soon as it is done. The supervisor and coordination see it at the next sync.'}</p>

    <div class="list">${open.length? open.map(a=>siteActionCard(a, multi)).join('')
      : `<div class="banner b-ok">${L?'Aucune recommandation en attente. Bon travail.':'No recommendation outstanding. Good work.'}</div>`}</div>

    ${done? `<hr><h3 class="small">${L?'Déjà résolues':'Already resolved'} (${done})</h3>
      <div class="list">${acts.filter(a=>a.status==='RESOLVED').slice(0,10).map(a=>
        `<div class="item" style="cursor:default"><div style="min-width:0">

  <div class="card">
    <h3>${L?'Rapports de supervision':'Supervision reports'}</h3>
    <p class="small muted">${L
      ?'Un rapport apparaît ici dès que le superviseur a soumis sa supervision et que votre téléphone a du réseau. S\'il manque, appuyez sur « Recevoir » en bas de l\'écran.'
      :'A report appears here as soon as the supervisor has submitted and this phone has a network. If one is missing, press "Receive" at the bottom of the screen.'}</p>
    <div class="list">${visits.length? visits.map(v=>{
      const s2=(v.scores||visitScores(v)).overall;
      return `<div class="item" onclick="go('#/report/${v.id}')">
        <div style="min-width:0"><b>${esc(v.date||'')}</b>
          <div class="s">${esc(v.supervisor||'')} · ${statusChip(v.status)}</div></div>
        <span class="chip ${band(s2.pct)}">${pc(s2.pct)}</span></div>`;}).join('')
      : `<p class="small muted">${L?'Aucun rapport disponible pour le moment.':'No report available yet.'}</p>`}
    </div>
  </div>

  ${syncCard()}`;
}

function siteActionCard(a, showSite){
  const L=LANG==='fr';
  const late=a.deadline && a.deadline<today() && a.status!=='RESOLVED';
  const st=showSite?siteById(a.siteId):null;
  return `<div class="card tight ${late?'fill-r':''}" style="margin:0">
    ${st?`<div class="xs muted" style="margin-bottom:4px">🏥 ${esc(st.facility)}</div>`:''}
    <div class="spread" style="margin-bottom:6px">
      <span class="chip ${a.qid?'n':'a'}">${a.qid?'Q'+esc(a.qn):(L?'Observation':'Observation')} · ${esc(a.sec||'')}</span>
      ${a.deadline?`<span class="chip ${late?'r':'n'}">${L?'échéance':'due'} ${esc(a.deadline)}</span>`:''}
    </div>
    <p class="small" style="margin:0 0 6px"><b>${esc(a.reco||a.root||'')}</b></p>
    ${a.root&&a.reco?`<p class="xs muted" style="margin:0 0 8px">${esc(a.root.slice(0,160))}</p>`:''}
    ${a.resp?`<p class="xs muted" style="margin:0 0 8px">${L?'Responsable':'Responsible'} : ${esc(a.resp)}</p>`:''}
    <div class="grid g2">
      <label class="f" style="margin:0"><span>${T('status')}</span>
        <select onchange="siteSetStatus('${a.id}',this.value)">
          <option value="OPEN" ${a.status==='OPEN'?'selected':''}>${T('unresolved')}</option>
          <option value="ONGOING" ${a.status==='ONGOING'?'selected':''}>${T('ongoing')}</option>
          <option value="RESOLVED" ${a.status==='RESOLVED'?'selected':''}>${T('resolved')}</option>
        </select></label>
      <label class="f" style="margin:0"><span>${L?'Ce que le site a fait':'What the site did'}</span>
        <input type="text" value="${esc(a.siteNote||'')}"
          placeholder="${L?'ex. registre AHD ouvert le 12/09':'e.g. AHD register opened on 12/09'}"
          oninput="quietAct('${a.id}','siteNote',this.value)"></label>
    </div>
  </div>`;
}
function siteSetStatus(id,val){
  const a=DB.d.actions.find(x=>x.id===id); if(!a) return;
  a.status=val; a.updated=Date.now();
  if(val==='RESOLVED'){ a.resolvedAt=Date.now(); a.resolvedBy=(me()||{}).name; }
  DB.save(); audit('ACTION_SITE_UPDATE','action',(a.reco||a.root||'').slice(0,60)+' → '+val);
  queue('visit', {visit:visitForSync(DB.d.visits.find(v=>v.id===a.visitId)||{}), actions:[a]});
  toast(LANG==='fr'?'✓ Mise à jour enregistrée':'✓ Update saved');
  render();
}
