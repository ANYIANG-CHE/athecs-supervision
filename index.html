function setVisitField(vid, field, val){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  if(v.status==='SUBMITTED'||v.status==='APPROVED') return;
  const before=v[field]||'';
  v[field]=(val||'').trim(); v.updated=Date.now(); DB.save();
  audit('VISIT_FIELD','visit', field+' : '+(before||'—')+' → '+(v[field]||'—'));
  flashSaved();
}
function jumpTo(vid,sec){
  VSEC=sectionList(cycleOf(DB.d.visits.find(x=>x.id===vid))).indexOf(sec);
  go('#/visit/'+vid+'/q');
}
/* Enrich answers with computed metadata so the spreadsheet is readable on its own */
function answersForSync(vid){
  const v=DB.d.visits.find(x=>x.id===vid)||{};
  const A=DB.d.answers[vid]||{}; const out={};
  visitQs(v).forEach(q=>{
    const a=A[q.id]; if(!a) return;
    const r=scoreAnswer(q,a);
    out[q.id]=Object.assign({}, a, {_n:q.n, _sec:q.sec, _month:q.monthLabel||'',
      _dom:q.dom==='MNE'?'S&E (DQA)':'Clinique',
      _pct: r.pct===null?'':Math.round(r.pct*10)/10, _band: bandLabel(r.band)});
  });
  return out;
}
function visitForSync(v){
  const s=siteById(v.siteId)||{};
  return Object.assign({}, v, {_district:s.district, _area:s.area, _facility:s.facility});
}
function submitVisit(vid){
  const v=DB.d.visits.find(x=>x.id===vid);
  if(!v) return;
  if(!canSupervise()) return toast(LANG==='fr'
    ?'Un administrateur ou un super utilisateur ne soumet pas de supervision.'
    :'An administrator or a super user does not submit supervisions.', 4500);
  v.status='SUBMITTED'; v.submitted=Date.now(); v.scores=visitScores(v); v.updated=Date.now();
  DB.save(); audit('VISIT_SUBMIT','visit',siteById(v.siteId).facility);
  const c=DB.d.cycles.find(x=>x.id===v.cycleId);
  if(c) queue('cycle', c);
  queue('visit', {visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)});
  modal(LANG==='fr'?'Supervision soumise':'Visit submitted', `
    <div class="banner b-ok">${LANG==='fr'
      ?'La supervision est verrouillée et transmise à la coordination.'
      :'The visit is locked and sent to the coordination team.'}</div>
    <p class="small">${LANG==='fr'
      ?'Le rapport de restitution est prêt. Ouvrez-le pour le débriefing avec l\'équipe de la formation sanitaire — il fonctionne sans réseau et peut être imprimé ou enregistré en PDF.'
      :'The debriefing report is ready. Open it for the debriefing with the facility team — it works with no network and can be printed or saved as PDF.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${LANG==='fr'?'Plus tard':'Later'}</button>
     <button class="btn" onclick="closeModal();go('#/report/${vid}')">📄 ${LANG==='fr'?'Ouvrir le rapport':'Open the report'}</button>`);
  render();
}
function approveVisit(vid){
  const v=DB.d.visits.find(x=>x.id===vid);
  v.status='APPROVED'; v.reviewNote=($('#rv-note')||{}).value||''; v.reviewedBy=(me()||{}).name;
  v.reviewedAt=Date.now(); DB.save(); audit('VISIT_APPROVE','visit',siteById(v.siteId).facility);
  queue('visit',{visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)}); postSiteMessage(v.siteId, (LANG==='fr'?'Supervision approuvée. ':'Visit approved. ')+(v.reviewNote||''));
  toast(T('approved')); render();
}
function returnVisit(vid){
  const note=($('#rv-note')||{}).value||'';
  if(!note.trim()) return toast(LANG==='fr'?'Un retour écrit est obligatoire':'Written feedback is mandatory');
  const v=DB.d.visits.find(x=>x.id===vid);
  v.status='RETURNED'; v.reviewNote=note; v.reviewedBy=(me()||{}).name; v.reviewedAt=Date.now();
  v.updated=Date.now();
  DB.save(); audit('VISIT_RETURN','visit',note);
  /* Without this the decision stayed on the console: the supervisor was never told, and
     their copy stayed locked as SUBMITTED for ever. approveVisit pushed; this did not. */
  queue('visit',{visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)});
  postSiteMessage(v.siteId, (LANG==='fr'?'Supervision retournée : ':'Visit returned: ')+note);
  toast(T('returned')); render();
}
function reopenVisit(vid){
  const L=LANG==='fr';
  askReason({
    title:L?'Rouvrir cette supervision':'Reopen this supervision',
    label:L?'Motif de réouverture (obligatoire)':'Reason for reopening (mandatory)',
    placeholder:L?'ex. score DQA saisi à l\'envers':'e.g. DQA figures entered the wrong way round',
    help:L?'La supervision repasse en brouillon et redevient modifiable par le superviseur. Le motif est journalisé.'
          :'The supervision goes back to draft and the supervisor can edit it again. The reason is logged.',
    confirmLabel:L?'Rouvrir':'Reopen', danger:true,
    onOk: r=>{
      const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
      v.status='DRAFT'; v.reopened=(v.reopened||[]).concat([{by:(me()||{}).name,at:Date.now(),reason:r}]);
      v.updated=Date.now();
      DB.save(); audit('VISIT_REOPEN','visit',r);
      queue('visit',{visit:visitForSync(v), answers:answersForSync(vid), actions:visitActions(vid)});
      toast(L?'Supervision rouverte':'Supervision reopened'); render();
    }});
}
function exportVisit(vid){
  const v=DB.d.visits.find(x=>x.id===vid); const s=siteById(v.siteId); const c=DB.d.cycles.find(x=>x.id===v.cycleId);
  const A=DB.d.answers[vid]||{};
  const rows=[['District','Aire','Formation sanitaire','Cycle','Periode','N','Mois','Section','Question','Domaine','Num','Den','Score %','Bande','Commentaire']];
  visitQs(v).forEach(q=>{ const a=A[q.id]||{}; const r=scoreAnswer(q,a);
    rows.push([s.district,s.area,s.facility,c.name,cyclePeriodLabel(c),q.n,q.monthLabel||'',q.sec,q.q,
      q.dom==='MNE'?'S&E (DQA)':'Clinique', a.na?'NA':(a.num??(a.v===true?1:a.v===false?0:'')),
      a.na?'NA':(a.den??(a.v===undefined?'':1)), r.pct===null?'':r.pct.toFixed(1),
      bandLabel(r.band), a.comment||a.naReason||'']); });
  downloadCSV(rows, 'supervision_'+s.facility.replace(/\W+/g,'_')+'_'+c.name.replace(/\W+/g,'')+'.csv');
  toast((LANG==='fr'?'✓ Export CSV créé — cherchez le fichier dans vos téléchargements'
                    :'✓ CSV export created — look in your downloads'), 4500);
}
function downloadCSV(rows, name){
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
}

/* =====================================================================
   DOUBLE SUBMISSION — THE SUPERVISOR CHOOSES, NOT THE CONSOLE

   One supervisor phone per site is the rule. When it is broken — a team
   that split up, a phone reinstalled mid-cycle, a visit begun twice — the
   server flags every submission for that site and cycle. None of them
   counts anywhere until somebody who actually did the work says which one
   is the real supervision. The other is archived, not deleted: it stays in
   the workbook, out of every score, recoverable.

   The console can SEE the conflict. It cannot settle it. That is deliberate
   and it is the one place where the app refuses the coordination team: only
   the people who were in the facility know which visit is the true one.
   ===================================================================== */
function conflictOwner(v){
  const u=me(); if(!u) return false;
  return conflictGroup(v).some(x=>x.uid===u.id);
}
function conflictLine(v){
  const L=LANG==='fr';
  const sc=(v.scores||visitScores(v)).overall;
  const A=DB.d.answers[v.id]||{};
  const answered=Object.keys(A).length;
  return `${esc(v.supervisor||'—')} · ${fmtDate?fmtDate(v.date):v.date}
    · ${answered} ${L?'question(s) renseignée(s)':'question(s) answered'}
    · ${sc.pct===null?'—':sc.pct.toFixed(1)+' %'}
    ${v.submitted?' · '+(L?'soumise le ':'submitted ')+fmtDT(v.submitted):''}`;
}
function resolveConflictModal(vid){
  const v=DB.d.visits.find(x=>x.id===vid); if(!v) return;
  const g=conflictGroup(v); const L=LANG==='fr';
  if(g.length<2) return toast(L?'Ce conflit est déjà réglé':'This conflict is already settled');
  if(!conflictOwner(v)) return toast(L
    ?'Seul un superviseur qui a conduit l\'une de ces supervisions peut trancher.'
    :'Only a supervisor who ran one of these supervisions can settle it.', 5000);
  const s=siteById(v.siteId)||{facility:'?'};
  const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{name:'?'};
  modal(L?'Deux supervisions pour la même formation sanitaire':'Two supervisions for the same facility', `
    <div class="banner b-warn">${L
      ?'<b>'+esc(s.facility)+'</b> a été soumise '+g.length+' fois pour <b>'+esc(c.name)+'</b>. Une seule peut compter.'
      :'<b>'+esc(s.facility)+'</b> was submitted '+g.length+' times for <b>'+esc(c.name)+'</b>. Only one can count.'}</div>
    <p class="small">${L
      ?'Choisissez celle qui est la vraie supervision de cette visite. Les autres sont archivées : elles sortent de tous les scores et de tous les rapports, mais elles restent dans le classeur et peuvent être consultées par la coordination.'
      :'Choose the one that is the real supervision for this visit. The others are archived: they leave every score and every report, but stay in the workbook and can still be consulted by the coordination team.'}</p>
    <div class="list" style="margin-top:10px">${g.map(x=>`
      <div class="item">
        <div style="min-width:0"><b>${esc(x.supervisor||'—')}</b>
          <span class="small muted">${conflictLine(x)}</span></div>
        <button class="btn sm" onclick="doResolveConflict('${x.id}')">${
          L?'C\'est celle-ci':'This is the one'}</button>
      </div>`).join('')}</div>
    <p class="xs muted" style="margin-top:10px">${L
      ?'Ce choix a besoin du réseau : il est enregistré sur le serveur, pour que les deux téléphones et la console voient le même résultat.'
      :'This choice needs a network: it is recorded on the server, so that both phones and the console see the same result.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${L?'Plus tard':'Later'}</button>`);
}
async function doResolveConflict(keepId){
  const L=LANG==='fr';
  const v=DB.d.visits.find(x=>x.id===keepId); if(!v) return;
  if(!ONLINE) return toast(L?'Ce choix a besoin du réseau — réessayez avec du signal.'
                            :'This choice needs a network — try again with signal.', 4500);
  const api=DB.d.config.api;
  if(!api) return toast(L?'Aucune URL d\'API configurée':'No API URL configured');
  const drop=conflictGroup(v).filter(x=>x.id!==keepId);
  toast(L?'Enregistrement…':'Recording…', 1500);
  let j=null;
  try{
    const r=await fetch(api,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:apiToken(), kind:'resolve', id:'RC-'+Date.now(),
        payload:{keepId, byId:(me()||{}).id}})});
    j=await r.json();
  }catch(e){}
  if(!j || !j.ok) return toast((L?'Échec : ':'Failed: ')+((j&&j.error)||'—'), 5000);
  /* the server has archived the others: let go of them here too, and clear the flag */
  drop.forEach(x=>{
    DB.d.visits = DB.d.visits.filter(y=>y.id!==x.id);
    delete DB.d.answers[x.id];
    DB.d.actions = DB.d.actions.filter(a=>a.visitId!==x.id);
  });
  v.conflict=[]; DB.save();
  audit('CONFLICT_RESOLVED','visit', (siteById(v.siteId)||{}).facility+' — '+keepId+
        ' ' + (L?'conservée, ':'kept, ') + drop.length + (L?' archivée(s)':' archived'));
  closeModal();
  toast(L?'✓ Supervision retenue — les autres sont archivées'
        :'✓ Supervision kept — the others are archived', 4500);
  render();
}
/* The banner the supervisor cannot miss. It sits on the home screen, because a
   conflict left alone silently removes a facility from the region's figures. */
function conflictBanner(){
  const groups=myConflicts(); if(!groups.length) return '';
  const L=LANG==='fr';
  return groups.map(g=>{
    const v=g[0], s=siteById(v.siteId)||{facility:'?'};
    const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{name:'?'};
    return `<div class="banner b-err">
      <b>${L?'Double soumission à régler':'Double submission to settle'}</b><br>
      ${L?'<b>'+esc(s.facility)+'</b> a été soumise '+g.length+' fois pour '+esc(c.name)+
          '. Tant que vous n\'avez pas choisi celle qui compte, cette formation sanitaire ne figure dans aucun score.'
        :'<b>'+esc(s.facility)+'</b> was submitted '+g.length+' times for '+esc(c.name)+
          '. Until you choose which one counts, this facility appears in no score.'}
      <div style="margin-top:8px"><button class="btn dan sm" onclick="resolveConflictModal('${v.id}')">
        ${L?'Choisir celle qui compte':'Choose the one that counts'}</button></div>
    </div>`;
  }).join('');
}

/* =====================================================================
   SUPERVISION REPORT — produced the moment a visit is submitted.
   Built entirely from data already on the device: no network, no server.
   Works in a facility with no signal, and prints to PDF from the browser.
   ===================================================================== */

function reportReady(v){ return v && (v.status==='SUBMITTED' || v.status==='APPROVED'); }

/* every answered question, worst first */
function rankedQuestions(v){
  const A=DB.d.answers[v.id]||{};
  return visitQs(v).map(q=>{
    const a=A[q.id]||{}; const r=scoreAnswer(q,a);
    return {q, a, r, txt:q.q};
  }).filter(x=>x.r.answered);
}
function failingQuestions(v){
  return rankedQuestions(v).filter(x=>!x.r.na && x.r.band!=='g')
    .sort((x,y)=>{
      const bx=x.r.band==='r'?0:1, by=y.r.band==='r'?0:1;
      if(bx!==by) return bx-by;
      return (x.r.pct??0)-(y.r.pct??0);
    });
}
function rankedSections(v){
  const sc=visitScores(v);
  return sc.sections.filter(s=>s.answered>0)
    .sort((a,b)=>(a.pct===null?101:a.pct)-(b.pct===null?101:b.pct));
}

function viewReport(vid){
  const v=DB.d.visits.find(x=>x.id===vid);
  if(!v) return '<div class="banner b-err">Introuvable</div>';
  const L=LANG==='fr';
  if(!reportReady(v)) return `<div class="card">
    <div class="banner b-warn">${L
      ?'Le rapport est disponible dès que la supervision est soumise. Complétez et soumettez d\'abord.'
      :'The report is available as soon as the visit is submitted. Complete and submit first.'}</div>
    <button class="btn blk" onclick="go('#/visit/${vid}/rev')">${T('review')} →</button></div>`;

  const s=siteById(v.siteId)||{}; const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{};
  const sc=visitScores(v);
  const secs=rankedSections(v);
  const fails=failingQuestions(v);
  const nas=rankedQuestions(v).filter(x=>x.r.na);
  const acts=visitActions(v.id);
  const prev=DB.d.actions.filter(a=>a.siteId===v.siteId && a.visitId!==v.id)
    .sort((a,b)=>(b.created||0)-(a.created||0));

  const bandWord=b=>b==='g'?(L?'Performant':'Performant'):b==='a'?(L?'Acceptable':'Acceptable')
                    :b==='r'?(L?'Critique':'Critical'):'—';

  return `
  <div class="rep">
    <!-- ---------- letterhead ---------- -->
    <div class="card rep-head">
      <div class="logos" style="margin-bottom:10px">
        <img src="${LOGO_ICAP}" style="height:34px"><img src="${LOGO_CNLS}" style="height:34px"><img src="${LOGO_CSU}" style="height:34px">
      </div>
      <h2 style="text-align:center;margin-bottom:2px">${L?'RAPPORT DE SUPERVISION INTÉGRÉE':'INTEGRATED SUPERVISION REPORT'}</h2>
      <p class="small muted" style="text-align:center;margin:0">
        ${L?'Projet ATHECS — Région de l\'Ouest':'Project ATHECS — West Region'}</p>
      <hr>
      <div class="tw"><table><tbody>
        <tr><td class="k">${T('facility')}</td><td><b>${esc(s.facility||'')}</b>
          ${s.status==='PROVISIONAL'?` <span class="chip a">${L?'provisoire':'provisional'}</span>`:''}</td></tr>
        <tr><td class="k">${T('district')} / ${T('area')}</td><td>${esc(s.district||'')} › ${esc(s.area||'')}</td></tr>
        <tr><td class="k">${T('cycle')}</td><td>${esc(c.name||'')} — ${esc(c.name?cyclePeriodLabel(c):'')}</td></tr>
        <tr><td class="k">${L?'Date de la visite':'Visit date'}</td><td>${esc(v.date||'')}</td></tr>
        <tr><td class="k">${L?'Superviseur':'Supervisor'}</td><td>${esc(v.supervisor||'')}</td></tr>
        ${v.comentors?`<tr><td class="k">${L?'Équipe de supervision':'Supervision team'}</td>
          <td>${esc(v.comentors)}</td></tr>`:''}
        <tr><td class="k">${T('status')}</td><td>${statusChip(v.status)}
          ${v.submitted?' · '+fmtDT(v.submitted):''}</td></tr>
        ${v.reviewedBy?`<tr><td class="k">${L?'Validé par':'Approved by'}</td><td>${esc(v.reviewedBy)}
          ${v.reviewedAt?' · '+fmtDT(v.reviewedAt):''}</td></tr>`:''}
      </tbody></table></div>
    </div>

    <!-- ---------- headline scores ---------- -->
    <div class="card">
      <h3>1. ${L?'Score global du site':'Overall site score'}</h3>
      <div class="grid g3 rings">
        <div class="stat">${ring(sc.clinical.pct,60,T('clinical'))}</div>
        <div class="stat">${ring(sc.mne.pct,60,T('mne'))}</div>
        <div class="stat">${ring(sc.overall.pct,60,T('synth'))}</div>
      </div>
      <div class="banner ${sc.overall.band==='g'?'b-ok':sc.overall.band==='a'?'b-warn':'b-err'}" style="margin-top:12px">
        <b>${bandWord(sc.overall.band)}</b> — ${pc(sc.overall.pct)}.
        ${L?`${sc.overall.answered} question(s) répondues sur ${sc.overall.total}, dont ${sc.overall.na} non applicable(s) exclue(s) du calcul.`
           :`${sc.overall.answered} of ${sc.overall.total} questions answered, ${sc.overall.na} not applicable and excluded.`}
      </div>
      <p class="xs muted">${L
        ?'Méthode : ratio agrégé. Tous les numérateurs et dénominateurs sont additionnés puis divisés — les pourcentages ne sont jamais moyennés. Seuils : 100 % vert · 90–99,9 % jaune · moins de 90 % rouge.'
        :'Method: pooled ratio. All numerators and denominators are summed then divided — percentages are never averaged. Bands: 100 % green · 90–99.9 % yellow · below 90 % red.'}</p>
    </div>

    <!-- ---------- sections, worst first ---------- -->
    <div class="card">
      <h3>2. ${L?'Performance par section — de la plus faible à la meilleure':'Performance by section — weakest first'}</h3>
      <div class="tw"><table>
        <thead><tr><th>#</th><th>Section</th><th>${L?'Domaine':'Domain'}</th>
          <th>${L?'Répondu':'Answered'}</th><th>N/A</th><th>Score</th><th>${L?'Appréciation':'Rating'}</th></tr></thead>
        <tbody>${secs.map((x,i)=>{
          const dom=visitQs(v).filter(q=>q.sec===x.sec)[0];
          return `<tr class="${x.pct===null?'':'fill-'+x.band}">
            <td class="xs">${i+1}</td><td class="small"><b>${esc(x.sec)}</b></td>
            <td class="xs">${dom&&dom.dom==='MNE'?T('mne'):T('clinical')}</td>
            <td class="xs">${x.answered}/${x.total}</td><td class="xs">${x.na}</td>
            <td class="sc">${pc(x.pct)}</td><td class="xs">${bandWord(x.band)}</td></tr>`;}).join('')}
          <tr style="font-weight:800"><td></td><td>${T('synth')}</td><td></td>
            <td class="xs">${sc.overall.answered}/${sc.overall.total}</td><td class="xs">${sc.overall.na}</td>
            <td class="sc">${pc(sc.overall.pct)}</td><td class="xs">${bandWord(sc.overall.band)}</td></tr>
        </tbody></table></div>
    </div>

    <!-- ---------- failing questions, worst first ---------- -->
    <div class="card">
      <h3>3. ${L?'Questions à améliorer — classées de la plus critique':'Questions to improve — most critical first'}
        <span class="chip ${fails.length?'r':'g'}">${fails.length}</span></h3>
      ${fails.length? `<div class="tw"><table>
        <thead><tr><th>#</th><th>Q</th><th>Section</th><th>${L?'Constat':'Finding'}</th>
          <th>Score</th><th>${L?'Commentaire du superviseur':'Supervisor comment'}</th></tr></thead>
        <tbody>${fails.map((x,i)=>`<tr class="fill-${x.r.band}">
          <td class="xs">${i+1}</td><td class="xs"><b>${x.q.n}</b>${
            x.q.monthLabel?`<div class="xs muted">${esc(x.q.monthLabel)}</div>`:''}</td>
          <td class="xs">${esc(x.q.sec)}</td>
          <td class="small">${esc(x.txt.slice(0,190))}${x.txt.length>190?'…':''}</td>
          <td class="sc xs">${x.r.dqa
            ? (L?'Écart ':'Gap ')+(x.r.dqa.diff>0?'+':'')+x.r.dqa.diff+' ('+x.r.dqa.pct.toFixed(1)+' %)'
            : pc(x.r.pct)}</td>
          <td class="xs">${esc(x.a.comment||'')}</td></tr>`).join('')}
        </tbody></table></div>`
       : `<div class="banner b-ok">${L?'Aucune question en dessous du seuil. Toutes les questions applicables sont vertes.'
                                      :'No question below the threshold. Every applicable question is green.'}</div>`}
    </div>

    ${nas.length?`<div class="card">
      <h3>4. ${L?'Questions non applicables sur la période':'Questions not applicable in the period'}
        <span class="chip n">${nas.length}</span></h3>
      <div class="tw"><table><thead><tr><th>Q</th><th>Section</th><th>${T('reason')}</th></tr></thead>
        <tbody>${nas.map(x=>`<tr><td class="xs"><b>${x.q.n}</b></td><td class="xs">${esc(x.q.sec)}</td>
          <td class="small">${esc(x.a.naReason||x.a.comment||'—')}</td></tr>`).join('')}
        </tbody></table></div>
      <p class="xs muted">${L?'Ces questions sont exclues du numérateur et du dénominateur : elles ne pénalisent pas le score.'
                             :'These are excluded from both numerator and denominator: they do not penalise the score.'}</p>
    </div>`:''}

    <!-- ---------- SWOT ---------- -->
    <div class="card">
      <h3>${nas.length?5:4}. ${T('swot')}</h3>
      <div class="grid g2">
        ${[['f',T('forces')],['o',T('opportunites')],['w',T('faiblesses')],['t',T('menaces')]].map(k=>`
          <div><b class="small">${k[1]}</b>
            <p class="small" style="white-space:pre-line;margin:4px 0 0">${esc(v.swot&&v.swot[k[0]]?v.swot[k[0]]:'—')}</p></div>`).join('')}
      </div>
    </div>

    <!-- ---------- action plan ---------- -->
    <div class="card">
      <h3>${nas.length?6:5}. ${T('actionPlan')} <span class="chip ${acts.length?'a':'n'}">${acts.length}</span></h3>
      ${acts.length?`<div class="tw"><table>
        <thead><tr><th>#</th><th>${T('rootCause')}</th><th>${T('actionOnsite')}</th><th>${T('reco')}</th>
          <th>${T('resp')}</th><th>${T('deadline')}</th><th>${T('status')}</th></tr></thead>
        <tbody>${acts.map((a,i)=>`<tr>
          <td class="xs">${i+1}</td>
          <td class="xs">${esc((a.root||'').slice(0,150))}</td>
          <td class="xs">${esc(a.onsite||'')}</td>
          <td class="small">${esc(a.reco||'')}</td>
          <td class="xs">${esc(a.resp||'')}</td>
          <td class="xs">${esc(a.deadline||'')}</td>
          <td class="xs">${a.status==='RESOLVED'?T('resolved'):a.status==='ONGOING'?T('ongoing'):T('unresolved')}</td>
        </tr>`).join('')}</tbody></table></div>`
       :`<p class="small muted">—</p>`}
    </div>

    ${prev.length?`<div class="card">
      <h3>${nas.length?7:6}. ${T('followup')}</h3>
      <div class="tw"><table>
        <thead><tr><th>${L?'Visite':'Visit'}</th><th>${T('reco')}</th><th>${T('deadline')}</th><th>${T('status')}</th></tr></thead>
        <tbody>${prev.slice(0,25).map(a=>`<tr class="${a.status==='RESOLVED'?'fill-g':
            (a.deadline&&a.deadline<today()?'fill-r':'')}">
          <td class="xs">${new Date(a.created).toLocaleDateString()}</td>
          <td class="small">${esc(a.reco||a.root||'')}</td>
          <td class="xs">${esc(a.deadline||'')}</td>
          <td class="xs">${a.status==='RESOLVED'?T('resolved'):a.status==='ONGOING'?T('ongoing'):T('unresolved')}</td>
        </tr>`).join('')}</tbody></table></div>
    </div>`:''}

    ${v.outOfScope?`<div class="card"><h3>${L?'Supervision hors affectation':'Supervision outside the assignment'}</h3>
      <p class="small">${L?'Le superviseur a déclaré le motif suivant au moment de choisir la formation sanitaire :'
                          :'The supervisor recorded the following reason when choosing the facility:'}</p>
      <div class="banner b-warn">${esc(v.outOfScope)}</div></div>`:''}

    <!-- ---------- debriefing signatures ---------- -->
    <div class="card">
      <h3>${L?'Restitution / débriefing':'Debriefing'}</h3>
      <p class="small muted">${L
        ?'Ce rapport a été présenté et discuté avec l\'équipe de la formation sanitaire à l\'issue de la supervision.'
        :'This report was presented to and discussed with the facility team at the end of the supervision.'}</p>
      <div class="grid g2" style="margin-top:14px">
        <div class="sigbox"><span>${L?'Le superviseur':'The supervisor'}</span>
          <b>${esc(v.supervisor||'')}</b><i></i></div>
        <div class="sigbox"><span>${L?'Le responsable de la formation sanitaire':'The facility manager'}</span>
          <b>&nbsp;</b><i></i></div>
      </div>
    </div>

    <div class="rep-foot">
      NACC powered by ICAP Global Health &nbsp;©&nbsp;2025–2026 ·
      ${L?'Projet ATHECS — Supervision intégrée, Région de l\'Ouest':'Project ATHECS — Integrated Supervision, West Region'}
      · ${esc(s.facility||'')} · ${esc(c.name||'')}
    </div>
  </div>

  <div class="noprint" style="margin-top:12px">
    <div class="row">
      <button class="btn" style="flex:1" onclick="printReport()">⎙ ${L?'Imprimer / Enregistrer en PDF':'Print / Save as PDF'}</button>
      <button class="btn sec" onclick="exportVisit('${vid}')">⇩ CSV</button>
    </div>
    <p class="xs muted" style="margin-top:8px">${L
      ?'L\'impression fonctionne sans réseau. Sur téléphone, choisissez « Enregistrer au format PDF » dans la boîte d\'impression pour partager le rapport.'
      :'Printing works with no network. On a phone, choose "Save as PDF" in the print dialog to share the report.'}</p>
  </div>`;
}


/* On a phone the print dialog is the operating system's, and it can take a second to
   appear or be refused outright. Saying what is happening stops the person tapping
   again and again at a button that looks dead. */
function printReport(){
  const L=LANG==='fr';
  toast(L?'Ouverture de l\'impression — choisissez « Enregistrer en PDF » dans la fenêtre du téléphone.'
         :'Opening print — choose "Save as PDF" in your phone\'s dialog.', 4000);
  setTimeout(()=>{ try{ window.print(); }catch(e){
    toast(L?'Votre téléphone a refusé l\'impression. Utilisez le menu du navigateur ▸ Imprimer.'
           :'Your phone refused to print. Use the browser menu ▸ Print.', 5000); } }, 250);
}

/* =====================================================================
   SITE FOCAL POINT
   Facility staff. Sees only their own facility: its scores, its reports,
   and the recommendations they are responsible for closing.
   Cannot start, edit or submit a supervision.
   Entirely offline once their device has synced at least once.
   ===================================================================== */

/* "Am I looking at the facility space right now?" — not "is my role SITE".
   A dual account is in the facility space only while that space is open. */
function isSite(){ const u=me(); return !!u && spaceOf(u)==='site'; }
function mySiteIds(){
  const u=me(); if(!u) return [];
  return Array.isArray(u.sites) ? u.sites : (u.siteId ? [u.siteId] : []);
}
function mySiteVisits(){
  const ids=mySiteIds();
  return DB.d.visits.filter(v=>ids.includes(v.siteId) && reportReady(v))
    .sort((a,b)=>(b.submitted||0)-(a.submitted||0));
}

function viewSiteHome(){
  const L=LANG==='fr', u=me();
  const ids=mySiteIds();
  const sites=ids.map(siteById).filter(Boolean);
  const visits=mySiteVisits();
  const last=visits[0];
  const acts=DB.d.actions.filter(a=>ids.includes(a.siteId));
  const open=acts.filter(a=>a.status!=='RESOLVED');
  const late=open.filter(a=>a.deadline && a.deadline<today());
  const done=acts.length-open.length;
  const pct=acts.length? (done/acts.length*100) : null;

  if(!sites.length) return `<div class="card">
    <div class="banner b-warn">${L
      ?'Aucune formation sanitaire ne vous est encore rattachée. Le niveau central doit vous en attribuer au moins une.'
      :'No facility is assigned to you yet. Central level must assign at least one.'}</div></div>`;

  const multi = sites.length>1;
  const disList = [...new Set(sites.map(s=>s.district))];

  return `
  <div class="card" style="background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0">
    <div class="spread">
      <div style="min-width:0">
        <h2 style="color:#fff;margin:0">${multi
          ? esc(sites.length+(L?' formations sanitaires':' facilities'))
          : esc(sites[0].facility)}</h2>
        <span class="small" style="opacity:.88">${multi
          ? esc(disList.join(' · '))
          : esc(sites[0].district)+' › '+esc(sites[0].area)}</span></div>
      <span class="chip" style="background:rgba(255,255,255,.2);color:#fff;border-color:transparent">
        ${L?'Point focal':'Focal point'}</span>
    </div>
    ${last?`<div class="small" style="opacity:.92;margin-top:7px">
      ${L?'Dernière supervision':'Last supervision'} : <b>${esc(last.date||'')}</b> · ${pc((last.scores||visitScores(last)).overall.pct)}</div>`:''}
  </div>

  ${typeof roleRequestCard==='function' ? roleRequestCard() : ''}

  ${multi?`<div class="card">
    <h3>${L?'Mes formations sanitaires':'My facilities'}</h3>
    <p class="small muted">${L
      ?'Les chiffres ci-dessous couvrent l\'ensemble de vos formations sanitaires. Le détail de chacune est dans son rapport.'
      :'The figures below cover all your facilities together. Each one\'s detail is in its own report.'}</p>
    <div class="list">${sites.map(st=>{
      const vs=DB.d.visits.filter(v=>v.siteId===st.id && reportReady(v))
                          .sort((a,b)=>(b.submitted||0)-(a.submitted||0));
      const lv=vs[0], sc=lv?(lv.scores||visitScores(lv)).overall:null;
      const op=DB.d.actions.filter(a=>a.siteId===st.id && a.status!=='RESOLVED').length;
      return `<div class="item" ${lv?`onclick="go('#/report/${lv.id}')"`:'style="cursor:default"'}>
        <div style="min-width:0"><b>${esc(st.facility)}</b>
          <div class="s">${esc(st.district)} › ${esc(st.area)} · ${
            op?(op+(L?' recommandation(s) ouverte(s)':' open recommendation(s)')):(L?'à jour':'up to date')}</div></div>
        ${sc?`<span class="chip ${band(sc.pct)}">${pc(sc.pct)}</span>`
            :`<span class="chip n">${L?'aucun rapport':'no report'}</span>`}</div>`;}).join('')}
    </div>
  </div>`:''}

  ${last&&multi?`<p class="xs muted" style="margin:0 0 6px">${L
    ?'Scores de la dernière supervision — '+esc((siteById(last.siteId)||{}).facility||'')
    :'Scores of the most recent supervision — '+esc((siteById(last.siteId)||{}).facility||'')}</p>`:''}
  ${last?`<div class="grid g3 rings" style="margin-bottom:13px">
    <div class="stat">${ring((last.scores||visitScores(last)).clinical.pct,56,T('clinical'))}</div>
    <div class="stat">${ring((last.scores||visitScores(last)).mne.pct,56,T('mne'))}</div>
    <div class="stat">${ring((last.scores||visitScores(last)).overall.pct,56,T('synth'))}</div>
  </div>`:''}

  <div class="card">
    <div class="spread"><h3>${L?'Mes recommandations':'My recommendations'}</h3>
      <span class="chip ${open.length?(late.length?'r':'a'):'g'}">${open.length} ${L?'ouverte(s)':'open'}</span></div>
    <div class="grid g3 always" style="margin-bottom:11px">
      <div class="stat"><b>${acts.length}</b><span>${L?'TOTAL':'TOTAL'}</span></div>
      <div class="stat ${open.length?'fill-a':'fill-g'}"><b>${open.length}</b><span>${L?'À FAIRE':'TO DO'}</span></div>
      <div class="stat ${late.length?'fill-r':''}"><b>${late.length}</b><span>${L?'EN RETARD':'OVERDUE'}</span></div>
    </div>
    <div class="spread small"><span>${L?'Taux de résolution':'Resolution rate'}</span><b class="sc">${pc(pct)}</b></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:${pct||0}%;background:${
      pct>=90?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)'}"></i></div>

    <p class="small muted">${L
      ?'Mettez à jour chaque recommandation dès qu\'elle est réalisée. Le superviseur et la coordination le voient à la synchronisation suivante.'
      :'Update each recommendation as soon as it is done. The supervisor and coordination see it at the next sync.'}</p>

    <div class="list">${open.length? open.map(a=>siteActionCard(a, multi)).join('')
      : `<div class="banner b-ok">${L?'Aucune recommandation en attente. Bon travail.':'No recommendation outstanding. Good work.'}</div>`}</div>

    ${done? `<hr><h3 class="small">${L?'Déjà résolues':'Already resolved'} (${done})</h3>
      <div class="list">${acts.filter(a=>a.status==='RESOLVED').slice(0,10).map(a=>
        `<div class="item" style="cursor:default"><div style="min-width:0">
           <b>${esc((a.reco||a.root||'').slice(0,90))}</b>
           <div class="s">${esc(a.resp||'')}${a.resolvedAt?' · '+new Date(a.resolvedAt).toLocaleDateString():''}</div>
         </div><span class="chip g">✓</span></div>`).join('')}</div>`:''}
  </div>

  <div class="card">
    <h3>${L?'Rapports de supervision':'Supervision reports'}</h3>
    <p class="small muted">${L
      ?'Un rapport apparaît ici dès que le superviseur a soumis sa supervision et que votre téléphone a du réseau. S\'il manque, appuyez sur « Recevoir » en bas de l\'écran.'
      :'A report appears here as soon as the supervisor has submitted and this phone has a network. If one is missing, press "Receive" at the bottom of the screen.'}</p>
    <div class="list">${visits.length? visits.map(v=>{
      const s2=(v.scores||visitScores(v)).overall;
      return `<div class="item" onclick="go('#/report/${v.id}')">
        <div style="min-width:0"><b>${esc(v.date||'')}</b>
          <div class="s">${esc(v.supervisor||'')} · ${statusChip(v.status)}</div></div>
        <span class="chip ${band(s2.pct)}">${pc(s2.pct)}</span></div>`;}).join('')
      : `<p class="small muted">${L?'Aucun rapport disponible pour le moment.':'No report available yet.'}</p>`}
    </div>
  </div>

  ${syncCard()}`;
}

function siteActionCard(a, showSite){
  const L=LANG==='fr';
  const late=a.deadline && a.deadline<today() && a.status!=='RESOLVED';
  const st=showSite?siteById(a.siteId):null;
  return `<div class="card tight ${late?'fill-r':''}" style="margin:0">
    ${st?`<div class="xs muted" style="margin-bottom:4px">🏥 ${esc(st.facility)}</div>`:''}
    <div class="spread" style="margin-bottom:6px">
      <span class="chip ${a.qid?'n':'a'}">${a.qid?'Q'+esc(a.qn):(L?'Observation':'Observation')} · ${esc(a.sec||'')}</span>

function siteSetStatus(id,val){
  const a=DB.d.actions.find(x=>x.id===id); if(!a) return;
  a.status=val; a.updated=Date.now();
  if(val==='RESOLVED'){ a.resolvedAt=Date.now(); a.resolvedBy=(me()||{}).name; }
  DB.save(); audit('ACTION_SITE_UPDATE','action',(a.reco||a.root||'').slice(0,60)+' → '+val);
  queue('visit', {visit:visitForSync(DB.d.visits.find(v=>v.id===a.visitId)||{}), actions:[a]});
  toast(LANG==='fr'?'✓ Mise à jour enregistrée':'✓ Update saved');
  render();
}

/* A download is invisible on a phone: nothing opens, nothing moves, and the person
   taps again. Say what left, or say there was nothing to send. */
function exportAll(){
  const rows=[['VisiteID','Date','Statut','District','Aire','Formation sanitaire','Cycle','Periode',
               'Superviseur','Score global %','Clinique %','S&E DQA %','Recos','Recos non resolues']];
  DB.d.visits.forEach(v=>{
    const s=siteById(v.siteId)||{}; const c=DB.d.cycles.find(x=>x.id===v.cycleId)||{};
    const sc=v.scores||visitScores(v);
    const acts=visitActions(v.id);
    rows.push([v.id,v.date,v.status,s.district,s.area,s.facility,c.name,c.name?cyclePeriodLabel(c):'',
      v.supervisor, sc.overall.pct===null?'':sc.overall.pct.toFixed(1),
      sc.clinical.pct===null?'':sc.clinical.pct.toFixed(1),
      sc.mne.pct===null?'':sc.mne.pct.toFixed(1),
      acts.length, acts.filter(a=>a.status!=='RESOLVED').length]);
  });
  const L=LANG==='fr';
  if(rows.length<2) return toast(L
    ?'Rien à exporter : aucune supervision sur cet appareil pour l\'instant.'
    :'Nothing to export: no supervision on this device yet.', 4000);
  downloadCSV(rows,'ATHECS_supervisions_'+today()+'.csv');
  toast((L?'✓ ':'✓ ')+(rows.length-1)+(L?' supervision(s) exportée(s) — cherchez le fichier dans vos téléchargements'
                                        :' supervision(s) exported — look in your downloads'), 4500);
}

/* ===================== DASHBOARD ===================== */
let DASH={cycle:'', district:'', site:''};
/* A supervisor and the coordination team need two different screens under the same word.
   The coordination team compares districts. A supervisor needs their own districts and,
   above all, the facility they have just supervised. So the dashboard splits in two, and a
   supervisor is never shown another district's figures. */
function viewDash(){ return isSuper() ? viewDashRegional() : viewDashMine(); }

/* An EMPTY scope means NOTHING, never everything.
   This used to return null for an empty list, and every caller reads null as
   "no filter" — so a supervisor whose districts had been emptied silently saw
   every district in the West. Only a super user sees the whole region, and that
   is said here explicitly instead of falling out of a missing value. */
function myDistricts(){
  const u=me();
  if(!u) return [];
  if(isSlot(u)) return null;                    // the console: the whole region, on purpose
  return Array.isArray(u.districts) ? u.districts : [];
}
/* every submitted supervision inside this person's districts, for the chosen cycle */
function scopedVisits(cid){
  const mine=myDistricts();
  return DB.d.visits.filter(v=>{
    if(!countable(v)) return false;      // a supervision in conflict counts nowhere
    if(cid && v.cycleId!==cid) return false;
    const s=siteById(v.siteId); if(!s) return false;
    return !mine || mine.includes(s.district);
  });
}
const poolOf=(arr,key)=>{ let n=0,d=0; arr.forEach(v=>{ const sc=v.scores||visitScores(v);
  n+=sc[key].n; d+=sc[key].d; }); return d>0?(n/d)*100:null; };

function viewDashRegional(){

  if(cid) vs=vs.filter(v=>v.cycleId===cid);
  vs=vs.filter(inScope);
  const agg=vs.filter(v=>{ const s=siteById(v.siteId); return s && s.status==='ACTIVE'; });
  const dis=[...new Set(DB.d.sites.map(s=>s.district))].sort();
  const scopeLabelTxt = DASH.district || (L?'Toute la région':'The whole region');
  // pooled regional
  const pool=poolOf;
  const rOverall=pool(agg,'overall'), rClin=pool(agg,'clinical'), rMne=pool(agg,'mne');
  const meanSite = agg.length? agg.reduce((a,v)=>a+(((v.scores||visitScores(v)).overall.pct)||0),0)/agg.length : null;

  // recommendations for the selected period
  const actIds=new Set(vs.map(v=>v.id));
  const acts=DB.d.actions.filter(a=>actIds.has(a.visitId));
  const unres=acts.filter(a=>a.status!=='RESOLVED');
  const late=unres.filter(a=>a.deadline&&a.deadline<today());
  const resPct=acts.length?((acts.length-unres.length)/acts.length*100):null;

  // by district
  const byD={};
  vs.forEach(v=>{ const s=siteById(v.siteId)||{}; const sc=v.scores||visitScores(v);
    const o=byD[s.district]=byD[s.district]||{n:0,d:0,sites:0,acts:0,unres:0};
    o.n+=sc.overall.n; o.d+=sc.overall.d; o.sites++; });
  acts.forEach(a=>{ const s=siteById(a.siteId)||{}; const o=byD[s.district]; if(!o)return;
    o.acts++; if(a.status!=='RESOLVED') o.unres++; });

  // by section
  const secAgg={};
  vs.forEach(v=>{ const sc=v.scores||visitScores(v);
    sc.sections.forEach(s=>{ const o=secAgg[s.sec]=secAgg[s.sec]||{n:0,d:0}; o.n+=s.n; o.d+=s.d; }); });

   :`REGIONAL SCORE — two readings\n\n1) Pooled ratio (headline): ${pc(pooledPct)}\n   All numerators and denominators from the ${n} visits are summed then divided. A large site weighs more — this is the region's real performance.\n\n2) Mean of site scores: ${pc(meanPct)}\n   Every site counts once. Answers "how is the average site doing?".\n\nPROVISIONAL sites are excluded from aggregates until approved.`);

/* ===================== CHAT ===================== */
function myThreads(){
  const u=me();
  return DB.d.threads.filter(t=>{
    if(t.scope==='GENERAL') return true;
    if(isSuper()) return true;
    if(t.scope==='SITE'){ const s=siteById(t.siteId);
      return s && (!Array.isArray(u.districts) || u.districts.includes(s.district)) &&
             (!t.members || t.members.includes(u.id)); }
    if(t.scope==='DIRECT') return (t.members||[]).includes(u.id);
    if(t.scope==='VISIT'){ const v=DB.d.visits.find(x=>x.id===t.visitId); return v && v.uid===u.id; }
    return false;
  });
}
function unread(){
  const u=me(); if(!u) return 0;
  return DB.d.messages.filter(m=> m.uid!==u.id && !(m.read||[]).includes(u.id) &&
    myThreads().some(t=>t.id===m.threadId)).length;
}
function viewChat(tid){
  const th=myThreads();
  const cur=tid?DB.d.threads.find(t=>t.id===tid):null;
  if(cur){ (DB.d.messages.filter(m=>m.threadId===cur.id)).forEach(m=>{
    m.read=m.read||[]; if(!m.read.includes(DB.d.session)) m.read.push(DB.d.session); }); DB.save(); }
  return `<div class="split">
    <div>
      <div class="card tight">
        <div class="spread"><b>${T('chat')}</b>
          ${isSuper()?`<button class="btn sm" onclick="newThreadModal()">＋</button>`:''}</div>
      </div>
      <div class="list">${th.map(t=>{
        const last=DB.d.messages.filter(m=>m.threadId===t.id).slice(-1)[0];
        const un=DB.d.messages.filter(m=>m.threadId===t.id&&m.uid!==DB.d.session&&!(m.read||[]).includes(DB.d.session)).length;
        const s=t.siteId?siteById(t.siteId):null;
        return `<div class="item ${cur&&cur.id===t.id?'fill-g':''}" onclick="go('#/chat/${t.id}')">
          <div style="min-width:0"><b>${esc(t.title||(s?s.facility:'—'))}</b>
            <div class="s">${scopeLabel(t.scope)}${last?' · '+esc((last.body||'').slice(0,40)):''}</div></div>
          ${un?`<span class="badge">${un}</span>`:'<span class="chip n">→</span>'}</div>`;}).join('')||'<p class="small muted">—</p>'}
      </div>
    </div>
    <div>
      ${cur?chatPane(cur):`<div class="card"><p class="small muted">${LANG==='fr'?'Sélectionnez une conversation.':'Select a conversation.'}</p></div>`}
    </div></div>`;
}
function scopeLabel(s){ return {GENERAL:LANG==='fr'?'Diffusion générale':'Broadcast',
  SITE:LANG==='fr'?'Site':'Site',VISIT:LANG==='fr'?'Supervision':'Visit',DIRECT:LANG==='fr'?'Direct':'Direct'}[s]||s; }
function chatPane(t){
  const ms=DB.d.messages.filter(m=>m.threadId===t.id).sort((a,b)=>a.ts-b.ts);
  const s=t.siteId?siteById(t.siteId):null;
  let ctx='';
  if(s){ const lastV=DB.d.visits.filter(v=>v.siteId===s.id&&v.scores).sort((a,b)=>(b.submitted||0)-(a.submitted||0))[0];
    ctx=`<div class="banner b-info xs">${esc(s.district)} › ${esc(s.area)} › <b>${esc(s.facility)}</b>${
      lastV?` · ${LANG==='fr'?'dernier score':'last score'} <b>${pc(lastV.scores.overall.pct)}</b>`:''}</div>`; }
  const canPost = t.scope!=='GENERAL' || isSuper();
  return `<div class="card">

      <input type="text" id="msg-in" placeholder="${LANG==='fr'?'Votre message…':'Your message…'}"

function sendMsg(tid){
  const el=$('#msg-in'); const body=(el.value||'').trim(); if(!body) return;
  const m={id:DB.id('M'), threadId:tid, uid:DB.d.session, who:(me()||{}).name, body,

  render(); const th=$('#thread'); if(th) th.scrollTop=th.scrollHeight;

function postSiteMessage(siteId, body){
  let t=DB.d.threads.find(x=>x.scope==='SITE'&&x.siteId===siteId);
  if(!t){ const s=siteById(siteId);
    t={id:DB.id('T'), scope:'SITE', siteId, title:s.facility, created:Date.now(),
       members:DB.d.visits.filter(v=>v.siteId===siteId).map(v=>v.uid)};
    DB.d.threads.push(t); }
  const m={id:DB.id('M'), threadId:t.id, uid:DB.d.session, who:(me()||{}).name, body, ts:Date.now(), read:[DB.d.session]};
  DB.d.messages.push(m); DB.save(); queue('message', m);
}

async function submitSiteReq(editId){
  const u=me(); const g=i=>{const e=$('#'+i); return e?String(e.value||'').trim():'';};
  const miss=[];
  if(!g('sr-dis'))miss.push(T('district')); if(!g('sr-area'))miss.push(T('area'));
  if(!g('sr-fac'))miss.push(T('facility'));
  if(!g('sr-ref'))miss.push(LANG==='fr'?'N° du document (E1)':'Document reference (E1)');
  if(!g('sr-date'))miss.push(LANG==='fr'?'Date du document (E1)':'Document date (E1)');
  if(!$('#sr-doc').files[0])miss.push(LANG==='fr'?'Pièce justificative (E2)':'Supporting document (E2)');
  if(!u.idNumber)miss.push(LANG==='fr'?'Pièce d\'identité du demandeur (E3)':'Requester identity document (E3)');
  if(!g('sr-fn'))miss.push(LANG==='fr'?'Fonction dans le site (E4)':'Function at the site (E4)');
  if(!g('sr-tel'))miss.push(LANG==='fr'?'Téléphone (E5)':'Phone (E5)');
  if(!$('#sr-dec').checked)miss.push(LANG==='fr'?'Déclaration (E6)':'Declaration (E6)');
  if(miss.length) return blockedModal(miss);

  const doc=await fileToB64($('#sr-doc').files[0]);
  let gps=null;
  if($('#sr-gps').checked && navigator.geolocation){
    gps = await new Promise(r=>navigator.geolocation.getCurrentPosition(
      p=>r({lat:p.coords.latitude,lng:p.coords.longitude}), ()=>r(null), {timeout:6000}));
  }
  const ref='ATH-SR-'+new Date().getFullYear()+'-'+String(DB.d.siteReq.length+1).padStart(4,'0');
  const before = editId? Object.assign({},siteById(editId)) : null;
  const req={id:DB.id('SR'), ref, type:g('sr-type'), editId:editId||null,
    before, after:{district:g('sr-dis'), area:g('sr-area'), facility:g('sr-fac')},
    source:g('sr-src'), docRef:g('sr-ref'), docDate:g('sr-date'), docFile:doc,
    reqName:u.name, reqUid:u.id, reqFn:g('sr-fn'), reqMat:g('sr-mat'),
    idType:u.idType, idNumber:u.idNumber,
    phone:g('sr-tel'), email:g('sr-mail'), justification:g('sr-just'),
    gps, deviceTs:Date.now(), status:'SUBMITTED'};
  DB.d.siteReq.push(req);

  // Provisional site available immediately (approved decision D4)
  if(req.type==='ADD'){
    const s={id:DB.id('S'), district:req.after.district, area:req.after.area, facility:req.after.facility,
      status:'PROVISIONAL', version:1, reqId:req.id};
    DB.d.sites.push(s); req.siteId=s.id;
    NV.district=s.district; NV.area=s.area; NV.siteId=s.id;
  }
  DB.save(); audit('SITE_REQ', req.type, ref+' · '+req.after.facility);
  queue('siteReq', req);
  modal(LANG==='fr'?'Demande enregistrée':'Request recorded',
   `<div class="banner b-ok">${LANG==='fr'?'Référence':'Reference'} : <b>${ref}</b></div>
    <p class="small">${req.type==='ADD'
      ? (LANG==='fr'?'Le site est utilisable immédiatement en statut <b>PROVISOIRE</b> (signalé en orange). Ses données sont exclues des agrégats régionaux jusqu\'à validation par un super utilisateur.'
                    :'The site is usable immediately as <b>PROVISIONAL</b> (flagged orange). Its data is excluded from regional aggregates until a super user approves it.')
      : (LANG==='fr'?'La modification sera appliquée après validation par un super utilisateur. Le registre est versionné : l\'ancienne version est conservée.'
                    :'The change will be applied after a super user approves it. The registry is versioned: the old version is kept.')}</p>`,
   `<button class="btn" onclick="closeModal();go(canSupervise()?'#/new':'#/home')">OK</button>`);
}

   on that phone, and nothing in the app carries a default. */
function admSlots(){
  const L=LANG==='fr';
  const slots=DB.d.users.filter(u=>isSlot(u)).sort((a,b)=>a.id<b.id?-1:1);
  const row=u=>{

        </div>
        <span class="chip ${!named?'n':u.claimed?'g':'a'}">${
          !named?(L?'libre':'free'):u.claimed?(L?'actif':'active'):(L?'à activer':'to activate')}</span>
      </div>

        ?'Un compte administrateur ne s\'attribue pas ici. Il se donne depuis l\'éditeur Apps Script : fonction <b>nouveauCodeAdmin</b>. C\'est ce qui fait que seul le propriétaire du classeur peut nommer un administrateur.'

      :`<div class="row" style="margin-top:9px">
          <button class="btn sm" ${ONLINE?'':'disabled'} onclick="assignSlotModal('${u.id}')">${
            named?(L?'⇄ Réattribuer':'⇄ Reassign'):(L?'＋ Attribuer':'＋ Assign')}</button>
          ${named?`<button class="btn sec sm" ${ONLINE?'':'disabled'} onclick="releaseSlotAsk('${u.id}')">⛔ ${
            L?'Retirer':'Withdraw'}</button>`:''}
        </div>`}
    </div>`;

async function doAssignSlot(slotId){
  const L=LANG==='fr';
  const name=(($('#as-name')||{}).value||'').trim();
  const phone=(($('#as-phone')||{}).value||'').trim();
  if(!name) return toast(L?'Le nom est obligatoire':'The name is required');
  if(!phone) return toast(L?'Le téléphone est obligatoire':'The phone number is required');
  if(!ONLINE) return toast(L?'L\'attribution a besoin du réseau':'Assigning needs a network');
  const api=DB.d.config.api;
  let j=null;
  try{
    const r=await fetch(api,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({token:apiToken(), kind:'assign', id:'AS-'+Date.now(),
        payload:{slotId, name, phone, byId:(me()||{}).id}})});
    j=await r.json();
  }catch(e){}
  if(!j || !j.ok) return toast((L?'Échec : ':'Failed: ')+((j&&j.error)||'—'), 4000);
  audit('SLOT_ASSIGN','user', name+' → '+slotId);
  await refreshSlots(false);
  closeModal();
  modal(L?'Compte attribué':'Account assigned', `
    <p class="small">${L?'Lisez ce code à <b>':'Read this code to <b>'}${esc(name)}</b>${phone?' ('+esc(phone)+')':''}.</p>
    <div class="codebox">${esc(j.code)}</div>
    <p class="small">${L
      ?'Elle ouvre l\'application ▸ <b>Administration</b> ▸ choisit son nom ▸ saisit ce code à la place du code PIN. L\'application lui demande aussitôt de choisir son propre code PIN.'
      :'They open the app ▸ <b>Administration</b> ▸ choose their name ▸ type this code instead of a PIN. The app then asks them to choose their own PIN.'}</p>
    <p class="xs muted">${L?'Usage unique. Valable 24 heures. Il faut du réseau au moment de l\'activation.'
                           :'Single use. Valid 24 hours. A network is needed at the moment of activation.'}</p>`,
    `<button class="btn" onclick="closeModal()">OK</button>`);
}

async function doReleaseSlot(slotId){

    const r=await fetch(api,{method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},

/* Everything the region has submitted, in one place, with the decision on the row.

      ?'Chaque ligne ouvre l\'onglet « Revue et soumission » de la supervision, où se trouvent les boutons Approuver et Retourner. Si une supervision soumise sur un autre téléphone n\'apparaît pas ici, appuyez sur Actualiser — elle est récupérée du serveur.'

    <div class="list">${sub.map(row).join('')||`<p class="small muted">${L?'Aucune supervision en attente.':'None pending.'}</p>`}</div>

    ${ret.length?`<hr><h3>${L?'Retournées au superviseur':'Returned to the supervisor'} (${ret.length})</h3>
      <div class="list">${ret.map(row).join('')}</div>`:''}

      <div class="list">${dr.slice(0,15).map(row).join('')}</div>`:''}
  </div>`;
}

/* Nothing on this tab used to leave the console. Opening a quarter, unticking a month or
   moving the deadline changed the coordinator's own screen and no phone in the region ever
   heard about it — the field stayed on the previous period. Every change now pushes the
   WHOLE list, so the closure of the old cycle travels along with the opening of the new. */
function pushCycles(){ DB.d.cycles.forEach(c=>queue('cycle', c)); }

function createCycle(){
  const fy=Number($('#cy-fy').value), q=Number($('#cy-q').value);
  const name='FY'+String(fy).slice(2)+' Q'+q;
  if(DB.d.cycles.find(c=>c.id==='C-FY'+fy+'Q'+q)) return toast(LANG==='fr'?'Ce cycle existe déjà':'Cycle already exists');
  DB.d.cycles.forEach(c=>c.status='CLOSED');
  DB.d.cycles.push(mkCycle(name, fy, q, true));
  DB.save(); audit('CYCLE_OPEN','cycle',name); pushCycles(); closeModal();
  toast(LANG==='fr'?'✓ '+name+' ouvert — les téléphones basculent à leur prochaine connexion'
                   :'✓ '+name+' opened — phones switch at their next connection', 4000);
  render();
}
function setMonth(cid,i,val){ const c=DB.d.cycles.find(x=>x.id===cid); c.monthsComplete[i]=val; DB.save();
  audit('CYCLE_MONTH','cycle',c.name+' m'+(i+1)+'='+val); queue('cycle', c);
  toast(LANG==='fr'?(val?'Mois inclus':'Mois retiré')+' — transmis aux téléphones'
                   :(val?'Month included':'Month removed')+' — sent to the phones', 2600);
  render(); }
function setCycleStatus(cid,st){ const c=DB.d.cycles.find(x=>x.id===cid);
  if(st==='OPEN') DB.d.cycles.forEach(x=>x.status='CLOSED');
  c.status=st; DB.save(); audit('CYCLE_STATUS','cycle',c.name+'→'+st); pushCycles(); render(); }
function setCycleDeadline(cid,v){ const c=DB.d.cycles.find(x=>x.id===cid);
  c.deadline=v; DB.save(); queue('cycle', c); }

function admApprovals(){
  const L=LANG==='fr';
  const all=DB.d.users.filter(u=>!isSlot(u));
  const pending=all.filter(u=>userStatus(u)===U_PENDING);
  const active=all.filter(u=>userStatus(u)===U_ACTIVE);
  const off=all.filter(u=>[U_SUSPENDED,U_REJECTED].includes(userStatus(u)));
  const help=active.filter(u=>u.pinHelp);

  /* Two records for one person split their supervisions in half. Show it on both cards. */
  /* Deactivating the twin used to be the only option — and it was a trap: the deactivated
     account vanished from its own phone, and that phone could never learn it had been
     reactivated. Merging keeps ONE account, moves everything onto it and archives the other. */
  const dupBanner=u=>{
    const d=duplicatesOf(u, all);
    if(!d.length) return '';
    const older=(a,b)=>((a.enrolled||0)<=(b.enrolled||0)?a:b);
    return `<div class="banner b-warn xs" style="margin-top:8px">⚠ ${L?'Doublon probable':'Probable duplicate'}
      ${d.map(x=>`<div style="margin-top:6px">
        <b>${esc(x.name)}</b> (${esc(x.fn||'—')}${x.idType?', '+esc(x.idType):''}, ${userStatus(x)})
        <div class="xs">${L?'Concordance':'Match'} : ${esc((x._match&&x._match.why||[]).join(' · ')||'—')}
          ${x._match&&x._match.sure?`<b>${L?'— certaine':'— certain'}</b>`
            :x._match&&x._match.likely?`<b>${L?'— probable':'— likely'}</b>`
            :`<i>${L?'— faible, à vérifier avec la personne':'— weak, check with the person'}</i>`}</div>
        <div class="row" style="margin-top:5px">
          ${x._match&&x._match.likely?`<button class="btn sm" onclick="confirmMerge('${older(u,x).id}','${(older(u,x).id===u.id?x:u).id}')">⇄ ${
            L?'Fusionner':'Merge'}</button>`:''}
          <button class="btn sec sm" onclick="closeDuplicate('${x.id}','${esc(u.name).replace(/'/g,"")}')">⛔ ${
            L?'Désactiver seulement':'Deactivate only'}</button>
        </div></div>`).join('')}
      <div class="xs" style="margin-top:6px">${L
        ?'La fusion garde le compte le plus ancien — c\'est celui auquel les supervisions sont rattachées — et archive l\'autre. Le téléphone de la personne bascule tout seul : elle n\'a rien à refaire.'
        :'Merging keeps the older account — the one the supervisions point at — and archives the other. The person\'s phone switches by itself: nothing for them to redo.'}</div>
    </div>`;
  };

  /* what the applicant supplied — read only. Central just decides. */
  const row=(k,v)=>v?`<tr><td class="k">${esc(k)}</td><td>${v}</td></tr>`:'';
  /* A dual account has TWO scopes and both must be visible: showing only one is how
     somebody ends up approved into a space that holds nothing. */
  const siteChips=u=>{
    const st=(u.sites||[]).map(id=>{ const x=siteById(id);
      return `<span class="chip n">${x?esc(x.district)+' › '+esc(x.facility):esc(id)}</span>`; }).join(' ');
    return st || `<span class="chip r">${L?'aucune formation sanitaire':'no facility'}</span>`;
  };
  const disChips=u=>{
    const d=(u.districts||[]);
    return d.length? d.map(x=>`<span class="chip n">${esc(x)}</span>`).join(' ')
                   : `<span class="chip r">${L?'aucun district':'no district'}</span>`;
  };
  const scope=u=>{
    if(isDual(u)) return `<div><span class="xs muted">👥 ${L?'Supervise':'Supervises'} :</span> ${disChips(u)}</div>
      <div style="margin-top:4px"><span class="xs muted">🏥 ${L?'Point focal':'Focal point'} :</span> ${siteChips(u)}</div>`;
    return u.role==='SITE' ? siteChips(u) : disChips(u);
  };

  /* The full ID number never leaves the private workbook. On a device that took the
     enrolment it is here; on any other device only the last four characters arrive —
     enough to read back to the person on the phone, never enough to reconstruct. */
  const idLine=(u,L)=>{
    if(u.idNumber) return esc(u.idType||'')+' n° '+esc(u.idNumber)
      + (u.idFile?` <a href="${u.idFile}" target="_blank">↗</a>`:'');
    if(u.idLast) return esc(u.idType||'')+' •••'+esc(u.idLast)
      + ` <span class="xs muted">(${L?'n° complet dans le classeur':'full number in the workbook'})</span>`;
    return `<span class="chip a">${L?'à vérifier dans le classeur':'check in the workbook'}</span>`;
  };

  const pendingCard=u=>`<div class="card tight">
    <div class="spread" style="margin-bottom:8px">
      <div style="min-width:0"><b style="font-size:1rem">${esc(u.name)}</b>
        <div class="xs muted">${esc(u.fn||'')}</div></div>
      <span class="chip ${u.role==='SITE'?'g':'n'}">${u.role==='SITE'?(L?'Personnel du site':'Facility staff'):(L?'Superviseur':'Supervisor')}</span>
    </div>
    <div class="tw"><table><tbody>
      ${row(u.role==='SITE'?T('facility'):T('district'), scope(u))}
      ${isDual(u)?row(L?'Deux rôles':'Two roles', `<span class="chip g">${L?'Superviseur + Personnel du site':'Supervisor + Facility staff'}</span>`):''}
      ${row(L?'Téléphone':'Phone', esc(u.phone||''))}
      ${row('Email', esc(u.email||''))}
      ${row(L?'Pièce d\'identité':'ID document', idLine(u,L))}
      ${row(L?'Matricule':'Matricule', esc(u.matricule||''))}
      ${row(L?'Demande reçue':'Request received', u.enrolled?fmtDT(u.enrolled):'')}
    </tbody></table></div>
    ${dupBanner(u)}
    <div class="row" style="margin-top:10px">
      <button class="btn ok" style="flex:2" onclick="approveUser('${u.id}')">✓ ${L?'Approuver':'Approve'}</button>
      <button class="btn dan" style="flex:1" onclick="rejectUser('${u.id}')">✕ ${L?'Rejeter':'Reject'}</button>
    </div>
    <button class="btn sec blk sm" style="margin-top:8px" onclick="editScope('${u.id}')">
      ✎ ${L?'Modifier l\'affectation avant d\'approuver':'Change the assignment before approving'}</button>
  </div>`;

  const activeCard=u=>`<div class="card tight ${u.pinHelp?'fill-a':''}">
    <div class="spread">
      <div style="min-width:0"><b>${esc(u.name)}</b>
        <div class="xs muted">${esc(u.fn||'')}${u.phone?' · '+esc(u.phone):''}</div>
        <div class="xs" style="margin-top:4px">${scope(u)}</div></div>
      <span class="chip g">${L?'Actif':'Active'}</span>
    </div>
    ${dupBanner(u)}
    ${u.pinHelp?`<div class="banner b-warn xs" style="margin-top:8px">🔑 ${L
      ?'A signalé un code PIN oublié le '+fmtDT(u.pinHelp)+'. Appelez-le/la et donnez le code temporaire.'
      :'Reported a forgotten PIN on '+fmtDT(u.pinHelp)+'. Call them and give the temporary code.'}</div>`
     : tempAlive(u)?`<div class="banner b-info xs" style="margin-top:8px">${L
      ?'Code temporaire en cours, valable jusqu\'au '+tempEnds(u)+'.'
      :'Temporary code outstanding, valid until '+tempEnds(u)+'.'}
      ${u.pinResetCode?`<a href="#" onclick="event.preventDefault();showTempPin('${u.id}')">${
        L?'revoir le code':'show the code again'}</a>`:''}</div>`:''}
    ${roleReqBanner(u)}
    <div class="row" style="margin-top:9px">
      ${hasSupHat(u)?`<button class="btn sec sm" onclick="editScope('${u.id}','SUPERVISOR')">⇄ ${
        L?'Districts':'Districts'}</button>`:''}
      ${hasSiteHat(u)?`<button class="btn sec sm" onclick="editScope('${u.id}','SITE')">🏥 ${
        L?'Formations sanitaires':'Facilities'}</button>`:''}
      <button class="btn ${u.pinHelp?'':'sec'} sm" onclick="resetPin('${u.id}')">🔑 ${
        u.pinHelp?(L?'Donner un code':'Give a code'):(L?'PIN oublié':'Forgotten PIN')}</button>
      <button class="btn dan sm" onclick="suspendUser('${u.id}')">⛔ ${L?'Désactiver':'Deactivate'}</button>
    </div>
    <div class="row" style="margin-top:7px">
      ${!isDual(u) && !reqPending(u) ? `<button class="btn sec sm" onclick="addRoleModal('${u.id}')">＋ ${
        L?'Ajouter le rôle '+(u.role==='SITE'?'superviseur':'personnel du site')
         :'Add the '+(u.role==='SITE'?'supervisor':'facility staff')+' role'}</button>`:''}
      ${isDual(u) ? `<button class="btn sec sm" onclick="revokeRoleAsk('${u.id}')">− ${
        L?'Retirer le second rôle':'Remove the second role'}</button>`:''}
    </div>
  </div>`;

  const offCard=u=>`<div class="card tight">
    <div class="spread">
      <div style="min-width:0"><b>${esc(u.name)}</b>
        <div class="xs muted">${esc(u.decisionNote||'')}</div></div>
      <span class="chip r">${userStatus(u)}</span>
    </div>
    <button class="btn ok sm" style="margin-top:8px" onclick="reactivateUser('${u.id}')">↺ ${L?'Réactiver':'Reactivate'}</button>
  </div>`;

  return `<div class="card">
    <div class="spread"><h3>${L?'Validation des comptes':'Account approvals'}</h3>

/* change districts (supervisor) or facility (site staff) — only when needed */
function editScope(uid, hat){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  const L=LANG==='fr';
  /* WHICH scope is being edited is now explicit. It used to be deduced from the role,
     which on a dual account could only ever reach one of the two — and worse, saving the
     facilities rewrote the districts from them, wiping the supervisor's assignment. */
  const which = (hat==='SITE'||hat==='SUPERVISOR') ? hat : (u.role==='SITE'?'SITE':'SUPERVISOR');
  EDIT_HAT = which;
  if(which==='SITE'){
    /* One person may follow several facilities, in several districts. */
    const byDis={};
    DB.d.sites.filter(s=>s.status!=='CLOSED').forEach(s=>{ (byDis[s.district]=byDis[s.district]||[]).push(s); });
    const cur=u.sites||[];
    modal((L?'Formations sanitaires — ':'Facilities — ')+u.name, `
      <p class="small muted">${L
        ?'Cochez toutes les formations sanitaires suivies par cette personne. Elles peuvent appartenir à plusieurs districts : les districts sont déduits automatiquement.'
        :'Select every facility this person follows. They may span several districts: the districts are derived automatically.'}</p>
      <label class="f"><span>${L?'Filtrer':'Filter'}</span>
        <input type="text" id="sc-find" placeholder="${L?'nom de la formation ou du district…':'facility or district name…'}"
          oninput="filterScopeSites(this.value)"></label>
      <label class="f"><span>${T('facility')}</span>
        <select id="sc-site" multiple size="14">
          ${Object.keys(byDis).sort().map(d=>`<optgroup label="${esc(d)}">${
            byDis[d].sort((a,b)=>(a.area+a.facility).localeCompare(b.area+b.facility)).map(s=>
              `<option value="${s.id}" data-f="${esc((d+' '+s.area+' '+s.facility).toLowerCase())}" ${
                cur.includes(s.id)?'selected':''}>${esc(s.area)} › ${esc(s.facility)}</option>`).join('')
          }</optgroup>`).join('')}
        </select></label>
      <p class="xs muted">${L
        ?'Sur téléphone : appuyez longuement ou touchez plusieurs lignes pour en sélectionner plusieurs.'
        :'On a phone: press and hold, or tap several rows, to select more than one.'}</p>`,
      `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
       <button class="btn" onclick="saveScope('${uid}')">${T('save')}</button>`);
  } else {
    const dis=[...new Set(DB.d.sites.map(s=>s.district))].sort();
    modal((L?'Districts — ':'Districts — ')+u.name, `
      <p class="small muted">${L?'Sélectionnez les districts couverts. Le changement est journalisé.'
                                :'Select the districts covered. The change is logged.'}</p>
      <label class="f"><span>${T('district')}</span>
        <select id="sc-dis" multiple size="10">${dis.map(d=>
          `<option ${(u.districts||[]).includes(d)?'selected':''}>${esc(d)}</option>`).join('')}</select></label>
      <label class="f"><span>${L?'Motif / référence (facultatif)':'Reason / reference (optional)'}</span>
        <input type="text" id="sc-why" placeholder="${L?'Note de service n°…':'Service note no…'}"></label>`,
      `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
       <button class="btn" onclick="saveScope('${uid}')">${T('save')}</button>`);
  }
}
function filterScopeSites(q){
  const sel=$('#sc-site'); if(!sel) return;
  const t=(q||'').trim().toLowerCase();
  Array.from(sel.querySelectorAll('option')).forEach(o=>{
    o.hidden = !!t && !(o.dataset.f||'').includes(t);
  });
  Array.from(sel.querySelectorAll('optgroup')).forEach(g=>{
    g.hidden = !Array.from(g.querySelectorAll('option')).some(o=>!o.hidden);
  });
}
let EDIT_HAT='';
function saveScope(uid){
  const u=DB.d.users.find(x=>x.id===uid); if(!u) return;
  if(EDIT_HAT==='SITE'){
    const ids=Array.from(($('#sc-site')||{selectedOptions:[]}).selectedOptions).map(o=>o.value);
    if(!ids.length) return toast(LANG==='fr'?'Choisissez au moins une formation sanitaire'
                                            :'Choose at least one facility');
    const before=(u.sites||[]).map(i=>(siteById(i)||{}).facility||i).join(', ');
    u.sites=ids; u.siteId=ids[0];
    /* For a facility-only account the districts are derived from the facilities, as they
       always were. For a DUAL account they are the supervisor's own assignment and must
       never be overwritten by an edit to the facilities. */
    if(!isDual(u)) u.districts=[...new Set(ids.map(i=>(siteById(i)||{}).district).filter(Boolean))];
    audit('USER_SITE','user',`${u.name} : ${before||'—'} → ${ids.map(i=>(siteById(i)||{}).facility||i).join(', ')}`);
  } else {
    const next=Array.from($('#sc-dis').selectedOptions).map(o=>o.value);
    if(!next.length) return toast(LANG==='fr'?'Au moins un district':'At least one district');
    const why=($('#sc-why')||{}).value||'';
    audit('USER_TRANSFER','user',`${u.name} : ${(u.districts||[]).join(', ')} → ${next.join(', ')}${why?' ('+why+')':''}`);
    u.districts=next; if(why) u.transferNote=why;
  }
  DB.save();
  /* a scope change is a privileged act now: it travels as a grant, not as a user push */
  if(isDual(u)) queue('roleGrant', {id:u.id, byId:(me()||{}).id, want:EDIT_HAT,
                                    scope: EDIT_HAT==='SITE' ? (u.sites||[]) : (u.districts||[])});
  else pushUser(u);
  closeModal();
  toast(LANG==='fr'?'✓ Affectation enregistrée':'✓ Assignment saved'); render();
}

/* The section used to be a datalist. On Android a datalist shows nothing at all when you
   tap it, so the field looked frozen on whatever section it opened with — every new question
   silently landed in "Coordination et documentation générale". It is a real select now, with
   an explicit way to create a section. */
function eqSectionChanged(v){
  const w=$('#eq-secnew-wrap'); if(!w) return;
  w.classList.toggle('hidden', v!=='__NEW__');
  if(v==='__NEW__') setTimeout(()=>{ const i=$('#eq-secnew'); if(i) i.focus(); }, 60);
}
function eqSection(){
  const sel=($('#eq-sec')||{}).value||'';
  if(sel!=='__NEW__') return sel.trim();
  return (($('#eq-secnew')||{}).value||'').trim();
}
function saveQ(id){
  const g=i=>$('#'+i).value;
  const patch={sec:eqSection(), q:g('eq-q').trim(), type:g('eq-type'), dom:g('eq-dom'),
    num:g('eq-num').trim()||undefined, den:g('eq-den').trim()||undefined,
    defDen:g('eq-dd')?Number(g('eq-dd')):undefined, weight:Number(g('eq-w'))||1,
    fu:g('eq-fu').trim()||undefined, dqa:$('#eq-dqa').checked?1:undefined,
    perMonth:$('#eq-pm').checked?true:undefined};
  if(!patch.sec) return toast(LANG==='fr'?'Choisissez ou nommez une section':'Choose or name a section');
  if(!patch.q) return toast(LANG==='fr'?'Énoncé obligatoire':'Question text required');
  if(patch.perMonth && !/\{\{MOIS\}\}/.test([patch.q,patch.num,patch.den].join(' ')))
    return toast(LANG==='fr'
      ?'Question par mois : écrivez {{MOIS}} dans l\'énoncé ou dans un libellé, sinon les lignes seront identiques'
      :'Per-month question: write {{MOIS}} in the wording or a label, otherwise every line reads the same', 4200);
  if(id){ const q=DB.d.questions.find(x=>x.id===id);
    const scoreRelevant = q.q!==patch.q||q.type!==patch.type||q.den!==patch.den||q.dom!==patch.dom||q.weight!==patch.weight;
    Object.assign(q,patch); if(scoreRelevant) q.version=(q.version||1)+1;
    audit('QUESTION_EDIT','question','Q'+q.n+' v'+q.version);
  } else {
    const n=Math.max(...DB.d.questions.map(x=>x.n))+1;
    /* Put it at the end of ITS OWN section, not at the end of the questionnaire — otherwise
       a question added to IPC appears after the last section and the supervisor never finds
       it where they expect. */
    const same=DB.d.questions.filter(x=>x.sec===patch.sec);
    const after=same.length? Math.max(...same.map(x=>x.order||0)) : Math.max(...DB.d.questions.map(x=>x.order||0));
    DB.d.questions.forEach(x=>{ if((x.order||0)>after) x.order=(x.order||0)+1; });
    DB.d.questions.push(Object.assign({id:'Q'+String(n).padStart(2,'0'),code:'Q'+n,n,active:true,
      order:after+1,version:1},patch));
    audit('QUESTION_ADD','question','Q'+n+' — '+patch.sec);
    toast(LANG==='fr'?'✓ Question ajoutée à « '+patch.sec+' »':'✓ Question added to "'+patch.sec+'"', 3200);
  }
  DB.save(); queue('questions', DB.d.questions); closeModal(); render();
}
function toggleQ(id){
  const q=DB.d.questions.find(x=>x.id===id); if(!q) return;
  const L=LANG==='fr', turningOff = q.active!==false;
  if(!turningOff){ applyToggleQ(id); return; }        // re-activating needs no ceremony
  modal(L?'Désactiver la question '+q.n:'Deactivate question '+q.n, `
    <div class="banner b-warn">${L
      ?'Cette question disparaîtra du questionnaire de <b>tous les superviseurs</b> au prochain chargement.'
      :'This question will disappear from <b>every supervisor\'s</b> questionnaire at their next load.'}</div>

    <p class="xs muted">${L
      ?'Rien n\'est supprimé : les supervisions déjà faites gardent cette question et son score. Vous pouvez la réactiver à tout moment.'
      :'Nothing is deleted: supervisions already done keep this question and its score. You can switch it back on at any time.'}</p>`,
    `<button class="btn sec" onclick="closeModal()">${T('cancel')}</button>
     <button class="btn dan" onclick="applyToggleQ('${id}')">${L?'Désactiver':'Deactivate'}</button>`);
}
function applyToggleQ(id){
  const q=DB.d.questions.find(x=>x.id===id); if(!q) return;
  const L=LANG==='fr';
  q.active = q.active===false;
  DB.save(); audit('QUESTION_TOGGLE','question','Q'+q.n+'='+q.active);

  toast(q.active ? (L?'✓ Question '+q.n+' réactivée':'✓ Question '+q.n+' switched back on')
                 : (L?'Question '+q.n+' désactivée — '+activeQuestions().length+' questions actives'
                     :'Question '+q.n+' deactivated — '+activeQuestions().length+' active questions'), 3400);
  render();
}

function decideSite(id, decision){
  const L=LANG==='fr';
  const r=DB.d.siteReq.find(x=>x.id===id); if(!r) return;
  if(decision==='MOREINFO'){
    return askReason({
      title:L?'Demander un complément — '+r.ref:'Ask for more information — '+r.ref,
      label:L?'Qu\'est-ce qui manque ? (obligatoire)':'What is missing? (mandatory)',
      placeholder:L?'ex. joindre la note de service signée':'e.g. attach the signed service note',
      help:L?'La demande reste ouverte. Le superviseur voit ce message et peut compléter son dossier.'
            :'The request stays open. The supervisor sees this message and can complete their file.',
      bannerTone:'b-info', confirmLabel:L?'Demander le complément':'Ask for it',
      onOk: note=>decideSiteDo(id, decision, note)});
  }
  if(decision!=='APPROVED'){
    return askReason({
      title:L?'Rejeter la demande '+r.ref:'Refuse request '+r.ref,
      label:L?'Motif du rejet (obligatoire)':'Reason for refusal (mandatory)',
      placeholder:L?'ex. formation sanitaire déjà enregistrée sous un autre nom'
                   :'e.g. facility already recorded under another name',
      help:L?'La demande est close. Le superviseur qui l\'a faite verra ce motif.'
            :'The request is closed. The supervisor who made it will see this reason.',
      confirmLabel:L?'Rejeter':'Refuse', danger:true,
      onOk: note=>decideSiteDo(id, decision, note)});
  }
  decideSiteDo(id, decision, '');
}
function decideSiteDo(id, decision, note){
  const r=DB.d.siteReq.find(x=>x.id===id); if(!r) return;
  r.status=decision; r.decidedBy=(me()||{}).name; r.decidedAt=Date.now(); r.decisionNote=note;
  if(decision==='APPROVED'){
    if(r.type==='ADD' && r.siteId){ const s=siteById(r.siteId); s.status='ACTIVE'; }
    else if(r.editId){ const s=siteById(r.editId);
      DB.d.audit.push({id:DB.id('A'),ts:Date.now(),user:(me()||{}).name,action:'SITE_VERSION',
        entity:'site',detail:JSON.stringify({before:r.before,after:r.after})});
      s.district=r.after.district; s.area=r.after.area; s.facility=r.after.facility;
      s.version=(s.version||1)+1;
      if(r.type==='MOVE'&&/ferm/i.test(r.justification||'')) s.status='CLOSED'; }
  } else if(r.type==='ADD' && r.siteId){
    const s=siteById(r.siteId); if(s) s.status='CLOSED';
  }
  DB.save(); audit('SITE_DECISION', decision, r.ref+' '+note); queue('siteReq', r); render();
}
