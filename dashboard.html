/* ---------- AHD readiness: the payload's own section, filtered ---------- */
function viewAhd(){
  const a = J && J.ahd;
  if(!a || !a.present) return `<div class="card"><div class="empty">${
    LANG === 'fr' ? 'L\u2019outil de préparation AHD n\u2019a pas encore de données publiées.'
                  : 'The AHD readiness tool has no published data yet.'}</div></div>`;
  /* The same filter strip as everywhere else. A facility is matched by its site id,
     which the atlas and the readiness section both carry; a row from a build that
     predates the id falls back to its name, and is simply not place-filtered if
     neither matches — never silently dropped from its own total. */
  const byId = {}; sitesAll().forEach(s2 => byId[s2.id] = s2);
  const byName = {}; sitesAll().forEach(s2 => byName[s2.name] = s2);
  const facs = (a.facilities || []).filter(f => {
    const m = byId[f.id] || byName[f.name];
    return m ? placeOk(m) : true;
  });
  /* POOLED, never an average of percentages — see the note on the overview. */
  const pooled = pct(facs.reduce((n, f) => n + (f.ready || 0), 0),
                     facs.reduce((n, f) => n + (f.applicable || 0), 0));
  const p1 = facs.reduce((n, f) => n + (f.p1 || 0), 0);
  const gaps = facs.reduce((n, f) => n + (f.gaps || 0), 0);
  const doms = {};
  facs.forEach(f => Object.keys(f.dom || {}).forEach(k => {
    const o = doms[k] || (doms[k] = [0, 0]);
    o[0] += f.dom[k][0]; o[1] += f.dom[k][1];
  }));
  const names = {};
  (a.domains || []).forEach(d => names[String(d.n)] = d.name || String(d.n));
  const domRows = Object.keys(doms)
    .map(k => ({lab: names[k] || k, v: pct(doms[k][0], doms[k][1])}))
    .filter(r => r.v !== null).sort((x, y) => x.v - y.v);
  const facRowsAhd = facs.map(f => ({lab:f.name, v:pct(f.ready, f.applicable)}))
    .filter(r => r.v !== null).sort((x, y) => x.v - y.v);

  return `
  <h2>${esc(T('ahdFull'))}</h2>
  <p class="sub">${esc(placeLabel())} · ${facs.length} ${
    LANG === 'fr' ? 'formation(s) sanitaire(s) évaluée(s)'
                  : 'facilit' + (facs.length === 1 ? 'y' : 'ies') + ' assessed'}</p>
  <div class="tiles">
    <div class="tile"><span class="edge" style="background:var(--ahd)"></span>
      <div class="k">${LANG === 'fr' ? 'Préparation globale' : 'Overall readiness'}</div>
      <div class="v">${pc(pooled)}</div><div class="n">${esc(bandWord(pooled))}</div></div>
    <div class="tile"><span class="edge" style="background:${p1 ? 'var(--crit)' : 'var(--good)'}"></span>
      <div class="k">${LANG === 'fr' ? 'Écarts prioritaires (P1)' : 'Priority 1 gaps'}</div>
      <div class="v">${p1}</div>
      <div class="n">${LANG === 'fr' ? 'Un seul suffit à classer un site critique'
                                     : 'One alone makes a site critical'}</div></div>
    <div class="tile"><span class="edge" style="background:var(--neutral)"></span>
      <div class="k">${LANG === 'fr' ? 'Écarts au total' : 'Gaps in total'}</div>
      <div class="v">${gaps}</div>
      <div class="n">${LANG === 'fr' ? 'Réponses Partiel ou Non' : 'Partial or No answers'}</div></div>
  </div>
  <div class="cards two">
    <div class="card"><h3>${LANG === 'fr' ? 'Par domaine' : 'By domain'}</h3>
      <p class="sub">${esc(T('sectionsSub'))}</p>${barsH(domRows)}</div>
    <div class="card"><h3>${LANG === 'fr' ? 'Par formation sanitaire' : 'By facility'}</h3>
      <p class="sub">${esc(T('sectionsSub'))}${facRowsAhd.length > 25
        ? ' · ' + (LANG === 'fr' ? '25 plus faibles' : '25 weakest') : ''}</p>
      ${barsH(facRowsAhd.slice(0, 25))}</div>
  </div>
  <div class="note">${LANG === 'fr'
    ? 'Un seul écart prioritaire (P1) classe une formation sanitaire en critique, quel que soit son pourcentage — c\u2019est la règle de l\u2019outil et elle n\u2019est pas moyennable. Les pourcentages ci-dessus sont poolés sur les réponses applicables, pas moyennés entre sites.'
    : 'A single priority-1 gap puts a facility in the critical band whatever its percentage — that is the instrument\u2019s rule and it cannot be averaged away. The percentages above are pooled over applicable answers, not averaged across sites.'}</div>`;
}

function exportCsv(){
  const rows = facRows();
  const head = ['facility','district','region','area','state','score','provisional',
                'visit_date','drafts','draft_last_change','draft_progress_pct',
                'draft_incomplete','open_recommendations','overdue','off_plan',
                'duplicate','ahd','milestone'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const body = rows.map(r => [r.name, r.district, r.region, r.area, T(STATE[r.state].w),
    r.v === null ? '' : r.v, r.provOnly ? 'yes' : '', r.date,
    r.drafts || '', r.drUp ? new Date(r.drUp).toISOString().slice(0, 10) : '',
    r.drPct === null ? '' : r.drPct, r.drInc ? 'yes' : '',
    r.open, r.late, r.offPlan ? 'yes' : '', r.dup ? 'yes' : '',
    T(STATE[r.ahd].w), T(STATE[r.fm].w)].map(q).join(','));
  /* A BOM, because Excel on a French Windows reads a UTF-8 CSV without one as
     Latin-1 and turns every accented facility name into mojibake. */
  const blob = new Blob(['﻿' + [head.map(q).join(',')].concat(body).join('\r\n')],
                        {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url;
  a.download = 'ATHECS_' + ((cycleById(F.cycle) || {}).name || 'cycle').replace(/\s+/g,'_') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function drawBody(){
  drillClose();                      /* a panel must never outlive the view it came from */
  $('#app').innerHTML =
      VIEW === 'fac' ? viewFacilities()
    : VIEW === 'pf'  ? viewPerformance()
    : VIEW === 'ins' ? viewInstruments()
    : VIEW === 'ahd' ? viewAhd()
    : viewCycle();
  /* the stacked segments carry their own tooltip text */
  [...document.querySelectorAll('.stack i[data-t]')].forEach(el => {
    el.onmousemove = e => tip(e, esc(el.getAttribute('data-t')));
    el.onmouseleave = () => tip(null, '');
  });
}
function draw(){
  if(!A) return;

    ${esc(T('updated'))} ${esc(new Date(J.generated).toLocaleString(LANG === 'fr' ? 'fr-FR' : 'en-GB'))}
    · ${LANG === 'fr' ? 'page' : 'page'} v${esc(PAGE_VERSION)} · ${LANG === 'fr' ? 'serveur' : 'server'} v${esc(srv)}
    ${J.superseded ? ' · ' + J.superseded + (LANG === 'fr' ? ' doublon(s) mis de côté' : ' duplicate(s) set aside') : ''}
    <br>NACC powered by ICAP Global Health © 2025–2026 · ATHECS
    <div class="credit">
      <span>${LANG === 'fr' ? 'Conçu par' : 'Designed by'} <b>C.F. ANYIANG</b></span>
      <a href="tel:+237658158909" title="${LANG === 'fr' ? 'Appeler le 658 158 909' : 'Call 658 158 909'}">\u260E 658 158 909</a>
      <a href="https://wa.me/237658158909" target="_blank" rel="noopener noreferrer"
         title="${LANG === 'fr' ? 'Écrire sur WhatsApp' : 'Message on WhatsApp'}">WhatsApp</a>
    </div>`;
}

/* ---------- load ---------- */
(function boot(){
  try{
    const t = localStorage.getItem('ath_dash_theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
    $('#th').textContent = t === 'dark' ? '☾' : t === 'light' ? '☀' : '◐';
    const l = localStorage.getItem('ath_dash_lang');
    if(l === 'en' || l === 'fr') LANG = l;
  }catch(e){}
  $('#fr').className = 'tb' + (LANG === 'fr' ? ' on' : '');
  $('#en').className = 'tb' + (LANG === 'en' ? ' on' : '');
  document.documentElement.lang = LANG;
  $('#t-title').textContent = T('title');

  fetch(API + '?action=dash&rtoken=' + encodeURIComponent(TOKEN))
    .then(r => r.json())
    .then(j => {
      if(!j || !j.ok) throw new Error((j && j.error) || '?');
      J = j; A = j.atlas || null;
      if(!A) throw new Error('atlas');
      $('#t-region').textContent = j.region || T('region');
      const open = (A.cycles || []).filter(c => c.status === 'OPEN')[0];
      F.cycle = (j.cycle && j.cycle.id) || (open && open.id)
             || ((A.cycles || [])[A.cycles.length - 1] || {}).id || '';
      draw();
    })
    .catch(e => {
      $('#app').innerHTML = `<div class="err"><b>${
        LANG === 'fr' ? 'Tableau de bord indisponible' : 'Dashboard unavailable'}</b><br>
        ${LANG === 'fr'
          ? 'Les données n’ont pas pu être lues. Réessayez dans un instant ; si cela persiste, le déploiement du serveur n’est peut-être pas à jour.'
          : 'The data could not be read. Try again in a moment; if it persists, the server deployment may not be up to date.'}
        <br><span style="font-size:.76rem;opacity:.75">${esc(String(e && e.message || e))}</span></div>`;
      $('#foot').textContent = '';
    });
})();
